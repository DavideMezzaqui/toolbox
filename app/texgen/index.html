<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TexGen</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
  /* the kit's --dim (#8a8a90) is 4.3:1 on a raised panel; TexGen puts small text on --panel3 too */
  :root { --tg-dim: #9a9aa2; }
  html, body { height: 100%; margin: 0; }
  body.kit { overflow: hidden; }
  /* TexGen styles its selects with the `background` shorthand, which drops the kit chevron: put it back */
  select { background-image: var(--chev) !important; background-repeat: no-repeat !important; background-position: right 8px center !important; background-size: 10px 10px !important; padding-right: 26px !important; }
  #root { height: 100%; }
  /* Shown only if the module never mounts - otherwise React replaces it. */
  #boot { color: var(--txt2); font: var(--fs-l) var(--mono); padding: 24px; }
  #boot .err { color: var(--err); white-space: pre-wrap; }
</style>
</head>
<body class="kit">

<div id="root"><div id="boot">Loading TexGen<span id="bootErr" class="err"></span></div></div>

<script>
// ---------------------------------------------------------------------------
// window.storage shim
//
// TexGen was authored as a Claude artifact, where the host page provides
// window.storage. Nothing provides it in a plain Electron window, so Save and
// Load both reported "No storage" and the project was never restored on start.
//
// IndexedDB rather than localStorage: a project embeds decoded image layers and
// routinely exceeds localStorage's ~5 MB string quota, which would fail the save
// only once the user had done enough work to matter.
//
// Contract expected by the tool:
//   storage.get(key) -> Promise<{ value: string } | null>
//   storage.set(key, value) -> Promise<void>
// ---------------------------------------------------------------------------
(function () {
  var DB_NAME = 'texgen', STORE = 'kv', DB_VERSION = 1;
  var dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('indexedDB open failed')); };
      req.onblocked = function () { reject(new Error('indexedDB blocked')); };
    });
    // A failed open must not poison every later call.
    dbPromise.catch(function () { dbPromise = null; });
    return dbPromise;
  }

  function tx(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var store = t.objectStore(STORE);
        var req = fn(store);
        t.onabort = function () { reject(t.error || new Error('transaction aborted')); };
        t.onerror = function () { reject(t.error || new Error('transaction failed')); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error('request failed')); };
      });
    });
  }

  window.storage = {
    get: function (key) {
      return tx('readonly', function (s) { return s.get(key); })
        .then(function (value) {
          // The tool checks `res && res.value`, so absent must not throw.
          return (typeof value === 'string') ? { value: value } : null;
        });
    },
    set: function (key, value) {
      return tx('readwrite', function (s) { return s.put(String(value), key); })
        .then(function () { return undefined; });
    },
    remove: function (key) {
      return tx('readwrite', function (s) { return s.delete(key); })
        .then(function () { return undefined; });
    }
  };
})();
</script>

<!-- React as classic scripts: these define the globals the shim re-exports.
     React 18 is deliberate - 19 no longer ships UMD builds. -->
<script src="./lib/react.production.min.js"></script>
<script src="./lib/react-dom.production.min.js"></script>

<!-- Maps the bare "react" specifier onto the local shim, so texgen.js stays
     unmodified apart from the fixes noted in the README. Must appear before any
     module script. -->
<script type="importmap">
{
  "imports": {
    "react": "./lib/react-shim.js"
  }
}
</script>

<!-- Shared kit and the Studio host contract (../shared/embed.js). Classic scripts, before the module. -->
<script src="../shared/kit.js"></script>
<script src="../shared/embed.js"></script>

<script type="module">
  import TexGen from './texgen.js';

  const root = document.getElementById('root');
  root.textContent = '';
  ReactDOM.createRoot(root).render(React.createElement(TexGen));

  // ---- Studio host --------------------------------------------------------------------------
  // The editor re-points window.__texgen at its current closures on every render (see "Studio host
  // hooks" in texgen.js); the host actions below just call through it.
  const T = (name) => function () { const h = window.__texgen; return h && h[name] ? h[name].apply(null, arguments) : undefined; };
  const queue = [];
  let waiting = false;
  function drain() {            // files that arrive before the editor has mounted wait for it
    const h = window.__texgen;
    if (!h) { if (!waiting) { waiting = true; const iv = setInterval(function () { if (window.__texgen) { clearInterval(iv); waiting = false; drain(); } }, 100); } return; }
    while (queue.length) h.importImage(queue.shift());
  }
  if (window.Embed) {
    Embed.register({
      id: 'texgen',
      title: 'TexGen',
      actions: [
        { id: 'undo',   icon: 'undo', tip: 'Undo', key: 'Ctrl+Z', disabled: true, run: T('undo') },
        { id: 'redo',   icon: 'redo', tip: 'Redo', key: 'Ctrl+Y', disabled: true, run: T('redo') },
        { id: 'seed',   label: 'Randomize seed', icon: 'reset', tip: 'New random seed for the current layer', key: 'R', run: T('randomize') },
        { id: 'save',   label: 'Save', icon: 'save', tip: 'Save the project in this app', key: 'Ctrl+S', run: T('save') },
        { id: 'export', label: 'Export PNG', icon: 'down', primary: true, tip: 'Render the texture at the export size and save it as PNG', run: T('exportPNG') }
      ],
      shortcuts: [
        ['Project', [['Ctrl+Z', 'Undo'], ['Ctrl+Y', 'Redo'], ['Ctrl+S', 'Save']]],
        ['Layers', [['Q / W', 'Previous / next layer'], ['D', 'Duplicate layer'], ['H', 'Show / hide layer'], ['C / V', 'Copy / paste layer'],
                    ['X', 'Reset layer'], ['S', 'Solo layer'], ['Esc', 'Leave solo']]],
        ['Generate', [['R', 'Randomize seed'], ['A', 'Randomize all seeds'], ['Shift+B', 'Cycle blend mode']]],
        ['View', [['1 - 6', 'Switch panel tab'], ['[ / ]', 'Previous / next tab'], ['G', 'Transform gizmo'], ['B', 'A/B compare'],
                  ['F', 'Fit zoom'], ['+ / -', 'Zoom in / out'], ['0', 'Zoom 100%']]],
        ['Sliders', [['Double-click', 'Reset slider'], ['Scroll', 'Nudge slider'], ['Shift+Scroll', 'Nudge 10x']]]
      ],
      accepts: ['image/*'],
      // an image from the tray or a drop: image layer (new, or the current one when it is an image layer)
      onReceive: function (files) { for (const f of files) queue.push(f); drain(); },
      // hidden: no playback behind the user's back
      onHide: function () { window.__tgPaused = true; },
      onShow: function () { window.__tgPaused = false; }
    });
  }
</script>

<script>
  // Surface a failed module load on the page instead of leaving a blank window.
  window.addEventListener('error', (e) => {
    const el = document.getElementById('bootErr');
    if (el) el.textContent = '\n\n' + (e.message || e.error || 'failed to load');
  });
</script>

</body>
</html>
