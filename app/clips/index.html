<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Joiner</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#121214; --panel:#18181c; --panel2:#1d1d22; --line:#2a2a31; --line2:#34343c;
  --ink:#d9d9df; --dim:#8a8a96; --faint:#5c5c66; --acc:#A78BFA; --acc2:#7c5ce0;
  --ok:#3fbf7f; --bad:#e5484d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:12px/1.35 "Segoe UI",Arial,sans-serif;overflow:hidden;
     display:grid;grid-template-rows:42px 1fr;user-select:none;-webkit-user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
textarea,input[type=text]{user-select:text;-webkit-user-select:text}

/* ------------------------------------------------------------- header */
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:11px;font-weight:600;letter-spacing:.1em;color:#fff;margin-right:6px}
header .sp{flex:1}
header .info{color:var(--dim);font-size:11px;white-space:nowrap}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:#55555f;background:#24242a}
button:disabled{opacity:.35;cursor:default}
button.primary{background:#2a2140;border-color:var(--acc2);color:#e3d9ff;font-weight:600}
button.primary:hover:not(:disabled){background:#33284f;border-color:var(--acc)}
button.danger:hover:not(:disabled){border-color:var(--bad);color:#ff8a8d}
button.small{padding:2px 7px;font-size:11px}
button.on{border-color:var(--acc);color:#e3d9ff;background:#2a2140}

/* ------------------------------------------------------------- layout */
main{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;min-height:0}
#left,#right{background:var(--panel);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ------------------------------------------------------------- clip list */
.drop{margin:10px;border:1px dashed #3a3a44;border-radius:6px;padding:12px;text-align:center;color:var(--dim);cursor:pointer;position:relative}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--ink);background:#1c1a24}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.listbar{display:flex;gap:5px;padding:0 10px 8px}
.listbar button{flex:1}
#list{flex:1;overflow-y:auto;padding:0 8px 12px}
.clip{display:flex;gap:8px;align-items:center;padding:5px;border:1px solid transparent;border-radius:5px;cursor:pointer;background:#1b1b20}
.clip:hover{border-color:var(--line2)}
.clip.sel{border-color:var(--acc);background:#211d2c}
.clip.dragging{opacity:.3}
.clip.before{box-shadow:0 -2px 0 var(--acc)}
.clip.after{box-shadow:0 2px 0 var(--acc)}
.clip img,.clip .noimg{width:64px;height:36px;object-fit:cover;border-radius:3px;background:#000;flex:none}
.clip .meta{flex:1;min-width:0}
.clip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .sub{color:var(--dim);font-size:11px;margin-top:2px}
.clip .n{color:var(--faint);font-size:10px;width:14px;text-align:right;flex:none}
.tr{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 28px;color:var(--faint);font-size:11px}
.tr::before{content:"";width:10px;border-top:1px solid #3a3a44}
.tr select{background:transparent;border:1px solid transparent;border-radius:3px;padding:1px 3px;color:var(--dim);font-size:11px;cursor:pointer}
.tr select:hover{border-color:var(--line2);color:var(--ink)}
.empty{color:var(--faint);text-align:center;padding:30px 12px;line-height:1.6}

/* ------------------------------------------------------------- preview */
#stage{flex:1;min-height:0;position:relative;background:#0b0b0d;display:flex;align-items:center;justify-content:center;overflow:hidden}
#view{display:block;box-shadow:0 0 0 1px #26262c;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#stageHint{position:absolute;color:var(--faint);text-align:center;line-height:1.7;pointer-events:none}
.transport{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-top:1px solid var(--line)}
.transport .time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:120px}
.transport label{display:flex;align-items:center;gap:5px;color:var(--dim)}
#strip{display:block;width:100%;height:64px;background:#101013;border-top:1px solid var(--line);cursor:pointer;touch-action:none}

/* ------------------------------------------------------------- inspector */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;color:var(--dim);border-bottom:2px solid transparent}
.tabs button:hover:not(:disabled){background:#1f1f25;color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);background:none}
#insp{flex:1;overflow-y:auto;padding:4px 12px 20px}
h3{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;font-weight:600}
.row{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:8px;margin:5px 0;min-height:24px}
.row>span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:6px;min-width:0}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:16px}
.ctl input[type=number],.ctl input[type=text],.ctl select,.ctl textarea{background:#101013;border:1px solid var(--line2);border-radius:3px;padding:3px 5px;min-width:0}
.ctl input[type=number]{width:62px;text-align:right}
.ctl input[type=number]::placeholder{color:#6d6d78}
.ctl input[type=text],.ctl select,.ctl textarea{flex:1;width:100%}
.ctl textarea{resize:vertical;min-height:52px;line-height:1.35}
.ctl input[type=color]{width:34px;height:24px;border:1px solid var(--line2);border-radius:3px;background:#101013;padding:2px;cursor:pointer}
.ctl input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px}
.ctl .unit{color:var(--faint);font-size:11px;min-width:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)!important}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.note{color:var(--faint);font-size:11px;line-height:1.5;margin:6px 0}
.trim{position:relative;height:26px;background:#101013;border:1px solid var(--line2);border-radius:3px;margin:6px 0 2px;touch-action:none}
.trim .keep{position:absolute;top:0;bottom:0;background:#2a2140;border-left:2px solid var(--acc);border-right:2px solid var(--acc);cursor:grab}
.trim .hd{position:absolute;top:-1px;bottom:-1px;width:12px;margin-left:-6px;cursor:ew-resize}
.trim .ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:.6;pointer-events:none}
.texts{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.titem{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--line2);border-radius:4px;cursor:pointer;background:#141417}
.titem.sel{border-color:var(--acc);background:#211d2c}
.titem .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos9{display:grid;grid-template-columns:repeat(3,22px);gap:3px}
.pos9 button{width:22px;height:18px;padding:0;border-radius:3px}
.seg{display:flex;gap:0}
.seg button{border-radius:0;padding:3px 9px}
.seg button:first-child{border-radius:3px 0 0 3px}
.seg button:last-child{border-radius:0 3px 3px 0}

/* ------------------------------------------------------------- export */
#busy{position:fixed;inset:0;background:rgba(8,8,10,.72);display:none;align-items:center;justify-content:center;z-index:20}
#busy.show{display:flex}
#busy .box{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:18px 20px;width:420px}
#busy .t{font-weight:600;margin-bottom:8px}
#busy .s{color:var(--dim);margin:8px 0 12px;min-height:16px}
.bar{height:4px;background:#26262c;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s linear}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24242a;border:1px solid var(--line2);border-radius:5px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:70vw}
#toast.show{opacity:1}
#toast.err{border-color:var(--bad);color:#ffb3b5}
#pool{display:none}
</style>
</head>
<body>

<header>
  <h1>CLIP JOINER</h1>
  <button id="bAdd" title="Add video clips (or drop them anywhere)">Add clips…</button>
  <input id="fileIn" type="file" accept="video/*" multiple hidden>
  <button id="bUndo" class="small" title="Undo (Ctrl+Z)">Undo</button>
  <button id="bRedo" class="small" title="Redo (Ctrl+Y)">Redo</button>
  <div class="sp"></div>
  <span class="info" id="hInfo"></span>
  <button id="bExport" class="primary" title="Render the sequence to an MP4 file">Export MP4</button>
</header>

<main>
  <section id="left">
    <label class="drop" id="drop"><input id="fileIn2" type="file" accept="video/*" multiple>
      <b>Drop clips here</b>MP4, WebM, MOV · added in name order</label>
    <div class="listbar">
      <button id="bSort" class="small" title="Sort all clips by file name">Sort by name</button>
      <button id="bClear" class="small danger" title="Remove every clip">Clear all</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="center">
    <div id="stage">
      <canvas id="view" width="960" height="540"></canvas>
      <div id="stageHint">Drop your clips anywhere.<br>They join with a short fade to black between each one.</div>
    </div>
    <div class="transport">
      <button id="bPlay" title="Play / pause (Space)" style="min-width:70px">Play</button>
      <button id="bStart" class="small" title="Go to start (Home)">|◀</button>
      <button id="bPrev" class="small" title="Previous frame (←), Shift = 1 s">◀</button>
      <button id="bNext" class="small" title="Next frame (→), Shift = 1 s">▶</button>
      <span class="time" id="tTime">0:00.00 / 0:00.00</span>
      <label title="Loop playback"><input type="checkbox" id="cLoop"> Loop</label>
      <label title="Hear the clips while previewing"><input type="checkbox" id="cSound" checked> Sound</label>
      <div style="flex:1"></div>
      <label title="Show the centre lines and a 5% safe margin"><input type="checkbox" id="cGuides"> Guides</label>
    </div>
    <canvas id="strip" height="64"></canvas>
  </section>

  <section id="right">
    <div class="tabs" id="tabs">
      <button data-tab="seq" class="on">Sequence</button>
      <button data-tab="clip">Clip</button>
      <button data-tab="tf">Transform</button>
      <button data-tab="text">Text</button>
    </div>
    <div id="insp"></div>
  </section>
</main>

<div id="busy"><div class="box">
  <div class="t" id="bzT">Exporting</div>
  <div class="bar"><i id="bzBar"></i></div>
  <div class="s" id="bzS"></div>
  <button id="bzCancel">Cancel</button>
</div></div>
<div id="toast"></div>
<div id="pool"></div>

<script>
'use strict';
/*
 * Clip Joiner: short clips in, one MP4 out.
 *
 * The sequence is a list of clips laid end to end. Between two clips there is
 * a transition: a fade through black (the default - the old clip closes to
 * black, the next one opens from black), a crossfade, a push, a wipe or a
 * straight cut. Each clip has its own trim, speed, transform (zoom, pan,
 * rotation, crop, optional animated zoom) and any number of text overlays.
 *
 * Everything is drawn by one function, renderAt(), at a time T on the
 * sequence. The preview and the export both call it, so what you see is
 * what you get. All geometry is stored as fractions of the output frame, so
 * the preview can draw at screen size and the export at full size.
 */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const uid = () => Math.random().toString(36).slice(2, 10);
const tick = () => new Promise(r => setTimeout(r, 0));
const clone = o => JSON.parse(JSON.stringify(o));
function ease(kind, p) {
  p = clamp(p, 0, 1);
  if (kind === 'linear') return p;
  if (kind === 'in') return p * p;
  if (kind === 'out') return 1 - (1 - p) * (1 - p);
  return p * p * (3 - 2 * p);                       /* smooth */
}
function fmt(t, fps) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
}
const natural = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

/* ================================================================ state */
const PRESETS = [
  ['1080p', 'Landscape 1920×1080', 1920, 1080],
  ['4k',    'Landscape 3840×2160', 3840, 2160],
  ['720p',  'Landscape 1280×720',  1280, 720],
  ['vert',  'Vertical 1080×1920',  1080, 1920],
  ['sq',    'Square 1080×1080',    1080, 1080],
  ['45',    'Portrait 1080×1350',  1080, 1350],
  ['first', 'Match first clip',    0, 0],
  ['custom','Custom',              0, 0]
];
const TRANS = [
  ['fade',  'Fade through black'],
  ['cross', 'Crossfade'],
  ['push',  'Push'],
  ['wipe',  'Wipe'],
  ['cut',   'Cut']
];
const FONTS = ['Turret Road', 'Segoe UI', 'Bahnschrift', 'Arial', 'Arial Black', 'Impact', 'Consolas', 'Georgia'];

const SEQ_DEFAULT = {
  preset: '1080p', w: 1920, h: 1080, fps: 30, bg: '#000000',
  trans: 'fade', fadeIn: 0.25, fadeOut: 0.25, hold: 0, fadeColor: '#000000',
  crossDur: 0.4, curve: 'smooth', firstIn: true, lastOut: true,
  mbps: 16, audio: true, name: ''
};
const TF_DEFAULT = { fit: 'cover', z0: 1, x0: 0, y0: 0, z1: 1.12, x1: 0, y1: 0, anim: false,
                     ease: 'smooth', rot: 0, flip: false, cl: 0, cr: 0, ct: 0, cb: 0 };
const TEXT_DEFAULT = {
  text: 'Title', font: 'Turret Road', weight: '500', size: 0.055, color: '#ffffff', op: 1,
  align: 'center', x: 0.5, y: 0.86, ls: 0.02, upper: false, lh: 1.15,
  stroke: 0, strokeColor: '#000000', shadow: 0.5,
  box: false, boxColor: '#000000', boxOp: 0.55, boxPad: 0.4,
  start: 0, dur: 0, anim: 'fade', animDur: 0.3
};

let seq = Object.assign({}, SEQ_DEFAULT, readJSON('clips.seq'));
let textStyle = Object.assign({}, TEXT_DEFAULT, readJSON('clips.textStyle'));
let clips = [];                 /* the model: plain data, undoable */
const media = new Map();        /* clip id -> {video, file, url, dur, vw, vh, thumb, audio} */
let sel = null, selText = null, tab = 'seq', editEnd = false;
let T = 0, playing = false, exporting = false, cancelExport = false;
let items = [], total = 0;      /* derived timeline */
let hits = [];                  /* text boxes of the last preview frame */

function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* Per-clip settings are remembered by file, so dropping the same clip again
   later brings back its trim, transform and texts. */
function sigOf(f) { return f.name + '|' + f.size + '|' + f.lastModified; }
let memory = readJSON('clips.memory');
let memTimer = 0;
function remember() {
  clearTimeout(memTimer);
  memTimer = setTimeout(() => {
    for (const c of clips) {
      const { id, name, sig, ...rest } = c;
      memory[c.sig] = { t: Date.now(), s: rest };
    }
    const keys = Object.keys(memory).sort((a, b) => memory[b].t - memory[a].t);
    for (const k of keys.slice(200)) delete memory[k];
    writeJSON('clips.memory', memory);
    writeJSON('clips.seq', seq);
  }, 400);
}

/* ================================================================ undo */
let past = [], future = [], lastSnap = null;
function snapshot() { return JSON.stringify({ seq, clips }); }
function commit() {
  const s = snapshot();
  if (s === lastSnap) return;
  if (lastSnap !== null) { past.push(lastSnap); if (past.length > 120) past.shift(); }
  future = []; lastSnap = s;
  remember(); updateUndo();
}
function restore(s) {
  const o = JSON.parse(s);
  seq = o.seq; clips = o.clips;
  if (sel && !clips.some(c => c.id === sel)) sel = null;
  selText = null;
  lastSnap = s; rebuildAll(); remember(); updateUndo();
}
function undo() { if (!past.length || exporting) return; future.push(lastSnap); restore(past.pop()); }
function redo() { if (!future.length || exporting) return; past.push(lastSnap); restore(future.pop()); }
function updateUndo() { $('bUndo').disabled = !past.length; $('bRedo').disabled = !future.length; }

/* ================================================================ media */
const pool = $('pool');

function loadVideo(url) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.crossOrigin = 'anonymous';
    v.onloadedmetadata = async () => {
      /* Screen recorders often write WebM without a duration. Asking for a
         time far past the end makes the browser scan to the real one. */
      if (!isFinite(v.duration)) {
        await new Promise(r => {
          const g = setTimeout(r, 8000);
          v.ondurationchange = () => { if (isFinite(v.duration)) { clearTimeout(g); r(); } };
          v.currentTime = 1e101;
        });
        v.ondurationchange = null;
        await seekTo(v, 0);
      }
      res(v);
    };
    v.onerror = () => rej(new Error('cannot read this file'));
    v.src = url;
    pool.appendChild(v);
  });
}
function seekTo(v, t) {
  return new Promise(res => {
    if (v.readyState >= 2 && Math.abs(v.currentTime - t) < 0.0005 && !v.seeking) { res(); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(g); v.removeEventListener('seeked', fin); res(); };
    const g = setTimeout(fin, 4000);
    v.addEventListener('seeked', fin);
    v.currentTime = t;
  });
}
async function thumbOf(v, t) {
  await seekTo(v, t);
  const c = document.createElement('canvas'); c.width = 128; c.height = 72;
  const g = c.getContext('2d');
  const s = Math.max(128 / v.videoWidth, 72 / v.videoHeight);
  const w = v.videoWidth * s, h = v.videoHeight * s;
  g.fillStyle = '#000'; g.fillRect(0, 0, 128, 72);
  g.drawImage(v, (128 - w) / 2, (72 - h) / 2, w, h);
  return c.toDataURL('image/jpeg', 0.7);
}

async function addFiles(list) {
  if (exporting) return;
  const files = [...list].filter(f => /^video\//.test(f.type) || /\.(mp4|m4v|mov|webm|mkv)$/i.test(f.name))
                         .sort((a, b) => natural.compare(a.name, b.name));
  if (!files.length) { toast('No video files in that drop.', true); return; }
  pause();
  let added = 0, failed = [];
  for (const f of files) {
    try {
      const url = URL.createObjectURL(f);
      const v = await loadVideo(url);
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) throw new Error('no duration');
      const id = uid();
      const c = { id, sig: sigOf(f), name: f.name.replace(/\.[^.]+$/, ''),
                  in: 0, out: dur, speed: 1, vol: 1, mute: false,
                  fadeIn: null, fadeOut: null, trans: null, transDur: null,
                  tf: clone(TF_DEFAULT), texts: [] };
      const old = memory[c.sig] && memory[c.sig].s;
      if (old && Math.abs((old.out || 0) - dur) < dur + 1) {
        Object.assign(c, clone(old));
        c.out = clamp(c.out, 0.05, dur); c.in = clamp(c.in, 0, c.out - 0.05);
        c.tf = Object.assign(clone(TF_DEFAULT), c.tf);
        c.texts = (c.texts || []).map(t => Object.assign(clone(TEXT_DEFAULT), t, { id: uid() }));
      }
      media.set(id, { video: v, file: f, url, dur, vw: v.videoWidth, vh: v.videoHeight, thumb: null, audio: undefined });
      clips.push(c);
      added++;
      media.get(id).thumb = await thumbOf(v, clamp(c.in + 0.3, 0, dur - 0.01));
    } catch (e) { failed.push(f.name); }
  }
  const wasEmpty = !sel;
  if (!sel && clips.length) sel = clips[0].id;
  if (seq.preset === 'first') applyPreset();
  commit(); rebuildAll();
  /* first load: park on a frame you can see, not on the black of the opening fade */
  if (wasEmpty && items.length) showAt(items[0].start + Math.min(items[0].len * 0.5, fadeInOf(items[0].c) + 0.3));
  if (failed.length) toast('Could not read: ' + failed.join(', '), true);
  else toast(added + ' clip' + (added === 1 ? '' : 's') + ' added');
}

/* A duplicated clip gets its own video element: two clips from one file can
   be on screen at once during a crossfade, each at its own time. */
async function duplicateClip(id) {
  const i = clips.findIndex(c => c.id === id); if (i < 0) return;
  const src = media.get(id);
  const v = await loadVideo(src.url);
  const c = clone(clips[i]); c.id = uid();
  c.texts.forEach(t => t.id = uid());
  media.set(c.id, Object.assign({}, src, { video: v }));
  clips.splice(i + 1, 0, c); sel = c.id;
  commit(); rebuildAll();
}
function removeClip(id) {
  const i = clips.findIndex(c => c.id === id); if (i < 0) return;
  clips.splice(i, 1);
  sel = clips[Math.min(i, clips.length - 1)] ? clips[Math.min(i, clips.length - 1)].id : null;
  selText = null;
  commit(); rebuildAll();
}

/* ================================================================ MP4 reading
 *
 * Export reads each clip once, front to back, through the hardware decoder.
 * Seeking a <video> to every frame instead is only fast when keyframes are
 * close together: Davide's showcase clips have one every 250 frames, so each
 * seek re-decoded up to 250 frames - 18 s to export 3 s of Javelin.
 *
 * This is a plain MP4/MOV reader for H.264 with its index in the moov box
 * (not fragmented files). Anything it cannot read falls back to seeking.
 */
function* boxes(d, s, e) {
  let o = s;
  while (o + 8 <= e) {
    let size = d.getUint32(o), h = 8;

/* ================================================================ strip */
const strip = $('strip'), sctx = strip.getContext('2d');

  const dpr = window.devicePixelRatio || 1, r = strip.getBoundingClientRect();
  sw = Math.round(r.width * dpr); sh = Math.round(r.height * dpr);
  strip.width = sw; strip.height = sh; drawStrip();
}).observe(strip);
const PADX = 10;

function drawStrip() {
  const dpr = window.devicePixelRatio || 1, g = sctx;

  g.fillStyle = '#101013'; g.fillRect(0, 0, sw, sh);

  const top = 18 * dpr, bot = sh - 8 * dpr;
  /* seconds ruler */
  g.fillStyle = '#4a4a54'; g.font = (10 * dpr) + 'px Segoe UI'; g.textBaseline = 'top';
  const step = total > 120 ? 10 : total > 40 ? 5 : total > 12 ? 2 : 1;
  for (let s = 0; s <= total; s += step) {
    const x = tToX(s); g.fillRect(x, 0, dpr, 5 * dpr);
    g.fillText(s + 's', x + 3 * dpr, 3 * dpr);
  }
  items.forEach((it, i) => {
    const x0 = tToX(it.start), x1 = tToX(it.start + it.len);
    const on = it.c.id === sel;
    const y0 = it.ovIn && i % 2 ? top + 4 * dpr : top, y1 = it.ovIn && i % 2 ? bot : bot - (it.ovOut ? 4 * dpr : 0);
    g.fillStyle = on ? '#3a2f5c' : (i % 2 ? '#26262e' : '#2c2c35');
    g.fillRect(x0, y0, Math.max(1, x1 - x0), y1 - y0);
    if (on) { g.strokeStyle = '#A78BFA'; g.lineWidth = 1.5 * dpr; g.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0 - 1, y1 - y0 - 1); }
    /* fade ramps */
    g.fillStyle = 'rgba(0,0,0,.75)';
    if (it.fadeInOn) { const d = tToX(it.start + Math.min(fadeInOf(it.c), it.len * 0.5)) - x0; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + d, y0); g.lineTo(x0, y1); g.fill(); }
    if (it.fadeOutOn) { const d = x1 - tToX(it.start + it.len - Math.min(fadeOutOf(it.c), it.len * 0.5)); g.beginPath(); g.moveTo(x1, y0); g.lineTo(x1 - d, y0); g.lineTo(x1, y1); g.fill(); }
    g.save(); g.beginPath(); g.rect(x0, y0, x1 - x0, y1 - y0); g.clip();
    g.fillStyle = on ? '#e3d9ff' : '#9a9aa6'; g.font = (11 * dpr) + 'px Segoe UI'; g.textBaseline = 'middle';
    g.fillText((i + 1) + '  ' + it.c.name, x0 + 6 * dpr, (y0 + y1) / 2);
    if (it.c.texts.length) { g.fillStyle = '#A78BFA'; g.fillText('T', x1 - 12 * dpr, y0 + 9 * dpr); }

let stripDrag = false;
strip.addEventListener('pointerdown', e => {

/* ================================================================ clip list */
function renderList() {
  const L = $('list'); L.innerHTML = '';
  if (!clips.length) { L.innerHTML = '<div class="empty">No clips yet.<br>Everything you drop is added in file-name order.</div>'; return; }
  clips.forEach((c, i) => {
    const it = items[i], m = media.get(c.id);
    const row = document.createElement('div');
    row.className = 'clip' + (c.id === sel ? ' sel' : '');
    row.draggable = true; row.dataset.id = c.id;
    row.innerHTML = '<span class="n"></span>' + (m.thumb ? '<img alt="">' : '<div class="noimg"></div>') +
                    '<div class="meta"><div class="nm"></div><div class="sub"></div></div>';
    row.querySelector('.n').textContent = i + 1;
    if (m.thumb) row.querySelector('img').src = m.thumb;
    row.querySelector('.nm').textContent = c.name;
    row.querySelector('.nm').title = m.file.name;
    const extra = [];
    if (c.speed !== 1) extra.push(c.speed + '×');
    if (c.texts.length) extra.push(c.texts.length + ' text');
    if (c.tf.anim) extra.push('zoom');
    row.querySelector('.sub').textContent = (it ? it.len.toFixed(2) : '?') + ' s' + (extra.length ? ' · ' + extra.join(' · ') : '');
    row.onclick = () => select(c.id);
    row.ondragstart = e => { row.classList.add('dragging'); e.dataTransfer.setData('text/x-clip', c.id); e.dataTransfer.effectAllowed = 'move'; };
    row.ondragend = () => row.classList.remove('dragging');
    row.ondragover = e => {
      if (!e.dataTransfer.types.includes('text/x-clip')) return;
      e.preventDefault();
      const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
      row.classList.toggle('before', !after); row.classList.toggle('after', after);
    };
    row.ondragleave = () => row.classList.remove('before', 'after');
    row.ondrop = e => {
      const from = e.dataTransfer.getData('text/x-clip'); if (!from) return;
      e.preventDefault(); e.stopPropagation();
      const after = row.classList.contains('after'); row.classList.remove('before', 'after');
      if (from === c.id) return;
      const moving = clips.splice(clips.findIndex(x => x.id === from), 1)[0];
      let at = clips.findIndex(x => x.id === c.id) + (after ? 1 : 0);
      clips.splice(at, 0, moving);
      commit(); rebuildAll();
    };
    L.appendChild(row);
    if (i < clips.length - 1) {
      const tr = document.createElement('div'); tr.className = 'tr';
      const s = document.createElement('select');
      s.title = 'Transition from clip ' + (i + 1) + ' to clip ' + (i + 2);
      s.appendChild(new Option('Default · ' + TRANS.find(x => x[0] === seq.trans)[1], ''));
      TRANS.forEach(([k, l]) => s.appendChild(new Option(l, k)));
      s.value = c.trans || '';
      s.onchange = () => { c.trans = s.value || null; commit(); rebuildAll(); };
      tr.appendChild(s); L.appendChild(tr);
    }
  });
}

function inspClip(c) {
  const m = media.get(c.id), it = items.find(x => x.c.id === c.id);
  h3(c.name);
  note(m.vw + '×' + m.vh + ' · source ' + m.dur.toFixed(2) + ' s · on the sequence ' + (it ? it.len.toFixed(2) : '?') + ' s');

  h3('Trim');
  const bar = document.createElement('div'); bar.className = 'trim';
  bar.innerHTML = '<div class="keep"></div><div class="hd" data-k="in"></div><div class="hd" data-k="out"></div><div class="ph"></div>';
  host.appendChild(bar);
  const paint = () => {
    const a = c.in / m.dur * 100, b = c.out / m.dur * 100;
    bar.children[0].style.left = a + '%'; bar.children[0].style.width = (b - a) + '%';
    bar.children[1].style.left = a + '%'; bar.children[2].style.left = b + '%';
    const on = it && T >= it.start && T < it.start + it.len;
    bar.children[3].style.display = on ? '' : 'none';
    if (on) bar.children[3].style.left = (srcTime(it, T) / m.dur * 100) + '%';
  };
  paint();
  let dragK = null, grab = 0;
  bar.onpointerdown = e => {
    const r = bar.getBoundingClientRect(), s = clamp((e.clientX - r.left) / r.width, 0, 1) * m.dur;
    dragK = e.target.dataset.k || (e.target.classList.contains('keep') ? 'move' : (Math.abs(s - c.in) < Math.abs(s - c.out) ? 'in' : 'out'));
    grab = s - c.in; bar.setPointerCapture(e.pointerId); bar.onpointermove(e);
  };

    if (!dragK) return;
    const r = bar.getBoundingClientRect(), s = clamp((e.clientX - r.left) / r.width, 0, 1) * m.dur;
    let show;
    if (dragK === 'in') { c.in = clamp(s, 0, c.out - 0.05); show = c.in; }
    else if (dragK === 'out') { c.out = clamp(s, c.in + 0.05, m.dur); show = c.out - 0.001; }
    else { const len = c.out - c.in; c.in = clamp(s - grab, 0, m.dur - len); c.out = c.in + len; show = c.in; }
    paint(); fin.show(); fout.show();

      hits = []; vctx.setTransform(1, 0, 0, 1, 0, 0);
      drawLayer(vctx, pw, ph, { c, start: 0, len: Math.max(0.05, (c.out - c.in) / c.speed) }, (show - c.in) / c.speed, {}, null);

  const fin = range('In', () => c.in, v => { c.in = clamp(v, 0, c.out - 0.05); paint(); }, { min: 0, max: m.dur, step: 0.01, unit: 's', seek: true });
  const fout = range('Out', () => c.out, v => { c.out = clamp(v, c.in + 0.05, m.dur); paint(); }, { min: 0, max: m.dur, step: 0.01, unit: 's', seek: true });
  buttons([
    ['Set In at playhead', () => { if (!it || T < it.start || T >= it.start + it.len) { toast('Put the playhead on this clip first.'); return; }
      c.in = clamp(srcTime(it, T), 0, c.out - 0.05); rebuildTimeline(); commit(); showAt(items.find(x => x.c.id === c.id).start); renderInsp(); }, '', 'I'],
    ['Set Out at playhead', () => { if (!it || T < it.start || T >= it.start + it.len) { toast('Put the playhead on this clip first.'); return; }
      c.out = clamp(srcTime(it, T), c.in + 0.05, m.dur); rebuildTimeline(); commit(); showAt(T); renderInsp(); }, '', 'O'],
    ['Full length', () => { c.in = 0; c.out = m.dur; rebuildTimeline(); commit(); showAt(T); renderInsp(); }]
  ]);

  h3('Timing');
  range('Speed', () => c.speed, v => c.speed = v, { min: 0.1, max: 4, step: 0.05, unit: '×', seek: true });
  optNum('Fade in', () => c.fadeIn, v => c.fadeIn = v, 'default ' + seq.fadeIn);
  optNum('Fade out', () => c.fadeOut, v => c.fadeOut = v, 'default ' + seq.fadeOut);
  if (it && it.i < clips.length - 1) {
    select_('Then', [['', 'Default · ' + TRANS.find(x => x[0] === seq.trans)[1]], ...TRANS], () => c.trans || '',
      v => c.trans = v || null, { rebuild: true, seek: true, title: 'Transition into the next clip' });

  }

  h3('Sound');
  range('Volume', () => c.vol, v => c.vol = v, { min: 0, max: 1, step: 0.01, k: 100, dp: 0, nmax: 100, unit: '%' });
  check('Mute', () => c.mute, v => c.mute = v);

    ['Duplicate', () => duplicateClip(c.id), '', 'Ctrl+D'],
    ['Reset clip', () => { Object.assign(c, { in: 0, out: m.dur, speed: 1, vol: 1, mute: false, fadeIn: null, fadeOut: null, trans: null, transDur: null, tf: clone(TF_DEFAULT) }); commit(); rebuildAll(); }],
    ['Remove', () => removeClip(c.id), 'danger', 'Delete']

}

function inspTf(c) {

  h3('Frame');

function toFrame(e) {

  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
view.addEventListener('pointerdown', e => {
  if (!clips.length || exporting) return;

  const p = toFrame(e), X = p.x * pw, Y = p.y * ph;
  const hit = [...hits].reverse().find(h => X >= h.box.x - 6 && X <= h.box.x + h.box.w + 6 && Y >= h.box.y - 6 && Y <= h.box.y + h.box.h + 6);
  view.setPointerCapture(e.pointerId); view.classList.add('drag');
  if (hit) {
    const c = clips.find(x => x.id === hit.clip), t = c.texts.find(x => x.id === hit.text);
    if (sel !== c.id || selText !== t.id || tab !== 'text') { sel = c.id; selText = t.id; tab = 'text'; setTab('text'); renderList(); }
    drag = { kind: 'text', t, sx: p.x, sy: p.y, ox: t.x, oy: t.y };
  } else {
    const act = activeAt(T), it = act[act.length - 1];

/* ================================================================ export */
async function exportMP4() {
  if (!clips.length || exporting) return;
  if (typeof VideoEncoder === 'undefined') { toast('This build has no video encoder.', true); return; }
  pause();
  const W = seq.w & ~1, H = seq.h & ~1, fps = seq.fps;
  const N = Math.max(1, Math.round(total * fps));
  exporting = true; cancelExport = false;
  busy(true, 'Preparing…', 0);
  let encoder = null, aenc = null, readers = null, usedDecoder = 0, usedSeek = 0;
  try {
    const mod = await import('./lib/mp4-muxer.mjs');
    const bitrate = Math.round(seq.mbps * 1e6);

    /* pick a codec this machine can actually encode at this size */
    const big = W * H > 2048 * 1088;
    const tries = (big ? ['avc1.640034', 'avc1.640033', 'avc1.4d0034'] : ['avc1.640028', 'avc1.4d0028', 'avc1.640032', 'avc1.42001f'])
      .flatMap(c => [[c, 'prefer-hardware', 'avc'], [c, 'prefer-software', 'avc']])
      .concat([['vp09.00.41.08', 'prefer-software', 'vp9'], ['vp09.00.51.08', 'prefer-software', 'vp9']]);
    let vc = null;
    for (const [codec, hw, mux] of tries) {
      try {
        const r = await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate, framerate: fps, hardwareAcceleration: hw });
        if (r.supported) { vc = { codec, hw, mux }; break; }
      } catch (e) {}
    }
    if (!vc) throw new Error('no encoder for ' + W + '×' + H + ' on this machine');

    /* sound: decode each clip once, mix offline with the same fades */
    let audio = null;
    if (seq.audio && typeof AudioEncoder !== 'undefined') {
      busy(true, 'Reading audio…', 0);
      audio = await mixAudio();
    }
    let ac = null;
    if (audio) {
      for (const [codec, mux] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]) {
        try {
          const r = await AudioEncoder.isConfigSupported({ codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
          if (r.supported) { ac = { codec, mux }; break; }
        } catch (e) {}
      }
    }

    const target = new mod.ArrayBufferTarget();
    const muxer = new mod.Muxer({
      target, fastStart: 'in-memory', firstTimestampBehavior: 'offset',
      video: { codec: vc.mux, width: W, height: H, frameRate: fps },
      audio: ac ? { codec: ac.mux, numberOfChannels: 2, sampleRate: 48000 } : undefined
    });
    let encErr = null;
    encoder = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: e => encErr = e });
    encoder.configure({ codec: vc.codec, width: W, height: H, bitrate, framerate: fps, hardwareAcceleration: vc.hw,
                        latencyMode: 'quality', bitrateMode: 'variable' });

    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d', { alpha: false });
    const us = 1e6 / fps;
    let n = 0;
    const emit = (t, frames) => {
      renderAt(g, W, H, t, null, frames);
      const f = new VideoFrame(cv, { timestamp: Math.round(n * us), duration: Math.round(us) });
      encoder.encode(f, { keyFrame: n % (fps * 2) === 0 });
      f.close(); n++;
      if (n % 3 === 0) {
        vctx.setTransform(1, 0, 0, 1, 0, 0); vctx.drawImage(cv, 0, 0, pw, ph);
        busy(true, 'Frame ' + n + ' / ' + N + (ac ? '  ·  with sound' : ''), n / N);
      }
    };

    {
      /* each clip is decoded once, front to back; a clip the reader cannot
         handle falls back to seeking its <video> */
      readers = new Map();
      const frames = new Map();
      for (let i = 0; i < N; i++) {
        if (cancelExport) throw new Error('cancelled');
        if (encErr) throw encErr;
        const t = i / fps, act = activeAt(t);
        for (const [id, r] of readers) if (r && !act.some(it => it.c.id === id)) { r.close(); readers.set(id, null); }
        frames.clear();
        await Promise.all(act.map(async it => {
          const m = media.get(it.c.id), st = clamp(srcTime(it, t), 0, m.dur - 0.001);
          if (!readers.has(it.c.id)) {
            const idx = await mp4Index(m.file);
            let r = null;
            if (idx) { r = new FrameReader(m.file, idx); r.open(st); }
            readers.set(it.c.id, r);
            if (r) usedDecoder++; else usedSeek++;
          }
          const r = readers.get(it.c.id);
          if (r) { const f = await r.frameAt(st); if (f) frames.set(it.c.id, f); }
          else await seekTo(m.video, st);
        }));
        emit(t, frames);
        while (encoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 4));
      }
    }
    await encoder.flush();

    if (ac) {
      busy(true, 'Encoding sound…', 1);
      aenc = new AudioEncoder({ output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: e => encErr = e });
      aenc.configure({ codec: ac.codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
      const L = audio.getChannelData(0), R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : L;
      const frames = Math.min(audio.length, Math.round(N / fps * 48000));
      for (let off = 0; off < frames; off += 1024) {
        const k = Math.min(1024, frames - off), data = new Float32Array(k * 2);
        data.set(L.subarray(off, off + k), 0); data.set(R.subarray(off, off + k), k);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: k, numberOfChannels: 2,
                                   timestamp: Math.round(off / 48000 * 1e6), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush();
    }
    if (encErr) throw encErr;
    muxer.finalize();

    const blob = new Blob([target.buffer], { type: 'video/mp4' });
    const name = (seq.name || (clips.length === 1 ? clips[0].name : 'reel')).replace(/[\\/:*?"<>|]+/g, '_') + '.mp4';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast('Exported ' + name + ' · ' + (blob.size / 1048576).toFixed(1) + ' MB · ' + n + ' frames' + (audio && !ac ? ' · no audio encoder, saved without sound' : ''));
  } catch (e) {
    if (e.message !== 'cancelled') { console.error(e); toast('Export failed: ' + e.message, true); }
    else toast('Export cancelled.');
  } finally {
    try { if (encoder && encoder.state !== 'closed') encoder.close(); } catch (e) {}
    try { if (aenc && aenc.state !== 'closed') aenc.close(); } catch (e) {}
    if (readers) for (const r of readers.values()) if (r) r.close();
    window.__decodeStats = { usedDecoder, usedSeek };
    pauseAll();
    exporting = false; busy(false);
    showAt(T); updateTime();
  }
}

async function mixAudio() {
  const rate = 48000;
  const dec = new OfflineAudioContext(2, rate, rate);
  let any = false;
  for (const it of items) {
    const m = media.get(it.c.id);
    if (m.audio === undefined) {
      try { m.audio = await dec.decodeAudioData(await m.file.arrayBuffer()); } catch (e) { m.audio = null; }
      for (const o of media.values()) if (o.file === m.file && o.audio === undefined) o.audio = m.audio;
    }
    if (m.audio && !it.c.mute && it.c.vol > 0) any = true;
  }
  if (!any) return null;
  const ctx = new OfflineAudioContext(2, Math.max(1, Math.ceil(total * rate)), rate);
  for (const it of items) {
    const m = media.get(it.c.id), c = it.c;
    if (!m.audio || c.mute || c.vol <= 0) continue;
    const src = ctx.createBufferSource(); src.buffer = m.audio; src.playbackRate.value = c.speed;
    const gn = ctx.createGain(); src.connect(gn); gn.connect(ctx.destination);
    const a = it.start, b = it.start + it.len, v = c.vol;
    const pts = [];
    const fi = it.fadeInOn ? Math.min(fadeInOf(c), it.len * 0.5) : 0, fo = it.fadeOutOn ? Math.min(fadeOutOf(c), it.len * 0.5) : 0;
    const oi = it.ovIn ? it.ovIn.d : 0, oo = it.ovOut ? it.ovOut.d : 0;
    const rin = Math.max(fi, oi), rout = Math.max(fo, oo);
    pts.push([a, rin > 0 ? 0 : v]);
    if (rin > 0) pts.push([a + rin, v]);
    if (rout > 0) pts.push([b - rout, v]);
    pts.push([b, rout > 0 ? 0 : v]);
    gn.gain.setValueAtTime(pts[0][1], pts[0][0]);
    for (const [t, val] of pts.slice(1)) gn.gain.linearRampToValueAtTime(val, t);
    src.start(a, c.in, c.out - c.in);
  }
  return await ctx.startRendering();
}

function busy(on, s, p) {
  $('busy').classList.toggle('show', !!on);

  $('bzS').textContent = s || '';

}

}
function rebuildAll() {
  computeTimeline(); T = clamp(T, 0, total);
  renderList(); renderInsp(); fitView(); showAt(T); updateUndo();
}

$('bAdd').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('fileIn2').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('bSort').onclick = () => { clips.sort((a, b) => natural.compare(media.get(a.id).file.name, media.get(b.id).file.name)); commit(); rebuildAll(); };
$('bClear').onclick = () => {
  if (!clips.length || !confirm('Remove all ' + clips.length + ' clips?')) return;
  pause(); clips = []; sel = null; selText = null; commit(); rebuildAll();
};
$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('bExport').onclick = exportMP4;
$('bPlay').onclick = () => playing ? pause() : play();
$('bStart').onclick = () => { pause(); showAt(0); };
$('bPrev').onclick = e => { pause(); showAt(T - (e.shiftKey ? 1 : 1 / seq.fps)); };
$('bNext').onclick = e => { pause(); showAt(T + (e.shiftKey ? 1 : 1 / seq.fps)); };
$('cGuides').onchange = draw;

/* drop anywhere */
let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; $('drop').classList.add('over'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('over'); } });
addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
addEventListener('drop', e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  e.preventDefault(); dragDepth = 0; $('drop').classList.remove('over');
  addFiles(e.dataTransfer.files);
});

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'range';
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing || exporting) return;
  if (mod && e.key.toLowerCase() === 'd' && sel) { e.preventDefault(); duplicateClip(sel); return; }
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); pause(); showAt(T - (e.shiftKey ? 1 : 1 / seq.fps)); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); pause(); showAt(T + (e.shiftKey ? 1 : 1 / seq.fps)); }
  else if (e.key === 'Home') { pause(); showAt(0); }
  else if (e.key === 'End') { pause(); showAt(total); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
    const c = selClip();
    if (selText && tab === 'text' && c) { c.texts = c.texts.filter(x => x.id !== selText); selText = null; commit(); draw(); renderInsp(); renderList(); }
    else removeClip(sel);
  }
  else if (e.key.toLowerCase() === 'i' && sel && tab === 'clip') $('insp').querySelector('.btns button').click();
  else if (e.key.toLowerCase() === 'o' && sel && tab === 'clip') $('insp').querySelectorAll('.btns button')[1].click();
});

/* ================================================================ start */
document.fonts.load('500 40px "Turret Road"').finally(() => draw());
lastSnap = snapshot();
computeTimeline(); renderList(); renderInsp(); updateUndo(); fitView();
</script>
</body>
</html>
