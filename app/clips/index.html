<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Joiner</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/kit.css">
<style>
/* Clip Joiner page furniture. Every component (buttons, fields, rows, tabs, toolbar,
   dialog, toast) comes from ../shared/kit.css; only the layout and the parts that
   exist nowhere else (clip list, trim bar, 3x3 snap grid) are styled here. */
html,body{height:100%}
body.kit{display:grid;grid-template-rows:var(--hdr-h) minmax(0,1fr);overflow:hidden;user-select:none;-webkit-user-select:none}
/* inside Studio the host owns the header: this page only shows its work area */
html.embed body.kit{grid-template-rows:minmax(0,1fr)}
html.embed body.kit>header{display:none}
textarea,input[type=text],input[type=number]{user-select:text;-webkit-user-select:text}

/* ------------------------------------------------------------- header (standalone) */
header .info{color:var(--dim);font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ------------------------------------------------------------- layout */
main{display:grid;grid-template-columns:clamp(220px,17vw,300px) minmax(0,1fr) var(--panel-w);min-height:0}
#left,#right{background:var(--panel);min-height:0;min-width:0;display:flex;flex-direction:column}
@media(max-width:900px){ main{grid-template-columns:180px minmax(0,1fr) var(--panel-w)} }
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ------------------------------------------------------------- clip list */
.drop{margin:10px;border:1px dashed var(--line2);border-radius:10px;background:var(--bg);padding:12px 10px;text-align:center;
  color:var(--dim);cursor:pointer;position:relative;font-size:var(--fs);transition:border-color .12s,color .12s}
.drop:hover,.drop:focus-within{border-color:#8a8a94;color:var(--txt2)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop b{display:block;color:var(--txt);font-weight:600;font-size:var(--fs-l);margin-bottom:2px}
.listbar{display:flex;gap:6px;padding:0 10px 8px}
.listbar button{flex:1;white-space:nowrap;padding:6px 6px}
#list{flex:1;overflow-y:auto;padding:0 8px 12px}
.clip{display:flex;gap:8px;align-items:center;padding:5px;cursor:pointer}
.clip.dragging{opacity:.3}
.clip.before{box-shadow:0 -2px 0 #c8c8ce}
.clip.after{box-shadow:0 2px 0 #c8c8ce}
.clip img,.clip .noimg{width:64px;height:36px;object-fit:cover;border-radius:4px;background:#000;flex:none}
.clip .meta{flex:1;min-width:0}
.clip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .sub{color:var(--dim);font-size:var(--fs-s);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .n{color:var(--dim);font-size:var(--fs-xs);width:16px;text-align:right;flex:none}
.tr{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 16px;color:var(--dim);font-size:var(--fs-s)}
.tr::before{content:"";width:8px;flex:none;border-top:1px solid var(--line2)}
.tr select{flex:1;min-width:0;max-width:230px;height:22px;padding-left:6px;font-size:var(--fs-s);color:var(--txt2)}
.empty{color:var(--dim);text-align:center;padding:30px 12px;line-height:1.6}

/* ------------------------------------------------------------- preview */
#stage{flex:1;min-height:0;position:relative;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
#view{display:block;box-shadow:0 0 0 1px var(--line);cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
body.noclips #view{display:none}
body.noclips #strip{display:none}
#strip{display:block;width:100%;height:64px;flex:none;background:var(--bg);border-top:1px solid var(--line);cursor:pointer;touch-action:none}

/* ------------------------------------------------------------- inspector */
#right .tabs{margin:10px 10px 2px}
#right .tabs button{flex:1}
#right .tabs button:disabled{opacity:.35}
#insp{flex:1;overflow-y:auto;padding:4px 10px 20px}
#insp .row input.val{width:56px}
#insp .row .unit{flex:none;width:24px;color:var(--dim);font-size:var(--fs-xs);white-space:nowrap}
#insp .row .unit.wide{width:auto}
#insp .row.top{align-items:flex-start}
#insp .row.top>label{padding-top:5px}
#insp .clipname{font-size:var(--fs-l);font-weight:600;margin:8px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#insp .btnrow{margin:8px 0}
.trim{position:relative;height:26px;background:var(--bg);border:1px solid var(--line);border-radius:5px;margin:6px 0 6px;touch-action:none}
.trim .keep{position:absolute;top:0;bottom:0;background:var(--panel3);border-left:2px solid #c8c8ce;border-right:2px solid #c8c8ce;cursor:grab}
.trim .hd{position:absolute;top:-1px;bottom:-1px;width:12px;margin-left:-6px;cursor:ew-resize}
.trim .ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:.6;pointer-events:none}
.texts{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.titem{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.titem:hover{border-color:var(--line2)}
.titem.sel{border-color:#74747e;background:var(--panel3)}
.titem .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem button.ibtn{width:24px;height:24px;flex:none}
/* 3x3 snap grid: nine real cells, the active one filled */
.pos9{display:grid;grid-template-columns:repeat(3,28px);gap:4px}
.pos9 button{width:28px;height:20px;padding:0;border-radius:4px;background:var(--bg);border:1px solid #4a4a52}
.pos9 button:hover{border-color:#9a9aa2;background:var(--panel3)}
.pos9 button.on{background:#c8c8ce;border-color:#c8c8ce}

/* ------------------------------------------------------------- export (busy) */
#busy .kit-dlg{width:min(440px,100%)}
#busy .kit-dlg-body{padding-bottom:6px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#c8c8ce;transition:width .15s linear}
#bzS{margin:10px 0 0;min-height:18px;font-size:var(--fs);color:var(--txt2);font-variant-numeric:tabular-nums}
#pool{display:none}
</style>
</head>
<body class="kit">

<header class="kit-head">
  <h1>Clip Joiner</h1>
  <button id="bAdd" data-ic="plus" title="Add video clips (or drop them anywhere)">Add clips…</button>
  <input id="fileIn" type="file" accept="video/*" multiple hidden>
  <button id="bUndo" data-ic="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="bRedo" data-ic="redo" title="Redo (Ctrl+Y)">Redo</button>
  <div class="grow"></div>
  <span class="info" id="hInfo"></span>
  <button id="bKeys" data-ic="key" title="Keyboard shortcuts (?)">Shortcuts</button>
  <button id="bExport" class="acc" data-ic="down" title="Render the sequence to an MP4 file">Export MP4</button>
</header>

<main>
  <section id="left">
    <label class="drop" id="drop"><input id="fileIn2" type="file" accept="video/*" multiple>
      <b>Drop clips here</b>MP4, WebM, MOV · added in name order</label>
    <div class="listbar">
      <button id="bSort" title="Sort all clips by file name">Sort by name</button>
      <button id="bClear" data-ic="trash" title="Remove every clip">Clear all</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="center">
    <div id="stage">
      <canvas id="view" width="960" height="540"></canvas>
      <div class="kit-empty" id="stageHint"><div class="card"><div class="ke-ic" data-ic="join"></div><b>Drop your clips anywhere</b>
        <span>They join with a short fade to black between each one.</span>
        <div class="btnrow"><button id="bAdd2" type="button" data-ic="plus">Add clips…</button></div></div></div>
    </div>
    <div class="kit-transport" id="transport">
      <button id="bStart" class="ibtn" data-ic="tostart" title="Go to start (Home)" aria-label="Go to start"></button>
      <button id="bPrev" class="ibtn" data-ic="stepback" title="Previous frame (←), Shift = 1 s" aria-label="Previous frame"></button>
      <button id="bPlay" class="ibtn" data-ic="play" title="Play / pause (Space)" aria-label="Play"></button>
      <button id="bNext" class="ibtn" data-ic="stepfwd" title="Next frame (→), Shift = 1 s" aria-label="Next frame"></button>
      <button id="bEnd" class="ibtn" data-ic="toend" title="Go to end (End)" aria-label="Go to end"></button>
      <div class="tsep"></div>
      <span class="tm" id="tTime">0:00.00 / 0:00.00</span>
      <span class="tm opt end" id="tFrame">frame 0</span>
      <div class="tgrow"></div>
      <button id="cLoop" class="ibtn" data-ic="loop" title="Loop playback" aria-label="Loop"></button>
      <button id="cSound" class="ibtn on" data-ic="sound" title="Hear the clips while previewing" aria-label="Sound"></button>
      <button id="cGuides" class="ibtn" data-ic="grid" title="Show the centre lines and a 5% safe margin" aria-label="Guides"></button>
    </div>
    <canvas id="strip" height="64"></canvas>
  </section>

  <section id="right">
    <div class="tabs" id="tabs">
      <button data-tab="seq" class="on">Sequence</button>
      <button data-tab="clip">Clip</button>
      <button data-tab="tf">Transform</button>
      <button data-tab="text">Text</button>
    </div>
    <div id="insp"></div>
  </section>
</main>

<div id="busy" class="kit-dlg-scrim" hidden>
  <div class="kit-dlg" role="dialog" aria-modal="true" aria-labelledby="bzT">
    <h3 id="bzT">Exporting</h3>
    <div class="kit-dlg-body">
      <div class="bar"><i id="bzBar"></i></div>
      <div id="bzS" aria-live="polite"></div>
    </div>
    <div class="kit-dlg-btns"><button id="bzCancel">Cancel</button></div>
  </div>
</div>
<div id="pool"></div>

<script src="../shared/kit.js"></script>
<script src="../shared/embed.js"></script>
<script>
'use strict';
/*
 * Clip Joiner: short clips in, one MP4 out.
 *
 * The sequence is a list of clips laid end to end. Between two clips there is
 * a transition: a fade through black (the default - the old clip closes to
 * black, the next one opens from black), a crossfade, a push, a wipe or a
 * straight cut. Each clip has its own trim, speed, transform (zoom, pan,
 * rotation, crop, optional animated zoom) and any number of text overlays.
 *
 * Everything is drawn by one function, renderAt(), at a time T on the
 * sequence. The preview and the export both call it, so what you see is
 * what you get. All geometry is stored as fractions of the output frame, so
 * the preview can draw at screen size and the export at full size.
 */

/* Reading, decoding and encoding video is shared with the other tools:
   app/shared/lib/video-io.js. It is an ES module and this page is a classic
   script (its top-level names must stay reachable), so it is imported
   dynamically and its functions bound to these names. Everything that uses
   them waits for vioReady first. */
let loadVideoElement, seekTo, mp4Index, FrameReader, Encoder, pickVideoCodec, decodeAudioFile, mixTracks;
const vioReady = import('../shared/lib/video-io.js').then(m => {
  ({ loadVideoElement, seekTo, mp4Index, FrameReader, Encoder, pickVideoCodec, decodeAudioFile, mixTracks } = m);
}).catch(e => { console.error(e); });

const $ = id => document.getElementById(id);
/* canvas colours come from the kit tokens, so the strip and the guides match the panels */
const CSSV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { bg: CSSV('--bg') || '#101012', hi: '#d4d4da', seg: ['#202024', '#27272d'], segSel: '#41414c' };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const uid = () => Math.random().toString(36).slice(2, 10);
const tick = () => new Promise(r => setTimeout(r, 0));
const clone = o => JSON.parse(JSON.stringify(o));
function ease(kind, p) {
  p = clamp(p, 0, 1);
  if (kind === 'linear') return p;
  if (kind === 'in') return p * p;
  if (kind === 'out') return 1 - (1 - p) * (1 - p);
  return p * p * (3 - 2 * p);                       /* smooth */
}
function fmt(t, fps) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
}
const natural = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

/* ================================================================ state */
const PRESETS = [
  ['1080p', 'Landscape 1920×1080', 1920, 1080],
  ['4k',    'Landscape 3840×2160', 3840, 2160],
  ['720p',  'Landscape 1280×720',  1280, 720],
  ['vert',  'Vertical 1080×1920',  1080, 1920],
  ['sq',    'Square 1080×1080',    1080, 1080],
  ['45',    'Portrait 1080×1350',  1080, 1350],
  ['first', 'Match first clip',    0, 0],
  ['custom','Custom',              0, 0]
];
const TRANS = [
  ['fade',  'Fade through black'],
  ['cross', 'Crossfade'],
  ['push',  'Push'],
  ['wipe',  'Wipe'],
  ['cut',   'Cut']
];
const FPS_LIST = [24, 25, 30, 50, 60, 120];
const FONTS = ['Turret Road', 'Segoe UI', 'Bahnschrift', 'Arial', 'Arial Black', 'Impact', 'Consolas', 'Georgia'];

const SEQ_DEFAULT = {
  preset: '1080p', w: 1920, h: 1080, fps: 30, bg: '#000000',
  trans: 'fade', fadeIn: 0.25, fadeOut: 0.25, hold: 0, fadeColor: '#000000',
  crossDur: 0.4, curve: 'smooth', firstIn: true, lastOut: true,
  mbps: 16, audio: true, name: ''
};
const TF_DEFAULT = { fit: 'cover', z0: 1, x0: 0, y0: 0, z1: 1.12, x1: 0, y1: 0, anim: false,
                     ease: 'smooth', rot: 0, flip: false, cl: 0, cr: 0, ct: 0, cb: 0 };
const TEXT_DEFAULT = {
  text: 'Title', font: 'Turret Road', weight: '500', size: 0.055, color: '#ffffff', op: 1,
  align: 'center', x: 0.5, y: 0.86, ls: 0.02, upper: false, lh: 1.15,
  stroke: 0, strokeColor: '#000000', shadow: 0.5,
  box: false, boxColor: '#000000', boxOp: 0.55, boxPad: 0.4,
  start: 0, dur: 0, anim: 'fade', animDur: 0.3
};

let seq = Object.assign({}, SEQ_DEFAULT, readJSON('clips.seq'));
let textStyle = Object.assign({}, TEXT_DEFAULT, readJSON('clips.textStyle'));
let clips = [];                 /* the model: plain data, undoable */
const media = new Map();        /* clip id -> {video, file, url, dur, vw, vh, thumb, audio} */
let sel = null, selText = null, tab = 'seq', editEnd = false;
let T = 0, playing = false, exporting = false, cancelExport = false;
let items = [], total = 0;      /* derived timeline */
let hits = [];                  /* text boxes of the last preview frame */

function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* Per-clip settings are remembered by file, so dropping the same clip again
   later brings back its trim, transform and texts. */
function sigOf(f) { return f.name + '|' + f.size + '|' + f.lastModified; }
let memory = readJSON('clips.memory');
let memTimer = 0;
function remember() {
  clearTimeout(memTimer);
  memTimer = setTimeout(() => {
    for (const c of clips) {
      const { id, name, sig, ...rest } = c;
      memory[c.sig] = { t: Date.now(), s: rest };
    }
    const keys = Object.keys(memory).sort((a, b) => memory[b].t - memory[a].t);
    for (const k of keys.slice(200)) delete memory[k];
    writeJSON('clips.memory', memory);
    writeJSON('clips.seq', seq);
  }, 400);
}

/* ================================================================ undo */
let past = [], future = [], lastSnap = null;
function snapshot() { return JSON.stringify({ seq, clips }); }
function commit() {
  const s = snapshot();
  if (s === lastSnap) return;
  if (lastSnap !== null) { past.push(lastSnap); if (past.length > 120) past.shift(); }
  future = []; lastSnap = s;
  remember(); updateUndo();
}
function restore(s) {
  const o = JSON.parse(s);
  seq = o.seq; clips = o.clips;
  if (sel && !clips.some(c => c.id === sel)) sel = null;
  selText = null;
  lastSnap = s; rebuildAll(); remember(); updateUndo();
}
function undo() { if (!past.length || exporting) return; future.push(lastSnap); restore(past.pop()); }
function redo() { if (!future.length || exporting) return; past.push(lastSnap); restore(future.pop()); }
function updateUndo() {
  $('bUndo').disabled = !past.length; $('bRedo').disabled = !future.length;
  setAction('undo', { disabled: !past.length }); setAction('redo', { disabled: !future.length });
}

/* ================================================================ media */
const pool = $('pool');

function loadVideo(url) { return loadVideoElement(url, pool); }
async function thumbOf(v, t) {
  await seekTo(v, t);
  const c = document.createElement('canvas'); c.width = 128; c.height = 72;
  const g = c.getContext('2d');
  const s = Math.max(128 / v.videoWidth, 72 / v.videoHeight);
  const w = v.videoWidth * s, h = v.videoHeight * s;
  g.fillStyle = '#000'; g.fillRect(0, 0, 128, 72);
  g.drawImage(v, (128 - w) / 2, (72 - h) / 2, w, h);
  return c.toDataURL('image/jpeg', 0.7);
}

async function addFiles(list) {
  if (exporting) return;
  await vioReady;
  const files = [...list].filter(f => /^video\//.test(f.type) || /\.(mp4|m4v|mov|webm|mkv)$/i.test(f.name))
                         .sort((a, b) => natural.compare(a.name, b.name));
  if (!files.length) { toast('No video files in that drop.', true); return; }
  pause();
  let added = 0, failed = [];
  for (const f of files) {
    try {
      const url = URL.createObjectURL(f);
      const v = await loadVideo(url);
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) throw new Error('no duration');
      const id = uid();
      const c = { id, sig: sigOf(f), name: f.name.replace(/\.[^.]+$/, ''),
                  in: 0, out: dur, speed: 1, vol: 1, mute: false,
                  fadeIn: null, fadeOut: null, trans: null, transDur: null,
                  tf: clone(TF_DEFAULT), texts: [] };
      const old = memory[c.sig] && memory[c.sig].s;
      if (old && Math.abs((old.out || 0) - dur) < dur + 1) {
        Object.assign(c, clone(old));
        c.out = clamp(c.out, 0.05, dur); c.in = clamp(c.in, 0, c.out - 0.05);
        c.tf = Object.assign(clone(TF_DEFAULT), c.tf);
        c.texts = (c.texts || []).map(t => Object.assign(clone(TEXT_DEFAULT), t, { id: uid() }));
      }
      media.set(id, { video: v, file: f, url, dur, vw: v.videoWidth, vh: v.videoHeight, thumb: null, audio: undefined });
      clips.push(c);
      added++;
      media.get(id).thumb = await thumbOf(v, clamp(c.in + 0.3, 0, dur - 0.01));
    } catch (e) { failed.push(f.name); }
  }
  const wasEmpty = !sel;
  if (!sel && clips.length) sel = clips[0].id;
  if (seq.preset === 'first') applyPreset();
  commit(); rebuildAll();
  /* first load: park on a frame you can see, not on the black of the opening fade */
  if (wasEmpty && items.length) showAt(items[0].start + Math.min(items[0].len * 0.5, fadeInOf(items[0].c) + 0.3));
  if (failed.length) toast('Could not read: ' + failed.join(', '), true);
  else toast(added + ' clip' + (added === 1 ? '' : 's') + ' added');
}

/* A duplicated clip gets its own video element: two clips from one file can
   be on screen at once during a crossfade, each at its own time. */
async function duplicateClip(id) {
  const i = clips.findIndex(c => c.id === id); if (i < 0) return;
  const src = media.get(id);
  await vioReady;
  const v = await loadVideo(src.url);
  const c = clone(clips[i]); c.id = uid();
  c.texts.forEach(t => t.id = uid());
  media.set(c.id, Object.assign({}, src, { video: v }));
  clips.splice(i + 1, 0, c); sel = c.id;
  commit(); rebuildAll();
}
function removeClip(id) {
  const i = clips.findIndex(c => c.id === id); if (i < 0) return;
  clips.splice(i, 1);
  sel = clips[Math.min(i, clips.length - 1)] ? clips[Math.min(i, clips.length - 1)].id : null;
  selText = null;
  commit(); rebuildAll();
}

/* The MP4 index reader, FrameReader, seeking and the encoder live in ../shared/lib/video-io.js. */

/* ================================================================ timeline */
const transOf = c => ({ type: c.trans || seq.trans, dur: c.transDur != null ? c.transDur : seq.crossDur });
const OVERLAP = { cross: 1, push: 1, wipe: 1 };

function computeTimeline() {
  const lens = clips.map(c => Math.max(0.05, (c.out - c.in) / c.speed));
  items = []; let t = 0;
  clips.forEach((c, i) => {
    const it = { c, i, start: t, len: lens[i], fadeInOn: false, fadeOutOn: false, ovIn: null, ovOut: null };
    items.push(it);
    if (i === 0) it.fadeInOn = seq.firstIn;
    if (i === clips.length - 1) { it.fadeOutOn = seq.lastOut; t = it.start + it.len; return; }
    const tr = transOf(c);
    if (OVERLAP[tr.type]) {
      const d = Math.min(tr.dur, lens[i] * 0.45, lens[i + 1] * 0.45);
      it.ovOut = { type: tr.type, d };
      t = it.start + it.len - d;
    } else if (tr.type === 'fade') {
      it.fadeOutOn = true;
      t = it.start + it.len + Math.max(0, seq.hold);
    } else t = it.start + it.len;
  });
  items.forEach((it, i) => {
    if (i > 0 && items[i - 1].ovOut) it.ovIn = items[i - 1].ovOut;
    if (i > 0 && items[i - 1].fadeOutOn && transOf(items[i - 1].c).type === 'fade') it.fadeInOn = true;
  });
  total = items.length ? t : 0;
}
const fadeInOf = c => c.fadeIn != null ? c.fadeIn : seq.fadeIn;
const fadeOutOf = c => c.fadeOut != null ? c.fadeOut : seq.fadeOut;
const srcTime = (it, t) => it.c.in + (t - it.start) * it.c.speed;

function activeAt(t) {
  if (!items.length) return [];
  if (t >= total) t = total - 1e-6;
  return items.filter(it => t >= it.start && t < it.start + it.len);
}
/* How bright a clip is at local time lt: the black fades at its two ends. */
function brightness(it, lt) {
  let b = 1;
  if (it.fadeInOn) { const d = Math.min(fadeInOf(it.c), it.len * 0.5); if (d > 0) b = Math.min(b, ease(seq.curve, lt / d)); }

function applyPreset() {
  const p = PRESETS.find(x => x[0] === seq.preset);
  if (!p) return;
  if (p[0] === 'first') {
    const m = clips[0] && media.get(clips[0].id);
    if (m) { seq.w = m.vw & ~1; seq.h = m.vh & ~1; }
  } else if (p[0] !== 'custom') { seq.w = p[2]; seq.h = p[3]; }
  seq.mbps = seq.w * seq.h > 2.5e6 ? 45 : seq.w * seq.h > 1e6 ? 16 : 8;
}

  const p = toFrame(e);
  if (drag.kind === 'text') {
    let x = drag.ox + (p.x - drag.sx), y = drag.oy + (p.y - drag.sy);
    if (drag.t.align === 'center' && Math.abs(x - 0.5) < 0.012) x = 0.5;
    if (Math.abs(y - 0.5) < 0.012) y = 0.5;
    drag.t.x = clamp(x, 0, 1); drag.t.y = clamp(y, 0, 1);
    if (txUI) { txUI.x.show(); txUI.y.show(); }
  } else {
    const x = drag.ox + (p.x - drag.sx), y = drag.oy + (p.y - drag.sy);
    if (drag.end) { drag.tf.x1 = x; drag.tf.y1 = y; } else { drag.tf.x0 = x; drag.tf.y0 = y; }
    if (tfUI && tab === 'tf') { tfUI.px.show(); tfUI.py.show(); }
  }
  draw();
});
view.addEventListener('pointerup', () => { if (drag) { drag = null; view.classList.remove('drag'); commit(); } });
view.addEventListener('wheel', e => {
  if (!clips.length || exporting) return;
  e.preventDefault();
  const act = activeAt(T), it = act[act.length - 1]; if (!it) return;
  if (it.c.id !== sel) { sel = it.c.id; selText = null; renderList(); renderInsp(); }
  const tf = it.c.tf, end = editEnd && tf.anim, k = Math.exp(-e.deltaY * 0.0012);
  if (end) tf.z1 = clamp(tf.z1 * k, 0.2, 4); else tf.z0 = clamp(tf.z0 * k, 0.2, 4);
  if (tfUI && tab === 'tf') tfUI.z.show();
  draw();
  clearTimeout(wheelTimer); wheelTimer = setTimeout(commit, 300);
}, { passive: false });
let wheelTimer = 0;

/* ================================================================ export */
async function exportMP4() {
  if (!clips.length || exporting) return;
  await vioReady;
  if (typeof VideoEncoder === 'undefined') { toast('This build has no video encoder.', true); return; }
  pause();
  const W = seq.w & ~1, H = seq.h & ~1, fps = seq.fps;
  const N = Math.max(1, Math.round(total * fps));
  exporting = true; cancelExport = false;
  busy(true, 'Preparing…', 0);
  let encoder = null, readers = null, usedDecoder = 0, usedSeek = 0;
  try {
    const bitrate = Math.round(seq.mbps * 1e6);

    /* pick a codec this machine can actually encode at this size */
    const vc = await pickVideoCodec(W, H, { bitrate, fps });
    if (!vc) throw new Error('no encoder for ' + W + '×' + H + ' on this machine');

    /* sound: decode each clip once, mix offline with the same fades */
    let audio = null;
    if (seq.audio && typeof AudioEncoder !== 'undefined') {
      busy(true, 'Reading audio…', 0);
      audio = await mixAudio();
    }

    encoder = await Encoder.create({ width: W, height: H, fps, bitrate, audio: !!audio, vc });
    const ac = encoder.hasAudio;

    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d', { alpha: false });
    let n = 0;
    const emit = (t, frames) => {
      renderAt(g, W, H, t, null, frames);
      encoder.encode(cv); n++;
      if (n % 3 === 0) {
        vctx.setTransform(1, 0, 0, 1, 0, 0); vctx.drawImage(cv, 0, 0, pw, ph);
        busy(true, 'Frame ' + n + ' / ' + N + (ac ? '  ·  with sound' : ''), n / N);
      }
    };

    {
      /* each clip is decoded once, front to back; a clip the reader cannot
         handle falls back to seeking its <video> */
      readers = new Map();
      const frames = new Map();
      for (let i = 0; i < N; i++) {
        if (cancelExport) throw new Error('cancelled');
        encoder.check();
        const t = i / fps, act = activeAt(t);
        for (const [id, r] of readers) if (r && !act.some(it => it.c.id === id)) { r.close(); readers.set(id, null); }
        frames.clear();
        await Promise.all(act.map(async it => {
          const m = media.get(it.c.id), st = clamp(srcTime(it, t), 0, m.dur - 0.001);
          if (!readers.has(it.c.id)) {
            const idx = await mp4Index(m.file);
            let r = null;
            if (idx) { r = new FrameReader(m.file, idx, { cancelled: () => cancelExport }); r.open(st); }
            readers.set(it.c.id, r);
            if (r) usedDecoder++; else usedSeek++;
          }
          const r = readers.get(it.c.id);
          if (r) { const f = await r.frameAt(st); if (f) frames.set(it.c.id, f); }
          else await seekTo(m.video, st);
        }));
        emit(t, frames);
        await encoder.drain();
      }
    }
    await encoder.flushVideo();

    if (ac) {
      busy(true, 'Encoding sound…', 1);
      await encoder.addAudio(audio, N / fps);
    }
    const { blob } = encoder.finalize();

    const name = (seq.name || (clips.length === 1 ? clips[0].name : 'reel')).replace(/[\/:*?"<>|]+/g, '_') + '.mp4';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast('Exported ' + name + ' · ' + (blob.size / 1048576).toFixed(1) + ' MB · ' + n + ' frames' + (audio && !ac ? ' · no audio encoder, saved without sound' : ''));
  } catch (e) {
    if (e.message !== 'cancelled') { console.error(e); toast('Export failed: ' + e.message, true); }
    else toast('Export cancelled.');
  } finally {
    if (encoder) encoder.close();
    if (readers) for (const r of readers.values()) if (r) r.close();
    window.__decodeStats = { usedDecoder, usedSeek };
    pauseAll();
    exporting = false; busy(false);
    showAt(T); updateTime();
  }
}

async function mixAudio() {
  const rate = 48000;
  const dec = new OfflineAudioContext(2, rate, rate);
  let any = false;
  for (const it of items) {
    const m = media.get(it.c.id);
    if (m.audio === undefined) {
      m.audio = await decodeAudioFile(m.file, dec);
      for (const o of media.values()) if (o.file === m.file && o.audio === undefined) o.audio = m.audio;
    }
    if (m.audio && !it.c.mute && it.c.vol > 0) any = true;
  }
  if (!any) return null;
  const tracks = [];
  for (const it of items) {
    const m = media.get(it.c.id), c = it.c;
    if (!m.audio || c.mute || c.vol <= 0) continue;
    const a = it.start, b = it.start + it.len, v = c.vol;
    const pts = [];
    const fi = it.fadeInOn ? Math.min(fadeInOf(c), it.len * 0.5) : 0, fo = it.fadeOutOn ? Math.min(fadeOutOf(c), it.len * 0.5) : 0;
    const oi = it.ovIn ? it.ovIn.d : 0, oo = it.ovOut ? it.ovOut.d : 0;
    const rin = Math.max(fi, oi), rout = Math.max(fo, oo);
    pts.push([a, rin > 0 ? 0 : v]);
    if (rin > 0) pts.push([a + rin, v]);
    if (rout > 0) pts.push([b - rout, v]);
    pts.push([b, rout > 0 ? 0 : v]);
    tracks.push({ buffer: m.audio, speed: c.speed, start: a, offset: c.in, duration: c.out - c.in, points: pts });
  }
  return await mixTracks(tracks, total, rate);
}

/* The export overlay is a Kit dialog frame (kit.css) that stays in this page, so it
   covers the work area in Studio too. Esc or Cancel stops the export. */
function busy(on, s, p) {
  const box = $('busy');
  if (!on) { box.hidden = true; syncActions(); return; }
  if (box.hidden) { box.hidden = false; $('bzCancel').focus(); }
  $('bzS').textContent = s || '';
  $('bzBar').style.width = Math.round((p || 0) * 100) + '%';
  syncActions();
}
$('bzCancel').onclick = () => { cancelExport = true; };

/* ================================================================ studio host */
/* The Studio header shows these as buttons (the standalone header has its own). The
   state is only sent when it changes: updateTime runs on every playback frame. */
const SHORTCUTS = [
  ['Playback', [['Space', 'Play / pause'], ['← →', 'Previous / next frame'], ['Shift + ← →', 'Back / forward 1 second'],
                ['Home / End', 'Go to start / end']]],
  ['File', [['Ctrl + O', 'Add clips'], ['Ctrl + E', 'Export MP4 (Ctrl + S does the same)']]],
  ['Editing', [['Ctrl + Z', 'Undo'], ['Ctrl + Y', 'Redo (also Ctrl + Shift + Z)'], ['Ctrl + D', 'Duplicate the selected clip'],
               ['Delete', 'Remove the selected clip, or the selected text'], ['I / O', 'Set In / Out at the playhead (Clip tab)']]],
  ['Preview', [['Drag', 'Pan the clip, or move a text'], ['Scroll', 'Zoom the clip'], ['Esc', 'Cancel an export in progress']]]
];
let hostReady = false;
const actionCache = {};
function setAction(id, patch) {
  if (!hostReady) return;
  const key = JSON.stringify(patch);
  if (actionCache[id] === key) return;
  actionCache[id] = key; Embed.action(id, patch);
}
function syncActions() {
  setAction('add', { disabled: exporting });
  setAction('export', { disabled: !clips.length || exporting, label: exporting ? 'Exporting…' : 'Export MP4' });
}

/* ================================================================ misc */
/* Notices go through Embed: the Studio toast in the host, this page's Kit toast alone. */
function toast(msg, err) { Embed.toast(msg, err ? { kind: 'err', ms: 6000 } : undefined); }
function rebuildAll() {
  computeTimeline(); T = clamp(T, 0, total);
  renderList(); renderInsp(); fitView(); showAt(T); updateUndo();
}
function setIcon(btn, name) {
  const old = btn.querySelector('svg.ic'); if (old) old.remove();
  btn.insertBefore(Kit.icon(name), btn.firstChild);
}
function setPlayUI(on) {
  const b = $('bPlay');
  b.classList.toggle('on', on); setIcon(b, on ? 'pause' : 'play');
  b.setAttribute('aria-label', on ? 'Pause' : 'Play');
}
/* Loop / Sound / Guides are toggle buttons that still answer to .checked, like the
   checkboxes they replaced. */
function toggleBtn(btn, o) {
  Object.defineProperty(btn, 'checked', {
    get: () => btn.classList.contains('on'),
    set: v => {
      btn.classList.toggle('on', !!v); btn.setAttribute('aria-pressed', v ? 'true' : 'false');
      if (o && o.icon) setIcon(btn, v ? o.icon[0] : o.icon[1]);
    }
  });
  btn.checked = btn.classList.contains('on');
  btn.onclick = () => { btn.checked = !btn.checked; if (o && o.change) o.change(); };
}
Kit.paintIcons();
Kit.config({ stage: '#stage' });
toggleBtn($('cLoop'));
toggleBtn($('cSound'), { icon: ['sound', 'mute'] });
toggleBtn($('cGuides'), { change: draw });
/* the frame number drops out when the bar is narrow; done a frame later so the observer never feeds itself */
new ResizeObserver(() => requestAnimationFrame(() => {
  const t = $('transport');
  t.classList.toggle('compact', t.clientWidth < 560); t.classList.toggle('tight', t.clientWidth < 420);
})).observe($('transport'));

$('bAdd').onclick = () => $('fileIn').click();
$('bAdd2').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('fileIn2').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('bSort').onclick = () => { clips.sort((a, b) => natural.compare(media.get(a.id).file.name, media.get(b.id).file.name)); commit(); rebuildAll(); };
$('bClear').onclick = async () => {
  if (!clips.length || exporting) return;
  const ok = await Embed.confirm('Remove all ' + clips.length + ' clips? Undo brings them back.',
    { title: 'Clear all clips', ok: 'Remove all', danger: true });
  if (!ok || !clips.length) return;
  pause(); clips = []; sel = null; selText = null; commit(); rebuildAll();
};
$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('bExport').onclick = exportMP4;
$('bKeys').onclick = () => Kit.keys(SHORTCUTS, { button: $('bKeys') });
$('bPlay').onclick = () => playing ? pause() : play();
$('bStart').onclick = () => { pause(); showAt(0); };
$('bPrev').onclick = e => { pause(); showAt(T - (e.shiftKey ? 1 : 1 / seq.fps)); };
$('bNext').onclick = e => { pause(); showAt(T + (e.shiftKey ? 1 : 1 / seq.fps)); };
$('bEnd').onclick = () => { pause(); showAt(total); };

/* drop anywhere on the window (Kit shows the veil and keeps the window from opening the file) */
Kit.drop(document.body, {
  accept: f => /^video\//.test(f.type) || /\.(mp4|m4v|mov|webm|mkv)$/i.test(f.name),
  overlayText: 'Drop video clips to add them',
  enabled: () => !exporting,
  onFiles: files => addFiles(files),
  onReject: () => toast('No video files in that drop.', true)
});

addEventListener('keydown', e => {
  if (e.key === 'Escape' && exporting) { cancelExport = true; return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'range';
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (mod && !e.shiftKey && !e.altKey && !exporting) {
    const k = e.key.toLowerCase();
    if (k === 'o') { e.preventDefault(); $('fileIn').click(); return; }
    if (k === 'e' || k === 's') { e.preventDefault(); if (clips.length) exportMP4(); return; }
  }
  if (typing || exporting) return;
  if (mod && e.key.toLowerCase() === 'd' && sel) { e.preventDefault(); duplicateClip(sel); return; }
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); pause(); showAt(T - (e.shiftKey ? 1 : 1 / seq.fps)); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); pause(); showAt(T + (e.shiftKey ? 1 : 1 / seq.fps)); }
  else if (e.key === 'Home') { pause(); showAt(0); }
  else if (e.key === 'End') { pause(); showAt(total); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
    const c = selClip();
    if (selText && tab === 'text' && c) { c.texts = c.texts.filter(x => x.id !== selText); selText = null; commit(); draw(); renderInsp(); renderList(); }
    else removeClip(sel);
  }
  else if (e.key.toLowerCase() === 'i' && sel && tab === 'clip') $('insp').querySelector('.btns button').click();
  else if (e.key.toLowerCase() === 'o' && sel && tab === 'clip') $('insp').querySelectorAll('.btns button')[1].click();
  else if (e.key === '?' && !Embed.active) Kit.keys(SHORTCUTS, { button: $('bKeys') });
});

/* ================================================================ start */
Embed.register({
  id: 'join', title: 'Join clips',
  actions: [
    { id: 'add', label: 'Add clips…', icon: 'plus', key: 'Ctrl+O', tip: 'Add video clips (or drop them anywhere)', run: () => $('fileIn').click() },
    { id: 'undo', label: 'Undo', icon: 'undo', short: true, key: 'Ctrl+Z', disabled: true, run: () => undo() },
    { id: 'redo', label: 'Redo', icon: 'redo', short: true, key: 'Ctrl+Y', disabled: true, run: () => redo() },
    { id: 'export', label: 'Export MP4', icon: 'down', primary: true, disabled: true, key: 'Ctrl+E',
      tip: 'Render the sequence to an MP4 file', run: () => exportMP4() }
  ],
  shortcuts: SHORTCUTS,
  accepts: ['video/*'],
  onReceive: files => addFiles(files),
  onShow: () => fitView(),
  onHide: () => pause()
});
hostReady = true;
document.fonts.load('500 40px "Turret Road"').finally(() => draw());
lastSnap = snapshot();
computeTimeline(); renderList(); renderInsp(); updateUndo(); fitView();
</script>
</body>
