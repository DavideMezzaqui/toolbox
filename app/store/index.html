}},

{n:'Diagonal', f:(L, fm)=>{
  const mini = fm && (fm.profile==='small' || fm.profile==='tiny');
  L.band.slant=0.05; L.band.feather=Math.max(L.band.feather,0.02);
  /* il taglio in punta e' in multipli dello spessore: sulla Card la barra
     e' spessa e un taglio lungo diventava un triangolo enorme */
  L.accent.endCut = mini ? 0.6 : 3;
  if(!mini) L.accent.thick*=1.3;
  /* la trama obliqua ha senso dove c'e' spazio: su Card e Icon sarebbe
     solo sporco */
  if(!mini) lookShape(L, {name:'Stripes', kind:'stripes', count:7, ratio:0.3,
    skew:0.5, x:0.66, y:0.06, w:0.28, h:0.18,
    color:L.accent.color, opacity:0.3, mode:'fill', front:false});
  L.row.sepShape='slash'; L.row.sepSkew=0.6;
}},

{n:'Stealth', f:(L)=>{
  const grey='#8a8a90', grigioScuro='#5e5e66';
  /* la barra ha un gradiente fra due colori: cambiarne uno solo lasciava
     l'arancione dall'altro capo, che e' proprio quello che questo Look
     vuole togliere */
  L.accent.color=grey; L.accent.color2=grigioScuro; L.accent.gradOn=false;
  L.accent.glow=0; L.accent.thick*=0.6;
  L.logo.outColor=grey; L.logo.glow=0; L.badges.color=grey;
  L.band.opacity=0.9; L.row.itemOp=0.55; L.frame.on=false;
}},

{n:'Wide bracket', f:(L, fm)=>{
  /* Su un'Icon da 160 px il logo occupa un quinto della tela: fra logo,
     riquadro e squadra al titolo non resta niente, e finivano uno sopra
     l'altro. Li' il Look si ferma al velo scuro, come fa Split panel. */
  if(fm && fm.profile === 'tiny'){
    L.grad.on=true; L.grad.side='bottom'; L.grad.strength=0.85; L.grad.size=0.6;
    L.frame.on=false;
    return;
  }
  L.band.on=false; L.accent.on=false; L.grad.on=true; L.grad.strength=0.6;
  /* un velo scuro sotto il testo perche' si legga sopra qualsiasi
     screenshot, e le due squadre un filo piu' larghe che lo incorniciano.
     Tutti e due crescono attorno al testo, quindi non lo tagliano mai. */
  lookShape(L, {name:'Backdrop', kind:'panel', cuts:'none',
    x:0.04, y:0.68, w:0.92, h:0.26, hostRow:'box', hostPad:1.15,
    color:'#0b0b0b', opacity:0.62, mode:'fill', front:false});
  lookShape(L, {name:'Bracket', kind:'bracket-L', x:0.04, y:0.68,
    w:0.92, h:0.26, thick:0.02, armX:0.22, armY:0.6, hostRow:'box', hostPad:1.6,
    color:L.accent.color, mode:'fill', front:false});
  /* il testo parte piu' a destra del solito: la squadra gli cresce attorno,
     e serve la striscia a sinistra per il logo, se no finisce sul tratto.
     La striscia e' larga quanto il logo di quel formato: 0.17 fisso
     bastava sulla Cover ma non sulla Card, dove il logo e' quasi il doppio
     in proporzione e finiva sopra al titolo. */
  const lw = L.logo.size * (fm ? fm.h/fm.w : 1);
  const sinistra = Math.max(0.17, 0.075 + lw + 0.03);
  L.row.x=sinistra; L.row.y=0.845; L.row.x2=sinistra; L.row.y2=0.79;
  /* la striscia era pero' rimasta vuota: il logo restava in basso a
     sinistra, fuori dal riquadro scuro, mentre il testo stava dentro.
     L'altezza si prende dal testo vero, non da un numero fisso: su Card
     e Icon il titolo va a capo e sta molto piu' in basso che sulla
     Cover. */
  L.logo.x=0.075; L.logo.anchor='free';
  if(fm){
    const f = formatoRidotto(fm, 600);
    const bx = rowInkBox(f, L, L.row.mode==='stack');
    if(bx) L.logo.y = (bx.top + bx.bot)/2/f.h - L.logo.size/2;
  }
}}
];

/* i Look creano i loro livelli con questa funzione: sono marcati, cosi'
   quando si passa a un altro Look spariscono da soli e non restano forme
   orfane in giro per la tela */
function lookShape(L, props){
  const l = layerDefaults('shape', props.name || 'Look shape');
  Object.assign(l, props);
  l.fromLook = true;
  delete l.name;
  l.name = props.name || 'Look shape';
  layersOf(L).push(l);
  return l;
}
function applyLook(idx, allFormats){
  pushUndo();
  const ids = allFormats ? FORMATS.map(f=>f.id) : [state.active];
  ids.forEach(id=>{
    const fm = FORMATS.find(f=>f.id===id);
    const old = state.layouts[id];
    /* Riparto sempre dal layout pulito del formato: prima i Look si
       accavallavano e lasciavano badge e scritte in posizioni strane,
       ereditate dal Look precedente. Tengo i colori scelti dall'utente
       e i livelli che ha creato lui a mano. */
    const fresh = defLayout(fm);
    fresh.on = old.on;
    fresh.layers = layersOf(old).filter(l=> !l.fromLook);
    /* Screenshot e regolazioni immagine sono lavoro dell'utente, non del
       Look: quelli passano di peso. I colori NO: prima li riportavo dal
       layout precedente e cosi' un Look ereditava le tinte di quello
       applicato prima. "Corner tag" mette il titolo nero, perche' li' sta
       su una targa arancione, e da quel momento ogni Look successivo si
       ritrovava il titolo nero sopra la fascia scura: invisibile. Adesso
       ogni Look parte dai colori di serie e la tinta scelta dall'utente
       viene riapplicata dopo, tutta insieme. */
    fresh.shot = JSON.parse(JSON.stringify(old.shot));
    fresh.fx   = JSON.parse(JSON.stringify(old.fx));
    state.layouts[id] = fresh;
    LOOKS[idx].f(fresh, fm);
    if(LOOKS[idx].psd){
      /* "PSD base" e' esattamente lo stato di partenza dell'app: niente
         riordino, che lo scosterebbe, ma la centratura del titolo nella
         fascia si', perche' e' quella che riproduce il PSD e all'avvio
         viene fatta comunque */
      centerRowInBandOn(fm, fresh);
    } else {
      tidyLayout(fresh, fm);
      sistemaLook(fresh, fm);
    }
    accentoFuoriDalLogo(fresh, fm);
  });
  /* la tinta scelta dall'utente si rimette sopra il Look appena applicato:
     il calcolo parte dalla tavolozza di serie, quindi si puo' ripetere
     quante volte si vuole senza che i colori scivolino via */
  const scelto = state.theme.accent;
  if(scelto && scelto.toLowerCase() !== C.accentA2.toLowerCase()){
    applyAccent(scelto, !allFormats);
  }
  buildControls(); render();
  toast('Look: '+LOOKS[idx].n+(allFormats?' (all formats)':''));
}

/* ==========================================================================
   RIORDINO AUTOMATICO
   I Look cambiano fascia, barra e sfumature, ma il logo, il titolo, la
   versione e i badge restavano dove li aveva messi il layout di partenza:
   di qui le scritte in posti strani. Qui li rimetto in ordine misurando
   l'inchiostro vero del testo, non i numeri teorici, cosi' il risultato
   e' giusto anche quando il Look ha ingrandito il titolo o spostato la
   fascia. Si lavora in questo ordine: prima il testo, poi il logo che gli
   si appoggia a sinistra, poi versione e badge negli angoli liberi.
   ========================================================================== */
function tidyLayout(L, fPieno, salta){
  if(!fPieno || salta) return;
  /* Il riordino lavora tutto in frazioni della tela: misurarlo a piena
     risoluzione non cambia il risultato, costa solo tempo. */
  const f = formatoRidotto(fPieno, 1500);
  const M = 0.03;                       /* margine comune, in frazione */
  const mx = M, my = M*f.w/f.h;         /* stesso margine in pixel sui due assi */

  /* --- 1. la riga di testo ------------------------------------------- */
  if(L.row && L.row.on){
    L.row.x = clamp(L.row.x, mx, 0.9);
    if(L.band && L.band.on){
      /* dentro la fascia, centrata: e' il caso del PSD */
      centerRowInBandOn(f, L);
    } else {
      /* senza fascia il titolo non deve uscire dal bordo di sotto */
      const box = rowInkBox(f, L, L.row.mode==='stack');
      if(box){
        const fuoriSotto = box.bot/f.h - (1 - my);
        if(fuoriSotto > 0) L.row.y -= fuoriSotto + 0.005;
        const fuoriSopra = my - box.top/f.h;
        if(fuoriSopra > 0) L.row.y += fuoriSopra + 0.005;
      }
    }
  }

  /* --- 2. il logo ------------------------------------------------------
     Il riordino e' un pronto soccorso, non un rifacimento: tocca il logo
     solo se e' fuori dalla tela o se finisce sopra al testo. Se sta bene
     dov'e' non lo muove, se no i Look che partono dal PSD lo sposterebbero
     ogni volta allontanandosi proprio da quello che devono riprodurre. */
  if(L.logo && L.logo.on){
    const box = L.row && L.row.on ? rowInkBox(f, L, false) : null;
    const lw = L.logo.size*f.h/f.w;     /* il riquadro e' quadrato in pixel */
    const lh = L.logo.size;
    const gap = Math.max(0.012, lw*0.16);

    const fuori = L.logo.x < -mx*0.5 || L.logo.y < -my*0.5 ||
                  L.logo.x + lw > 1 + mx*0.5 || L.logo.y + lh > 1 + my*0.5;
    const sopraIlTesto = box && boxOverlap(L.logo.x, L.logo.y, lw, lh,
      {x:box.left/f.w, y:box.top/f.h,
       w:(box.right-box.left)/f.w, h:(box.bot-box.top)/f.h}) > 0;

    if(fuori){
      L.logo.x = clamp(L.logo.x, mx*0.4, 1-lw-mx*0.4);
      L.logo.y = clamp(L.logo.y, my*0.4, 1-lh-my*0.4);
    }
    if(sopraIlTesto){
      if(L.logo.anchor === 'free'){
        pushApart(L, f, box, lw, lh, my);
      } else {
        /* di regola sta a sinistra del testo, com'e' nel PSD */
        let lx = box.left/f.w - gap - lw;
        if(lx < mx*0.4){
          lx = clamp(box.left/f.w, mx, 1-lw-mx);
          const sopra = box.top/f.h - lh - my*0.6;
          const sotto = box.bot/f.h + my*0.6;
          L.logo.y = (sopra >= my) ? sopra
                   : (sotto + lh <= 1-my ? sotto : clamp(sopra, my, 1-lh-my));
        } else {
          L.logo.y = clamp((box.top+box.bot)/2/f.h - lh/2, my*0.4, 1-lh-my*0.4);
        }
        L.logo.x = clamp(lx, mx*0.4, 1-lw-mx);
      }
    }
  }

  /* --- 3. la versione nell'angolo in basso a destra ------------------- */
  if(L.version && L.version.on){
    L.version.x = clamp(L.version.x, 0.5, 1-mx*0.4);
    L.version.y = clamp(L.version.y, my, 1-my*0.4);
  }

  /* --- 4. i badge, nell'angolo libero in alto ------------------------- */
  if(L.badges && L.badges.on){
    const n = String(state.pack.badges||'').split(',').filter(x=>x.trim()).length || 1;
    const tot = n*L.badges.h + (n-1)*L.badges.gap;
    const bw = badgeWidth(f, L);
    L.badges.y = clamp(L.badges.y, my, Math.max(my, 1-tot-my));
    L.badges.x = clamp(L.badges.x, mx, Math.max(mx, 1-bw-mx));

    /* Provo una serie di posti in ordine e prendo il primo davvero libero.
       Con un solo tentativo (in alto a sinistra) i Look che mettono il
       titolo in cima finivano per sovrapporsi ai badge. */
    const box = (L.row && L.row.on) ? rowInkBox(f, L, false) : null;
    const dx = 1 - bw - mx;
    const sottoTesto = box ? box.bot/f.h + my*0.7 : my;
    const fondo = (L.band && L.band.on ? L.band.top - L.band.feather*0.5 : 1) - tot - my*0.7;
    /* se dove stanno adesso non danno fastidio a nessuno, non li tocco */
    const qui = boxOverlap(L.badges.x, L.badges.y, bw, tot,
        box ? {x:box.left/f.w, y:box.top/f.h,
               w:(box.right-box.left)/f.w, h:(box.bot-box.top)/f.h} : null)
      + ((L.logo && L.logo.on) ? boxOverlap(L.badges.x, L.badges.y, bw, tot,
          {x:L.logo.x, y:L.logo.y, w:L.logo.size*f.h/f.w, h:L.logo.size}) : 0);
    const dentro = L.badges.x >= -mx*0.5 && L.badges.y >= -my*0.5 &&
                   L.badges.x + bw <= 1 + mx*0.5 && L.badges.y + tot <= 1 + my*0.5;
    if(qui === 0 && dentro) return;

    const posti = [
      [L.badges.x, L.badges.y],   /* dove sta adesso */
      [mx, my],                   /* alto a sinistra */
      [dx, my],                   /* alto a destra */
      [mx, sottoTesto],           /* subito sotto il testo, a sinistra */
      [dx, sottoTesto],           /* subito sotto il testo, a destra */
      [mx, fondo],                /* in basso, sopra la fascia */
      [dx, fondo]
    ];
    let scelto = null, minSovrap = Infinity;
    for(const [bx, by] of posti){
      if(by < my*0.5 || by + tot > 1 - my*0.5) continue;
      const s1 = boxOverlap(bx, by, bw, tot, box ? {x:box.left/f.w, y:box.top/f.h,
                   w:(box.right-box.left)/f.w, h:(box.bot-box.top)/f.h} : null);
      const s2 = (L.logo && L.logo.on)
        ? boxOverlap(bx, by, bw, tot, {x:L.logo.x, y:L.logo.y,
                     w:L.logo.size*f.h/f.w, h:L.logo.size}) : 0;
      const tot2 = s1 + s2;
      if(tot2 === 0){ scelto = [bx, by]; break; }
      if(tot2 < minSovrap){ minSovrap = tot2; scelto = [bx, by]; }
    }
    if(scelto){ L.badges.x = scelto[0]; L.badges.y = scelto[1]; }
  }
}


/* ==========================================================================
   CONTROLLO FINALE DEL LOOK
   Il Look dice l'idea, questo passaggio la fa stare in piedi su tutti e
   dieci i formati. Senza, ogni Look andrebbe tarato dieci volte e
   basterebbe un titolo piu' lungo per rimetterlo fuori squadra: la targa
   tagliava il testo, la barra ci passava sopra, il logo finiva addosso a
   qualcosa. Qui la targa cresce attorno al testo, la barra si scosta, il
   logo si sposta e la cornice resta un filo.
   ========================================================================== */
const FRAME_MAX = 0.005;
/* sposta la riga di testo tenendo insieme le due linee */
function spostaTesto(L, dx, dy){
  if(!L.row) return;
  L.row.x += dx; L.row.y += dy;
  if(L.row.x2 !== undefined) L.row.x2 += dx;
  if(L.row.y2 !== undefined) L.row.y2 += dy;
}
/* riquadro dell'inchiostro della riga, in frazioni di tela */
/* riquadro del solo brand, quello che nella modalita' impilata sta sopra
   il titolo. Si misura togliendo dal testo tutto il resto. */
function brandBoxFrac(f, L){
  if(!L.row || !L.row.on) return null;
  const pk = Object.assign({}, state.pack, {title:'', category:''});
  if(!String(pk.brand||'').trim()) return null;
  return inkFrac(f, c=> drawRow(c, f.w, f.h, L.row, pk, limiteRiga(L, f.w, f.h)));
}
function rowBoxFrac(f, L, soloTitolo){
  if(!L.row || !L.row.on) return null;
  const b = rowInkBox(f, L, !!soloTitolo);
  if(!b) return null;
  return {x:b.left/f.w, y:b.top/f.h, w:(b.right-b.left)/f.w, h:(b.bot-b.top)/f.h};
}
/* riquadro di un pezzo qualsiasi, misurato sull'inchiostro */
function inkFrac(f, fn, soglia){
  const c = scratch(73, f.w, f.h);
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,f.w,f.h);
  fn(c);
  const d = c.getImageData(0,0,f.w,f.h).data;
  const lim = soglia === undefined ? 40 : soglia;
  let x0=-1,y0=-1,x1=-1,y1=-1;
  for(let y=0;y<f.h;y++) for(let x=0;x<f.w;x++){
    if(d[(y*f.w+x)*4+3] > lim){
      if(y0<0) y0=y; y1=y;
      if(x0<0 || x<x0) x0=x;
      if(x>x1) x1=x;
    }
  }
  return x0<0 ? null : {x:x0/f.w, y:y0/f.h, w:(x1-x0)/f.w, h:(y1-y0)/f.h};
}
function siToccano(a, b){
  return a && b && a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
}
/* La barra accento non deve passare sopra le scritte.
   Eccezione voluta: su Card e Icon il PSD appoggia il brand sulla barra, ed
   e' il disegno giusto. Vale pero' solo finche' la barra e' una fascia alta
   quanto la scritta: se un Look la assottiglia diventa una riga, e una riga
   in mezzo alla parola e' solo un errore.
   Serve sia ai Look sia al titolo scritto su piu' righe: aggiungendo una
   riga il testo cresce verso l'alto e va a finire sotto la barra. */
function accentoFuoriDalTesto(L, f, testoGia){
  if(!L || !L.accent || !L.accent.on || !L.row || !L.row.on) return false;
  const my = 0.025*f.w/f.h;
  const testo = testoGia || rowBoxFrac(f, L, false);
  if(!testo) return false;
  const disegnaAcc = c=> PARTS.find(x=>x.key==='accent').draw(c, f.w, f.h, L, false);
  let brandSuBarra = false;
  if(L.row.mode === 'stack'){
    const bBrand = brandBoxFrac(f, L);
    /* si misura la parte piena, non l'alone: un alone largo farebbe
       sembrare fascia quella che a occhio e' una riga */
    const pieno = inkFrac(f, disegnaAcc, 200);
    brandSuBarra = !bBrand || !pieno || pieno.h >= bBrand.h*0.85;
  }
  const rif = brandSuBarra ? rowBoxFrac(f, L, true) : testo;
  const acc = inkFrac(f, disegnaAcc);
  /* un filo di margine: la misura e' presa in piccolo, e due cose che
     quasi si toccano a schermo pieno si toccano davvero */
  const rifLargo = rif && {x:rif.x, y:rif.y - 0.006, w:rif.w, h:rif.h + 0.012};
  if(!(rif && acc && siToccano(acc, rifLargo))) return false;
  const t = L.accent.thick;
  /* Lo stacco si misura sull'altezza della scritta, non sullo spessore
     della riga: con una riga sottile lo stacco veniva di un pixel e a
     occhio la riga sembrava passare sul bordo delle lettere. */
  const aria = Math.max(t*0.9, rif.h*0.28);
  const sopra = rif.y - t/2 - aria;
  const sotto = rif.y + rif.h + t/2 + aria;
  if(sopra - t/2 > my*0.5){ L.accent.y = sopra; return true; }
  if(sotto + t/2 < 1 - my*0.5){ L.accent.y = sotto; return true; }
  return false;
}
/* Nella modalita' impilata (Card e Icon) il brand sta sopra il titolo e
   poggia sulla barra arancione. Un titolo su due righe cresce verso l'alto
   e va a finire addosso al brand: allora salgono tutti e due insieme,
   brand e barra, e la fascia nera si allarga quanto basta a contenerli. */
function sistemaRigheStack(L, f){
  if(!L.row || !L.row.on || L.row.mode !== 'stack') return false;
  const tit = rowBoxFrac(f, L, true);
  const br = brandBoxFrac(f, L);
  if(!tit || !br) return false;
  const aria = Math.max(0.004, br.h*0.3);
  /* la barra e' quella su cui il brand poggia solo se lo contiene davvero */
  const dis = c=> PARTS.find(x=>x.key==='accent').draw(c, f.w, f.h, L, false);
  const pieno = (L.accent && L.accent.on) ? inkFrac(f, dis, 200) : null;
  const mezzoBrand = br.y + br.h*0.5;
  const suBarra = !!(pieno && pieno.h >= br.h*0.85 &&
                     pieno.y <= mezzoBrand && pieno.y + pieno.h >= mezzoBrand);
  /* di quanto devono salire, insieme, brand e barra per stare sopra il
     titolo: comanda il piu' basso dei due */
  let serve = (tit.y - aria) - (br.y + br.h);
  if(suBarra) serve = Math.min(serve, (tit.y - aria*0.5) - (pieno.y + pieno.h));
  if(serve >= -0.0005) return false;            /* sono gia' sopra */
  L.row.y2 += serve;
  if(suBarra) L.accent.y += serve;
  if(L.band && L.band.on){
    const cima = Math.max(0.12, (suBarra ? pieno.y : br.y) + serve - aria);
    if(cima < L.band.top) L.band.top = cima;
  }
  return true;
}
/* Il titolo su piu' righe cresce verso l'alto: la barra accento, che sta
   ferma, ci finisce dentro. Si rimette a posto su tutti i formati appena
   il numero di righe cambia, che e' l'unico momento in cui serve. */
/* Il riassetto delle righe del titolo, rimandato a quando la tastiera si
   ferma. Un solo timer: mentre si scrive si riarma e basta. */
let righeTimer = null;
function rinviaRigheTitolo(){
  if(righeTimer) clearTimeout(righeTimer);
  righeTimer = setTimeout(()=>{
    righeTimer = null;
    if(sistemaRigheTitolo()){ syncControls(); render(); }
  }, 350);
}
function sistemaRigheTitolo(){
  let mosse = 0;
  FORMATS.forEach(fm=>{
    const L = state.layouts[fm.id];
    if(!L) return;
    const f = formatoRidotto(fm, 600);
    let tocco = false;
    if(sistemaRigheStack(L, f)) tocco = true;
    if(accentoFuoriDalTesto(L, f)) tocco = true;
    /* spostando le cose cambia quello che sta sotto le scritte: il colore
       del testo va ripensato, se no il brand resta scuro su fondo scuro */
    if(tocco){ sistemaContrasto(L, f); mosse++; }
  });
  return mosse;
}
/* Quanto di un rettangolo e' davvero coperto di colore. Serve a distinguere
   un pannello pieno, su cui il logo ci sta benissimo, da una cornice o una
   squadra, che sono due tratti sottili: sopra un tratto il logo si vede
   attraversato da una riga e sembra un errore. */
function pienoDentro(f, fn, box){
  const x0 = Math.max(0, Math.floor(box.x*f.w)), y0 = Math.max(0, Math.floor(box.y*f.h));
  const x1 = Math.min(f.w, Math.ceil((box.x+box.w)*f.w));
  const y1 = Math.min(f.h, Math.ceil((box.y+box.h)*f.h));
  if(x1<=x0 || y1<=y0) return 0;
  const c = scratch(74, f.w, f.h);
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,f.w,f.h);
  fn(c);
  const d = c.getImageData(x0, y0, x1-x0, y1-y0).data;
  let n = 0;
  for(let i=3;i<d.length;i+=4) if(d[i] > 40) n++;
  return n / ((x1-x0)*(y1-y0));
}


/* Il colore del testo lo decide quello che ha sotto, non il Look.
   Su Card e Icon il brand e' scuro perche' poggia sulla barra arancione:
   se pero' un Look lo sposta su un pannello nero resta nero su nero e
   sparisce. Qui si guarda davvero cosa c'e' dietro e si sceglie chiaro o
   scuro di conseguenza. */
function fondoSotto(f, L){
  const c = scratch(74, f.w, f.h);
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = '#101014'; c.fillRect(0,0,f.w,f.h);
  ['grad','band','accent'].forEach(k=>{
    const p = PARTS.find(x=>x.key===k);
    if(p && L[k] && L[k].on) p.draw(c, f.w, f.h, L, false);
  });
  layersOf(L).filter(l=> l.on && !l.front && l.type !== 'text')
             .forEach(l=> drawShape(c, f.w, f.h, l));
  return c;
}
/* chiarezza di un colore, da 0 (nero) a 1 (bianco) */
function luma(hex){
  const n = parseInt(String(hex||'#000').replace('#',''), 16);
  if(isNaN(n)) return 0;
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return (r*0.299 + g*0.587 + b*0.114)/255;
}
function chiaroSotto(c, f, box){
  if(!box) return 0;
  const x = Math.max(0, Math.round(box.x*f.w)), y = Math.max(0, Math.round(box.y*f.h));
  const w = Math.max(1, Math.min(f.w-x, Math.round(box.w*f.w)));
  const h = Math.max(1, Math.min(f.h-y, Math.round(box.h*f.h)));
  const d = c.getImageData(x, y, w, h).data;
  let s = 0, n = 0;
  for(let i=0;i<d.length;i+=4*5){
    s += (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114)/255;
    n++;
  }
  return n ? s/n : 0;
}
function sistemaContrasto(L, f){
  if(!L.row || !L.row.on) return;
  const solo = (chi)=>{
    const pk = Object.assign({}, state.pack);
    if(chi === 'brand'){ pk.title=''; pk.category=''; }
    else { pk.brand=''; pk.category=''; }
    return inkFrac(f, c=> drawRow(c, f.w, f.h, L.row, pk, limiteRiga(L, f.w, f.h)));
  };
  /* la chiarezza del fondo e' una media: una tela piccola basta e costa
     un ventesimo */
  const fPiccolo = formatoRidotto(f, 360);
  const fondo = fondoSotto(fPiccolo, L);
  const scegli = (box)=>{
    const l = chiaroSotto(fondo, fPiccolo, box);
    return l > 0.5 ? C.dark : C.text;
  };
  const bTit = solo('title');
  if(bTit) L.row.color = scegli(bTit);
  if(L.row.mode === 'stack'){
    const bBrand = solo('brand');
    if(bBrand){
      L.row.brandColor = scegli(bBrand);
      /* Qui il brand non e' una scritta di servizio ma la parola grossa
         appoggiata sulla barra, come nel PSD: sbiadirla la rende solo
         difficile da leggere. */
      L.row.itemOp = Math.max(L.row.itemOp, 0.95);
    }
  } else {
    L.row.itemColor = L.row.color;
  }
}

function sistemaLook(L, fPieno){
  if(!fPieno) return;
  /* Qui si misura solo per decidere dove mettere le cose, non per
     disegnarle: mezzo pixel in piu' o in meno non cambia niente, mentre
     leggere otto milioni di pixel per ogni formato si sente. */
  const f = formatoRidotto(fPieno, 700);
  const mx = 0.025, my = 0.025*f.w/f.h;

  /* 1. la cornice resta un filo */
  if(L.frame && L.frame.on) L.frame.thick = Math.min(L.frame.thick, FRAME_MAX);

  /* 1b. Sulle storie 9:16 l'app si prende una striscia in alto e una in
     basso: quello che ci finisce dentro c'e' ma non si vede. Il layout di
     partenza ne tiene gia' conto, i Look pero' mettono testo e logo dove
     vogliono loro: qui chi ci casca rientra. Si fa prima che i pannelli
     crescano attorno al testo, cosi' seguono la posizione buona. */
  if(f.h > f.w*1.6){
    const alto = 250/1920, basso = 340/1920;
    const t0 = rowBoxFrac(f, L, false);
    if(t0){
      if(t0.y < alto) spostaTesto(L, 0, alto - t0.y);
      else if(t0.y + t0.h > 1 - basso)
        spostaTesto(L, 0, Math.max(alto - t0.y, (1 - basso) - (t0.y + t0.h)));
    }
    if(L.logo && L.logo.on){
      const lh = L.logo.size;
      if(L.logo.y < alto) L.logo.y = alto;
      else if(L.logo.y + lh > 1 - basso) L.logo.y = Math.max(alto, 1 - basso - lh);
    }
    if(L.version && L.version.on && typeof L.version.y === 'number'){
      if(L.version.y < alto + 0.02) L.version.y = alto + 0.02;
      else if(L.version.y > 1 - basso) L.version.y = 1 - basso;
    }
    if(L.badges && L.badges.on && typeof L.badges.y === 'number')
      L.badges.y = Math.max(L.badges.y, alto + 0.01);
  }

  /* 2. la forma che ospita il testo gli cresce attorno, non lo taglia */
  let testo = rowBoxFrac(f, L, false);
  /* La targa puo' crescere solo fino ai margini della tela: con un titolo
     lungo il testo diventerebbe piu' largo di quanto la targa puo' essere,
     e uscirebbe dai bordi. Allora e' il testo a farsi piu' stretto: il
     limite di larghezza del titolo scende a quello che ci sta dentro. */
  if(testo && L.row){
    const ospiti = layersOf(L).filter(l=> l.on && l.fromLook && l.hostRow === 'box');
    if(ospiti.length){
      const k = ospiti.reduce((a,l)=> Math.max(a, l.hostPad||1), 1);
      /* si guarda anche l'altezza che il titolo avrebbe senza rimpicciolire:
         se no il bordo risulta stretto e il conto torna solo per un pelo */
      const alto = Math.max(testo.h, L.row.titleSize || 0);
      const padX = Math.max(0.016, alto*0.55*f.h/f.w) * k;
      const tetto = Math.max(0.2, 1 - mx*2 - padX*2);
      /* Il limite si mette sempre, non solo quando il testo lo supera: se lo
         si mettesse dopo, spostare il testo verso sinistra gli farebbe
         guadagnare spazio, il testo ricrescerebbe e uscirebbe di nuovo. */
      L.row.fitW = Math.min(L.row.fitW===undefined ? 1 : L.row.fitW, tetto);
      testo = rowBoxFrac(f, L, false) || testo;
    }
  }
  if(testo){
    const ospiti = layersOf(L).filter(l=> l.on && l.fromLook && l.hostRow);
    const targhe = ospiti.filter(l=> l.hostRow !== 'colonna');
    const bordoX = (t, k)=> Math.max(0.016, t.h*0.55*f.h/f.w) * k;
    const bordoY = (t, k)=> Math.max(0.016*f.w/f.h, t.h*0.55) * k;
    if(targhe.length){
      /* Il pannello col bordo piu' largo decide dove finisce il testo: cosi'
         ci stanno dentro tutti e il testo si sposta una volta sola. Prima
         ogni pannello lo spostava per conto suo, e con due pannelli il
         secondo lo mandava fuori dal primo. */
      const k = targhe.reduce((a,l)=> Math.max(a, l.hostPad||1), 1);
      /* Si ripete finche' non si ferma: spostando il testo verso sinistra
         gli resta piu' spazio a destra, quindi si rimpicciolisce di meno e
         torna a essere piu' largo. Due o tre giri e la cosa si assesta. */
      for(let giro=0; giro<4; giro++){
        const padX = bordoX(testo, k), padY = bordoY(testo, k);
        const w = Math.min(1-mx*2, testo.w + padX*2);
        const h = Math.min(1-my*2, testo.h + padY*2);
        const x = clamp(testo.x - padX, mx, Math.max(mx, 1-mx-w));
        const y = clamp(testo.y - padY, my, Math.max(my, 1-my-h));
        const dx = (x + padX) - testo.x, dy = (y + padY) - testo.y;
        if(Math.abs(dx) < 0.0005 && Math.abs(dy) < 0.0005) break;
        spostaTesto(L, dx, dy);
        testo = rowBoxFrac(f, L, false) || testo;
      }
    }
    /* ora ogni pannello cresce attorno al testo dov'e' davvero finito */
    ospiti.forEach(l=>{
      const k = l.hostPad || 1;
      const padX = bordoX(testo, k), padY = bordoY(testo, k);
      if(l.hostRow === 'colonna'){
        /* pannello laterale: cambia solo la larghezza, il resto e' voluto */
        const serve = testo.x + testo.w + padX - l.x;
        l.w = Math.min(0.6, Math.max(l.w, serve));
      } else {
        l.w = Math.min(1-mx*2, testo.w + padX*2);
        l.h = Math.min(1-my*2, testo.h + padY*2);
        l.x = clamp(testo.x - padX, mx, Math.max(mx, 1-mx-l.w));
        l.y = clamp(testo.y - padY, my, Math.max(my, 1-my-l.h));
      }
    });
    testo = rowBoxFrac(f, L, false);
  }

  /* 3. la barra accento non passa sopra le scritte.
     Eccezione voluta: su Card e Icon il PSD ci appoggia sopra il brand, ed
     e' il disegno giusto. Li' si controlla solo il titolo. */
  /* nella modalita' impilata brand e barra salgono insieme sopra il titolo */
  sistemaRigheStack(L, f);
  accentoFuoriDalTesto(L, f);

  /* 4. il logo non sta a cavallo della barra accento.
     Su Card e Icon no: li' il PSD appoggia proprio il logo sulla barra
     spessa, ed e' il disegno giusto. */
  if(L.logo && L.logo.on && L.accent && L.accent.on && L.row && L.row.mode !== 'stack'){
    const lw = L.logo.size*f.h/f.w, lh = L.logo.size;
    const t = Math.max(L.accent.thick, 0.004);
    const ay0 = L.accent.y - t/2, ay1 = L.accent.y + t/2;
    const ax0 = L.accent.x0, ax1 = L.accent.x1;
    const incrocia = L.logo.x < ax1 && ax0 < L.logo.x + lw &&
                     L.logo.y < ay1 && ay0 < L.logo.y + lh &&
                     !(L.logo.y > ay0 - lh*0.25 && L.logo.y + lh < ay1 + lh*0.25);
    if(incrocia){
      const sopra = ay0 - lh - my*0.4;
      const sotto = ay1 + my*0.4;
      if(sopra > my*0.3) L.logo.y = sopra;
      else if(sotto + lh < 1 - my*0.3) L.logo.y = sotto;
    }
  }

  /* 4b. Il logo non sta a cavallo di una cornice o di una squadra. Un
     pannello pieno va benissimo, un tratto sottile no: si vede il logo
     tagliato da una riga e sembra un errore. Si guardano solo le forme
     nate dal Look, e solo quelle che disegnano un contorno. */
  if(L.logo && L.logo.on){
    const lw = L.logo.size*f.h/f.w, lh = L.logo.size;
    const logoBox = {x:L.logo.x, y:L.logo.y, w:lw, h:lh};
    const contorni = layersOf(L).filter(l=>
      l.on && l.fromLook && l.type !== 'text' && l.w > 0 && l.h > 0 &&
      pienoDentro(f, c=> drawShape(c, f.w, f.h, l), {x:l.x, y:l.y, w:l.w, h:l.h}) < 0.35);
    const addosso = contorni.filter(l=>
      pienoDentro(f, c=> drawShape(c, f.w, f.h, l), logoBox) > 0.004);
    if(addosso.length){
      /* il posto piu' naturale e' di fianco, appena fuori dal contorno */
      const sx = Math.min.apply(null, addosso.map(l=> l.x));
      const su = Math.min.apply(null, addosso.map(l=> l.y));
      const giu = Math.max.apply(null, addosso.map(l=> l.y + l.h));
      const aSinistra = sx - lw - mx*0.4;
      const sopra = su - lh - my*0.4;
      if(aSinistra >= mx*0.5) L.logo.x = aSinistra;
      else if(sopra >= my*0.5) L.logo.y = sopra;
      else if(giu + my*0.4 + lh <= 1 - my*0.5) L.logo.y = giu + my*0.4;
    }
  }

  /* 5. il testo prende il colore che si legge sopra quello che ha sotto */
  sistemaContrasto(L, f);

  /* 6. niente forme davanti al testo: chi ci finisce sopra passa dietro */
  if(testo){
    layersOf(L).filter(l=> l.on && l.fromLook && l.front && l.type !== 'text').forEach(l=>{
      if(siToccano({x:l.x, y:l.y, w:l.w, h:l.h}, testo)) l.front = false;
    });
  }
}

/* larghezza vera di un badge, misurata col font corrente */
function badgeWidth(f, L){
  const c = scratch(87, 8, 8);
  const h = L.badges.h*f.h, px = L.badges.size*h;
  setFont(c, L.badges.font, L.badges.weight, px, L.badges.track);
  let w = 0;
  String(state.pack.badges||'').split(',').map(x=>x.trim()).filter(Boolean)
    .forEach(t=>{ w = Math.max(w, c.measureText(t).width); });
  return (w + px*L.badges.pad*2) / f.w;
}

/* quanto si sovrappongono due rettangoli, in area */
function boxOverlap(x, y, w, h, o){
  if(!o) return 0;
  const ox = Math.max(0, Math.min(x+w, o.x+o.w) - Math.max(x, o.x));
  const oy = Math.max(0, Math.min(y+h, o.y+o.h) - Math.max(y, o.y));
  return ox*oy;
}

/* allontana il logo dal testo, verso il lato dove c'e' piu' spazio */
function pushApart(L, f, box, lw, lh, my){
  const lx = L.logo.x, ly = L.logo.y;
  const rx0 = box.left/f.w, rx1 = box.right/f.w;
  const ry0 = box.top/f.h,  ry1 = box.bot/f.h;
  const tocca = lx < rx1 && rx0 < lx+lw && ly < ry1 && ry0 < ly+lh;
  if(!tocca) return;
  const sopra = ry0 - lh - my*0.6;
  const sotto = ry1 + my*0.6;
  if(sopra >= my*0.4) L.logo.y = sopra;
  else if(sotto + lh <= 1 - my*0.4) L.logo.y = sotto;
  else L.logo.x = clamp(rx1 + my*0.6, my*0.4, 1-lw-my*0.4);
}

/* centratura nella fascia su un formato solo, senza toccare lo stato
   globale: serve al riordino, che gira anche su formati non attivi */
function centerRowInBandOn(f, L){
  if(!L.row.on || !L.band.on) return;
  const stack = L.row.mode==='stack';
  for(let pass=0; pass<3; pass++){
    const box = rowInkBox(f, L, stack);
    if(!box) break;
    const cima = L.band.top*f.h;
    const altaFascia = f.h - cima;
    const altoTesto = Math.max(1, box.bot - box.top);
    /* Di regola il testo sta in mezzo alla fascia, com'e' nel PSD. Sulle
       storie 9:16 pero' la fascia arriva fino in fondo apposta, per coprire
       la parte che l'app si prende: li' e' alta tre o quattro volte il
       testo, e centrarlo vorrebbe dire metterlo proprio dove non si vede.
       In quel caso il testo si appoggia sotto il bordo alto della fascia. */
    const target = (altaFascia > altoTesto*3)
      ? cima + altoTesto*1.35
      : (cima + f.h)/2;
    const delta = (target - (box.top+box.bot)/2)/f.h;
    L.row.y += delta;
    if(Math.abs(delta*f.h) < 0.35) break;
  }
}

/* ============================================================================
   VARIANTI
   Fotografie complete del progetto, per confrontare strade diverse.
   ============================================================================ */
function variantSnap(name){
  return {name:name, pack:JSON.parse(JSON.stringify(state.pack)),
          theme:JSON.parse(JSON.stringify(state.theme)),
          layouts:JSON.parse(JSON.stringify(state.layouts))};
}
function variantLoad(i){
  const v = state.variants[i];
  if(!v) return;
  pushUndo();
  state.pack = JSON.parse(JSON.stringify(v.pack));
  state.theme = JSON.parse(JSON.stringify(v.theme||state.theme));
  state.layouts = JSON.parse(JSON.stringify(v.layouts));
  migraTuttiIPannelli(state.layouts);
  state.currentVariant = i;
  buildFormats(); buildControls(); render();
  toast('Variant: '+v.name);
}
function variantAdd(){
  pushUndo();
  const n = 'Variant '+(state.variants.length+1);
  state.variants.push(variantSnap(n));
  state.currentVariant = state.variants.length-1;
  buildControls(); toast('Saved as '+n);
}
function variantUpdate(){
  const i = state.currentVariant;
  if(i==null || !state.variants[i]){ variantAdd(); return; }
  pushUndo();
  const name = state.variants[i].name;
  state.variants[i] = variantSnap(name);
  buildControls(); toast('Updated '+name);
}
function variantDelete(i){
  pushUndo();
  state.variants.splice(i,1);
  if(state.currentVariant===i) state.currentVariant = null;
  buildControls(); toast('Variant deleted');
}
function variantRename(i){
  const v = state.variants[i]; if(!v) return;
  const n = prompt('Variant name', v.name);
  if(n){ pushUndo(); v.name = n; buildControls(); }
}

/* confronto: tutte le varianti affiancate sul canvas */
function compareSheet(){
  const list = state.variants.length ? state.variants : [variantSnap('Current')];
  const full = FORMATS.find(x=>x.id===state.active);
  /* i riquadri servono per guardarli, non per stamparli: li tengo a 900 px
     di lato lungo, se no con sei varianti dell'Asset page si arriva a 11520 px */
  const base = sizeOf(full);
  const k = Math.min(1, 900/Math.max(base.w, base.h));
  const f = {id:full.id, group:full.group, name:full.name, note:full.note,
             profile:full.profile, w:Math.round(base.w*k), h:Math.round(base.h*k)};
  const cols = Math.min(3, list.length);
  const rows = Math.ceil(list.length/cols);
  const pad = Math.round(f.w*0.02), lab = Math.round(f.h*0.055);
  const cw = f.w, ch = f.h;
  const out = document.createElement('canvas');
  out.width = cols*cw + pad*(cols+1);
  out.height = rows*(ch+lab+pad) + pad;
  const g = out.getContext('2d');
  g.fillStyle = '#141418'; g.fillRect(0,0,out.width,out.height);

  const savePack = state.pack, saveTheme = state.theme, saveLayouts = state.layouts;
  list.forEach((v,i)=>{
    state.pack = v.pack; state.theme = v.theme||saveTheme; state.layouts = v.layouts;
    const c = document.createElement('canvas'); c.width=f.w; c.height=f.h;
    renderTo(c.getContext('2d'), f, state.layouts[f.id], false);
    const x = pad + (i%cols)*(cw+pad);
    const y = pad + Math.floor(i/cols)*(ch+lab+pad);
    g.drawImage(c, x, y+lab);
    g.fillStyle = '#c8c8d0';
    g.font = '600 '+Math.round(lab*0.62)+'px sans-serif';
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    g.fillText(v.name, x, y+lab*0.78);
  });
  state.pack = savePack; state.theme = saveTheme; state.layouts = saveLayouts;
  return out;
}

/* variazione casuale entro limiti sensati, per scoprire strade nuove */
/* ============================================================================
   CENTRATURA DEL TITOLO NELLA FASCIA
   Misura l'inchiostro vero del testo, non il riquadro teorico, cosi' tiene
   conto di maiuscole, accenti e discendenti del font.
   ============================================================================ */
function rowInkBox(f, L, titleOnly){
  const c = scratch(5, f.w, f.h);
  const pk = titleOnly ? Object.assign({}, state.pack, {brand:'', category:''}) : state.pack;
  const teorico = drawRow(c, f.w, f.h, L.row, pk, limiteRiga(L, f.w, f.h));
  /* Leggere tutta la tela di una Asset page vuol dire copiare otto milioni
     di pixel, e qui si legge fino a sei volte di fila: su 3840x2160 sono
     centinaia di millisecondi ogni volta che si prova un look. Il disegno
     dice gia' dove ha scritto: guardo solo quella zona, con un margine
     largo per ombre e bagliori. La misura resta al pixel pieno. */
  let rx = 0, ry = 0, rw = f.w, rh = f.h;
  if(teorico && teorico.w > 0 && teorico.h > 0){
    const mx = Math.max(24, teorico.w*0.25), my = Math.max(24, teorico.h*0.9);
    rx = Math.max(0, Math.floor(teorico.x - mx));
    ry = Math.max(0, Math.floor(teorico.y - my));
    rw = Math.min(f.w - rx, Math.ceil(teorico.w + mx*2));
    rh = Math.min(f.h - ry, Math.ceil(teorico.h + my*2));
  }
  if(rw <= 0 || rh <= 0) return null;
  const d = c.getImageData(rx, ry, rw, rh).data;
  let top = -1, bot = -1, left = -1, right = -1;
  for(let y=0; y<rh; y++){
    const base = y*rw*4;
    for(let x=0; x<rw; x++){
      if(d[base + x*4 + 3] > 40){ if(top<0) top = y; bot = y; break; }
    }
  }
  if(top<0){
    /* niente inchiostro dove il disegno diceva: guardo tutta la tela,
       cosi' un caso strano non fa sbagliare la centratura */
    if(rw === f.w && rh === f.h) return null;
    return rowInkBoxTutta(c, f);
  }
  for(let x=0; x<rw; x++){
    for(let y=top; y<=bot; y++){
      if(d[(y*rw + x)*4 + 3] > 40){ if(left<0) left = x; right = x; break; }
    }
  }
  return {top:top+ry, bot:bot+ry, left:left+rx, right:right+rx};
}
function rowInkBoxTutta(c, f){
  const d = c.getImageData(0, 0, f.w, f.h).data;
  let top = -1, bot = -1, left = -1, right = -1;
  for(let y=0; y<f.h; y++){
    const base = y*f.w*4;
    for(let x=0; x<f.w; x++){
      if(d[base + x*4 + 3] > 40){ if(top<0) top = y; bot = y; break; }
    }
  }
  if(top<0) return null;
  for(let x=0; x<f.w; x++){
    for(let y=top; y<=bot; y++){
      if(d[(y*f.w + x)*4 + 3] > 40){ if(left<0) left = x; right = x; break; }
    }
  }
  return {top:top, bot:bot, left:left, right:right};
}

/* centratura verticale nella fascia. L'orizzontale non sta piu' qui: la fa
   drawRow al momento del disegno, cosi' resta giusta anche quando cambia il
   titolo. */
function centerRowInBand(all, silent, soloNonPsd){
  /* Le grafiche prese dal PSD hanno gia' la linea di base giusta: centrarle
     da sole all'avvio le spostava di qualche pixel piu' in alto. Le altre
     invece vanno centrate, perche' i loro numeri sono ricavati e non
     misurati. */
  const ids = (all ? FORMATS.map(f=>f.id) : [state.active])
    .filter(id=> !soloNonPsd || FROM_PSD.indexOf(id) < 0);
  let done = 0;
  ids.forEach(id=>{
    const f = FORMATS.find(x=>x.id===id), L = state.layouts[id];
    if(!L.row.on) return;
    let touched = false;

    if(L.band.on){
      /* stessa regola di centerRowInBandOn: dentro una fascia molto piu'
         alta del testo (le storie) il testo si appoggia in alto */
      const prima = L.row.y;
      centerRowInBandOn(f, L);
      touched = L.row.y !== prima;
    }

    if(touched) done++;
  });
  if(!silent){ syncControls(); render(); toast('Centred on '+done+' format'+(done===1?'':'s')); }
  return done;
}

/* ==================================================== AZIONI DEI PULSANTI */

function runAction(act){
  if(act==='resetFx'){
    pushUndo();
    state.layouts[state.active].fx = PARTS.find(p=>p.key==='fx').defaults({});
    syncControls(); render(); return;
  }
  if(act==='applyAccent'){
    pushUndo();
    const n = applyAccent(state.theme.accent, state.theme.scope==='this format');
    syncControls(); render();
    toast(n+' colour'+(n===1?'':'s')+' repainted'); return;
  }
  if(act==='previewName'){
    const f = FORMATS.find(x=>x.id===state.active);
    const fuori = tokenIgnoti(state.naming.pattern).concat(tokenIgnoti(state.naming.folder));
    toast(folderFor(f, state.pack, 1)+fileNameFor(f, state.pack, 1) +
      (fuori.length ? '     (ignored: ' + [...new Set(fuori)].join(' ') + ')' : '')); return;
  }
  if(act==='panelsEven'){
    pushUndo();
    const S = state.layouts[state.active].shot;
    S.weights = [1,1,1,1,1,1]; S.slants = [0,0,0,0,0,0,0];
    buildControls(); render(); toast('Even panels'); return;
  }
  if(act==='panelsHero'){
    pushUndo();
    const S = state.layouts[state.active].shot;
    S.weights = [2,1,1,1,1,1]; S.slants = [0,0,0,0,0,0,0];
    if((S.panels||1) < 3) S.panels = 3;
    buildControls(); render(); toast('Big panel on the left'); return;
  }
  if(act==='panelsFan'){
    pushUndo();
    const S = state.layouts[state.active].shot;
    const n = Math.max(2, Math.round(S.panels||1));
    S.slants = [];
    for(let i=0;i<=n;i++) S.slants[i] = (i-n/2) * 0.16;
    buildControls(); render(); toast('Cuts fanned out'); return;
  }
  if(act==='shotsClear'){
    pushUndo();
    SHOTS = []; imgShot = null;
    dbSvuota();
    rimappaImmagini(()=> -1);
    buildControls(); render();
    toast('Images removed. Ctrl+Z brings them back'); return;
  }
  if(act==='resetAccent'){
    pushUndo();
    applyAccent(C.accentA2, state.theme.scope==='this format');
    syncControls(); render(); toast('Back to the PSD orange'); return;
  }
  if(act==='autoClear'){ autoClear(); return; }
  if(act==='autoRestore'){
    pushUndo();
    toast(autoRestore() ? 'Last save restored'
          : (ripristinoRotto ? 'The saved work is damaged and could not be read'
                             : 'Nothing saved yet'));
    return;
  }
  if(act==='sizeCheck'){ sizeCheck(); return; }
  if(act==='preflight'){ preflightRun(); return; }
  if(act==='centerRow'){ pushUndo(); centerRowInBand(false); return; }
  if(act==='centerRowAll'){ pushUndo(); centerRowInBand(true); return; }
  if(act==='variantAdd'){ variantAdd(); return; }
  if(act==='variantUpdate'){ variantUpdate(); return; }
  if(act==='compareShow'){
    compareMode = !compareMode;
    buildTools(); render();
    toast(compareMode ? 'Comparison view, click again to go back' : 'Back to editing');
    return;
  }
  if(act==='compareExport'){
    const c = compareSheet();
    c.toBlob(b=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = safe(applyCase('comparison '+(state.variants.length||1)+' variants',
                                  state.naming.case, state.naming.sep||'_'))+'.png';
      a.click();
    }, 'image/png');
    toast('Comparison sheet exported');
    return;
  }
}

/* pesa ogni formato attivo con le impostazioni correnti */
/* ==========================================================================
   CONTROLLO PRIMA DI ESPORTARE
   Gli errori che costano di piu' non sono quelli che si vedono: sono quelli
   che si scoprono dopo, guardando i PNG gia' caricati sullo store. Qui si
   guardano tutti i formati accesi e si dice cosa non va, prima di premere
   esporta. Non blocca niente: elenca e basta.
   ========================================================================== */
let PREVOLO = null;                 /* ultimo esito, per stamparlo nel pannello */

function inkDelDisegno(f, L, quale){
  /* riquadro di inchiostro vero di una parte, misurato sul disegno */
  const c = scratch(93, f.w, f.h);
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,f.w,f.h);
  const parte = PARTS.find(x=> x.key===quale);
  if(!parte || !parte.draw) return null;
  let box = null;
  try{ box = parte.draw(c, f.w, f.h, L, false); }catch(e){ return null; }
  return box;
}

function preflight(){
  const trovati = [];
  const agg = (formato, tipo, testo)=> trovati.push({formato, tipo, testo});
  const attivi = FORMATS.filter(f=> state.layouts[f.id].on);

  if(!attivi.length) agg('', 'errore', 'No format is ticked: there is nothing to export');
  if(state.export.scale !== 1)
    agg('', 'nota', 'Scale is ' + Math.round(state.export.scale*100) +
        '%: the files will not have the size the stores ask for');
  if(!state.pack.title.trim()) agg('', 'errore', 'The title is empty');

  /* Se non e' stata caricata nessuna immagine lo si dice una volta sola.
     Prima usciva la stessa riga per ogni formato: otto righe identiche che
     non aggiungono niente e che, col tetto di venti, coprono i problemi
     veri sotto di loro. */
  /* la barra accento nasce sul bordo del quadrato del logo: se resta a
     mezz'aria si vede subito, ed e' l'unico dettaglio del PSD che si
     rompe spostando il logo a mano */
  attivi.forEach(f=>{
    const L = state.layouts[f.id];
    const a = L.accent, lg = L.logo;
    if(!a || !a.on || !lg || !lg.on || a.x0 <= 0.03) return;
    const lw = lg.size * f.h / f.w;
    if(a.y < lg.y || a.y > lg.y + lg.size) return;   /* non e' alla sua altezza */
    const buco = (a.x0 - (lg.x + lw)) * f.w;
    if(buco > lw*f.w*0.5)
      agg(f.name, 'nota', 'the accent line starts ' + Math.round(buco) +
          ' px after the logo instead of touching it');
  });

  /* la griglia: piu' righe scritte che caselle disponibili */
  attivi.forEach(f=>{
    (state.layouts[f.id].layers||[]).forEach(l=>{
      if(l.type !== 'grid' || !l.on || l.autoRows) return;
      const voci = String(l.text||'').split('\n').filter(t=> t.trim()).length;
      const celle = Math.max(1, Math.round(l.cols||3)) * Math.max(1, Math.round(l.rows||3));
      if(voci > celle)
        agg(f.name, 'nota', '"' + l.name + '" has ' + voci + ' lines but only ' + celle +
            ' cells: the last ' + (voci-celle) + ' are not drawn');
    });
  });

  /* uno screenshot con zone trasparenti esce come un buco nero nel file */
  const bucati = SHOTS.filter(s=> s.buchi).map(s=> s.name);
  if(bucati.length)
    agg('', 'nota', bucati.length === 1
      ? '"' + bucati[0] + '" has transparent areas: they will come out as holes'
      : bucati.length + ' screenshots have transparent areas that will come out as holes ("' +
        bucati[0] + '" and ' + (bucati.length-1) + ' more)');

  const nessunaImmagine = !SHOTS.length && !imgShot;
  if(nessunaImmagine && attivi.some(f=>{
       const L = state.layouts[f.id];
       return L.shot && L.shot.on !== false;
     }))
    agg('', 'nota', 'no screenshot loaded yet');

  attivi.forEach(fPieno=>{
    const L = state.layouts[fPieno.id];
    const o = outSize(fPieno);
    /* Il controllo guarda se le cose sbordano, non misura al pixel: si
       lavora in scala ridotta e si riportano i pixel veri moltiplicando.
       Su una Asset page 4K questo taglia il tempo di tre quarti senza
       cambiare nessuna risposta. */
    const f = formatoRidotto(fPieno, 1500);
    const vero = v => Math.round(v * fPieno.w / f.w);

    /* il titolo dentro la tela e dentro la fascia */
    if(L.row.on){
      const box = rowInkBox(f, L, false);
      if(!box) agg(f.name, 'nota', 'the text row draws nothing');
      else {
        if(box.left < 0 || box.right > f.w)
          agg(f.name, 'errore', 'the title runs past the edge by ' +
              vero(Math.max(-box.left, box.right - f.w)) + ' px');
        if(box.top < 0 || box.bot > f.h)
          agg(f.name, 'errore', 'the title runs off the top or bottom');
        const soloTitolo = rowInkBox(f, L, true);
        if(L.band.on){
          const cima = L.band.top*f.h;
          if(soloTitolo && soloTitolo.top < cima - f.h*0.02)
            agg(f.name, 'nota', 'the title sticks out of the black band');
        }
        /* Un titolo lungo si rimpicciolisce da solo per stare nello spazio:
           su una Icon da 160 px puo' finire a quattro pixel di altezza, e
           quattro pixel non sono una parola, sono una riga grigia. Il PSD
           sta a otto, quindi il disegno di serie non viene segnalato. */
        if(soloTitolo){
          const altoPx = vero(soloTitolo.bot - soloTitolo.top);
          if(altoPx > 0 && altoPx < 6)
            agg(f.name, 'nota', 'the title ends up ' + altoPx + ' px tall here: too small ' +
                'to read. Use a shorter title, or turn the text off on this format');
        }
      }
    }

    /* Pezzi che si accavallano e scritte che non si leggono: sono i due
       difetti che si scoprono solo dopo aver caricato le immagini sullo
       store, quando e' tardi. */
    if(L.row.on){
      const t = rowInkBox(f, L, false);
      if(t){
        const addosso = (k, nome)=>{
          if(!L[k] || !L[k].on) return;
          const b2 = inkDelDisegno(f, L, k);
          if(!b2) return;
          const ox = Math.max(0, Math.min(t.right, b2.x+b2.w) - Math.max(t.left, b2.x));
          const oy = Math.max(0, Math.min(t.bot, b2.y+b2.h) - Math.max(t.top, b2.y));
          if(ox*oy > f.w*f.h*0.0003)
            agg(f.name, 'nota', 'the text and the ' + nome + ' overlap');
        };
        addosso('badges', 'badges');
        addosso('version', 'version number');
        /* La barra accento merita un controllo suo: su Card e Icon il PSD
           ci appoggia il brand apposta, quindi si guarda solo il titolo, e
           solo quando la barra e' una riga sottile e non una fascia. */
        if(L.accent && L.accent.on){
          const dis = c2=> PARTS.find(x=>x.key==='accent').draw(c2, f.w, f.h, L, false);
          const tit = rowInkBox(f, L, true);
          const pieno = inkFrac(f, dis, 200);
          const altoTit = tit ? (tit.bot - tit.top)/f.h : 0;
          const fascia = pieno && altoTit && pieno.h >= altoTit*0.85;
          const bAcc = inkFrac(f, dis);
          if(tit && bAcc && !fascia){
            const ax = bAcc.x*f.w, ay = bAcc.y*f.h, aw = bAcc.w*f.w, ah = bAcc.h*f.h;
            const ox = Math.max(0, Math.min(tit.right, ax+aw) - Math.max(tit.left, ax));
            const oy = Math.max(0, Math.min(tit.bot, ay+ah) - Math.max(tit.top, ay));
            if(ox*oy > f.w*f.h*0.0002)
              agg(f.name, 'nota', 'the accent line runs across the title');
          }
        }
        const box = {x:t.left/f.w, y:t.top/f.h,
                     w:(t.right-t.left)/f.w, h:(t.bot-t.top)/f.h};
        /* per la chiarezza media del fondo basta una tela piccola: si
           guarda una media, non i dettagli */
        const fLuce = formatoRidotto(fPieno, 360);
        const chiaro = chiaroSotto(fondoSotto(fLuce, L), fLuce, box);
        if(Math.abs(chiaro - luma(L.row.color)) < 0.2)
          agg(f.name, 'nota', 'the title has little contrast with what is behind it');
      }
    }

    /* le altre parti accese devono stare dentro */
    ['badges','version','logo','accent'].forEach(k=>{
      const e = L[k];
      if(!e || !e.on) return;
      const b = inkDelDisegno(f, L, k);
      if(!b) return;
      const fuori = Math.max(-b.x, -b.y, (b.x+b.w)-f.w, (b.y+b.h)-f.h);
      if(fuori > 1)
        agg(f.name, 'errore', selLabel(k).toLowerCase() + ' sticks out of the canvas by ' +
            vero(fuori) + ' px');
    });

    /* i livelli aggiunti a mano */
    layersOf(L).forEach(l=>{
      if(!l.on) return;
      const b = measureLayer(l, f);
      if(!b) return;
      const fuori = Math.max(-b.x, -b.y, (b.x+b.w)-1, (b.y+b.h)-1);
      if(fuori > 0.02)
        agg(f.name, 'nota', 'layer "' + l.name + '" is ' + Math.round(fuori*100) + '% outside');
    });

    /* I formati verticali finiscono nelle storie, e le app ci mettono sopra
       la loro interfaccia: in alto la barra del profilo, in basso il campo
       per rispondere e i comandi di condivisione. Le misure che girano per
       un 1080x1920 sono 250 px in alto e 340 in basso. Quello che sta li'
       dentro c'e' ma non si vede. */
    if(f.h > f.w*1.6){
      const basso = f.h*340/1920, alto = f.h*250/1920;
      const sotto = [], sopra = [];
      const guarda = (k, nome)=>{
        const e = L[k];
        if(!e || !e.on) return;
        const b2 = (k==='row') ? (()=>{ const t = rowInkBox(f, L, false);
                     return t ? {x:t.left, y:t.top, w:t.right-t.left, h:t.bot-t.top} : null; })()
                               : inkDelDisegno(f, L, k);
        if(!b2) return;
        if(b2.y + b2.h > f.h - basso) sotto.push(nome);
        else if(b2.y < alto) sopra.push(nome);
      };
      guarda('row', 'the text');
      guarda('logo', 'the logo');
      guarda('badges', 'the badges');
      guarda('version', 'the version number');
      /* un avviso solo, con l'elenco: tre righe uguali di fila non aiutano */
      const elenca = a2 => a2.length > 1
        ? a2.slice(0,-1).join(', ') + ' and ' + a2[a2.length-1]
        : a2[0];
      if(sotto.length)
        agg(f.name, 'nota', elenca(sotto) + (sotto.length>1?' end':' ends') +
            ' up in the bottom ' + vero(basso) + ' px, where a story app puts the ' +
            'reply field and the share buttons');
      if(sopra.length)
        agg(f.name, 'nota', elenca(sopra) + (sopra.length>1?' are':' is') +
            ' in the top ' + vero(alto) + ' px, where a story app puts the profile bar');
    }

    /* Sulle anteprime di Youtube il riquadro della durata sta nell'angolo in
       basso a destra: quello che finisce li' sotto sparisce negli elenchi e
       nelle ricerche, cioe' proprio dove l'anteprima serve. */
    if(String(fPieno.group||'').indexOf('YouTube') >= 0){
      const zona = {x:f.w*0.86, y:f.h*0.88, w:f.w*0.14, h:f.h*0.12};
      const dentro = [];
      [['row','the text'], ['version','the version number'],
       ['badges','the badges'], ['logo','the logo']].forEach(([k, nome])=>{
        const e = L[k];
        if(!e || !e.on) return;
        const b2 = (k==='row') ? (()=>{ const t = rowInkBox(f, L, false);
                     return t ? {x:t.left, y:t.top, w:t.right-t.left, h:t.bot-t.top} : null; })()
                               : inkDelDisegno(f, L, k);
        if(!b2) return;
        const ox = Math.max(0, Math.min(b2.x+b2.w, zona.x+zona.w) - Math.max(b2.x, zona.x));
        const oy = Math.max(0, Math.min(b2.y+b2.h, zona.y+zona.h) - Math.max(b2.y, zona.y));
        if(ox*oy > 0) dentro.push(nome);
      });
      if(dentro.length)
        agg(f.name, 'nota', dentro.join(' and ') + ' sits in the bottom right corner, ' +
            'where YouTube draws the duration badge over the thumbnail');
    }

    /* la risoluzione delle immagini: una schermata piccola stirata su 3840
       si vede sgranata, ed e' l'errore che si scopre solo online */
    if(L.shot && L.shot.on !== false){
      const n = Math.max(1, Math.round(L.shot.panels||1));
      const viste = [];
      for(let i=0;i<n;i++){
        const im = shotByIndex(Array.isArray(L.shot.src) ? L.shot.src[i] : -1);
        if(im && viste.indexOf(im) < 0) viste.push(im);
      }
      if(!viste.length && !imgShot && !nessunaImmagine)
        agg(f.name, 'nota', 'no screenshot loaded');
      /* con piu' pannelli ogni immagine copre solo la sua fetta, quindi
         quello che serve e' la larghezza della fetta, non quella intera */
      const serve = Math.round(o.w / n);
      viste.forEach(im=>{
        if(im.width < serve * 0.5)
          agg(f.name, 'nota', 'a screenshot is ' + im.width + ' px wide for a ' + serve +
              ' px slot: it will look soft');
      });
    }

    if(L.logo.on && !imgLogo) agg(f.name, 'nota', 'the logo is on but no logo image is loaded');
    /* Un titolo scritto in un alfabeto che non e' quello latino sparisce
       dal nome del file: i nomi restano a lettere semplici apposta, perche'
       viaggino fra Windows, Mac e lo zip senza sorprese. Ma se il titolo
       sparisce del tutto conviene saperlo, se no in un lotto escono file
       che non si distinguono l'uno dall'altro. */
    {
      const t = String(state.pack.title||'').trim();
      /* stessa potatura del nome del file, ma senza la rete di sicurezza:
         cosi' si vede se del titolo non resta proprio niente */
      const resta = senzaAccenti(t).replace(/[^A-Za-z0-9]+/g, '');
      if(t && !resta.length)
        agg(f.name, 'nota', 'the title has no letters the file name can keep: ' +
            'the file comes out named after the format only');
    }
    /* Icon e Social: il manuale Unity dice che quelle due immagini non
       devono contenere testo. E' una regola loro, non una scelta di
       questo programma, quindi si segnala e basta: chi vuole tenerlo
       ce lo tiene. */
    if(fPieno.senzaTesto){
      const scritte = [];
      if(L.row && L.row.on) scritte.push('the text row');
      if(L.badges && L.badges.on) scritte.push('the badges');
      if(L.version && L.version.on) scritte.push('the version number');
      (layersOf(L)||[]).forEach(l=>{
        if(l.on && l.type === 'text' && scritte.indexOf('a text layer') < 0)
          scritte.push('a text layer');
      });
      if(scritte.length)
        agg(f.name, 'nota', elencaCose(scritte) + ' on an image Unity asks to keep free of ' +
            'text. Turn the text off here, or accept it knowing the rule');
    }
    /* il font caricato non entra nel preset: se manca, le scritte escono
       con il carattere di sistema e a occhio non si nota subito */
    if(!state.customFont){
      const chiedono = [];
      ['row','version','badges'].forEach(g=>{
        const o = L[g];
        if(!o || !o.on) return;
        ['font','titleFont','itemFont'].forEach(k=>{
          if(o[k] === FONT_MIO && chiedono.indexOf(g) < 0) chiedono.push(g);
        });
      });
      if(chiedono.length)
        agg(f.name, 'errore', 'asks for the loaded font but no font file is loaded: ' +
            'the text comes out in the system font');
    }
  });

  /* nomi dei file: doppioni e segnaposto sbagliati */
  const fuori = tokenIgnoti(state.naming.pattern).concat(tokenIgnoti(state.naming.folder));
  if(fuori.length)
    agg('', 'errore', 'unknown in the file name: ' + [...new Set(fuori)].join(' '));
  const nomi = {}, gia = {};
  attivi.forEach(f=>{
    const nome = folderFor(f, state.pack, 1) + fileNameFor(f, state.pack, 1);
    if(nomi[nome] && !gia[nome]){
      gia[nome] = true;
      agg('', 'errore', 'more than one file would be called ' + nome +
          ': add {format} to the file name');
    }
    nomi[nome] = true;
  });

  const visti = {}, unici = [];
  trovati.forEach(x=>{
    const chiave = x.tipo+'|'+x.formato+'|'+x.testo;
    if(visti[chiave]) return;
    visti[chiave] = true; unici.push(x);
  });
  unici.sort((a,b)=> (a.tipo===b.tipo) ? 0 : (a.tipo==='errore' ? -1 : 1));
  const tagliati = unici.length > 20 ? unici.slice(0,20) : unici;
  if(unici.length > 20)
    tagliati.push({formato:'', tipo:'nota', testo:'and ' + (unici.length-20) + ' more'});
  PREVOLO = {quando: Date.now(), trovati: tagliati};
  return tagliati;
}

function preflightRun(){
  const t = preflight();
  const errori = t.filter(x=> x.tipo==='errore').length;
  const note   = t.length - errori;
  buildControls();
  toast(!t.length ? 'Everything checks out'
    : errori + ' problem' + (errori===1?'':'s') + ', ' + note + ' thing' + (note===1?'':'s') +
      ' to look at.  The list is under Export.');
  return t;
}

async function sizeCheck(){
  const list = FORMATS.filter(f=> state.layouts[f.id].on);
  if(!list.length){ toast('No format selected'); return; }
  let total = 0;
  const lines = [];
  for(const f of list){
    const blob = await new Promise(res=> renderFormatToBlob(f, res));
    total += blob.size;
    const o = outSize(f);
    lines.push(f.name+' '+o.w+'x'+o.h+': '+Math.round(blob.size/1024)+' KB');
  }
  toast(exportExt().toUpperCase()+' - total '+(total/1048576).toFixed(2)+' MB for '+
        list.length+' images. Biggest: '+
        lines.sort((a,b)=> parseInt(b.split(': ')[1]) - parseInt(a.split(': ')[1]))[0]);
  return lines;
}

/* ================================================ ZIP, metodo senza compressione */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c^u8[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
/* Due file con lo stesso nome dentro uno zip non danno errore: quando lo
   si apre ne resta uno solo e gli altri spariscono in silenzio. Capitava
   con due formati che finiscono con lo stesso nome. Qui il nome
   doppio prende un numero in coda, cosi' non si perde niente. */
function nomiUnici(files){
  const visti = {};
  let cambiati = 0;
  files.forEach(f=>{
    let n = f.name;
    if(visti[n]){
      const punto = n.lastIndexOf('.');
      const base = punto > 0 ? n.slice(0, punto) : n;
      const est  = punto > 0 ? n.slice(punto) : '';
      let k = 2;
      while(visti[base + '_' + k + est]) k++;
      n = base + '_' + k + est;
      cambiati++;
    }
    visti[n] = true;
    f.name = n;
  });
  return cambiati;
}

function makeZip(files){
  const doppi = nomiUnici(files);
  if(doppi) toast(doppi + ' file'+(doppi===1?'':'s')+' had the same name, ' +
                  'numbered to keep them all');
  const enc = new TextEncoder();
  const chunks=[], central=[];
  let offset=0;
  const dosTime=0x6000, dosDate=0x5CA1;
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data);
    const lh = new Uint8Array(30+name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true);
    dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,f.data.length,true);
    dv.setUint32(22,f.data.length,true); dv.setUint16(26,name.length,true);
    lh.set(name,30); chunks.push(lh, f.data);
    const ch = new Uint8Array(46+name.length), c2 = new DataView(ch.buffer);
    c2.setUint32(0,0x02014b50,true); c2.setUint16(4,20,true); c2.setUint16(6,20,true);
    c2.setUint16(12,dosTime,true); c2.setUint16(14,dosDate,true);
    c2.setUint32(16,crc,true); c2.setUint32(20,f.data.length,true);
    c2.setUint32(24,f.data.length,true); c2.setUint16(28,name.length,true);
    c2.setUint32(42,offset,true); ch.set(name,46);
    central.push(ch); offset += lh.length + f.data.length;
  });
  let cdSize=0; central.forEach(c=> cdSize += c.length);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true);
  ev.setUint16(10,files.length,true); ev.setUint32(12,cdSize,true);
  ev.setUint32(16,offset,true);
  const out = new Uint8Array(offset+cdSize+22);
  let p=0;
  chunks.forEach(c=>{ out.set(c,p); p+=c.length; });
  central.forEach(c=>{ out.set(c,p); p+=c.length; });
  out.set(end,p);
  return out;
}

/* i pesi del font vanno caricati esplicitamente, altrimenti il browser
   carica solo quelli gia' usati e gli altri cadono sul font di sistema */
Promise.all([...document.fonts].map(f=> f.load().catch(()=>{})))
  .then(()=> document.fonts.ready)
  .then(()=>{
    /* prima riprendo il lavoro salvato, poi centro: se ho ripreso qualcosa
       non tocco le posizioni, sono gia' quelle che aveva lasciato l'utente */
    const back = autoRestore();
    if(!back) centerRowInBand(true, true, true);
    if(!back && ripristinoRotto)
      setTimeout(()=> toast('The saved work was damaged: starting from the default design'), 900);
    buildTools();
    buildControls();
    render();
    autoArmed = true;
    autoSaveNow();
    /* le immagini tornano dal loro archivio, che e' piu' lento ad aprirsi */
    dbCarica().then(n=>{
      if(n){ buildControls(); render(); }
      /* il file del progetto si riprende dopo le immagini: la firma le conta */
      riprendiFileProgetto();
      riprendiCartellaExport().then(()=> buildControls());
      if(back) toast(n ? 'Last session restored, '+n+' screenshot'+(n>1?'s':'')+' back too'
                       : 'Last session restored, load the images again');
      else if(n) toast(n+' screenshot'+(n>1?'s':'')+' back from last time');
    }).catch(()=>{
      if(back) toast('Last session restored, load the images again');
    });
    /* Il file del font non sta nel salvataggio automatico piu' di quanto
       stia in un preset: se il lavoro ripreso lo chiede, va detto, se no
       le scritte tornano con il carattere di sistema e sembrano solo
       "un po' diverse". */
    if(back && !state.customFont && chiedonoIlFontMio())
      setTimeout(()=> toast('The restored work asks for a loaded font: load the file again ' +
        'with Font, or the text comes out in the system font'), 3200);
  });
/* chiudendo la scheda scrivo subito, senza aspettare il timer */
window.addEventListener('beforeunload', ()=>{ autoSaveNow(); });

/* Due schede aperte sullo stesso file scrivono nello stesso salvataggio
   automatico: l'ultima che chiude cancella il lavoro dell'altra, e in
   silenzio. Il browser avvisa quando un'altra scheda scrive: lo si dice una
   volta sola, senza rompere. */
window.addEventListener('storage', e=>{
  if(e.key !== AUTOKEY || avvisatoAltraFinestra) return;
  avvisatoAltraFinestra = true;
  toast('Another window of this tool is saving to the same place: the last one ' +
        'you close wins. Use Save for a file that stays yours');
});
