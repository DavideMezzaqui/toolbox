         Icon  51.134 x 0.1489 = 7.61 px  su un riquadro di 18  -> 0.423
         Card  51.134 x 0.2514 = 12.86 px su 24                 -> 0.536
         Thumb 39.880 x 2.1080 = 84.07 px su 192                -> 0.4376 */
    size: P.big?0.4376 : (P.tiny?0.423 : (P.small?0.4946:0.53)),
    /* Margine laterale risolto sulla larghezza vera del PSD: 383 px sulla
       Thumbnail, 53 sulla Card, 34 sull'Icon, con il carattere qui sopra. */
    pad: P.big?1.273 : (P.tiny?1.158 : (P.small?1.106:0.55)), uniform:true,
    /* Nel PSD il badge e' un riquadro pieno #151515 con il contorno
       arancione in gradiente all'80%, non un contorno vuoto: era la
       differenza che si vedeva di piu'. Contorno misurato artboard per
       artboard: 14 px su 192 (Thumbnail), 2 su 24 (Card), 2 su 18 (Icon);
       sulle tele piccole serve proporzionalmente piu' spesso. Lo smusso e'
       33 px su 192, cioe' 0.173. */
    strokeOn:true, thick: P.big?0.073 : (P.tiny?0.111 : 0.083),
    color:C.accentA2, color2:C.accentB2, gradOn:true, gradLink:true,
    gradAngle:0, strokeOp:0.8,
    fillOn:true, fillColor:'#151515', fillOpacity:1,
    /* Lo smusso e' misurato sul RISULTATO, non ricavato dai numeri del
       tratto. Contarlo come meta' dello spessore torna sulla Thumbnail e
       sbaglia sulle tele piccole: li' il PSD mette il contorno arancione
       FUORI dalla sagoma, e quei due pixel allargano anche il taglio.
         Thumbnail  33 px su 190, misurati sul PSD renderizzato  -> 0.1737
         Icon        4 px su 18,  misurati sull'icona vera       -> 0.2222
         Card        stesso contorno esterno dell'Icon, riquadro
                     piu' grande                                 -> 0.200   */
    cut: P.big?0.1731 : (P.tiny?0.2222 : (P.small?0.1923:0.173)), cuts:'all',
    /* nel PSD le lettere dei badge dell'Icon sono molto piu' distanziate
       delle altre: a 160 px si vede */
    textColor:'#ffffff', font:'Turret Road', weight:'700',
    track: P.tiny?0.10:0.02}),
  draw:(c,W,H,L)=>{
    const b = L.badges;
    const list = String(state.pack.badges||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(!b.on || !list.length) return null;
    /* Con due badge la pila e' alta un quarto della tela, con sette uscirebbe
       dal bordo e passerebbe sopra al titolo. Sopra una certa altezza la
       pila si stringe da sola invece di sbordare: meglio badge piu' piccoli
       che badge fuori dalla grafica. */
    let hh = b.h, gg = b.gap;
    const alta = list.length*hh + (list.length-1)*gg;
    /* lo spazio libero finisce dove comincia la barra accento o la fascia:
       sotto ci sono le scritte */
    let fondo = 0.94;
    if(L.band && L.band.on) fondo = Math.min(fondo, L.band.top);
    if(L.accent && L.accent.on) fondo = Math.min(fondo, L.accent.y - L.accent.thick/2);
    const spazio = Math.max(0.2, fondo - b.y - 0.015);
    if(alta > spazio){ const k = spazio/alta; hh *= k; gg *= k; }
    const h = hh*H, px = b.size*h, t = Math.max(1, b.thick*h);
    const cut = b.cut*h;
    let y = b.y*H, maxW = 0;
    c.save();
    /* Nel PSD i riquadri hanno tutti la stessa larghezza, e quella larghezza
       la decide il primo badge con il suo margine pieno: HDRP, che e' piu'
       lungo, ci sta dentro con un margine piu' stretto. Prendendo invece la
       scritta piu' lunga e dandole il margine pieno venivano riquadri del
       16% piu' larghi di quelli del PSD gia' con URP e HDRP. */
    setFont(c, b.font, b.weight, px, b.track);
    const MARGINE_MINIMO = 0.7;          /* frazione del margine pieno */
    const primo = c.measureText(list[0]).width;
    let piuLunga = 0;
    list.forEach(label=>{ piuLunga = Math.max(piuLunga, c.measureText(label).width); });
    let wide = Math.max(primo + px*b.pad*2,
                        piuLunga + px*b.pad*MARGINE_MINIMO*2);
    list.forEach(label=>{
      setFont(c, b.font, b.weight, px, b.track);
      const w = b.uniform===false ? c.measureText(label).width + px*b.pad*2 : wide;
      maxW = Math.max(maxW, w);
      if(b.fillOn){
        c.save(); c.globalAlpha = b.fillOpacity; c.fillStyle = b.fillColor;
        cutCornerPath(c, b.x*W, y, w, h, cut, b.cuts); c.fill(); c.restore();
      }
      if(b.strokeOn){
        c.save();
        c.globalAlpha = b.strokeOp===undefined ? 1 : b.strokeOp;
        c.strokeStyle = gradPaint(c, b, b.x*W, y, w, h);
        c.lineWidth = t; c.lineJoin = 'miter'; c.miterLimit = 8;
        /* Il tratto si disegna sulla mezzeria, quindi il suo percorso sta
           rientrato di t/2. Rientrare di d un angolo tagliato a 45 gradi
           accorcia il taglio di d*(2-radice di 2), non di d: togliendo t/2,
           come si faceva prima, il contorno veniva piu' squadrato del
           riempimento che ha sotto, e sui formati piccoli si vedeva. */
        cutCornerPath(c, b.x*W+t/2, y+t/2, w-t, h-t,
                      Math.max(0, cut - t*(2-Math.SQRT2)/2), b.cuts);
        c.stroke();
        c.restore();
      }
      c.fillStyle = b.textColor;
      c.textBaseline = 'middle'; c.textAlign = 'center';
      /* La spaziatura fra le lettere ne aggiunge un po' anche dopo l'ultima:
         la compenso, se no la scritta risulta spostata a sinistra. */
      /* Con la linea di base "middle" il browser centra sul quadratone del
         carattere, non sulle maiuscole: la scritta resta qualche centesimo
         piu' in alto del centro del riquadro. Misurato sui tre formati che
         hanno i badge, la correzione giusta e' 0.075 del corpo. */
      c.fillText(label, b.x*W + w/2 + px*(b.track||0)/2, y+h/2+px*0.075);
      y += h + gg*H;
    });
    c.restore();
    return {x:b.x*W, y:b.y*H, w:maxW, h:list.length*h + (list.length-1)*gg*H};
  },
  rows:[
    {p:'badges.on',          l:'On',          type:'check'},
    {type:'group', l:'Shape'},
    {p:'badges.cuts',        l:'Cut corners', type:'pick', opts:CORNERS, draw:previewCorners, cols:2},
    {p:'badges.cut',         l:'Cut size',    type:'range', min:0, max:0.5, step:0.01,
     when:L=> L.badges.cuts && L.badges.cuts!=='none'},
    {type:'group', l:'Text'},
    {p:'badges.font',        l:'Font',        type:'select', opts:FONTS},
    {p:'badges.weight',      l:'Weight',      type:'select', opts:WEIGHTS},
    {type:'group', l:'Placement'},
    {p:'badges.x',           l:'X',      type:'range', min:0, max:1, step:0.002},
    {p:'badges.y',           l:'Y',      type:'range', min:0, max:1, step:0.002},
    {p:'badges.h',           l:'Height',      type:'range', min:0.02, max:0.4, step:0.002},
    {p:'badges.gap',         l:'Gap',         type:'range', min:0, max:0.2, step:0.002},
    {p:'badges.size',        l:'Text size',   type:'range', min:0.15, max:0.9, step:0.01},
    {p:'badges.pad',         l:'Pad X',       type:'range', min:0.1, max:2, step:0.02},
    {p:'badges.uniform',     l:'Same width',  type:'check'},
    {type:'group', l:'Outline and fill'},
    {p:'badges.strokeOn',    l:'Stroke',      type:'check'},
    {p:'badges.thick',       l:'Stroke size', type:'range', min:0.005, max:0.3, step:0.005,
     when:L=> L.badges.strokeOn},
    {p:'badges.strokeOp',    l:'Stroke opacity', type:'range', min:0, max:1, step:0.02,
     when:L=> L.badges.strokeOn},
    {p:'badges.gradLink',    l:'Follow theme', type:'check', when:L=> L.badges.strokeOn},
    {p:'badges.color',       l:'Stroke colour', type:'color',
     when:L=> L.badges.strokeOn && !L.badges.gradLink},
    {p:'badges.gradOn',      l:'Gradient',     type:'check', when:L=> L.badges.strokeOn},
    {p:'badges.color2',      l:'Stroke colour right', type:'color',
     when:L=> L.badges.strokeOn && L.badges.gradOn && !L.badges.gradLink},
    {p:'badges.fillOn',      l:'Fill',        type:'check'},
    {p:'badges.fillColor',   l:'Fill colour',  type:'color', when:L=> L.badges.fillOn},
    {p:'badges.fillOpacity', l:'Fill opacity',type:'range', min:0, max:1, step:0.02,
     when:L=> L.badges.fillOn},
    {p:'badges.textColor',   l:'Text colour',  type:'color'},
    {p:'badges.track',       l:'Tracking',    type:'range', min:-0.05, max:0.4, step:0.005},
  ]},

/* ---------------------------------------------------------------- cornice */
{ key:'frame', section:'Frame', order:90,
  /* La cornice deve restare un filo, non un bordo: appena si ispessisce
     mangia la grafica e si vede solo lei. Di serie e' sottile su tutti i
     formati e i Look non la ingrossano. */
  defaults:P=>({on:P.mini, thick: P.mini?0.006:0.0025, color:C.band, inset:0,
                cut:0, cuts:'none'}),
  draw:(c,W,H,L)=>{
    const f = L.frame;
    if(!f.on) return null;
    const t = Math.max(1, f.thick*Math.min(W,H));
    const i = f.inset*Math.min(W,H);
    c.save();
    c.strokeStyle = f.color; c.lineWidth = t; c.lineJoin='miter'; c.miterLimit=8;
    cutCornerPath(c, i+t/2, i+t/2, W-2*i-t, H-2*i-t, f.cut*Math.min(W,H), f.cuts);
    c.stroke();
    c.restore();
    return null;
  },
  rows:[
    {p:'frame.on',    l:'On',          type:'check'},
    {p:'frame.thick', l:'Thickness',   type:'range', min:0.001, max:0.05, step:0.001},
    {p:'frame.color', l:'Colour',       type:'color'},
    {p:'frame.inset', l:'Inset',       type:'range', min:0, max:0.1, step:0.002},
    {p:'frame.cuts',  l:'Cut corners', type:'pick', opts:CORNERS, draw:previewCorners, cols:2},
    {p:'frame.cut',   l:'Cut size',    type:'range', min:0, max:0.2, step:0.002,
     when:L=> L.frame.cuts && L.frame.cuts!=='none'},
  ]}
);

/* i livelli liberi: uno strato sotto il testo e uno sopra.
   Il contenuto vero e' la lista L.layers, gestita nella sezione Layers. */
PARTS.push(
  {key:'layersBack',  order:25, defaults:P=>({}),
   draw:(c,W,H,L)=> drawLayers(c, W, H, L, false)},
  {key:'layersFront', order:82, defaults:P=>({}),
   draw:(c,W,H,L)=> drawLayers(c, W, H, L, true)}
);

/* ------------------------------------------------- riga testo, disegno vero */
function tFont(r){ return r.titleFont || r.font; }
function iFont(r){ return r.itemFont  || r.font; }
function tTrack(r){ return r.titleTrack!==undefined ? r.titleTrack : r.track; }
function iTrack(r){ return r.itemTrack !==undefined ? r.itemTrack  : r.track; }
function iColor(r){ return r.itemColor || r.color; }

function titleLines(t){ return String(t||'').split('\n').filter(l=>l.length); }

function rowWidths(c, r, tPx, iPx, gap, title, cat, brand){
  setFont(c, tFont(r), r.titleWeight, tPx, tTrack(r));
  const lines = titleLines(title);
  let w = 0;
  lines.forEach(l=>{ w = Math.max(w, c.measureText(l).width); });
  const lastW = lines.length ? c.measureText(lines[lines.length-1]).width : 0;
  w = Math.max(w, lastW);
  const sepW = Math.max(1, r.sepW*iPx) * sepFattore(r.sepShape);
  const nSep = Math.max(1, Math.round(r.sepCount||1));
  const sepStep = sepW*(1 + (r.sepSpace!==undefined ? r.sepSpace : 0.9));
  /* Il separatore sta FRA due cose: se il titolo e' vuoto, la riga non
     puo' cominciare con una barretta appesa al nulla. */
  [cat, brand].filter(x=>x.length).forEach((pt, i)=>{
    const c_e_prima = titleLines(title).length > 0 || i > 0;
    if(r.sepOn && c_e_prima) w += gap + sepW + (nSep-1)*sepStep;
    w += gap;
    setFont(c, iFont(r), r.itemWeight, iPx, iTrack(r));
    w += c.measureText(pt).width;
  });
  return w;
}

/* separatori: solo forme nette */
/* Alcune forme di separatore hanno bisogno di piu' spazio di una barretta:
   il doppio filo, con la larghezza di una barra sola, disegnava due linee
   attaccate che si vedevano come una. Il fattore vale sia per il disegno
   sia per il conto di quanto spazio occupa la riga. */
function sepFattore(k){ return k === 'double' ? 2.6 : (k === 'chevron' ? 1.2 : 1); }

function drawSep(c, r, x, y, w, h){
  const k = r.sepShape || 'bar';
  /* l'inclinazione si misura sull'altezza: sulla larghezza, che e' di due
     pixel, non si vedeva nemmeno al massimo */
  const sk = (r.sepSkew||0)*h*0.5;
  if(k==='bar'){ c.fillRect(x, y, w, h); return; }
  if(k==='slash'){
    c.beginPath();
    c.moveTo(x+sk, y); c.lineTo(x+sk+w, y); c.lineTo(x+w, y+h); c.lineTo(x, y+h);
    c.closePath(); c.fill(); return;
  }
  if(k==='chevron'){
    const t = h*0.3;
    c.beginPath();
    c.moveTo(x, y); c.lineTo(x+w, y+h/2); c.lineTo(x, y+h);
    c.lineTo(x+t, y+h/2); c.closePath(); c.fill(); return;
  }
  if(k==='dot-square'){
    const sz = Math.max(1, w*1.4);
    c.fillRect(x, y+h/2-sz/2, sz, sz); return;
  }
  if(k==='double'){
    const t = Math.max(1, w*0.3);
    c.fillRect(x, y, t, h);
    c.fillRect(x+w-t, y, t, h); return;
  }
  c.fillRect(x, y, w, h);
}

/* Quanto in la' puo' arrivare la riga di testo. Se la versione sta sulla
   stessa linea, il titolo si ferma prima invece di finirle addosso: con un
   titolo lungo sulla Thumbnail le due scritte si sovrapponevano. */
function limiteRiga(L, W, H){
  const v = L && L.version, r = L && L.row;
  if(!v || !v.on || !r) return 0.995;
  const t = String(state.pack.version||'');
  if(!t) return 0.995;
  /* solo se sono davvero sulla stessa linea */
  if(Math.abs(v.y - r.y) > Math.max(0.02, r.titleSize*1.6)) return 0.995;
  /* e solo se la versione sta nella meta' destra, dov'e' di regola: se
     qualcuno la porta in mezzo al titolo, il titolo non deve rimpicciolirsi
     all'improvviso, e ci pensa il controllo prima dell'export a dirlo */
  if(v.x < 0.5) return 0.995;
  const c = scratch(76, 8, 8);
  setFont(c, v.font, v.weight, v.size*H, v.track);
  const w = c.measureText(t).width / W;
  const sx = (v.align === 'right') ? v.x - w : v.x;
  return Math.max(0.25, Math.min(0.995, sx - 0.015));
}

function drawRow(c, W, H, r, pack, maxR){
  if(!r.on) return null;
  const up = t => r.upper ? String(t).toUpperCase() : String(t);
  const title = up(pack.title), cat = up(pack.category), brand = up(pack.brand);
  if(!title && !cat && !brand) return null;

  let tPx = r.titleSize*H, iPx = r.itemSize*H;
  const destra = (maxR === undefined ? 0.995 : maxR);
  const avail = Math.max(0.05, Math.min(r.fitW!==undefined?r.fitW:0.86, destra - r.x))*W;

  if(r.mode==='stack'){
    let x = r.x*W;
    const x2 = (r.x2!==undefined ? r.x2 : r.x)*W;
    c.save(); c.textBaseline='alphabetic'; c.textAlign='left';
    setFont(c, iFont(r), r.titleWeight, iPx, iTrack(r));
    let wBrand = c.measureText(brand).width;
    setFont(c, tFont(r), '500', tPx, tTrack(r));
    let wTitle = 0;
    titleLines(title).forEach(l=>{ wTitle = Math.max(wTitle, c.measureText(l).width); });
    const need = Math.max(x+wTitle, x2+wBrand) - Math.min(x,x2);
    if(need > avail){
      const k = avail/need; tPx *= k; iPx *= k;
      setFont(c, iFont(r), r.titleWeight, iPx, iTrack(r)); wBrand = c.measureText(brand).width;
      setFont(c, tFont(r), '500', tPx, tTrack(r));
      wTitle = 0; titleLines(title).forEach(l=>{ wTitle = Math.max(wTitle, c.measureText(l).width); });
    }
    setFont(c, iFont(r), r.titleWeight, iPx, iTrack(r));
    c.globalAlpha = r.itemOp; c.fillStyle = r.brandColor;
    c.fillText(brand, x2, r.y2*H);
    setFont(c, tFont(r), '500', tPx, tTrack(r));
    c.globalAlpha = r.titleOp; c.fillStyle = r.color;
    const tl = titleLines(title);
    const lh2 = tPx*(r.lineGap!==undefined ? r.lineGap : 1.14);
    /* "Centre across" e' una proprieta' del disegno, non una correzione da
       fare una volta sola. Prima si applicava spostando row.x quando si
       spuntava la casella: bastava poi cambiare il titolo perche' la riga
       restasse ferma dov'era e non fosse piu' centrata.
       Si centra sull'inchiostro e non sull'avanzamento: fra le due cose ci
       sono i margini laterali del primo e dell'ultimo segno piu' la
       spaziatura che il browser aggiunge dopo l'ultima lettera, e su una
       tela da 160 px sono tre pixel che si vedono. */
    const xRiga = l=>{
      if(!r.hCenter) return x;
      const m = c.measureText(l);
      return W/2 - ((m.actualBoundingBoxRight||0) - (m.actualBoundingBoxLeft||0))/2;
    };
    if(r.hCenter && tl.length) x = xRiga(tl.reduce((a,b)=>
      c.measureText(b).width > c.measureText(a).width ? b : a));
    tl.forEach((l,i)=> c.fillText(l, xRiga(l), r.y*H - (tl.length-1-i)*lh2));
    c.restore();
    const left = Math.min(x, x2);
    return {x:left, y:r.y2*H-iPx, w:Math.max(x+wTitle, x2+wBrand)-left, h:(r.y-r.y2)*H+tPx};
  }

  let gap = r.gap*iPx;
  c.save(); c.textBaseline='alphabetic'; c.textAlign='left';
  let need = rowWidths(c, r, tPx, iPx, gap, title, cat, brand);
  if(need > avail){ const k = avail/need; tPx *= k; iPx *= k; gap *= k; need = avail; }

  /* vedi la nota nel ramo impilato: centrata al disegno, non spostando x */
  const coda = (cat || brand) ? iPx*iTrack(r) : tPx*tTrack(r);
  const x0 = r.hCenter ? (W - need)/2 + coda/2 : r.x*W;
  const base = r.y*H;
  let x = x0;
  setFont(c, tFont(r), r.titleWeight, tPx, tTrack(r));
  c.globalAlpha = r.titleOp; c.fillStyle = r.color;
  /* piu' righe: l'ultima resta sulla linea di base, le altre salgono sopra */
  const lines = titleLines(title);
  const lh = tPx*(r.lineGap!==undefined ? r.lineGap : 1.14);
  lines.forEach((l, i)=>{
    c.fillText(l, x, base - (lines.length-1-i)*lh);
  });
  x += lines.length ? c.measureText(lines[lines.length-1]).width : 0;

  const sepH = r.sepH*tPx, sepW = Math.max(1, r.sepW*iPx) * sepFattore(r.sepShape);
  [cat, brand].filter(t=>t.length>0).forEach((pt, iPezzo)=>{
    /* niente barretta prima del primo pezzo se non c'e' un titolo davanti */
    if(r.sepOn && (lines.length > 0 || iPezzo > 0)){
      x += gap;
      c.globalAlpha = r.sepOp; c.fillStyle = r.color;
      const n = Math.max(1, Math.round(r.sepCount||1));
      const step = sepW*(1 + (r.sepSpace!==undefined ? r.sepSpace : 0.9));
      for(let i=0;i<n;i++) drawSep(c, r, x + i*step, base-sepH*0.92, sepW, sepH);
      x += sepW + (n-1)*step;
    }
    x += gap;
    setFont(c, iFont(r), r.itemWeight, iPx, iTrack(r));
    c.globalAlpha = r.itemOp; c.fillStyle = iColor(r);
    c.fillText(pt, x, base);
    x += c.measureText(pt).width;
  });
  c.restore();
  const extra = Math.max(0, lines.length-1)*lh;
  return {x:x0, y:base-tPx*0.82-extra, w:x-x0, h:tPx*1.06+extra};
}

/* ==========================================================================
   LIVELLI LIBERI
   Al posto di Shape 1/2/3 fissi: una lista a cui si aggiunge quello che
   serve, forme o testi, in qualsiasi numero e in qualsiasi ordine. Ogni
   livello si puo' mettere sotto o sopra il testo principale, spostare
   nella pila, duplicare, rinominare e spegnere.
   ========================================================================== */
let LAYER_SEQ = 0;
function newLayerId(){ LAYER_SEQ++; return 'ly' + LAYER_SEQ + '-' + (LAYER_SEQ*2654435761 % 99991); }

function layerDefaults(type, name){
  const base = Object.assign({
    id:newLayerId(), type:type, name:name || (type==='shape' ? 'Shape' : 'Text'),
    on:true, front:false, x:0.06, y:0.10, w:0.24, h:0.10, rot:0, opacity:1
  }, shadowDefaults());
  if(type==='shape') Object.assign(base, {
    kind:'panel', mode:'fill', color:C.accentA2, strokeColor:C.accentA2,
    thick:0.08, cut:0.25, cuts:'top-right + bottom-left',
    skew:0.3, count:5, ratio:0.4, armX:0.35, armY:0.5,
    gradOn:false, color2:C.accentB2, gradAngle:0
  });
  /* La griglia: un livello solo che disegna N riquadri uguali, uno per
     riga scritta nel campo testo. Serve a elencare le cose che il pacco
     contiene sull'Asset page, dove nove riquadri messi a mano sarebbero
     nove livelli da spostare uno per uno. */
  if(type==='grid') Object.assign(base, {
    x:0.06, y:0.10, w:0.42, h:0.34,
    cols:3, rows:3, autoRows:true, rowH:0.135, gap:0.02,
    text:'Feature one\nFeature two\nFeature three\nFeature four\nFeature five\n' +
         'Feature six\nFeature seven\nFeature eight\nFeature nine',
    mode:'both', color:'#0b0b0b', cellOpacity:0.72,
    strokeColor:C.accentA2, thick:0.04, cut:0.18, cuts:'top-right + bottom-left',
    gradOn:false, color2:C.accentB2, gradAngle:0,
    font:'Turret Road', weight:'500', size:0.028, track:0.02,
    textColor:'#efefef', align:'center', upper:false, lineGap:1.12,
    padX:0.5, padY:0.4, numbered:false
  });
  if(type==='text') Object.assign(base, {
    text:'NEW TEXT', font:'Turret Road', weight:'700', size:0.06, track:0.02,
    color:'#ffffff', align:'left', upper:false, lineGap:1.14,
    gradOn:false, color2:C.accentB2, gradAngle:0,
    boxOn:false, boxColor:'#0b0b0b', boxOpacity:0.85,
    boxPadX:0.45, boxPadY:0.3, boxCut:0.2, boxCuts:'none',
    boxStrokeOn:false, boxStrokeColor:C.accentA2, boxThick:0.05
  });
  return base;
}

/* i campi mancanti (preset vecchi) vengono riempiti dai default del tipo */
function fixLayer(l){
  const t = (l.type==='text' || l.type==='grid') ? l.type : 'shape';
  const d = layerDefaults(t, l.name);
  const out = Object.assign(d, l);
  if(!out.id) out.id = newLayerId();
  return out;
}

function layersOf(L){ if(!Array.isArray(L.layers)) L.layers = []; return L.layers; }

/* --------------------------------------------------------- disegno testo */
/* I livelli di testo accettano gli stessi segnaposto dei nomi dei file:
   scrivendo {title} il livello segue i dati del pack. Quello che non e' un segnaposto valido
   resta scritto com'e', se no non si potrebbe piu' scrivere una graffa. */
let FMT_CORRENTE = null;
function testoConSegnaposto(t){
  const str = String(t||'');
  if(str.indexOf('{') < 0) return str;
  const shim = FMT_CORRENTE || FORMATS.find(x=>x.id===state.active) || FORMATS[0];
  /* l'anteprima disegna in scala ridotta: {w} e {h} devono dire la misura
     vera del formato, se no a schermo si legge un numero e nel file un altro */
  const f = FORMATS.find(x=> x.id===shim.id) || shim;
  const mis = sizeOf(f);
  const d = new Date();
  const map = {title:state.pack.title, category:state.pack.category,
               brand:state.pack.brand, version:state.pack.version,
               badges:state.pack.badges,
               platform:String(f.group||'').split(' ')[0], format:f.name,
               w:mis.w, h:mis.h,
               date:d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())};
  return str.replace(/\{(\w+)\}/g, (m,k)=> map[k]!==undefined ? String(map[k]) : m);
}
function drawTextLayer(c, W, H, o){
  const px = Math.max(2, o.size*H);
  const lines = testoConSegnaposto(o.text).split('\n');
  const txt = lines.map(t => o.upper ? t.toUpperCase() : t);
  setFont(c, o.font, o.weight, px, o.track);
  const lh = px * (o.lineGap===undefined ? 1.14 : o.lineGap);
  let wide = 0;
  txt.forEach(t => { wide = Math.max(wide, c.measureText(t).width); });
  const totH = (txt.length-1)*lh + px;
  const x = o.x*W, y = o.y*H;
  /* x,y e' l'angolo in alto a sinistra del blocco di testo */
  let bx = x, by = y;
  c.save();
  c.globalAlpha = o.opacity;
  if(o.rot){
    c.translate(bx+wide/2, by+totH/2);
    c.rotate(o.rot*Math.PI/180);
    c.translate(-(bx+wide/2), -(by+totH/2));
  }
  if(o.boxOn){
    const padX = px*(o.boxPadX===undefined?0.45:o.boxPadX);
    const padY = px*(o.boxPadY===undefined?0.3:o.boxPadY);
    const bw = wide + padX*2, bh = totH + padY*2;
    const sh = shadowOn(c, o, W, H);
    c.fillStyle = o.gradOn && o.color2 ? boxGradient(c, o, bx-padX, by-padY, bw, bh) : o.boxColor;
    c.globalAlpha = o.opacity * (o.boxOpacity===undefined?0.85:o.boxOpacity);
    cutCornerPath(c, bx-padX, by-padY, bw, bh, px*(o.boxCut||0), o.boxCuts||'none');
    c.fill();
    c.globalAlpha = o.opacity;
    if(o.boxStrokeOn){
      c.strokeStyle = o.boxStrokeColor;
      c.lineWidth = Math.max(1, (o.boxThick||0.05)*px);
      c.lineJoin='miter'; c.miterLimit=8;
      cutCornerPath(c, bx-padX, by-padY, bw, bh, px*(o.boxCut||0), o.boxCuts||'none');
      c.stroke();
    }
    shadowOff(c, sh);
  }
  const sh2 = o.boxOn ? false : shadowOn(c, o, W, H);
  setFont(c, o.font, o.weight, px, o.track);
  c.textBaseline = 'alphabetic';
  c.textAlign = 'left';
  c.fillStyle = (!o.boxOn && o.gradOn && o.color2)
    ? boxGradient(c, o, bx, by, wide, totH) : o.color;
  txt.forEach((t,i)=>{
    let tx = bx;
    if(o.align==='center') tx = bx + (wide - c.measureText(t).width)/2;
    if(o.align==='right')  tx = bx + (wide - c.measureText(t).width);
    c.fillText(t, tx, by + px*0.82 + i*lh);
  });
  shadowOff(c, sh2);
  c.restore();
  return {x:bx, y:by, w:wide, h:totH};
}

/* ------------------------------------------------------- disegno griglia */
/* Manda a capo un testo dentro una larghezza data, con le parole intere.
   Una parola piu' larga della cella resta su una riga sua: tagliarla a
   meta' sarebbe peggio che farla sporgere di poco. */
function aCapo(c, testo, largo){
  const parole = String(testo).split(/\s+/).filter(Boolean);
  if(!parole.length) return [''];
  const righe = [];
  let cur = parole[0];
  for(let i=1;i<parole.length;i++){
    const prova = cur + ' ' + parole[i];
    if(c.measureText(prova).width <= largo) cur = prova;
    else { righe.push(cur); cur = parole[i]; }
  }
  righe.push(cur);
  return righe;
}

/* Quante file e quanto e' alta la griglia. Due modi:
   - file dal testo: si conta quante voci ci sono, l'altezza di una fila la
     decidi tu e la griglia cresce verso il basso man mano che scrivi;
   - file fisse: decidi tu quante file e quanto e' alto tutto il blocco, e
     le caselle si dividono quello spazio. */
function grigliaMisure(o, W, H){
  const cols = Math.max(1, Math.round(o.cols||3));
  const voci = testoConSegnaposto(o.text).split('\n')
                 .map(t=> t.trim()).filter(t=> t.length);
  const gapW = Math.max(0, (o.gap===undefined?0.02:o.gap));
  if(o.autoRows){
    const righe = Math.max(1, Math.ceil(voci.length/cols));
    const rh = o.rowH===undefined ? 0.135 : o.rowH;
    /* Il vuoto fra le caselle e' misurato sulla larghezza, quindi per
       sommarlo all'altezza va riportato in frazione di altezza: serve il
       rapporto della tela. */
    const k = (W && H) ? W/H : 1;
    return {cols, righe, voci, gapW, alt: righe*rh + gapW*o.w*k*(righe-1)};
  }
  return {cols, righe: Math.max(1, Math.round(o.rows||3)), voci, gapW, alt: o.h};
}

function drawGridLayer(c, W, H, o){
  if(!o.on) return null;
  const m = grigliaMisure(o, W, H);
  const gw = o.w*W, gh = m.alt*H, gx = o.x*W, gy = o.y*H;
  if(gw <= 0 || gh <= 0) return null;
  const cols = m.cols, righe = m.righe, voci = m.voci;
  const gap = m.gapW * gw;
  const cw = (gw - gap*(cols-1))/cols;
  const chh = (gh - gap*(righe-1))/righe;
  if(cw <= 1 || chh <= 1) return {x:gx, y:gy, w:gw, h:gh};

  const px = Math.max(2, (o.size||0.028)*H);
  const padX = px*(o.padX===undefined?0.5:o.padX);
  const padY = px*(o.padY===undefined?0.4:o.padY);
  const lh = px*(o.lineGap===undefined?1.12:o.lineGap);

  c.save();
  c.globalAlpha = o.opacity===undefined ? 1 : o.opacity;
  if(o.rot){
    c.translate(gx+gw/2, gy+gh/2);
    c.rotate(o.rot*Math.PI/180);
    c.translate(-(gx+gw/2), -(gy+gh/2));
  }
  const sh = shadowOn(c, o, W, H);
  const modo = o.mode || 'both';
  const quante = Math.min(voci.length, cols*righe);
  for(let i=0;i<quante;i++){
    const cx = gx + (i%cols)*(cw+gap);
    const cy = gy + Math.floor(i/cols)*(chh+gap);
    const taglio = (o.cut||0) * Math.min(cw, chh) * 0.5;
    if(modo==='fill' || modo==='both'){
      c.fillStyle = o.gradOn && o.color2
        ? boxGradient(c, o, cx, cy, cw, chh) : o.color;
      const a = c.globalAlpha;
      c.globalAlpha = a * (o.cellOpacity===undefined?0.72:o.cellOpacity);
      cutCornerPath(c, cx, cy, cw, chh, taglio, o.cuts||'none');
      c.fill();
      c.globalAlpha = a;
    }
    if(modo==='stroke' || modo==='both'){
      c.strokeStyle = o.gradOn && o.color2
        ? boxGradient(c, o, cx, cy, cw, chh) : o.strokeColor;
      const lw = Math.max(1, (o.thick||0.04)*Math.min(cw, chh));
      c.lineWidth = lw;
      c.lineJoin = 'miter'; c.miterLimit = 8;
      /* il tratto sta meta' dentro e meta' fuori dal percorso: si rientra
         di meta' spessore, se no la griglia sborda dal riquadro che si
         sposta con il mouse e le caselle di bordo sono piu' grandi */
      cutCornerPath(c, cx+lw/2, cy+lw/2, cw-lw, chh-lw,
                    Math.max(0, taglio-lw/2), o.cuts||'none');
      c.stroke();
    }
    /* il testo della cella, a capo da solo e centrato in altezza */
    setFont(c, o.font, o.weight, px, o.track||0);
    const testo = o.upper ? voci[i].toUpperCase() : voci[i];
    const linee = aCapo(c, testo, Math.max(4, cw - padX*2));
    const totH = (linee.length-1)*lh + px;
    let ty = cy + (chh - totH)/2 + px*0.82;
    c.textBaseline = 'alphabetic';
    c.textAlign = 'left';
    c.fillStyle = o.textColor || '#efefef';
    linee.forEach(t=>{
      const larga = c.measureText(t).width;
      let tx = cx + padX;
      if(o.align==='center') tx = cx + (cw - larga)/2;
      if(o.align==='right')  tx = cx + cw - padX - larga;
      c.fillText(t, tx, ty);
      ty += lh;
    });
  }
  shadowOff(c, sh);
  c.restore();
  return {x:gx, y:gy, w:gw, h:gh};
}

/* --------------------------------------------------------- disegno lista */
let LAYER_BOXES = {};
function drawLayers(c, W, H, L, front){
  layersOf(L).forEach(raw=>{
    const o = raw;
    if(!o.on || !!o.front !== !!front) return;
    let box = null;
    if(o.type==='text') box = drawTextLayer(c, W, H, o);
    else if(o.type==='grid') box = drawGridLayer(c, W, H, o);
    else box = drawShape(c, W, H, o);
    if(box) LAYER_BOXES['lay:'+o.id] = box;
  });
  return null;
}

/* ------------------------------------------- riconoscimento della chiave */
function isLay(k){ return typeof k==='string' && k.slice(0,4)==='lay:'; }
function layById(id, L){
  const lay = layersOf(L || state.layouts[state.active]);
  return lay.find(x=> x.id===id) || null;
}
function layOfKey(k){ return isLay(k) ? layById(k.slice(4)) : null; }
function selLabel(k){
  if(isLay(k)){ const l = layOfKey(k); return l ? l.name : 'Layer'; }
  if(k === 'shot'){
    const S = state.layouts[state.active].shot;
    if(Math.round(S.panels||1) > 1) return 'Screenshot, panel ' + (pannelloAttivo(S)+1);
  }
  return SEL_LABEL[k] || k;
}
function sizeKeyOf(k){
  if(!isLay(k)) return SIZE_KEY[k];
  const l = layOfKey(k);
  /* un livello di testo non ha una larghezza propria: quella la decide il
     testo stesso. La maniglia deve agire sul corpo del carattere. */
  return (l && l.type==='text') ? 'size' : 'w';   /* forme e griglie: la larghezza */
}
function sizeMaxOf(k){
  if(!isLay(k)) return SIZE_MAX[k]||0.6;
  const l = layOfKey(k);
  return (l && l.type==='text') ? 0.5 : 1.6;
}
function posKeysOf(k){ return isLay(k) ? {x:'x', y:'y'} : (POS_KEYS[k]||{x:null,y:null}); }

/* ------------------------------------------------------------- comandi */
function layerAdd(type){
  pushUndo();
  const L = state.layouts[state.active];
  const list = layersOf(L);
  const n = list.filter(x=>x.type===type).length + 1;
  const etichetta = type==='shape' ? 'Shape ' : (type==='grid' ? 'Grid ' : 'Text ');
  const l = layerDefaults(type, etichetta+n);
  list.push(l);
  state.sel = 'lay:'+l.id;
  buildControls(); render();
  toast(l.name+' added');
}
function layerDelete(id){
  pushUndo();
  const L = state.layouts[state.active];
  const list = layersOf(L);
  /* se il livello fa parte di una selezione multipla se ne vanno tutti */
  const scelti = multiIds();
  const via = (scelti.length > 1 && scelti.indexOf(id) >= 0) ? scelti : [id];
  via.forEach(x=>{
    const i = list.findIndex(y=>y.id===x);
    if(i>=0) list.splice(i,1);
  });
  multiClear();
  if(via.indexOf(state.sel.slice(4)) >= 0) state.sel = list.length ? 'lay:'+list[0].id : 'row';
  buildControls(); render();
  if(via.length > 1) toast(via.length+' layers deleted');
}
function layerDup(id){
  pushUndo();
  const L = state.layouts[state.active];
  const list = layersOf(L);
  const scelti = multiIds();
  const quali = (scelti.length > 1 && scelti.indexOf(id) >= 0) ? scelti : [id];
  const nuovi = [];
  quali.forEach(x=>{
    const i = list.findIndex(y=>y.id===x);
    if(i<0) return;
    const copy = JSON.parse(JSON.stringify(list[i]));
    copy.id = newLayerId();
    copy.name = list[i].name + ' copy';
    copy.x = Math.min(1.2, copy.x + 0.02);
    copy.y = Math.min(1.2, copy.y + 0.02);
    list.push(copy);
    nuovi.push(copy.id);
  });
  if(nuovi.length){
    state.sel = 'lay:'+nuovi[0];
    selMulti = nuovi.slice(1);
  }
  buildControls(); render();
  if(nuovi.length > 1) toast(nuovi.length+' layers duplicated');
}
function layerMove(id, dir){
  const list = layersOf(state.layouts[state.active]);
  const i = list.findIndex(x=>x.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=list.length) return;   /* niente da fare, niente da annullare */
  pushUndo();
  const t = list[i]; list[i] = list[j]; list[j] = t;
  buildControls(); render();
}
/* copia i livelli di questo formato su tutti gli altri */
function layersToAll(){
  pushUndo();
  const src = layersOf(state.layouts[state.active]);
  FORMATS.forEach(f=>{
    if(f.id===state.active) return;
    state.layouts[f.id].layers = JSON.parse(JSON.stringify(src)).map(l=>{
      l.id = newLayerId(); return l;
    });
  });
  render();
  toast('Layers copied to every format');
}

/* i preset vecchi avevano shape1/2/3: li trasformo in livelli */
function migrateShapes(L){
  ['shape1','shape2','shape3'].forEach((k,i)=>{
    const o = L[k];
    if(!o || typeof o !== 'object') return;
    if(o.on){
      const l = layerDefaults('shape', 'Shape '+(i+1));
      Object.keys(o).forEach(kk=>{ if(kk!=='id' && kk!=='type' && kk!=='name') l[kk] = o[kk]; });
      l.type = 'shape';
      layersOf(L).push(l);
    }
    delete L[k];
  });
}

/* ====================================================== STATO E COSTRUZIONE */
const DRAW_ALL = PARTS.filter(p=>p.draw);
function ordOf(p, L){ return typeof p.order==='function' ? p.order(L) : p.order; }
function drawOrder(L){ return DRAW_ALL.slice().sort((a,b)=> ordOf(a,L)-ordOf(b,L)); }
let DRAW_PARTS = DRAW_ALL;
const SEL_PARTS  = PARTS.filter(p=>p.select);
const SEL_LABEL  = {}, SEL_SECTION = {}, SIZE_KEY = {}, SIZE_MAX = {}, POS_KEYS = {};
SEL_PARTS.forEach(p=>{
  SEL_LABEL[p.key]=p.label; SEL_SECTION[p.key]=p.section;
  SIZE_KEY[p.key]=p.size||null; SIZE_MAX[p.key]=p.sizeMax||0.6;
  POS_KEYS[p.key]=p.pos||{x:null,y:null};
});

function defLayout(f){
  const P = f.profile;
  const ctx = {f:f, big:P==='big', small:P==='small', tiny:P==='tiny',
               asset:P==='asset', mini:(P==='small'||P==='tiny'),
               fromPsd: FROM_PSD.indexOf(f.id)>=0};
  const k = FROM_PSD.indexOf(f.id)>=0 ? 1 : Math.max(0.35, Math.min(1, (f.w/f.h)/1.5));
  ctx.k = k;
  ctx.S = v => v*k;
  ctx.B = v => 1-(1-v)*k;
  const L = {on:true};
  if(f.sizes) L.res = f.sizes[0][2];
  PARTS.forEach(p=>{
    if(!p.defaults) return;
    const d = p.defaults(ctx);
    /* i valori dell'elemento vincono su quelli dell'ombra, che sono solo
       il punto di partenza */
    L[p.key] = SHADOW_PARTS.indexOf(p.key)>=0 ? Object.assign(shadowDefaults(), d) : d;
  });
  L.layers = [];
  migraPannelli(L);

  /* Il logo e' un quadrato: la sua misura viene dall'altezza, mentre la
     partenza del testo e della barra sono frazioni della larghezza. Sui
     formati larghi e bassi come Social 1200x630 le due cose divergono e il
     logo resta staccato dalla linea. Qui, sui formati che il PSD non ha,
     ricavo la partenza del testo e della barra dal bordo destro del logo,
     tenendo lo stesso rapporto che ha la Cover. */
  if(!ctx.fromPsd && L.logo && L.row && L.accent){
    const lw = L.logo.size*f.h/f.w;         /* larghezza del logo, in frazione */
    const destra = L.logo.x + lw;
    const VUOTO = 0.46;                     /* rapporto vuoto/logo della Cover */
    L.row.x = destra + lw*VUOTO;
    if(L.row.x2 !== undefined) L.row.x2 = L.row.x;
    L.accent.x0 = destra - lw*0.022;        /* la barra parte dal logo */
  }

  /* STORIE 9:16: LA ZONA CHE L'APP COPRE
     Su una storia l'app mette la sua roba sopra la grafica: in alto la barra
     del profilo, in basso il campo per rispondere e i bottoni di condivisione.
     Le misure che valgono per un 1080x1920 sono circa 250 px in alto e 340 in
     basso. Con l'impaginazione delle altre grafiche, titolo, logo e versione
     finivano tutti li' sotto: c'erano ma non si vedevano. Qui il blocco in
     basso sale sopra quella fascia, e i badge scendono sotto quella in alto.
     La fascia scura resta attaccata al fondo, cosi' il fondo non resta
     scoperto: e' un fondale, non e' roba da leggere. */
  if(f.h > f.w*1.6){
    const suBasso = 340/1920, giuAlto = 250/1920;
    const su = k => { if(L[k] && typeof L[k].y === 'number') L[k].y -= suBasso; };
    ['row','logo','version','accent'].forEach(su);
    if(L.row && typeof L.row.y2 === 'number') L.row.y2 -= suBasso;
    if(L.band) L.band.top = Math.max(0.2, L.band.top - suBasso);
    if(L.badges && typeof L.badges.y === 'number')
      L.badges.y = Math.max(L.badges.y, giuAlto + 0.01);
  }
  return L;
}

/* Ombra su tutto: aggiungo i sei controlli in coda a ogni elemento che ha
   un pannello, e i valori di partenza al suo layout. Il disegno vero e'
   gestito da renderTo, che accende l'ombra prima di chiamare il draw. */
const SHADOW_PARTS = ['band','accent','logo','row','version','badges','frame','grad'];
PARTS.forEach(p=>{
  if(SHADOW_PARTS.indexOf(p.key)>=0 && p.rows) p.rows = p.rows.concat(shadowRows(p.key));
});

/* elenco di tutti i campi colore, ricavato dalle righe del pannello */
const COLOR_PATHS = [];
PARTS.forEach(p=>{ (p.rows||[]).forEach(r=>{ if(r.type==='color') COLOR_PATHS.push(r.p); }); });

function isChromatic(hex){
  const n = parseInt(String(hex).replace('#',''),16);
  if(isNaN(n)) return false;
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return (Math.max(r,g,b) - Math.min(r,g,b)) > 18;
}

/* sostituisce in un colpo solo tutti i colori non grigi, su tutti i formati */
/* ------------------------------------------------------------ colori HSL
   Servono per cambiare tutta la tinta in un colpo senza appiattire i
   gradienti: sposto la tonalita' di ogni colore della stessa quantita',
   invece di riscrivere tutti i colori uguali. */
function hex2hsl(hex){
  let n = parseInt(String(hex).replace('#',''),16);
  if(isNaN(n)) return {h:0,s:0,l:0};
  const r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d>0){
    if(mx===r) h = ((g-b)/d) % 6;
    else if(mx===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if(h<0) h += 360;
  }
  const l = (mx+mn)/2;
  const sat = d===0 ? 0 : d/(1-Math.abs(2*l-1));
  return {h:h, s:Math.min(1,sat), l:l};
}
function hsl2hex(h,s,l){
  h = ((h%360)+360)%360; s = Math.max(0,Math.min(1,s)); l = Math.max(0,Math.min(1,l));
  const c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  const to = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+to(r)+to(g)+to(b);
}

/* Ricolora tutto quello che non e' un grigio. Il colore scelto viene messo
   esatto dove c'era il colore guida di prima; tutti gli altri colori
   (il secondo capo dei gradienti, le varianti piu' calde) vengono ruotati
   della stessa quantita', cosi' i gradienti restano gradienti. */
/* gli ultimi colori usati davvero: ritrovare la tinta di ieri senza
   ripescarla ogni volta dal selettore di sistema */
let COLORI_USATI = [];
function ricordaColore(hex){
  const c = String(hex||'').toLowerCase();
  if(!/^#[0-9a-f]{6}$/.test(c)) return;
  COLORI_USATI = [c].concat(COLORI_USATI.filter(x=> x !== c)).slice(0, 8);
}
function applyAccent(hex, onlyCurrent){
  ricordaColore(hex);
  const ids = onlyCurrent ? [state.active] : FORMATS.map(f=>f.id);
  const A = hex2hsl(C.accentA2);        /* il colore guida di serie */
  const B = hex2hsl(hex);
  const dh = B.h - A.h;
  const ds = A.s > 0.02 ? B.s / A.s : 1;
  const dl = B.l - A.l;
  const same = (a,b) => String(a).toLowerCase() === String(b).toLowerCase();
  const shift = v => {
    if(same(v, C.accentA2)) return hex;
    const c = hex2hsl(v);
    return hsl2hex(c.h + dh, c.s * ds, Math.max(0.04, Math.min(0.96, c.l + dl*0.5)));
  };
  let n = 0;
  ids.forEach(id=>{
    const L = state.layouts[id];
    const f = FORMATS.find(x=>x.id===id);
    if(!L || !f) return;
    /* la tavolozza di partenza di questo formato: e' da li' che calcolo,
       non dai colori che ci sono adesso */
    const def = defLayout(f);
    COLOR_PATHS.forEach(path=>{
      const i = path.lastIndexOf('.');
      const grp = path.slice(0,i), key = path.slice(i+1);
      if(grp==='pack' || !L[grp] || !def[grp]) return;
      const base = def[grp][key];
      if(base === undefined || !isChromatic(base)) return;   /* i grigi mai */
      L[grp][key] = shift(base);
      n++;
    });
    /* i livelli non hanno un default: la prima volta mi segno i loro
       colori di partenza, poi calcolo sempre da quelli */
    layersOf(L).forEach(l=>{
      if(!l.cBase){
        l.cBase = {};
        ['color','color2','strokeColor','boxColor','boxStrokeColor'].forEach(k=>{
          if(l[k]) l.cBase[k] = l[k];
        });
      }
      Object.keys(l.cBase).forEach(k=>{
        if(!isChromatic(l.cBase[k])) return;
        l[k] = shift(l.cBase[k]);
        n++;
      });
    });
  });
  /* la coppia del gradiente e' un colore del tema come gli altri: se non
     ruotasse anche lei, spostare l'Accent lascerebbe indietro tutto quello
     che segue il tema invece di ridipingerlo */
  state.theme.gradA = shift(C.accentA2);
  state.theme.gradB = shift(C.accentB2);
  state.theme.accentRef = hex;
  state.theme.accent = hex;
  return n;
}

function renderTo(c, f, L, preview){
  FMT_CORRENTE = f;                 /* serve ai segnaposto nei livelli di testo */
  const W = f.w, H = f.h;
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1; c.globalCompositeOperation='source-over'; c.filter='none';
  c.clearRect(0,0,W,H);
  c.fillStyle = '#000'; c.fillRect(0,0,W,H);
  const boxes = {};
  LAYER_BOXES = {};
  DRAW_PARTS = drawOrder(L);
  DRAW_PARTS.forEach(p=>{
    const cfg = L[p.key];
    const sh = shadowOn(c, cfg, W, H);
    const b = p.draw(c, W, H, L, preview);
    shadowOff(c, sh);
    if(p.select) boxes[p.key] = b;
  });
  Object.assign(boxes, LAYER_BOXES);
  return boxes;
}

   Le cose che si toccano di continuo mentre si lavora sull'immagine stanno
   qui, non in una sezione del pannello a destra.

  const bar = document.getElementById('tools');
  if(!bar) return;
  bar.innerHTML = '';
  const mk = (ic, label, title, onclick, isOn) => {

               b.appendChild(sp); }

    b.onclick = onclick;
    bar.appendChild(b);
    return b;
  };
  const sep = ()=>{ const d = document.createElement('div'); d.className='tsep'; bar.appendChild(d); };

  const u = mk('undo','Undo','Undo the last change. Ctrl+Z', undo);
  const r = mk('redo','Redo','Redo what you just undid. Ctrl+Shift+Z, or Ctrl+Y', redo);

  sep();
  mk('magnet2','Snap','Snap to the margins, the middle of the canvas and the other elements, by their edge or by their centre. Hold Alt while dragging to skip it once. Key: G', ()=>{
    state.snap.on = !state.snap.on; buildTools(); syncControls();
  }, state.snap.on);
  mk('grid','Grid','Show a grid over the canvas', ()=>{
    showGrid = !showGrid; buildTools(); render();
  }, showGrid);
  mk('wheel','Wheel','Mouse wheel resizes the selection instead of zooming the canvas', ()=>{
    wheelResize = !wheelResize; buildTools();
  }, wheelResize);
  sep();
  /* "Fit" qui accanto ai comandi dello zoom si leggeva come "adatta la tela
     alla finestra", che e' un'altra cosa: questo rimette a posto lo
     screenshot dentro la grafica */

    pushUndo();
    const S = state.layouts[state.active].shot, i = pannelloAttivo(S);
    Object.keys(PANNELLO_ZERO).forEach(k=>{ S[k][i] = PANNELLO_ZERO[k]; });
    buildControls(); render();
  });
  mk('reset','Reset','Reset this format to its default layout, screenshot panels included. Ctrl+Z brings it back', ()=>{
    pushUndo();
    const f = FORMATS.find(x=>x.id===state.active);
    const keep = state.layouts[f.id].on;
    state.layouts[f.id] = defLayout(f);

    centerRowInBand(false, true);
    buildControls(); render();

  sep();
  mk(selLocked ? 'lock' : 'unlock','Lock','Lock the selection: clicking will not switch element. Key: L',
     ()=>{ selLocked = !selLocked; HOVER = null; buildTools(); render();
           toast(selLocked ? 'Selection locked on ' + selLabel(state.sel)
                           : 'Selection unlocked'); }, selLocked);
  sep();
  mk('zout','','Zoom out of the canvas. The mouse wheel does the same', ()=> zoomStep(-1));
  mk('','100%','Fit the whole canvas in the window. Key: 0. The number is the real scale you are looking at: 100% means one canvas pixel on one screen pixel',
     ()=>{ viewFit(); }).id = 'bZoom';
  mk('zin','','Zoom into the canvas to work on small details. Mouse wheel, or key +',
     ()=> zoomStep(1));
  sep();

     ()=> runAction('compareShow'), compareMode);

     con lei, la prossima misura le rimette se servono */

}

/* ==========================================================================
   ZOOM E SPOSTAMENTO DELLA TELA
   Ingrandire non stira quello che e' gia' stato disegnato: la tela viene
   ridisegnata piu' grande, come quando si zooma in Photoshop su un
   documento grande. Cosi' a zoom tre si vede piu' dettaglio, non i pixel
   dell'anteprima ingranditi. Il limite e' la misura vera del formato:
   arrivati li' non c'e' altro da mostrare e si vedono i pixel veri
   dell'export, netti e quadrati.
   Il disegno buono costa, quindi mentre si trascina o si gira la rotellina
   si usa la risoluzione di sempre e quello nitido arriva un attimo dopo,
   quando la mano si ferma: la reattivita' non cambia.
   Lo spostamento resta una traslazione CSS, che non costa niente.
   ========================================================================== */
const cvwrap = document.getElementById('cvwrap');
let view = {z:1, tx:0, ty:0};
const ZOOM_MAX = 8;
/* Si puo' anche rimpicciolire sotto la misura che entra nella finestra:
   serve per vedere la grafica con un po' d'aria attorno, e prima il
   bottone "meno" non faceva niente finche' non si era ingrandito. */
const ZOOM_MIN = 0.2;
/* tetto di pixel per un disegno nitido: oltre non si guadagna niente che
   valga il tempo speso */
const BUDGET_VISTA = 4.6e6;
const SCALINI_VISTA = [0.5, 0.65, 0.8, 1];
let vistaNitida = false, nitidoTimer = null;
/* Uno schermo fitto ha piu' pixel veri di quelli che il CSS conta. Si tiene
   il conto fino a due: oltre il guadagno non si vede e il disegno costa. */
function dprVista(){
  const d = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  return Math.max(1, Math.min(2, d));
}

/* Quanto spazio c'e' per la tela, in pixel di schermo. */
function spazioTela(){
  const st = document.getElementById('stage');
  if(!st) return {w:900, h:600};
  const tb = document.getElementById('tools');
  const sb = st.querySelector('.stagebar');
  const w = Math.max(120, st.clientWidth - 34);
  const h = Math.max(120, st.clientHeight - (tb?tb.offsetHeight:0)
                          - (sb?sb.offsetHeight:0) - 46);
  return {w, h};
}
/* Le tre misure che contano: quanto grande sta a schermo (dispW/dispH),
   a che risoluzione conviene disegnarla (rw/rh) e a quale scala reale
   la si sta guardando (fit*z, la percentuale che si legge sul bottone). */
function misureVista(f, nitido){
  const vera = sizeOf(f);
  const sp = spazioTela();
  /* il bordo di un pixel per lato fa parte dell'ingombro, piu' un filo di
     margine perche' la barra sotto la tela puo' andare a capo */
  let fit = Math.min((sp.w-6)/vera.w, (sp.h-6)/vera.h);
  /* i formati piccoli si mostrano ingranditi di un numero intero di volte,
     cosi' i pixel restano quadrati */
  fit = fit >= 2 ? Math.min(6, Math.floor(fit)) : Math.min(1, fit);
  const dispW = vera.w * fit * view.z, dispH = vera.h * fit * view.z;
  /* risoluzione di partenza: quella di sempre */
  const k0 = Math.min(1, PREVIEW_MAX/Math.max(vera.w, vera.h));
  let rw = Math.max(2, Math.round(vera.w*k0));
  /* Quanti pixel veri di schermo occupa la tela: su uno schermo fitto (o con
     l'ingrandimento di Windows) sono piu' di quelli del CSS, e disegnare al
     numero del CSS si vedrebbe sfocato. */
  const bisogno = Math.min(vera.w, Math.ceil(dispW*dprVista()));
  if(nitido && bisogno > rw + 1){
    /* Si sale a scalini invece che di continuo: due zoom vicini chiedono lo
       stesso disegno, che quindi si ritrova gia' fatto invece di rifarlo.
       Si prende il primo scalino che basta, mai uno sotto: uno sotto
       sarebbe di nuovo sfocato, e il motivo per rifare il disegno era
       proprio quello. */
    const serve = Math.min(1, bisogno/vera.w);
    let k = SCALINI_VISTA.find(v=> v >= serve - 0.001);
    if(k === undefined) k = 1;
    const tetto = Math.min(1, Math.sqrt(BUDGET_VISTA/(vera.w*vera.h)));
    rw = Math.max(rw, Math.min(vera.w, Math.round(vera.w*Math.min(k, tetto))));
  }
  const rh = Math.max(2, Math.round(rw * vera.h / vera.w));
  return {vera, fit, dispW, dispH, rw, rh, scala: fit*view.z};
}
/* Quando la mano si ferma, un disegno alla risoluzione che lo schermo sta
   davvero mostrando: quella dello zoom, o quella dei pixel fitti. */
function chiediNitido(){
  if(nitidoTimer){ clearTimeout(nitidoTimer); nitidoTimer = null; }
  if(vistaNitida || compareMode) return;
  const f = FORMATS.find(x=>x.id===state.active);
  if(!f) return;
  if(misureVista(f, true).rw <= PW + 1) return;   /* non c'e' altro da vedere */
  nitidoTimer = setTimeout(()=>{
    nitidoTimer = null;
    vistaNitida = true;
    try{ render(); } finally { vistaNitida = false; }
  }, 150);
}
function clampPan(){
  const r = cvwrap.getBoundingClientRect();
  const mx = Math.max(0, (cv.offsetWidth  - r.width )/2);
  const my = Math.max(0, (cv.offsetHeight - r.height)/2);
  view.tx = Math.max(-mx, Math.min(mx, view.tx));
  view.ty = Math.max(-my, Math.min(my, view.ty));
}
function applyView(){
  cv.style.transform = (!view.tx && !view.ty)
    ? '' : 'translate('+view.tx.toFixed(1)+'px,'+view.ty.toFixed(1)+'px)';
  const bt = document.getElementById('bZoom');
  if(bt){
    const sp = bt.querySelector('span');
    const f = FORMATS.find(x=>x.id===state.active);
    if(sp) sp.textContent = f ? Math.round(misureVista(f, false).scala*100)+'%' : '100%';
    bt.classList.toggle('on', view.z !== 1);
  }
}
/* dopo un cambio di zoom: nuova misura della tela, poi limiti e traslazione */
function aggiornaVista(){
  adattaTela();
  clampPan();
  applyView();
}
function viewFit(){ view = {z:1, tx:0, ty:0}; aggiornaVista(); }
/* Da ingranditi meta' tela sta fuori: se scelgo un elemento che non si
   vede, la tela ci va sopra da sola. Senza questo, cliccare un elemento
   nell'elenco a destra sembrerebbe non fare niente. */
let vistaSel = null;
function mostraSelezione(forza){
  if(view.z <= 1){ vistaSel = state.sel; return; }
  if(!forza && vistaSel === state.sel) return;
  vistaSel = state.sel;
  const b = (state.sel==='shot') ? {x:0,y:0,w:PW,h:PH} : BOXES[state.sel];
  if(!b) return;
  const r = cv.getBoundingClientRect(), w = cvwrap.getBoundingClientRect();
  const cx = r.left + (b.x+b.w/2)/PW*r.width;
  const cy = r.top  + (b.y+b.h/2)/PH*r.height;
  const dentro = cx > w.left+10 && cx < w.right-10 && cy > w.top+10 && cy < w.bottom-10;
  if(dentro) return;
  view.tx += (w.left + w.width/2) - cx;
  view.ty += (w.top  + w.height/2) - cy;
  clampPan(); applyView();
}
/* ingrandisce tenendo fermo il punto sotto il cursore */
function zoomAt(cx, cy, fattore){
  const r = cvwrap.getBoundingClientRect();
  const dx = cx - (r.left + r.width/2);
  const dy = cy - (r.top  + r.height/2);
  const nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, view.z * fattore));
  if(Math.abs(nz - view.z) < 1e-6) return;
  const k = nz / view.z;
  view.tx = dx - (dx - view.tx)*k;
  view.ty = dy - (dy - view.ty)*k;
  view.z = nz;
  /* sotto il 100% la tela sta tutta nella finestra: non c'e' niente da
     spostare e tenerla decentrata sembrerebbe un difetto */
  if(view.z <= 1){ view.tx = 0; view.ty = 0; }
  aggiornaVista();
}
function zoomStep(dir){
  const r = cvwrap.getBoundingClientRect();
  zoomAt(r.left + r.width/2, r.top + r.height/2, dir > 0 ? 1.25 : 1/1.25);
}
/* La rotellina ingrandisce la tela, come in qualsiasi programma di
   disegno, tenendo fermo il punto sotto il cursore. Alt resta il
   ridimensionamento dell'elemento scelto, e Ctrl fa lo zoom anche lui
   perche' e' l'abitudine di molti: prevenendolo qui, Chrome non ingrandisce
   piu' tutta la pagina mentre si lavora.
   Prima serviva Ctrl per forza, e sulla tela la rotellina da sola non
   faceva niente: la pagina non scorre comunque, quindi era un gesto
   sprecato. */
let wheelTimer = null;
/* Il gesto vale su tutta l'area di lavoro, non solo sopra la tela: la
   cornice della tela si stringe addosso al disegno, quindi rimpicciolendo
   restava una fascia larga in cui la rotellina non faceva piu' niente. */
(document.getElementById('stage') || cvwrap).addEventListener('wheel', e=>{
  /* Alt, o il bottone "Wheel" acceso, ridimensiona l'elemento scelto
     invece di ingrandire la tela. Il gesto vale su tutta l'area di lavoro
     e non solo sopra la tela: rimpicciolita, la tela lascia scoperta
     mezza finestra e li' la rotellina sembrava morta. */
  if(e.altKey || wheelResize){
    const k = state.sel, sk = sizeKeyOf(k);
    if(!sk) return;
    /* un solo passo di undo per gesto continuo di rotellina */
    if(wheelTimer===null) pushUndo();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(()=>{ wheelTimer = null; }, 450);
    const el = elOf(k);
    el[sk] = clamp(el[sk] * (e.deltaY>0?0.96:1.04), 0.002, sizeMaxOf(k));
    syncControls(); render(); e.preventDefault();
    return;
  }
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18);
}, {passive:false});

/* spostamento: tasto centrale, oppure barra spaziatrice tenuta premuta */
let spazio = false, panFrom = null;
cvwrap.addEventListener('mousedown', e=>{
  if(e.button !== 1 && !(spazio && e.button === 0)) return;
  if(view.z <= 1) return;
  e.preventDefault(); e.stopPropagation();
  panFrom = {x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty};
  cvwrap.classList.add('panning');
}, true);
window.addEventListener('mousemove', e=>{
  if(!panFrom) return;
  view.tx = panFrom.tx + (e.clientX - panFrom.x);
  view.ty = panFrom.ty + (e.clientY - panFrom.y);
  clampPan(); applyView();
});
window.addEventListener('mouseup', ()=>{
  if(!panFrom) return;
  panFrom = null; cvwrap.classList.remove('panning');
});

/* griglia di controllo sopra la tela, solo in anteprima */
let showGrid = false;
function drawGrid(c, W, H){
  if(!showGrid) return;
  const step = Math.round(Math.min(W,H)/12);
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.13)';
  c.lineWidth = 1;
  for(let x=step; x<W; x+=step){ c.beginPath(); c.moveTo(x+0.5,0); c.lineTo(x+0.5,H); c.stroke(); }
  for(let y=step; y<H; y+=step){ c.beginPath(); c.moveTo(0,y+0.5); c.lineTo(W,y+0.5); c.stroke(); }
  c.strokeStyle = 'rgba(255,255,255,0.3)';
  c.beginPath(); c.moveTo(W/2,0); c.lineTo(W/2,H); c.stroke();
  c.beginPath(); c.moveTo(0,H/2); c.lineTo(W,H/2); c.stroke();
  c.restore();
}

/* ------------------------------------------------------------- selezione */
let BOXES = {};
/* Elemento sotto il cursore: si illumina prima del clic, cosi' si vede
   cosa si sta per prendere. Con tanti livelli sovrapposti indovinare
   a occhio non funziona. */
let HOVER = null;
/* Blocco della selezione: quando e' acceso il clic non cambia elemento,
   si continua a spostare quello scelto anche passando sopra agli altri. */
let selLocked = false;

/* ==========================================================================
   SELEZIONE A RIQUADRO
   Partendo da un punto vuoto della tela e trascinando si tira un rettangolo:
   al rilascio si prendono tutti i livelli che tocca. Con Ctrl o Shift si
   aggiungono a quelli gia' scelti invece di ricominciare.
   ========================================================================== */
let boxSel = null;
function drawBoxSel(c, W, H){
  if(!boxSel) return;
  const x = Math.min(boxSel.x0, boxSel.x1)*W, y = Math.min(boxSel.y0, boxSel.y1)*H;
  const w = Math.abs(boxSel.x1-boxSel.x0)*W, h = Math.abs(boxSel.y1-boxSel.y0)*H;
  if(w < 1 || h < 1) return;
  const u = Math.max(1, Math.min(W,H)*0.0018);
  c.save();
  c.fillStyle = 'rgba(255,255,255,0.10)';
  c.fillRect(x, y, w, h);
  c.setLineDash([u*5, u*4]);
  c.lineWidth = u*2.2; c.strokeStyle = 'rgba(0,0,0,0.55)';
  c.strokeRect(x, y, w, h);
  c.lineWidth = u; c.strokeStyle = 'rgba(255,255,255,0.9)';
  c.strokeRect(x, y, w, h);
  c.restore();
}
/* i livelli toccati dal rettangolo, dal piu' in basso al piu' in alto */
function livelliNelRiquadro(){
  if(!boxSel) return [];
  const x = Math.min(boxSel.x0, boxSel.x1)*PW, y = Math.min(boxSel.y0, boxSel.y1)*PH;
  const w = Math.abs(boxSel.x1-boxSel.x0)*PW, h = Math.abs(boxSel.y1-boxSel.y0)*PH;
  return layersOf(state.layouts[state.active]).filter(l=>{
    if(!l.on) return false;
    const b = BOXES['lay:'+l.id];
    if(!b) return false;
    return b.x < x+w && b.x+b.w > x && b.y < y+h && b.y+b.h > y;
  }).map(l=> l.id);
}

/* gli altri livelli della selezione: cornice piu' sottile, senza maniglia */
function drawMulti(c, W, H){
  if(multiCount() < 2) return;
  const primo = isLay(state.sel) ? state.sel.slice(4) : null;
  const u = Math.max(1, Math.min(W,H)*0.002), pad = u*3;
  c.save();
  c.setLineDash([u*4, u*4]);
  multiIds().forEach(id=>{
    if(id === primo) return;
    const b = BOXES['lay:'+id];
    if(!b) return;
    c.lineWidth = u*2.2; c.strokeStyle = 'rgba(0,0,0,0.5)';
    c.strokeRect(b.x-pad, b.y-pad, b.w+pad*2, b.h+pad*2);
    c.lineWidth = u; c.strokeStyle = 'rgba(255,255,255,0.85)';
    c.strokeRect(b.x-pad, b.y-pad, b.w+pad*2, b.h+pad*2);
  });
  c.restore();
}

function drawHover(c, W, H){
  if(!HOVER || HOVER === state.sel || dragging) return;
  const b = (HOVER === 'shot') ? {x:0, y:0, w:W, h:H} : BOXES[HOVER];
  if(!b) return;
  const u = Math.max(1, Math.min(W,H)*0.0018), pad = u*3;
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.42)';
  c.lineWidth = u*1.6;
  c.setLineDash([u*4, u*4]);
  c.strokeRect(b.x-pad, b.y-pad, b.w+pad*2, b.h+pad*2);
  c.restore();
}
function drawSelection(c, W, H){
  const b = (state.sel==='shot') ? {x:0,y:0,w:W,h:H} : BOXES[state.sel];
  if(!b) return;
  if(state.sel === 'shot'){
    const S = state.layouts[state.active].shot, n = Math.max(1, Math.round(S.panels||1));
    if(n > 1){
      const u = Math.max(1.2, Math.min(W,H)*0.0022);
      const poly = panelPoly(pannelloAttivo(S), n, W, H, S.slant||0, S.gap||0, S);
      c.save();
      polyPath(c, poly); c.clip();
      polyPath(c, poly);
      c.lineWidth = u*5; c.strokeStyle = 'rgba(0,0,0,0.55)'; c.setLineDash([u*5,u*4]); c.stroke();
      c.lineWidth = u*2.4; c.strokeStyle = '#fff'; c.stroke();
      c.restore();
    }
  }
  const u = Math.max(1.2, Math.min(W,H)*0.0022), pad = u*3;
  c.save();
  c.lineWidth = u*2.4; c.strokeStyle='rgba(0,0,0,0.55)';
  c.setLineDash([u*5,u*4]);
  c.strokeRect(b.x-pad, b.y-pad, b.w+pad*2, b.h+pad*2);
  c.lineWidth = u; c.strokeStyle='#fff';
  c.strokeRect(b.x-pad, b.y-pad, b.w+pad*2, b.h+pad*2);
  c.setLineDash([]);
  if(sizeKeyOf(state.sel)){
    const hs = u*7;
    const q = maniglia(W, H, b, u, hs);
    c.fillStyle='#fff'; c.strokeStyle='rgba(0,0,0,0.6)'; c.lineWidth=u*0.8;
    c.fillRect(q.x, q.y, hs, hs);
    c.strokeRect(q.x, q.y, hs, hs);
  }
  c.restore();
}
/* Posizione della maniglia dell'angolo. Se l'elemento sta appoggiato al
   bordo, la maniglia finirebbe fuori dalla tela e non si potrebbe piu'
   afferrare: in quel caso rientra e resta a portata di mouse. */
function maniglia(W, H, b, u, hs){
  const pad = u*3;
  return {x: Math.max(0, Math.min(W-hs, b.x+b.w+pad-hs/2)),
          y: Math.max(0, Math.min(H-hs, b.y+b.h+pad-hs/2))};
}
function handleRect(W, H){
  if(!sizeKeyOf(state.sel)) return null;
  const b = (state.sel==='shot') ? {x:0,y:0,w:W,h:H} : BOXES[state.sel];
  if(!b) return null;
  const u = Math.max(1.2, Math.min(W,H)*0.0022);
  const hs = u*7, presa = hs*2.2;
  const q = maniglia(W, H, b, u, hs);
  /* la zona da afferrare e' piu' larga del quadratino disegnato */
  return {x: q.x - (presa-hs)/2, y: q.y - (presa-hs)/2, w: presa, h: presa};
}
function hitTest(px, py){
  const inside = b => b && px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h;
  const lay = layersOf(state.layouts[state.active]).filter(l=>l.on);
  const front = lay.filter(l=>l.front), back = lay.filter(l=>!l.front);
  for(let i=front.length-1;i>=0;i--){
    if(inside(BOXES['lay:'+front[i].id])) return 'lay:'+front[i].id;
  }
  for(let i=DRAW_PARTS.length-1;i>=0;i--){
    const p = DRAW_PARTS[i];
    if(!p.select || p.key==='shot') continue;
    if(inside(BOXES[p.key])) return p.key;
  }
  for(let i=back.length-1;i>=0;i--){
    if(inside(BOXES['lay:'+back[i].id])) return 'lay:'+back[i].id;
  }
  return 'shot';
}

let compareMode = false;
/* l'anteprima si vede a circa 900 px: disegnarla a 3840 e' spreco puro.
   L'export resta sempre a piena risoluzione. */
const PREVIEW_MAX = 1500;
let PW = 0, PH = 0;
let vistaFormato = null;
function previewFormat(f){
  const m = misureVista(f, vistaNitida);
  return {id:f.id, group:f.group, name:f.name, note:f.note, profile:f.profile,
          w:m.rw, h:m.rh};
}
function render(){
  /* Un livello cancellato, o rimasto in un altro formato, non deve restare
     selezionato: le frecce e le maniglie scriverebbero dentro un oggetto
     che non si vede piu'. Il controllo costa niente e vale per ogni strada
     che porta a disegnare, comprese quelle che nascono da un annulla. */
  fixSelection();
  /* cambiando formato la tela cambia misura: uno zoom pensato per l'altra
     lascerebbe l'occhio in un punto che non vuol dire piu' niente */
  if(typeof view !== 'undefined' && vistaFormato !== state.active){
    vistaFormato = state.active;
    if(view.z !== 1) viewFit();
  }
  autoSave();
  const f = FORMATS.find(x=>x.id===state.active);
  const L = state.layouts[f.id];
  if(compareMode){
    BOXES = {};                      /* nei fogli non si seleziona niente */
    if(view.z !== 1){ view = {z:1, tx:0, ty:0}; applyView(); }
    const sheet = compareSheet();
    cv.width = sheet.width; cv.height = sheet.height;
    ctx.drawImage(sheet, 0, 0);
    document.getElementById('dims').textContent =
      'Comparison, '+(state.variants.length||1)+' variants of '+f.name;
    document.getElementById('selinfo').textContent =
      'Click "Compare all on canvas" again to go back to editing';
    adattaTela();
    drawThumbs();          /* le anteprime a sinistra restano aggiornate */
    return;
  }
  const pf = previewFormat(f);
  PW = pf.w; PH = pf.h;
  cv.width = PW; cv.height = PH;
  BOXES = renderTo(ctx, pf, L, true);
  drawGrid(ctx, PW, PH);
  drawHover(ctx, PW, PH);
  drawMulti(ctx, PW, PH);
  drawSelection(ctx, PW, PH);
  drawGuides(ctx, PW, PH);
  drawBoxSel(ctx, PW, PH);
  const sz = sizeOf(f);
  document.getElementById('dims').textContent =
    f.group+' / '+f.name+'  '+sz.w+'x'+sz.h+(f.note? '  ('+f.note+')':'');
  document.getElementById('selinfo').textContent =
    selLabel(state.sel) + (selLocked ? '  (locked)' : '');
  adattaTela();
  mostraSelezione(false);
  drawThumbs();
}

/* La misura a schermo della tela la decide sempre il codice, mai il CSS:
   solo cosi' zoom, spostamento e posizione del mouse parlano della stessa
   cosa. Un'Icon da 160 px viene mostrata ingrandita di un numero intero di
   volte, senza sfumare i pixel: quello che si vede sono i pixel veri
   dell'export, solo piu' grandi. */
function adattaTela(){
  const st = document.getElementById('stage');
  if(!st || !PW || !PH) return;
  strettoIlPannello(st);
  if(compareMode){ adattaFoglio(st); return; }
  const f = FORMATS.find(x=>x.id===state.active);
  if(!f) return;
  const m = misureVista(f, false);
  const sp = spazioTela();
  /* la finestra che ritaglia la tela deve essere esattamente lo spazio su
     cui e' stata calcolata la misura, altrimenti a zoom 1 un formato alto
     verrebbe tagliato in basso */
  cvwrap.style.maxWidth  = Math.round(sp.w) + 'px';
  cvwrap.style.maxHeight = Math.round(sp.h) + 'px';
  cv.style.maxWidth = 'none'; cv.style.maxHeight = 'none';
  cv.style.width  = Math.round(m.dispW) + 'px';
  cv.style.height = Math.round(m.dispH) + 'px';
  /* pixel netti solo quando si sta guardando davvero i pixel dell'export:
     se il disegno e' ancora sotto la misura vera, meglio sfumare */
  cv.style.imageRendering = (m.dispW > PW + 1 && PW >= m.vera.w - 1) ? 'pixelated' : '';
  /* la percentuale sul bottone dice la scala vera: cambia anche solo
     cambiando formato o rimpicciolendo la finestra, non solo zoomando */
  applyView();
  chiediNitido();
}
/* i fogli di confronto e di lotto hanno una loro forma: si adattano e basta */
function adattaFoglio(st){
  const sp = spazioTela();
  const k = Math.min(1, sp.w/cv.width, sp.h/cv.height);
  cvwrap.style.maxWidth  = Math.round(sp.w) + 'px';
  cvwrap.style.maxHeight = Math.round(sp.h) + 'px';
  cv.style.maxWidth = 'none'; cv.style.maxHeight = 'none';
  cv.style.width  = Math.round(cv.width*k) + 'px';
  cv.style.height = Math.round(cv.height*k) + 'px';
  cv.style.imageRendering = '';
}
/* Su uno schermo stretto la barra sopra la tela andava a capo e si mangiava
   settanta pixel di altezza. Invece di indovinare una larghezza limite le si
   chiede se ci sta: se va a capo restano le sole icone (il nome si legge
   passandoci sopra), e se ancora non basta spariscono divisori e margini.
   La prova costa una lettura del layout, quindi si rifa' solo quando la
   larghezza cambia davvero. */
let _largoBarra = -1;
function strettoIlPannello(st){
  const tb = document.getElementById('tools');
  if(!tb) return;
  const w = st.clientWidth;
  if(w === _largoBarra) return;
  _largoBarra = w;
  const UNA_RIGA = 46;
  tb.classList.remove('compatta', 'strettissima');
  if(tb.offsetHeight <= UNA_RIGA) return;
  tb.classList.add('compatta');
  if(tb.offsetHeight <= UNA_RIGA) return;
  tb.classList.add('strettissima');
}
window.addEventListener('resize', ()=>{ aggiornaVista(); });

/* ------------------------------------------------------ lista dei formati */
const THUMB_STEPS = [0, 44, 72, 110, 168];
function thumbSize(dir){
  const cur = state.ui.thumb || 72;
  let i = THUMB_STEPS.reduce((best, v, k)=>
    Math.abs(v-cur) < Math.abs(THUMB_STEPS[best]-cur) ? k : best, 0);
  i = Math.max(0, Math.min(THUMB_STEPS.length-1, i + dir));
  state.ui.thumb = THUMB_STEPS[i];
  buildFormats();
  autoSave();
  toast(state.ui.thumb ? 'Previews '+state.ui.thumb+' px' : 'Previews off');
}

/* I livelli appartengono al singolo formato. Cambiando formato la
   selezione restava su un livello che li' non esiste: da quel momento le
   frecce, il trascinamento e il pannello scrivevano su un oggetto vuoto e
   non succedeva niente, senza che l'app lo dicesse. */
let inFix = false;
function fixSelection(){
  if(!isLay(state.sel)) return;
  if(layOfKey(state.sel)) return;
  const list = layersOf(state.layouts[state.active]);
  state.sel = list.length ? 'lay:'+list[0].id : 'row';
  multiClear();
  /* il pannello mostrava i comandi del livello sparito: va rifatto */
  if(!inFix && document.getElementById('controls')){
    inFix = true;
    try{ buildControls(); }catch(e){}
    inFix = false;
  }
}

function buildFormats(){
  fixSelection();
  const box = document.getElementById('formats');
  box.innerHTML = '';

  /* misura delle anteprime, regolabile */
  const tb = document.createElement('div');
  tb.className = 'thumbbar';
  tb.innerHTML = '<span>Previews</span>';
  [['-1','Smaller previews','\u2212'], ['1','Bigger previews','+']].forEach(v=>{
    const bt = document.createElement('button');
    bt.textContent = v[2]; bt.title = v[1];
    bt.onclick = e=>{ e.stopPropagation(); thumbSize(parseInt(v[0],10)); };
    tb.appendChild(bt);
  });
  const TW = state.ui.thumb === undefined ? 72 : state.ui.thumb;
  tb.querySelectorAll('button')[0].disabled = TW <= THUMB_STEPS[0];
  tb.querySelectorAll('button')[1].disabled = TW >= THUMB_STEPS[THUMB_STEPS.length-1];
  box.appendChild(tb);

  let group = null, gEl = null;
  FORMATS.forEach(f=>{
    if(f.group!==group){
      group = f.group;
      gEl = document.createElement('div'); gEl.className='grp';
      gEl.innerHTML = '<h4>'+group+'</h4>';
      box.appendChild(gEl);
    }
    const row = document.createElement('div');
    row.className = 'fmt'+(f.id===state.active?' on':'');
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = state.layouts[f.id].on;
    cb.onclick = e=>{ e.stopPropagation(); state.layouts[f.id].on = cb.checked; drawThumbs(true); };
    /* anteprima: la stessa immagine che uscirebbe, in piccolo.
       Si ridisegna da sola dopo ogni modifica, con un ritardo, cosi' non
       pesa mentre si trascina un elemento sulla tela. */
    const b = sizeOf(f);
    const nm = document.createElement('div');
    nm.className='nm';
    nm.innerHTML = '<b>'+f.name+'</b><i>'+b.w+'x'+b.h+'</i>';

    let th = null;
    if(TW > 0){
      th = document.createElement('canvas');
      th.className = 'th';
      /* il doppio dei pixel, per gli schermi fitti */
      th.width = TW*2;
      th.height = Math.round(TW*2 * b.h/b.w);
      th.style.width = TW+'px';
      th.style.height = Math.round(TW * b.h/b.w)+'px';
      th.dataset.fmt = f.id;
    }
    const grande = TW >= 110;
    if(grande){
      row.classList.add('big');
      const top = document.createElement('div');
      top.className = 'top';
      top.appendChild(cb); top.appendChild(nm);
      if(th) row.appendChild(th);
      row.appendChild(top);
    } else {
      row.appendChild(cb);
      if(th) row.appendChild(th);
      row.appendChild(nm);
    }
    /* stesso impaginato, due risoluzioni: la scelta sta qui, sotto il nome,
       non in un secondo formato che raddoppierebbe la lista */
    if(f.sizes){
      const sel = document.createElement('select');
      sel.className = 'res';
      f.sizes.forEach(sz=>{
        const o = document.createElement('option');
        o.value = sz[2]; o.textContent = sz[2];
        sel.appendChild(o);
      });
      sel.value = state.layouts[f.id].res || f.sizes[0][2];
      sel.onclick = e=> e.stopPropagation();
      sel.onchange = ()=>{
        pushUndo();
        state.layouts[f.id].res = sel.value;
        buildFormats(); render();
        toast(f.name+': '+sel.value);
      };
      row.appendChild(sel);
    }
    row.title = f.group + ' ' + f.name + ', ' + b.w + 'x' + b.h +
                (f.note ? ' - ' + f.note : '');
    cb.title = 'Include this format in Export all';
    row.onclick = ()=>{
      state.active=f.id; multiClear();
      buildFormats(); buildControls(); render();
    };
    gEl.appendChild(row);
  });
  drawThumbs();
}

/* ------------------------------------------------ anteprime dei formati
   Disegnate a bassa risoluzione dentro il canvas della riga. Il conto e'
   leggero perche' renderTo lavora gia' alla misura finale, ma lo faccio
   comunque in differita: mentre si trascina conta solo la tela grande. */
let thumbTimer = null;
function drawThumbs(now){
  if(thumbTimer){ clearTimeout(thumbTimer); thumbTimer = null; }
  const run = ()=>{
    thumbTimer = null;
    document.querySelectorAll('#formats canvas.th').forEach(cv2=>{
      const f = FORMATS.find(x=> x.id===cv2.dataset.fmt);
      if(!f) return;
      const g = cv2.getContext('2d');
      g.setTransform(1,0,0,1,0,0);
      g.clearRect(0,0,cv2.width,cv2.height);
      const b = sizeOf(f);
      /* la tela ha gia' le proporzioni del formato: riempio tutto */
      const k = Math.min(cv2.width/b.w, cv2.height/b.h);
      const w = Math.max(2, Math.round(b.w*k)), h = Math.max(2, Math.round(b.h*k));
      const off = scratch(90, w, h);
      try{
        renderTo(off, {id:f.id, group:f.group, name:f.name, note:f.note,
                       profile:f.profile, w:w, h:h},
                 state.layouts[f.id], false);
      }catch(err){ return; }
      g.drawImage(off.canvas, Math.round((cv2.width-w)/2), Math.round((cv2.height-h)/2));
      cv2.style.opacity = state.layouts[f.id].on ? '1' : '0.4';
    });
  };
  if(now) run(); else thumbTimer = setTimeout(run, 180);
}
