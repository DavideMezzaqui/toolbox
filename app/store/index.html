let undoStack = [], redoStack = [];
function snapState(){
  return JSON.stringify({pack:state.pack, theme:state.theme, naming:state.naming,
                         layouts:state.layouts,
                         variants:state.variants, ui:state.ui, export:state.export});
}
function applySnap(s){
  const d = JSON.parse(s);
  state.pack = d.pack;
  state.layouts = d.layouts || {};
  migraTuttiIPannelli(state.layouts);
  /* Nessun formato puo' restare senza layout: un salvataggio piu' vecchio,
     o fatto quando l'elenco dei formati era diverso, ne avrebbe di meno e
     selezionandone uno mancante andrebbe tutto in errore. */
  FORMATS.forEach(f=>{
    if(!state.layouts[f.id] || typeof state.layouts[f.id] !== 'object')
      state.layouts[f.id] = defLayout(f);
  });
  /* Il layout di un formato tolto dall'elenco resta dentro ai salvataggi, e
     va bene: se il formato torna, torna com'era. Ma il formato ATTIVO va
     controllato sull'elenco, non sui layout, se no si resta puntati a uno
     che non c'e' piu' e il primo disegno va in errore. */
  if(!FORMATS.some(f=>f.id === state.active)) state.active = FORMATS[0].id;
  fixSelection();
  if(d.theme)  state.theme  = d.theme;
  if(d.naming) state.naming = d.naming;
  if(d.export) state.export = Object.assign(state.export, d.export);
  if(Array.isArray(d.variants)) state.variants = d.variants;
  if(d.ui){
    if(d.ui.thumb !== undefined) state.ui.thumb = d.ui.thumb;
    if(d.ui.margin !== undefined) state.ui.margin = d.ui.margin;
  }
  buildFormats(); buildControls(); render();
}
/* una mossa nuova cancella la pila del ripeti: e' il comportamento di
   qualunque editor, altrimenti si ripeterebbe una storia che non esiste piu' */
/* La libreria degli screenshot non entra nel testo dello stato, perche'
   contiene immagini vere. Viaggia percio' su due pile parallele, mosse
   sempre insieme a quelle dello stato: cosi' anche togliere o riordinare
   una foto si annulla come tutto il resto. */
let undoShots = [], redoShots = [];
function shotsSnap(){ return {list: SHOTS.slice(), main: imgShot, logo: imgLogo}; }
function shotsBack(s){
  if(!s) return;
  SHOTS = s.list.slice();
  imgShot = s.main;
  imgLogo = s.logo;
  if(imgShot && !SHOTS.some(x=> x.img===imgShot)) imgShot = SHOTS.length ? SHOTS[0].img : null;
  if(!imgShot && SHOTS.length) imgShot = SHOTS[0].img;
}
function pushUndo(){
  undoStack.push(snapState());
  undoShots.push(shotsSnap());
  if(undoStack.length>60){ undoStack.shift(); undoShots.shift(); }
  redoStack.length = 0; redoShots.length = 0;
  updateHistBtns();
}
function undo(){
  const s = undoStack.pop();
  if(!s){ toast('Nothing to undo'); return; }
  redoStack.push(snapState());
  redoShots.push(shotsSnap());
  if(redoStack.length>60){ redoStack.shift(); redoShots.shift(); }
  shotsBack(undoShots.pop());
  dbSalva();
  applySnap(s); updateHistBtns(); toast('Undo');
}
function redo(){
  const s = redoStack.pop();
  if(!s){ toast('Nothing to redo'); return; }
  undoStack.push(snapState());
  undoShots.push(shotsSnap());
  shotsBack(redoShots.pop());
  dbSalva();
  applySnap(s); updateHistBtns(); toast('Redo');
}
function updateHistBtns(){
  const u = document.getElementById('bUndo'), r = document.getElementById('bRedo');
  if(u) u.disabled = !undoStack.length;
  if(r) r.disabled = !redoStack.length;
}

/* ------------------------------------------------- salvataggio automatico
   il lavoro resta nel browser: se chiudo la scheda per sbaglio o il pc si
   riavvia, alla riapertura ritrovo tutto. Le immagini no: quelle stanno in
   memoria e sarebbero troppo pesanti da tenere qui, vanno ricaricate. */
const AUTOKEY = 'davfx-store-graphics-autosave';
let autoTimer = null, autoArmed = false;
let autoAvvisato = false;
/* Due finestre aperte sullo stesso file scrivono nello stesso salvataggio
   automatico, e l'ultima che chiude cancella il lavoro dell'altra senza dire
   niente. L'evento che il browser manda fra schede non arriva quando la
   pagina si apre da file, quindi il controllo si fa qui: prima di scrivere
   si guarda se l'ora del salvataggio e' ancora quella che ci avevamo messo
   noi. Se non lo e', ha scritto qualcun altro. */
let oraNostra = 0, avvisatoAltraFinestra = false, ultimoAuto = '';
function altraFinestraHaScritto(){
  if(!oraNostra) return false;
  try{
    const raw = localStorage.getItem(AUTOKEY);
    if(!raw) return false;
    const at = JSON.parse(raw).at;
    return !!at && at !== oraNostra;
  }catch(err){ return false; }
}
function autoSaveNow(){
  if(!autoArmed || !state.auto.on) return;
  if(!avvisatoAltraFinestra && altraFinestraHaScritto()){
    avvisatoAltraFinestra = true;
    toast('Another window of this tool is saving to the same place: the last one ' +
          'you close wins. Use Save for a file that stays yours');
  }
  const ora = Date.now();
  const pacco = (snap)=> JSON.stringify({
    v:APP.version, at:ora, active:state.active, snap:snap, colori:COLORI_USATI
  });
  const stato = snapState();
  /* niente da scrivere se non e' cambiato niente: il disegno chiama qui a
     ogni movimento, e l'avviso deve dire "salvato" solo quando lo e' */
  if(stato + state.active === ultimoAuto) return;
  try{
    localStorage.setItem(AUTOKEY, pacco(stato));
    autoAvvisato = false;
    oraNostra = ora;
    ultimoAuto = stato + state.active;
    segnaAutosave();
    return;
  }catch(err){ /* spazio finito o memoria negata: provo a stringere */ }
  /* Le varianti sono la parte pesante: meglio salvare il lavoro senza di
     loro che non salvare niente. Se non basta nemmeno cosi', l'utente deve
     saperlo: un salvataggio che fallisce in silenzio e' peggio di uno che
     non c'e'. */
  try{
    const magro = JSON.parse(snapState());
    magro.variants = [];
    localStorage.setItem(AUTOKEY, pacco(JSON.stringify(magro)));
    oraNostra = ora;
    if(!autoAvvisato){
      autoAvvisato = true;
      toast('Storage almost full: saved without the variants. Use Save to keep a project file.');
    }
  }catch(err2){
    if(!autoAvvisato){
      autoAvvisato = true;
      toast('Autosave failed: browser storage is full. Use Save to keep a project file.');
    }
  }
}
function autoSave(){
  if(!autoArmed || !state.auto.on) return;
  if(autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(()=>{ autoTimer = null; autoSaveNow(); }, 700);
}
function autoClear(){
  try{ localStorage.removeItem(AUTOKEY); }catch(err){}
  dbSvuota();                 /* anche le immagini: e' un ripartire da zero */
  toast('Saved work and stored images cleared');
}
/* Un lavoro salvato prima di oggi non ha i campi nuovi, e soprattutto ha i
   vecchi valori dei badge, che non erano quelli del PSD. mergeLayout
   aggiunge i campi mancanti ma non tocca quelli che ci sono gia': qui si
   rifanno solo quelli rimasti al valore di serie di prima, cosi' chi aveva
   personalizzato i badge se li ritrova come li aveva lasciati. */
function migraSalvataggio(got){
  if(!got) return got;
  /* il nome lungo di serie di prima diventa quello corto di adesso */
  if(got.naming && got.naming.pattern === '{title}_{platform}_{format}_{w}x{h}') got.naming.pattern = '{format}';
  if(got.theme){
    if(!got.theme.gradA) got.theme.gradA = C.accentA2;
    if(!got.theme.gradB) got.theme.gradB = C.accentB2;
  }
  if(!got.layouts) return got;
  FORMATS.forEach(fm=>{
    const L = got.layouts[fm.id];
    if(!L || !L.badges) return;
    const b = L.badges;
    const intatto = b.thick === 0.06 && b.cut === 0.17 &&
                    b.fillOn === false && String(b.color).toLowerCase() === C.accent;
    if(!intatto) return;
    const nuovo = defLayout(fm).badges;
    ['thick','cut','fillOn','fillColor','fillOpacity','color','color2',
     'gradOn','gradLink','gradAngle','strokeOp'].forEach(k=>{ b[k] = nuovo[k]; });
  });
  migraMisureBadge(got);
  migraOpacitaTesto(got);
  return got;
}

/* I badge di Icon e Card hanno sbagliato misura due volte: prima erano
   quelli di una versione inventata, poi quelli presi dal solo rettangolo del
   livello del PSD invece che dal risultato. Qui ci sono tutti i valori che
   sono stati di serie fin qui, formato per formato: un campo rimasto a uno
   di quelli si rifa', un campo che hai spostato tu resta com'e'. */
const MISURE_VECCHIE = {
  unity_icon: [
    {x:0.0438,  y:0.0313,  h:0.0875,  gap:0.05,    size:0.53,   pad:1.05,  cut:0.17},
    {x:0.03125, y:0.01875, h:0.1125,  gap:0.025,   size:0.423,  pad:1.092, cut:0.1667}
  ],
  unity_card: [
    {x:0.0452,  y:0.0357,  h:0.0786,  gap:0.0357,  size:0.53,   pad:1.1,   cut:0.17},
    {x:0.04286, y:0.03214, h:0.08571, gap:0.02857, size:0.536,  pad:1.067, cut:0.159},
    {x:0.04286, y:0.03214, h:0.08571, gap:0.02857, size:0.536,  pad:1.067, cut:0.200}
  ],
  yt_thumb: [
    {pad:1.256, cut:0.17},
    {pad:1.286, cut:0.1731}
  ]
};
function migraMisureBadge(got){
  if(!got.layouts) return;
  Object.keys(MISURE_VECCHIE).forEach(id=>{
    const L = got.layouts[id]; if(!L || !L.badges) return;
    const fm = FORMATS.find(f=>f.id===id); if(!fm) return;
    const nuovo = defLayout(fm).badges;
    MISURE_VECCHIE[id].forEach(vecchio=>{
      Object.keys(vecchio).forEach(k=>{
        if(Math.abs(L.badges[k] - vecchio[k]) < 1e-6) L.badges[k] = nuovo[k];
      });
    });
  });
}

/* Card e Icon avevano le opacita' della Thumbnail: nel PSD li' sono piene, e
   il DAVFX nero sulla barra arancione veniva slavato. */
function migraOpacitaTesto(got){
  if(!got.layouts) return;
  ['unity_icon','unity_card'].forEach(id=>{
    const L = got.layouts[id]; if(!L || !L.row) return;
    if(L.row.titleOp === 0.85) L.row.titleOp = 1;
    if(L.row.itemOp  === 0.75) L.row.itemOp  = 1;
  });
}

/* dopo un tentativo di ripristino dice se il salvataggio c'era ma era
   illeggibile: "Nothing saved yet" in quel caso era una bugia */
let ripristinoRotto = false;
function autoRestore(){
  ripristinoRotto = false;
  let raw = null;
  try{ raw = localStorage.getItem(AUTOKEY); }catch(err){ return false; }
  if(!raw) return false;
  try{
    const d = JSON.parse(raw);
    if(!d || !d.snap) return false;
    const got = JSON.parse(d.snap);
    /* i salvataggi di una versione vecchia non hanno i campi nuovi:
       li riempio dai default, come per i preset */
    if(got.layouts) FORMATS.forEach(fm=>{
      if(got.layouts[fm.id]) got.layouts[fm.id] = mergeLayout(fm, got.layouts[fm.id]);
    });
    /* Senza condizione sulla versione, e apposta. Il salvataggio automatico
       scrive sempre il numero di versione di OGGI, qualunque cosa contenga:
       basta che scatti una volta prima che la migrazione abbia lavorato e
       il lavoro si ritrova timbrato "aggiornato" con dentro i valori
       vecchi, e da quel momento nessuna migrazione lo guarda piu'. E'
       successo davvero. La migrazione sostituisce solo i campi rimasti
       esattamente a un valore di serie di prima, quindi rifarla ogni volta
       non costa e non toglie niente: quando sono gia' a posto, non
       corrisponde piu' niente e non cambia nulla. */
    migraSalvataggio(got);
    applySnap(JSON.stringify(got));
    if(Array.isArray(d.colori)) COLORI_USATI = d.colori.slice(0,8);
    if(d.active && FORMATS.some(f=>f.id === d.active)){ state.active = d.active; buildFormats(); }
    undoStack.length = 0; redoStack.length = 0;
    undoShots.length = 0; redoShots.length = 0; updateHistBtns();
    return true;
  }catch(err){ ripristinoRotto = true; return false; }
}

const GLOBAL_GROUPS = ['pack','theme','naming','snap','export','auto','ui'];
function splitPath(path){
  const i = path.lastIndexOf('.');
  return [path.slice(0,i), path.slice(i+1)];
}
/* 'shot.src#2' vuol dire: la terza casella dell'elenco shot.src.
   Serve ai pannelli, che hanno un valore per riquadro. */
function idxOf(path){
  const h = path.indexOf('#');
  return h < 0 ? null : {base:path.slice(0,h), i:parseInt(path.slice(h+1),10)};
}
function getVal(path){
  const ix = idxOf(path);
  if(ix){
    const arr = getVal(ix.base);
    return Array.isArray(arr) ? arr[ix.i] : undefined;
  }
  const p = splitPath(path);
  if(isLay(p[0])){ const l = layOfKey(p[0]); return l ? l[p[1]] : undefined; }
  if(GLOBAL_GROUPS.indexOf(p[0])>=0) return state[p[0]][p[1]];
  return state.layouts[state.active][p[0]][p[1]];
}
/* Il valore di serie di un controllo, da qualunque parte venga: livello,
   parte del formato o impostazione generale. Serve all'Alt+clic. */
function defaultVal(path){
  const q = splitPath(path);
  if(isLay(q[0])){
    const l = layOfKey(q[0]);
    if(!l) return undefined;
    return layerDefaults(l.type, l.name)[q[1]];
  }
  if(GLOBAL_GROUPS.indexOf(q[0]) >= 0){
    const g = STATO_DI_SERIE[q[0]];
    return g ? g[q[1]] : undefined;
  }
  const f = FORMATS.find(x=> x.id===state.active);
  const d = defLayout(f);
  return d[q[0]] ? d[q[0]][q[1]] : undefined;
}
function setVal(path, v){
  multiApply(path, v);
  const ix = idxOf(path);
  if(ix){
    let arr = getVal(ix.base);
    if(!Array.isArray(arr)){ arr = []; setVal(ix.base, arr); }
    arr[ix.i] = v;
    return;
  }
  const p = splitPath(path);
  if(isLay(p[0])){ const l = layOfKey(p[0]); if(l) l[p[1]] = v; return; }
  if(GLOBAL_GROUPS.indexOf(p[0])>=0){ state[p[0]][p[1]] = v; return; }
  state.layouts[state.active][p[0]][p[1]] = v;
}

/* ------------------------------------------------------ nomi dei file */
function two(n){ return String(n).padStart(2,'0'); }
const TOKENS = ['title','category','brand','version','platform','format',
                'w','h','index','date'];
/* Un segnaposto scritto male non deve finire dentro il nome del file: le
   graffe le toglie la ripulitura e resterebbero lettere a caso, tipo
   "{n}" che diventa "n". Meglio niente, e un avviso quando serve. */
function tokenIgnoti(str){
  const fuori = [];
  String(str||'').replace(/\{(\w+)\}/g, (m,k)=>{
    if(TOKENS.indexOf(k) < 0 && fuori.indexOf(m) < 0) fuori.push(m);
    return m;
  });
  return fuori;
}
function avvisaToken(){
  const fuori = tokenIgnoti(state.naming.pattern).concat(tokenIgnoti(state.naming.folder));
  if(!fuori.length) return false;
  toast('Unknown in the file name: ' + [...new Set(fuori)].join(' ') +
        '.  Available: ' + TOKENS.map(t=>'{'+t+'}').join(' '));
  return true;
}
function tokenize(str, f, pk, index){
  pk = pk || state.pack;
  const d = new Date();
  const map = {title:pk.title, category:pk.category, brand:pk.brand, version:pk.version,
               platform:f.group.split(' ')[0], format:f.name, w:f.w, h:f.h,
               index:two(index==null?1:index),
               date:d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())};
  return String(str||'').replace(/\{(\w+)\}/g, (m,k)=> map[k]!==undefined ? String(map[k]) : '');
}
function applyCase(str, mode, sep){
  const words = String(str).split(/[\s_\-]+/).filter(Boolean);
  if(mode==='lower')      return words.join(sep).toLowerCase();
  if(mode==='UPPER')      return words.join(sep).toUpperCase();
  if(mode==='snake_case') return words.join('_').toLowerCase();
  if(mode==='kebab-case') return words.join('-').toLowerCase();
  if(mode==='PascalCase') return words.map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('');
  return words.join(sep);
}
function exportMime(){
  const f = state.export.format;
  return f.indexOf('JPEG')>=0 ? 'image/jpeg' : (f.indexOf('WebP')>=0 ? 'image/webp' : 'image/png');
}
function exportExt(){
  const m = exportMime();
  return m==='image/jpeg' ? 'jpg' : (m==='image/webp' ? 'webp' : 'png');
}
/* misure reali in uscita, con la scala applicata */
/* alcuni formati escono in piu' risoluzioni con lo stesso identico
   impaginato: la scelta sta nel formato, non in una voce separata */
function sizeOf(f){
  if(!f.sizes) return {w:f.w, h:f.h, label:''};
  const L = state.layouts[f.id];
  const want = L && L.res;
  const hit = f.sizes.find(x=> x[2]===want) || f.sizes[0];
  return {w:hit[0], h:hit[1], label:hit[2]};
}
function outSize(f){
  const k = state.export.scale, b = sizeOf(f);
  return {w: Math.max(1, Math.round(b.w*k)), h: Math.max(1, Math.round(b.h*k))};
}
function fileNameFor(f, pk, index){
  const o = outSize(f);
  const raw = tokenize(state.naming.pattern, {group:f.group, name:f.name, w:o.w, h:o.h}, pk, index);
  return safe(applyCase(raw, state.naming.case, state.naming.sep || '_'))+'.'+exportExt();
}
function folderFor(f, pk, index){
  /* stesse misure del nome del file: se la scala e' 2x, {w} vale il doppio
     in tutti e due, se no la cartella dice una cosa e il file un'altra */
  const o = outSize(f);
  const raw = tokenize(state.naming.folder,
                       {group:f.group, name:f.name, w:o.w, h:o.h}, pk, index);
  if(!raw.trim()) return '';
  return safe(applyCase(raw, state.naming.case, state.naming.sep || '_'))+'/';
}

const openSecs = {};
let secFilter = '';

function applyFilter(){
  const q = secFilter.trim().toLowerCase();
  let trovate = 0;
  document.querySelectorAll('#controls .sec').forEach(el=>{
    const t = el.querySelector('.hd b').textContent.toLowerCase();
    if(!q){
      /* senza ricerca si vede solo la scheda scelta */
      el.style.display = (el.dataset.tab === activeTab) ? '' : 'none';
      /* E si rimette tutto come prima della ricerca: le righe che la
         ricerca aveva nascosto dentro una sezione restavano nascoste anche
         dopo aver svuotato il filtro, e quei comandi sparivano finche' non
         si chiudeva e riapriva la sezione. */
      const bd0 = el.querySelector('.bd');
      if(bd0) [...bd0.children].forEach(ch=> ch.style.display = '');
      const idx = parseInt(el.dataset.idx, 10);
      if(!isNaN(idx)) el.classList.toggle('open', !!openSecs[idx]);
      return;
    }
    /* con la ricerca si guarda dappertutto, titoli e nomi dei controlli */
    let hit = t.indexOf(q)>=0;
    if(!hit){
      el.querySelectorAll('label').forEach(lb=>{
        if(lb.textContent.toLowerCase().indexOf(q)>=0) hit = true;
      });
    }
    el.style.display = hit ? '' : 'none';
    if(hit) trovate++;
    /* Una sezione trovata si apre da sola. Prima restava chiusa: si cercava
       "accent", compariva l'intestazione "Accent line" e i comandi non si
       vedevano lo stesso, bisognava cliccarci sopra. */
    if(hit) el.classList.add('open');
    /* Se la sezione risponde solo per via di un controllo, mostro quel
       controllo e non tutti gli altri: una ricerca che apre un muro di
       righe non ha fatto molto per chi cerca. */
    const bd = el.querySelector('.bd');
    if(bd) [...bd.children].forEach(ch=> ch.style.display = '');
    if(hit && t.indexOf(q)<0 && bd){
      el.classList.add('open');
      let ultimoGruppo = null, gruppoUsato = false;
      [...bd.children].forEach(ch=>{
        if(ch.classList.contains('grp2')){
          if(ultimoGruppo && !gruppoUsato) ultimoGruppo.style.display = 'none';
          ultimoGruppo = ch; gruppoUsato = false; return;
        }
        if(ch.classList.contains('hint')){ ch.style.display = 'none'; return; }
        const dentro = ch.textContent.toLowerCase().indexOf(q) >= 0;
        ch.style.display = dentro ? '' : 'none';
        if(dentro) gruppoUsato = true;
      });
      if(ultimoGruppo && !gruppoUsato) ultimoGruppo.style.display = 'none';
    }
  });
  /* Una ricerca senza risposta lasciava il pannello vuoto e basta: sembra
     che si sia rotto qualcosa. Meglio dirlo. */
  const vuoto = document.getElementById('secVuoto');
  if(vuoto){
    vuoto.style.display = (q && !trovate) ? '' : 'none';
    vuoto.textContent = 'Nothing matches "' + secFilter.trim() + '"';
  }
}

function selectEl(k){
  state.sel = k;
  const want = isLay(k) ? 'Layers' : SEL_SECTION[k];
  SECTIONS.forEach((s,i)=>{
    if(s.t===want) openSecs[i]=true;
    else if(EL_SECTIONS.indexOf(s.t)>=0) openSecs[i]=false;
  });
  /* se l'elemento vive in un'altra scheda ci porto l'utente,
     altrimenti clicca sulla tela e non succede niente di visibile */
  if(want){
    const tb = tabOf(want);
    if(tb !== activeTab && !secFilter.trim()) activeTab = tb;
  }
  scrollTo = want;
  buildControls();
  /* Con una ricerca in corso la sezione dell'elemento appena scelto puo'
     essere nascosta dal filtro: si cliccava sulla tela, l'elemento si
     selezionava, e nel pannello non compariva niente. Se e' nascosta la
     ricerca si svuota, che e' quello che uno si aspetta cliccando. */
  if(want && secFilter.trim()){
    const sez = [...document.querySelectorAll('#controls .sec')]
      .find(s=> s.dataset.title === want);
    if(!sez || sez.style.display === 'none'){
      secFilter = '';
      const tb = tabOf(want);
      if(tb !== activeTab) activeTab = tb;
      buildControls();
    }
  }
}

/* le sezioni sono divise in schede: cosi' invece di un muro lungo si
   vedono solo le sei o sette che servono in quel momento */
const TABS = [
  {id:'design',  label:'Design',
   has:['Looks','Layers','Colours','Bottom band','Accent line','Logo','Text row',
        'Version','Badges','Frame']},
  {id:'image',   label:'Image',
   has:['Screenshot','Image adjustments','Blur effects','Tint / blend','Dark gradient']},
  {id:'content', label:'Content', has:['Pack data','File naming']},
  {id:'test',    label:'Test',    has:['Variants']},
  {id:'out',     label:'Output',  has:['Export','Session']}
];
let activeTab = 'design';
function tabOf(title){
  const t = TABS.find(x=> x.has.indexOf(title)>=0);
  return t ? t.id : 'design';
}

function buildControls(){
  const box = document.getElementById('controls');
  /* Ricostruire il pannello riportava l'elenco in cima: se stavi regolando
     un cursore a meta' sezione ti ritrovavi all'inizio. La posizione si
     rimette dov'era. */
  const scorri = box.scrollTop;
  box.innerHTML = '';
  box.appendChild(stripImmagini());

  const tb = document.createElement('div');
  tb.className = 'tabs';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.title = t.has.join(', ');
    if(t.id===activeTab) b.classList.add('on');
    b.onclick = ()=>{ activeTab = t.id; buildControls(); };
    tb.appendChild(b);
  });
  box.appendChild(tb);

  /* filtro: scrivere due lettere e' piu' veloce che scorrere.
     Con il filtro attivo si cerca in tutte le schede, non solo in questa. */
  const fr = document.createElement('div');
  fr.className = 'row';
  fr.innerHTML = '<input type="text" id="secFilter" placeholder="Search all settings..." ' +
                 'title="Searches every tab, not just this one" style="flex:1">' +
                 '<button id="secClose" style="flex:none" title="Collapse every section">close</button>';
  box.appendChild(fr);
  const vuoto = document.createElement('div');
  vuoto.id = 'secVuoto'; vuoto.className = 'hint';
  vuoto.style.display = 'none';
  box.appendChild(vuoto);
  const fi = fr.querySelector('#secFilter');
  fi.value = secFilter;
  fi.oninput = ()=>{ secFilter = fi.value; applyFilter(); };
  fr.querySelector('#secClose').onclick = ()=>{
    SECTIONS.forEach((s,i)=> openSecs[i] = false);
    buildControls();
    document.getElementById('secFilter').focus();
  };

  SECTIONS.forEach((s,i)=>{
    if(openSecs[i]===undefined) openSecs[i] = !!s.open;
    const sec = document.createElement('div');
    sec.className = 'sec'+(openSecs[i]?' open':'');
    const hd = document.createElement('div');
    hd.className='hd';
    if(SEC_ICONS[s.t]) hd.setAttribute('data-ic', SEC_ICONS[s.t]);
    const tit = document.createElement('b'); tit.textContent = s.t;
    const sgn = document.createElement('span'); sgn.innerHTML = openSecs[i]?'&minus;':'+';
    hd.appendChild(tit); hd.appendChild(sgn);
    /* il testo lungo della sezione diventa anche il suggerimento del titolo */
    if(s.note) hd.title = s.note.length > 150 ? s.note.slice(0,147)+'...' : s.note;
    hd.onclick = ()=>{ openSecs[i] = !openSecs[i]; buildControls(); };
    sec.appendChild(hd);
    const bd = document.createElement('div'); bd.className='bd';
    /* Una riga che in questo momento non fa niente confonde e basta: la
       seconda linea quando il testo e' su una riga sola, il colore di
       arrivo quando il gradiente e' spento, lo spazio fra i segmenti
       quando il segmento e' uno. Quelle non si mostrano. */
    s.rows.forEach(r=>{ if(rigaServe(r)) bd.appendChild(makeRow(r)); });
    sec.appendChild(bd);
    sec.dataset.title = s.t;
    sec.dataset.tab = tabOf(s.t);
    /* serve al filtro per rimettere aperta o chiusa la sezione com'era */
    sec.dataset.idx = i;
    box.appendChild(sec);
  });
  box.appendChild(keysPanel());
  paintIcons(box);
  applyFilter();
  if(scorri) box.scrollTop = scorri;
  if(scrollTo){
    const el = [...box.querySelectorAll('.sec')].find(e=> e.dataset.title===scrollTo);
    if(el) el.scrollIntoView({block:'nearest'});
    scrollTo = null;
  }
}
let scrollTo = null;

/* aggiorna solo i valori dei controlli gia' presenti: 20 volte piu' leggero
   della ricostruzione completa del pannello */
function syncControls(){
  document.querySelectorAll('#controls [data-path]').forEach(el=>{
    const path = el.getAttribute('data-path');
    let v;
    try { v = getVal(path); } catch(e){ return; }
    if(el.type==='checkbox'){ if(el.checked !== !!v) el.checked = !!v; }
    else if(String(el.value) !== String(v)) el.value = v;
    if(el.type==='color'){
      const h = el.parentNode && el.parentNode.querySelector('[data-hexof]');
      if(h) h.textContent = String(v || '').toUpperCase();
    }
    if(el.type==='range'){
      const lab = el.parentNode && el.parentNode.querySelector('.val');
      if(lab && document.activeElement !== lab){
        const st = parseFloat(el.step);
        lab.value = Number(v).toFixed(decimaliPasso(st));
      }
    }
  });
}

/* Un cursore di un pannello: un passo di annulla per gesto, il valore
   scrivibile a mano accanto, Alt+clic lo rimette al valore di serie. */
function rigaPannello(etichetta, mn, mx, st, leggi, scrivi, tip){
  const rw = document.createElement('div'); rw.className = 'row'; rw.title = tip || '';
  const lb = document.createElement('label'); lb.textContent = etichetta;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = mn; inp.max = mx; inp.step = st; inp.value = leggi();
  const val = document.createElement('input'); val.className = 'val'; val.type = 'number'; val.step = st;
  const dec = st < 0.01 ? 3 : (st < 1 ? 2 : 0);
  val.value = Number(leggi()).toFixed(dec);
  let preso = false;
  const metti = v=>{ v = Math.min(mx, Math.max(mn, v)); scrivi(v); inp.value = v; val.value = Number(v).toFixed(dec); render(); };
  inp.oninput = ()=>{ if(!preso){ pushUndo(); preso = true; } metti(parseFloat(inp.value)); };
  inp.onchange = ()=>{ preso = false; };
  val.onchange = ()=>{ const v = parseFloat(val.value); if(isNaN(v)) return; pushUndo(); metti(v); };
  inp.addEventListener('mousedown', e=>{
    if(!e.altKey) return;
    e.preventDefault(); pushUndo();
    metti(etichetta==='Zoom' ? 1 : (etichetta==='X' || etichetta==='Y' ? 0.5 : (etichetta==='Width' ? 1 : 0)));
  });
  rw.appendChild(lb); rw.appendChild(inp); rw.appendChild(val);
  return rw;
}

/* ==========================================================================
   IMMAGINI DEL PROGETTO
   Sempre in vista in cima al pannello destro, qualunque scheda sia aperta:
   si vede subito cosa c'e' nel progetto, senza aprire niente.
     clic            l'immagine va nel pannello scelto di questo formato
     Alt+clic        va nel pannello scelto di tutti i formati
     trascinare      cambia l'ordine; una barra chiara dice dove cade
   Il numero in alto e' la posizione nell'elenco, l'etichetta P1, P2 in
   basso dice in quale pannello di questo formato l'immagine e' gia' in
   uso; l'anello bianco e' quella del pannello scelto.
   ========================================================================== */
const _miniature = new WeakMap();
function miniatura(img){
  let c = _miniature.get(img);
  if(c) return c;
  c = document.createElement('canvas'); c.width = 128; c.height = 72;
  const g = c.getContext('2d');
  const k = Math.max(128/img.width, 72/img.height);
  g.imageSmoothingQuality = 'high';
  g.drawImage(imgRidotta(img, img.width*k, img.height*k), (128-img.width*k)/2, (72-img.height*k)/2, img.width*k, img.height*k);
  _miniature.set(img, c);
  return c;
}
/* Gli indici delle immagini stanno dentro ogni layout, anche in quelli
   delle varianti: quando l'elenco cambia vanno rifatti tutti insieme. */
function rimappaImmagini(mappa){
  const tocca = layouts=> Object.keys(layouts||{}).forEach(id=>{
    const S = layouts[id] && layouts[id].shot;
    if(S && Array.isArray(S.src)) S.src = S.src.map(v=> v < 0 ? v : mappa(v));
  });
  tocca(state.layouts);
  (state.variants||[]).forEach(v=> tocca(v.layouts));
}
/* Un pannello senza una scelta (-1) mostra l'immagine principale. Prima di
   cambiare l'elenco quella scelta implicita diventa esplicita, cosi' nessun
   pannello cambia immagine da solo quando l'elenco si riordina. */
function fissaPrincipale(){
  const k = SHOTS.findIndex(x=> x.img === imgShot);
  if(k < 0) return;
  const tocca = layouts=> Object.keys(layouts||{}).forEach(id=>{
    const S = layouts[id] && layouts[id].shot;
    if(S && Array.isArray(S.src)) S.src = S.src.map(v=> v < 0 ? k : v);
  });
  tocca(state.layouts);
  (state.variants||[]).forEach(v=> tocca(v.layouts));
}
function spostaImmagine(da, verso){
  /* verso e' il punto d'inserimento nell'elenco com'e' ora */
  const a = verso > da ? verso - 1 : verso;
  if(a === da) return;
  pushUndo();
  fissaPrincipale();
  const ordine = SHOTS.map((_, k)=> k);
  ordine.splice(a, 0, ordine.splice(da, 1)[0]);
  const nuovo = {};
  ordine.forEach((vecchio, k)=> nuovo[vecchio] = k);
  SHOTS = ordine.map(k=> SHOTS[k]);
  rimappaImmagini(v=> nuovo[v] !== undefined ? nuovo[v] : v);
  dbSalva(); buildControls(); render();
}
function togliImmagine(i){
  pushUndo();
  fissaPrincipale();
  const via = SHOTS[i].img;
  SHOTS.splice(i, 1);
  if(imgShot === via) imgShot = SHOTS.length ? SHOTS[0].img : null;
  rimappaImmagini(v=> v === i ? -1 : (v > i ? v - 1 : v));
  dbSalva(); buildControls(); render();
  toast(SHOTS.length ? 'Removed. ' + SHOTS.length + ' left. Ctrl+Z brings it back' : 'No images left. Ctrl+Z brings it back');
}
function usaImmagine(i, ovunque){
  pushUndo();
  const metti = id=>{
    const S = state.layouts[id].shot;
    if(!Array.isArray(S.src)) S.src = [];
    S.src[pannelloAttivo(S)] = i;
  };
  if(ovunque) FORMATS.forEach(f=> metti(f.id)); else metti(state.active);
  state.sel = 'shot';
  dbSalva(); buildControls(); render();
  const S = state.layouts[state.active].shot, pann = Math.round(S.panels||1) > 1 ? ', panel ' + (pannelloAttivo(S)+1) : '';
  toast(SHOTS[i].name + (ovunque ? ' in the selected panel of every format' : pann ? ' in' + pann : ' on this format'));
}
let _trascinoImg = null;
function stripImmagini(){
  const box = document.createElement('div');
  box.id = 'imgs';
  const hd = document.createElement('div'); hd.className = 'ih';
  const tit = document.createElement('b');
  tit.textContent = SHOTS.length ? 'Images ' + SHOTS.length : 'Images';
  hd.appendChild(tit);
  const bt = (ic, testo, title, fn)=>{
    const b = document.createElement('button'); b.title = title;
    b.appendChild(icon(ic)); if(testo){ const sp = document.createElement('span'); sp.textContent = testo; b.appendChild(sp); }
    b.onclick = fn; hd.appendChild(b); return b;
  };
  bt('image', 'Add', 'Add images. Dropping files on the window does the same', ()=> document.getElementById('fImg').click());
  bt('folder', 'Folder', 'Add every image in a folder, subfolders included', ()=> document.getElementById('fFolder').click());
  if(SHOTS.length) bt('trash', '', 'Remove every image. Ctrl+Z brings them back', ()=> runAction('shotsClear'));
  box.appendChild(hd);
  if(!SHOTS.length){
    const v = document.createElement('div'); v.className = 'vuoto';
    v.textContent = 'No images yet. Drop them here or anywhere on the window';
    v.onclick = ()=> document.getElementById('fImg').click();
    box.appendChild(v);
    return box;
  }
  const S = state.layouts[state.active].shot, np = Math.max(1, Math.round(S.panels||1));
  const nelPannello = shotByIndex(panelSrc(S, pannelloAttivo(S)));
  const grid = document.createElement('div'); grid.className = 'lib';
  const pulisci = ()=> grid.querySelectorAll('.prima,.dopo').forEach(x=> x.classList.remove('prima','dopo'));
  SHOTS.forEach((sh, i)=>{
    const card = document.createElement('div');
    const pannelli = [];
    for(let p=0;p<np;p++) if(shotByIndex(panelSrc(S, p)) === sh.img) pannelli.push(p+1);
    card.className = 'card' + (pannelli.length ? ' usata' : '') + (sh.img === nelPannello ? ' on' : '');
    card.title = (sh.path || sh.name) + '\nClick: put it in the selected panel.  Alt+click: on every format.  Drag: reorder';
    card.draggable = true;
    /* la miniatura e' fatta una volta per immagine; qui se ne mette una copia */
    const th = document.createElement('canvas'); th.width = 128; th.height = 72;
    th.getContext('2d').drawImage(miniatura(sh.img), 0, 0);
    card.appendChild(th);
    const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
    card.appendChild(num);
    if(pannelli.length){
      const pn = document.createElement('span'); pn.className = 'pan';
      pn.textContent = np > 1 ? 'P' + pannelli.join(' P') : 'IN USE';
      card.appendChild(pn);
    }
    const del = document.createElement('button');
    del.className = 'del'; del.title = 'Remove from the project';
    del.appendChild(icon('trash'));
    del.onclick = e=>{ e.stopPropagation(); togliImmagine(i); };
    card.appendChild(del);
    card.onclick = e=> usaImmagine(i, e.altKey);
    card.ondragstart = e=>{
      _trascinoImg = i; card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/x-sg-img', String(i));
    };
    card.ondragend = ()=>{ _trascinoImg = null; card.classList.remove('dragging'); pulisci(); };
    card.ondragover = e=>{
      if(_trascinoImg === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      const r = card.getBoundingClientRect(), dopo = e.clientX > r.left + r.width/2;
      pulisci(); card.classList.add(dopo ? 'dopo' : 'prima');
    };
    card.ondrop = e=>{
      if(_trascinoImg === null) return;
      e.preventDefault(); e.stopPropagation();
      const r = card.getBoundingClientRect(), dopo = e.clientX > r.left + r.width/2;
      const da = _trascinoImg; _trascinoImg = null; pulisci();
      spostaImmagine(da, i + (dopo ? 1 : 0));
    };
    grid.appendChild(card);
  });
  box.appendChild(grid);
  paintIcons(box);
  return box;
}

/* ==========================================================================
   SELETTORE CON ANTEPRIMA
   Un menu a tendina normale sa mostrare solo testo: "chevron" o
   "top-left + bottom-right" non dicono niente finche' non li provi. Qui il
   bottone apre una griglia di riquadri disegnati, uno per scelta.
   draw(ctx, w, h, valore) e' l'unica cosa che cambia da un uso all'altro.
   ========================================================================== */
let openPop = null;
function closePop(){
  if(openPop && openPop.parentNode) openPop.parentNode.removeChild(openPop);
  openPop = null;
}
document.addEventListener('mousedown', e=>{
  if(openPop && !openPop.contains(e.target) && !e.target.closest('.pick>.cur')) closePop();
});

function miniCanvas(w, h, draw, val){
  const c = document.createElement('canvas');
  c.width = w*2; c.height = h*2;                 /* nitido sugli schermi fitti */
  const g = c.getContext('2d');
  g.scale(2,2);
  try{ draw(g, w, h, val); }catch(err){}
  return c;
}

/* ==========================================================================
   POSIZIONAMENTO PRECISO DEI LIVELLI
   Trascinare a mano va bene per provare, non per rifinire. Qui si aggancia
   il livello a uno dei nove punti della tela, o lo si allinea agli elementi
   che ci sono gia': la fascia nera, la barra colorata, il blocco del titolo.
   Le misure vengono dal disegno vero, non dai numeri teorici, cosi' vale
   anche per i testi, che una larghezza propria non ce l'hanno.
   ========================================================================== */
function measureLayer(l, f){
  /* La misura serve in frazioni della tela, non in pixel: su una Asset page
     4K disegnare a piena risoluzione per sapere dove sta un livello costava
     piu' del disegno stesso. Si misura in scala ridotta, il risultato
     relativo e' lo stesso. */
  f = formatoRidotto(f, 2000);
  const c = scratch(92, f.w, f.h);
  const fPrima = FMT_CORRENTE;
  FMT_CORRENTE = f;              /* i segnaposto valgono anche nella misura */
  let box = null;
  const salvato = l.on;
  l.on = true;
  try{
    box = (l.type==='text') ? drawTextLayer(c, f.w, f.h, l)
        : (l.type==='grid') ? drawGridLayer(c, f.w, f.h, l)
        : drawShape(c, f.w, f.h, l);
  }catch(err){}
  l.on = salvato;
  FMT_CORRENTE = fPrima;
  if(!box) return null;
  return {x:box.x/f.w, y:box.y/f.h, w:box.w/f.w, h:box.h/f.h};
}

/* i riferimenti a cui ci si puo' agganciare, oltre ai bordi della tela */
function anchorTargets(f, L){
  const t = {};
  if(L.band && L.band.on) t.band = {x:L.band.x0, y:L.band.top, w:L.band.x1-L.band.x0, h:1-L.band.top};
  if(L.accent && L.accent.on)
    t.accent = {x:L.accent.x0, y:L.accent.y - L.accent.thick/2,
                w:L.accent.x1-L.accent.x0, h:L.accent.thick};
  if(L.row && L.row.on){
    const b = rowInkBox(f, L, false);
    if(b) t.title = {x:b.left/f.w, y:b.top/f.h, w:(b.right-b.left)/f.w, h:(b.bot-b.top)/f.h};
  }
  if(L.logo && L.logo.on)
    t.logo = {x:L.logo.x, y:L.logo.y, w:L.logo.size*f.h/f.w, h:L.logo.size};
  return t;
}

/* I nove punti di aggancio. Erano scritti con i caratteri di cornice
   (┌ ─ ┐ …) e il font di sistema li rendeva come lettere a caso: adesso
   ognuno e' un riquadrino disegnato con il quadratino nel punto giusto,
   che si capisce a colpo d'occhio. */
const ANCHORS = [
  ['top left',      0,   0  ], ['top',    0.5, 0  ], ['top right',    1, 0  ],
  ['left',          0,   0.5], ['centre', 0.5, 0.5], ['right',        1, 0.5],
  ['bottom left',   0,   1  ], ['bottom', 0.5, 1  ], ['bottom right', 1, 1  ]
];
function disegnaAncora(g, w, h, ax, ay){
  g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,0.28)';
  g.lineWidth = 1;
  g.strokeRect(1.5, 1.5, w-3, h-3);
  const q = Math.max(3, Math.round(Math.min(w,h)*0.34));
  const x = 2 + ax*(w-4-q), y = 2 + ay*(h-4-q);
  g.fillStyle = '#c8c8ce';
  g.fillRect(Math.round(x), Math.round(y), q, q);
}

function layerAnchor(l, f, ax, ay, margin){
  const b = measureLayer(l, f);
  if(!b) return;
  const m = margin===undefined ? (state.ui.margin===undefined ? 0.03 : state.ui.margin) : margin;
  const mx = m, my = m*f.w/f.h;
  /* scarto fra dove sta il disegno e dove sta il punto di ancoraggio del
     livello: per i testi i due non coincidono */
  const dx = l.x - b.x, dy = l.y - b.y;
  const zonaX = 1 - mx*2 - b.w, zonaY = 1 - my*2 - b.h;
  l.x = mx + zonaX*ax + dx;
  l.y = my + zonaY*ay + dy;
}

function layerMatch(l, f, L, key, mode){
  const t = anchorTargets(f, L)[key];
  if(!t) { toast('That element is off'); return; }
  const b = measureLayer(l, f);
  if(!b) return;
  const dx = l.x - b.x, dy = l.y - b.y;
  if(mode === 'box' && l.type !== 'text'){
    l.w = t.w; l.h = t.h; l.x = t.x; l.y = t.y;
    return;
  }
  /* centrato sul riferimento */
  l.x = t.x + (t.w - b.w)/2 + dx;
  l.y = t.y + (t.h - b.h)/2 + dy;
}

/* ==========================================================================
   SELEZIONE MULTIPLA DEI LIVELLI
   Ctrl e clic aggiunge o toglie un livello dalla selezione, Maiusc e clic
   nella lista prende tutto quello che sta in mezzo. Da li' in poi spostare,
   allineare, duplicare, cancellare e cambiare un qualsiasi valore agisce su
   tutti insieme. Il "primo" della selezione resta state.sel: e' quello che
   detta i valori mostrati nel pannello.
   ========================================================================== */
let selMulti = [];              /* id degli altri livelli scelti */

function multiIds(){
  const out = [];
  if(isLay(state.sel)) out.push(state.sel.slice(4));
  selMulti.forEach(id=>{ if(out.indexOf(id) < 0) out.push(id); });
  /* i livelli cancellati non devono restare nella lista */
  const vivi = layersOf(state.layouts[state.active]).map(l=>l.id);
  return out.filter(id=> vivi.indexOf(id) >= 0);
}
function multiLayers(){
  const L = state.layouts[state.active];
  return multiIds().map(id=> layById(id, L)).filter(Boolean);
}
function multiCount(){ return multiIds().length; }

function multiToggle(id){
  if(!isLay(state.sel)){ state.sel = 'lay:'+id; selMulti = []; return; }
  const primo = state.sel.slice(4);
  if(id === primo){
    /* tolgo il primo: il posto passa al successivo, se c'e' */
    if(selMulti.length){ state.sel = 'lay:'+selMulti.shift(); }
    return;
  }
  const i = selMulti.indexOf(id);
  if(i >= 0) selMulti.splice(i, 1);
  else selMulti.push(id);
}
function multiRange(id){
  const list = layersOf(state.layouts[state.active]).map(l=>l.id);
  const a = list.indexOf(isLay(state.sel) ? state.sel.slice(4) : id);
  const b = list.indexOf(id);
  if(a < 0 || b < 0){ state.sel = 'lay:'+id; selMulti = []; return; }
  const lo = Math.min(a,b), hi = Math.max(a,b);
  selMulti = [];
  for(let i=lo;i<=hi;i++) if(list[i] !== list[a]) selMulti.push(list[i]);
}
function multiClear(){ selMulti = []; }

/* Il pannello mostra i valori del primo livello scelto; scrivendone uno,
   lo stesso valore va su tutti quelli selezionati che hanno quel campo.
   E' cosi' che il pannello diventa una modifica di gruppo senza doverne
   scrivere uno apposta. */
function multiApply(path, v){
  if(!isLay(path.split('.')[0])) return false;
  const lay = multiLayers();
  if(lay.length < 2) return false;
  const key = path.slice(path.lastIndexOf('.')+1);
  const primo = lay[0];
  lay.forEach(l=>{
    if(l === primo) return;
    /* solo i campi che il livello ha davvero: un testo non ha "kind" */
    if(Object.prototype.hasOwnProperty.call(l, key)) l[key] = v;
  });
  return true;
}

function pickerRow(r){
  const row = document.createElement('div');
  row.className = 'row';
  const tip = tipFor(r);
  if(tip) row.title = tip;
  const lab = document.createElement('label');
  lab.textContent = r.l;
  row.appendChild(lab);

  const box = document.createElement('div');
  box.className = 'pick';
  const cur = document.createElement('button');
  cur.className = 'cur';
  cur.type = 'button';
  cur.title = tip || ('Pick ' + String(r.l).toLowerCase());
  box.appendChild(cur);

  const paint = ()=>{
    cur.innerHTML = '';
    const v = getVal(r.p);
    cur.appendChild(miniCanvas(30, 16, r.draw, v));
    const t = document.createElement('span');
    t.className = 'lbl';
    t.textContent = r.label ? r.label(v) : String(v);
    cur.appendChild(t);
    const car = document.createElement('span');
    car.className = 'car'; car.textContent = '▾';
    cur.appendChild(car);
  };
  paint();

  cur.onclick = e=>{
    e.stopPropagation();
    const gia = openPop && openPop.dataset.path === r.p;
    closePop();
    if(gia) return;
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.dataset.path = r.p;
    pop.style.gridTemplateColumns = 'repeat(' + (r.cols || 4) + ',1fr)';
    (typeof r.opts === 'function' ? r.opts() : r.opts).forEach(o=>{
      const val = (o && o.v !== undefined) ? o.v : o;
      const nome = (o && o.n !== undefined) ? o.n : String(o);
      const cell = document.createElement('div');
      cell.className = 'opt' + (String(val)===String(getVal(r.p)) ? ' on' : '');
      cell.title = nome;
      cell.appendChild(miniCanvas(64, 30, r.draw, val));
      const cap = document.createElement('span');
      cap.textContent = nome;
      cell.appendChild(cap);
      cell.onclick = ()=>{
        pushUndo();
        setVal(r.p, val);
        closePop(); paint(); render();
        /* cambiando forma cambiano anche le regolazioni che hanno senso */
        if(r.rebuild || guidaAltreRighe(r.p)) buildControls();
      };
      pop.appendChild(cell);
    });
    box.appendChild(pop);
    openPop = pop;
  };

  box.setAttribute('data-path', r.p);
  row.appendChild(box);
  return row;
}

/* --------------------------------------------- i disegni delle anteprime */
function previewShape(g, w, h, kind){
  g.fillStyle = '#1a1a1f'; g.fillRect(0,0,w,h);
  const o = {kind:kind, cut:0.25, cuts:'top-right + bottom-left', skew:0.35,
             count:5, ratio:0.4, armX:0.35, armY:0.5, thick:0.1};
  const m = Math.min(w,h)*0.16;
  g.fillStyle = '#e0e0e4';
  g.strokeStyle = '#e0e0e4';
  g.lineWidth = Math.max(1, Math.min(w,h)*0.09);
  g.lineJoin = 'miter'; g.miterLimit = 12;
  shapePath(g, kind, m, m, w-m*2, h-m*2, o);
  if(kind==='frame') g.fill('evenodd'); else g.fill();
}

function previewCorners(g, w, h, which){
  g.fillStyle = '#1a1a1f'; g.fillRect(0,0,w,h);
  const m = Math.min(w,h)*0.2;
  g.fillStyle = '#e0e0e4';
  cutCornerPath(g, m, m, w-m*2, h-m*2, Math.min(w,h)*0.3, which);
  g.fill();
}

function previewSep(g, w, h, kind){
  g.fillStyle = '#1a1a1f'; g.fillRect(0,0,w,h);
  g.fillStyle = '#e0e0e4';
  const bw = Math.max(2, w*0.14), bh = h*0.62;
  drawSep(g, {sepShape:kind, sepSkew:0.4}, (w-bw)/2, (h-bh)/2, bw, bh);
}

function previewShot(g, w, h, idx){
  g.fillStyle = '#000'; g.fillRect(0,0,w,h);
  const im = shotByIndex(parseInt(idx,10));
  if(!im){
    g.fillStyle = '#3a3a42';
    g.fillRect(w*0.2, h*0.3, w*0.6, h*0.4);
    return;
  }
  const k = Math.max(w/im.width, h/im.height);
  const dw = im.width*k, dh = im.height*k;
  g.drawImage(im, (w-dw)/2, (h-dh)/2, dw, dh);
}

function tipFor(r){
  if(r.tip) return r.tip;
  if(!r.p) return '';
  if(TIP_PATH[r.p]) return TIP_PATH[r.p];
  let k = r.p.slice(r.p.lastIndexOf('.')+1);
  const h = k.indexOf('#'); if(h>=0) k = k.slice(0,h);
  return TIP_KEY[k] || '';
}

/* I comandi che accendono o spengono altre righe: quando cambiano, il
   pannello va rifatto, se no la riga comparsa o sparita si vede solo al
   giro dopo. L'elenco si ricava da solo leggendo le condizioni. */
let _guide = null;
function percorsiGuida(){
  if(_guide) return _guide;
  _guide = {};
  SECTIONS.forEach(s=> (s.rows||[]).forEach(r=>{
    if(!r.when) return;
    String(r.when).replace(/L\.([A-Za-z0-9_]+)\.([A-Za-z0-9_]+)/g,
      (tutto, a, b)=>{ _guide[a+'.'+b] = true; return tutto; });
  }));
  return _guide;
}
function guidaAltreRighe(path){
  if(percorsiGuida()[path]) return true;
  /* i livelli hanno percorsi tipo 'lay:12.gradOn': qui conta il campo, e
     questi quattro accendono e spengono altre righe */
  if(isLay(path)){
    const campo = path.slice(path.lastIndexOf('.')+1);
    return campo==='gradOn' || campo==='boxOn' || campo==='boxStrokeOn' ||
           campo==='kind' || campo==='mode';
  }
  return false;
}

/* condizione di una riga: se c'e' e non e' soddisfatta, la riga non compare */
function rigaServe(r){
  if(!r.when) return true;
  const L = state.layouts[state.active];
  if(!L) return true;
  try{ return !!r.when(L); }catch(e){ return true; }
}

/* quante cifre dopo la virgola merita un cursore: un conteggio a passo uno
   scritto "3.00" sembra un numero che si puo' spezzare, e non e' cosi' */
function decimaliPasso(st){
  const p = Math.abs(Number(st) || 0.01);
  if(p >= 1) return 0;
  if(p >= 0.01) return 2;
  return p >= 0.001 ? 3 : 4;
}

    return d;
  }
  if(r.type==='alignpad'){
    const l = layOfKey(state.sel);
    const wrap = document.createElement('div');
    if(!l) return wrap;
    const f = FORMATS.find(x=>x.id===state.active);

    const arow = document.createElement('div');
    arow.className = 'arow';

    const pad = document.createElement('div');
    pad.className = 'apad';

      const cv2 = document.createElement('canvas');
      cv2.width = 26; cv2.height = 18;
      cv2.style.width = '26px'; cv2.style.height = '18px';
      disegnaAncora(cv2.getContext('2d'), 26, 18, a[1], a[2]);
      bt.appendChild(cv2);
      bt.title = 'Snap to ' + a[0];
      bt.onclick = ()=>{
        pushUndo();
        /* con piu' livelli scelti si agganciano tutti allo stesso punto */
        (multiCount() > 1 ? multiLayers() : [l]).forEach(x=> layerAnchor(x, f, a[1], a[2]));
        syncControls(); render();
      };
      pad.appendChild(bt);
    });
    arow.appendChild(pad);

    const col = document.createElement('div');
    col.className = 'acol';
    const add = (txt, tip, fn)=>{
      const bt = document.createElement('button');
      bt.textContent = txt; bt.title = tip;
      bt.onclick = ()=>{ pushUndo(); fn(); syncControls(); render(); };
      col.appendChild(bt);
    };
    const tg = anchorTargets(f, state.layouts[state.active]);
    add('Fill the canvas', 'Cover the whole format, margins included', ()=>{
      if(l.type==='text'){ layerAnchor(l, f, 0.5, 0.5, 0); return; }
      l.x=0; l.y=0; l.w=1; l.h=1;
    });
    add('Full width', 'As wide as the canvas, keep the height', ()=>{
      if(l.type==='text'){ layerAnchor(l, f, 0.5, 0.5, 0); return; }
      l.x = 0; l.w = 1;
    });
    add('Centre across', 'Centre it sideways, leave the height alone', ()=>{
      const b = measureLayer(l, f);
      if(b) l.x = (1 - b.w)/2 + (l.x - b.x);
    });
    if(tg.band) add('Match the band', 'Same box as the black band',
      ()=> layerMatch(l, f, state.layouts[state.active], 'band', 'box'));
    if(tg.accent) add('Match the accent bar', 'Same box as the coloured bar',
      ()=> layerMatch(l, f, state.layouts[state.active], 'accent', 'box'));
    if(tg.title) add('Centre on the title', 'Same centre as the title block',
      ()=> layerMatch(l, f, state.layouts[state.active], 'title', 'centre'));
    if(tg.logo) add('Centre on the logo', 'Same centre as the logo square',
      ()=> layerMatch(l, f, state.layouts[state.active], 'logo', 'centre'));
    arow.appendChild(col);
    wrap.appendChild(arow);

    /* il margine usato dai nove punti */
    wrap.appendChild(makeRow({p:'ui.margin', l:'Margin', type:'range',
      min:0, max:0.2, step:0.002, tip:'Distance from the edge used by the nine anchors'}));
    return wrap;
  }
  if(r.type==='pick') return pickerRow(r);
  if(r.type==='layerlist'){

    const list = layersOf(L);

    const add = document.createElement('div');
    add.className = 'btnrow';
    add.innerHTML = '<button data-add="shape" title="Add a shape layer">+ Shape</button>' +

      [['up','Move up',   ()=> layerMove(l.id, +1), riga === 0],
       ['down','Move down',()=> layerMove(l.id, -1), riga === list.length-1],

    const sel = layOfKey(state.sel);

    return wrap;
  }
  if(r.type==='preflight'){
    const wrap = document.createElement('div');
    if(!PREVOLO) return wrap;
    if(!PREVOLO.trovati.length){
      const ok = document.createElement('div');
      ok.className = 'hint'; ok.textContent = 'No problems found';
      wrap.appendChild(ok);
      return wrap;
    }
    PREVOLO.trovati.forEach(x=>{
      const d = document.createElement('div');
      d.className = 'chk' + (x.tipo==='errore' ? ' bad' : '');
      d.textContent = (x.formato ? x.formato + ': ' : '') + x.testo;
      const f = FORMATS.find(y=> y.name===x.formato);
      if(f){
        d.title = 'Go to ' + f.group + ' / ' + f.name;
        d.onclick = ()=>{
          state.active = f.id; buildFormats(); buildControls(); render();
        };
      }
      wrap.appendChild(d);
    });
    return wrap;
  }
  if(r.type==='variants'){
    const wrap = document.createElement('div');
    if(!state.variants.length){
      const e = document.createElement('div');
      e.className='hint'; e.textContent='Empty';
      wrap.appendChild(e);
      return wrap;
    }
    state.variants.forEach((v,i)=>{
      const line = document.createElement('div');
      line.className = 'row';
      const b = document.createElement('button');
      b.textContent = v.name; b.style.flex='1';
      b.title = 'Load "' + v.name + '" back onto the canvas';
      if(i===state.currentVariant) b.className='acc';
      b.onclick = ()=> variantLoad(i);
      const rn = document.createElement('button');
      rn.textContent='name'; rn.style.flex='none';
      rn.title = 'Rename this variant';
      rn.onclick = ()=> variantRename(i);
      const dl = document.createElement('button');
      dl.textContent='x'; dl.style.flex='none';
      dl.title = 'Delete this variant. Ctrl+Z brings it back';
      dl.onclick = ()=> variantDelete(i);
      line.appendChild(b); line.appendChild(rn); line.appendChild(dl);
      wrap.appendChild(line);
    });
    return wrap;
  }

  const row = document.createElement('div');
  row.className = 'row' + (r.type==='area'?' full':'');
  const tip = tipFor(r);
  if(tip) row.title = tip;
  /* Alt+clic su una riga rimette il valore di serie: piu' rapido che
     inseguire a mano il numero di partenza dopo aver provato. */
  if(r.p) row.addEventListener('mousedown', e=>{
    if(!e.altKey || e.button !== 0) return;
    const def = defaultVal(r.p);
    if(def === undefined) return;
    e.preventDefault(); e.stopPropagation();
    pushUndo();
    setVal(r.p, def);
    syncControls(); buildControls(); render();
    toast((r.l || r.p) + ' back to ' +
      (typeof def === 'number' ? Math.round(def*1000)/1000 : (def === '' ? 'empty' : def)));
  }, true);
  if(r.type==='button'){
    const spiega = r.tip || (r.act ? ACT_TIP[r.act] : '') || '';
    if(!row.title && spiega) row.title = spiega;
    const b = document.createElement('button');
    b.textContent = r.text; b.style.flex='1';
    /* la spiegazione va anche sul bottone, non solo sulla riga che lo
       contiene: cosi' compare ovunque ci si passi sopra */
    if(spiega) b.title = spiega;
    if(r.wide) b.className = 'acc';
    b.onclick = ()=> runAction(r.act);
    row.appendChild(b);
    return row;
  }
  const lab = document.createElement('label');
  lab.textContent = r.l;
  row.appendChild(lab);
  let inp, valEl=null, gesture=false;

  if(r.type==='range'){
    inp = document.createElement('input'); inp.type='range';
    inp.min=r.min; inp.max=r.max; inp.step=r.step; inp.value = getVal(r.p);
    /* il numero a destra non e' piu' una scritta ma una casella: si puo'
       battere il valore esatto invece di inseguirlo con lo slider.
       Accetta anche valori fuori dai limiti dello slider, entro il doppio,
       perche' a volte serve spingersi oltre. */
    valEl = document.createElement('input');
    valEl.type = 'number'; valEl.className = 'val';
    valEl.step = r.step;
    valEl.title = 'Type an exact value';
    const dec = decimaliPasso(r.step);
    const fmt = v => Number(v).toFixed(dec);
    valEl.value = fmt(getVal(r.p));
    const lo = Math.min(r.min, r.min < 0 ? r.min*2 : 0);
    const hi = r.max * 2;
    inp.oninput = ()=>{
      if(!gesture){ pushUndo(); gesture=true; }
      setVal(r.p, parseFloat(inp.value)); valEl.value = fmt(inp.value); render(); };
    inp.onchange = ()=>{
      gesture=false;
      /* un cursore puo' far comparire o sparire altre righe (i pannelli, il
         numero di separatori): si rifa' il pannello a trascinamento finito,
         non durante, se no il cursore scappa da sotto il dito */
      if(r.p==='shot.panels' || guidaAltreRighe(r.p)) buildControls();
    };
    valEl.onchange = ()=>{
      let v = parseFloat(valEl.value);
      if(isNaN(v)){ valEl.value = fmt(getVal(r.p)); return; }
      v = Math.max(lo, Math.min(hi, v));
      pushUndo();
      setVal(r.p, v);
      valEl.value = fmt(v);
      inp.value = v;                 /* lo slider si ferma al suo limite */
      render();
      if(r.p==='shot.panels' || guidaAltreRighe(r.p)) buildControls();
    };
    valEl.onkeydown = e=>{ if(e.key==='Enter') valEl.blur(); e.stopPropagation(); };
  } else if(r.type==='check'){
    inp = document.createElement('input'); inp.type='checkbox';
    inp.checked = !!getVal(r.p);
    inp.onchange = ()=>{
      pushUndo(); setVal(r.p, inp.checked);
      render();
      if(guidaAltreRighe(r.p)) buildControls();
    };
  } else if(r.type==='color'){
    inp = document.createElement('input'); inp.type='color'; inp.value = getVal(r.p);
    inp.oninput = ()=>{
      if(!gesture){ pushUndo(); gesture=true; }
      setVal(r.p, inp.value);
      if(r.p==='theme.accent') applyAccent(inp.value, state.theme.scope==='this format');
      const h = row.querySelector('[data-hexof]'); if(h) h.textContent = inp.value.toUpperCase();
      render(); };
    inp.onchange = ()=>{ gesture=false; if(r.p==='theme.accent') buildControls(); };
  } else if(r.type==='select'){
    inp = document.createElement('select');
    r.opts.forEach(o=>{
      const op=document.createElement('option');
      op.value=o;
      /* 'Custom (loaded)' da solo non dice quale font sia: se ce n'e' uno
         caricato mostro il nome del file, tenendo lo stesso valore interno */
      op.textContent = (o==='Custom (loaded)' && state.customFont)
        ? 'Custom: '+state.customFont : o;
      /* nei menu dei font ogni voce e' scritta con il suo font:
         e' l'anteprima piu' onesta che un menu di sistema possa dare */
      if(r.opts === FONTS) op.style.fontFamily = fam(o) + ', sans-serif';
      inp.appendChild(op);
    });
    inp.value = getVal(r.p);
    inp.onchange = ()=>{ pushUndo(); setVal(r.p, inp.value); render();
                         avvisaZonaLogo(r.p, inp.value);
                         if(guidaAltreRighe(r.p)) buildControls(); };
    } else if(r.type==='area'){
    inp = document.createElement('textarea');
    inp.value = getVal(r.p) || '';
    inp.oninput = ()=>{
      if(!gesture){ pushUndo(); gesture=true; }
      /* Il titolo su piu' righe cresce verso l'alto e finisce sotto la
         barra accento, che sta ferma. Appena il numero di righe cambia si
         rimette a posto la barra, su tutti i formati.
         Quel riassetto ridisegna tutti e dieci i formati e ne rilegge i
         pixel per il contrasto: senza immagini caricate costa meno di un
         decimo di secondo, ma con gli screenshot dentro sono secondi, e
         cadeva esattamente sul tasto che fa cambiare il numero di righe -
         il primo che si batte su un titolo vuoto. Si scrive, la tastiera si
         inchioda e le lettere dopo si perdono. Adesso aspetta che si smetta
         di scrivere: la barra si sistema un attimo dopo, e intanto il campo
         resta reattivo. */
      const prima = (r.p === 'pack.title') ? titleLines(getVal(r.p)).length : 0;
      setVal(r.p, inp.value);
      if(r.p === 'pack.title' && titleLines(inp.value).length !== prima) rinviaRigheTitolo();
      render();
    };
    inp.onblur = ()=>{ gesture=false; };
  } else {
    inp = document.createElement('input'); inp.type='text';
    inp.value = getVal(r.p) || '';
    inp.oninput = ()=>{ if(!gesture){ pushUndo(); gesture=true; } setVal(r.p, inp.value); render(); };
    inp.onblur = ()=>{ gesture=false; };
  }
  if(r.p) inp.setAttribute('data-path', r.p);
  row.appendChild(inp);
  if(valEl) row.appendChild(valEl);
  if(r.type === 'color' && r.p) aggiungiComandiColore(row, r.p);
  return row;
}
/* Accanto a ogni colore il suo codice: un clic lo copia. Sul secondo colore
   di una coppia (Colour 2, To, Colour right) un bottone scambia i due:
   rosso/blu diventa blu/rosso, valori presi cosi' come sono. */
function compagnoColore(p){
  if(/color2$/.test(p)) return p.replace(/color2$/, 'color');
  if(p === 'theme.gradB') return 'theme.gradA';
  return null;
}
function aggiungiComandiColore(row, p){
  const hex = document.createElement('button');
  hex.className = 'hex'; hex.setAttribute('data-hexof', p);
  hex.textContent = String(getVal(p) || '').toUpperCase();
  hex.title = 'Copy this colour code';
  hex.onclick = ()=>{
    const v = String(getVal(p) || '').toUpperCase();
    const fatto = ()=> toast(v + ' copied');
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(v).then(fatto, ()=> toast('Could not reach the clipboard'));
  };
  row.appendChild(hex);
  const altro = compagnoColore(p);
  if(!altro || getVal(altro) === undefined) return;
  const sw = document.createElement('button');
  sw.className = 'swapc'; sw.title = 'Swap the two colours';
  sw.textContent = '\u21c5';
  sw.onclick = ()=>{
    pushUndo();
    const a = getVal(altro), b = getVal(p);
    setVal(altro, b); setVal(p, a);
    syncControls(); render();
    toast('Colours swapped');
  };
  row.appendChild(sw);
}

/* ============================================== TRASCINAMENTO SUL CANVAS */
let dragging=false, mode='move', dragStart=null;
let GUIDES = {x:null, y:null};

/* punti a cui gli elementi si agganciano: margini, centro, altri elementi */
function snapTargets(axis){
  const t = [0.03, 0.05, 0.5, 0.95, 0.97];
  const L = state.layouts[state.active];
  SEL_PARTS.forEach(pt=>{
    if(pt.key===state.sel || pt.key==='shot') return;
    const el = L[pt.key], pk = POS_KEYS[pt.key];
    if(!el || !el.on) return;
    const k = axis==='x' ? pk.x : pk.y;
    if(k && typeof el[k]==='number') t.push(el[k]);
  });
  layersOf(L).forEach(l=>{
    if(!l.on || 'lay:'+l.id === state.sel) return;
    t.push(axis==='x' ? l.x : l.y);
  });
  if(axis==='y' && L.band.on) t.push(L.band.top);
  return t;
}
function snapTo(v, axis, tol){
  let best = v, dist = tol;
  snapTargets(axis).forEach(t=>{
    const d = Math.abs(v-t);
    if(d < dist){ dist = d; best = t; }
  });
  return {v:best, hit: best!==v || dist<tol ? (dist<tol?best:null) : null};
}
function drawGuides(c, W, H){
  if(GUIDES.x===null && GUIDES.y===null) return;
  const u = Math.max(1, Math.min(W,H)*0.0016);
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.75)';
  c.lineWidth = u; c.setLineDash([u*6, u*5]);
  if(GUIDES.x!==null){ c.beginPath(); c.moveTo(GUIDES.x*W,0); c.lineTo(GUIDES.x*W,H); c.stroke(); }
  if(GUIDES.y!==null){ c.beginPath(); c.moveTo(0,GUIDES.y*H); c.lineTo(W,GUIDES.y*H); c.stroke(); }
  c.restore();
}
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height};
}
function elOf(k){
  if(isLay(k)){ const l = layOfKey(k); return l || {}; }
  if(k === 'shot') return vistaPannello(state.layouts[state.active].shot);
  return state.layouts[state.active][k];
}
/* Lo screenshot visto come elemento e' il pannello scelto: x, y e scale
   leggono e scrivono la sua voce negli elenchi. Cosi' trascinare, la
   maniglia, la rotellina e le frecce passano tutti di qui e non possono
   toccare un altro pannello. */
function vistaPannello(S){
  const i = pannelloAttivo(S);
  return {
    get x(){ return panelVal(S, i, 'px'); }, set x(v){ S.px[i] = v; },
    get y(){ return panelVal(S, i, 'py'); }, set y(v){ S.py[i] = v; },
    get scale(){ return panelVal(S, i, 'sc'); }, set scale(v){ S.sc[i] = v; },
    on: true, panels: S.panels, indice: i
  };
}
/* il pannello sotto il punto, in pixel dell'anteprima */
function pannelloSotto(x, y){
  const S = state.layouts[state.active].shot;
  const n = Math.max(1, Math.round(S.panels||1));
  if(n === 1) return 0;
  for(let i=n-1;i>=0;i--){
    const poly = panelPoly(i, n, PW, PH, S.slant||0, S.gap||0, S);
    let dentro = false;
    for(let a=0, b=poly.length-1; a<poly.length; b=a++){
      const [xa, ya] = poly[a], [xb, yb] = poly[b];
      if((ya > y) !== (yb > y) && x < (xb-xa)*(y-ya)/(yb-ya) + xa) dentro = !dentro;
    }
    if(dentro) return i;
  }
  return pannelloAttivo(S);
}

function startDrag(e){
  if(compareMode) return;
  const p = canvasPos(e);
  const px = p.x*PW, py = p.y*PH;
  const hr = handleRect(PW, PH);
  const onHandle = hr && px>=hr.x && px<=hr.x+hr.w && py>=hr.y && py<=hr.y+hr.h;
  /* col blocco acceso il clic non cambia elemento: si trascina sempre
     quello scelto, anche partendo da sopra un altro */
  if(!onHandle && !selLocked){
    const k = hitTest(px, py);
    /* Sull'immagine: trascinare la sposta. hitTest non torna mai vuoto -
       lo screenshot sta sotto tutto e copre la tela intera - quindi finche'
       questo ramo apriva il rettangolo di selezione, l'immagine non si
       poteva muovere in nessun modo se non con i cursori X e Y.
       Il rettangolo che prende i livelli resta, su Shift. */
    if(k === null || (k === 'shot' && (e.shiftKey || !imgShot))){
      boxSel = {x0:p.x, y0:p.y, x1:p.x, y1:p.y,
                somma: !!(e.ctrlKey || e.metaKey)};
      dragging = false;
      render(); e.preventDefault();
      return;
    }
    if((e.ctrlKey || e.metaKey) && isLay(k)){
      multiToggle(k.slice(4));
      buildControls();
    } else {
      if(!isLay(k) || multiIds().indexOf(k.slice(4)) < 0) multiClear();
      selectEl(k);
    }
  }
  pushUndo();
  /* con la tela divisa si prende il pannello su cui si e' cliccato */
  if(state.sel === 'shot' && !onHandle){
    const S = state.layouts[state.active].shot, prima = pannelloAttivo(S);
    S.active = pannelloSotto(px, py);
    if(S.active !== prima) buildControls();
  }

  const k = state.sel, el = elOf(k), pk = posKeysOf(k), sk = sizeKeyOf(k);
  mode = onHandle ? 'resize' : 'move';
  dragging = true; cv.classList.add('drag');
  const b = (k==='shot') ? {x:0,y:0,w:PW,h:PH} : (BOXES[k]||{x:0,y:0,w:1,h:1});
  /* posizione di partenza di ogni livello scelto, per muoverli insieme */
  const gruppo = multiCount() > 1
    ? multiLayers().map(l=> ({l:l, x:l.x, y:l.y})) : null;
  /* Quanto dista il centro di quello che si vede dal punto che si sta
     trascinando. Serve per agganciare anche il centro, non solo il bordo:
     l'ancora non e' sempre in alto a sinistra (la versione, per dire, e'
     ancorata a destra), quindi lo scarto si misura una volta qui. */
  const offCx = (PW && pk.x) ? (b.x + b.w/2)/PW - el[pk.x] : null;
  const offCy = (PH && pk.y) ? (b.y + b.h/2)/PH - el[pk.y] : null;
  dragStart = {p, k, pk, sk, gruppo, offCx, offCy,
               x: pk.x? el[pk.x] : 0,
               y: pk.y? el[pk.y] : 0,
               size: sk ? el[sk] : 0,
               /* la seconda riga del testo, per farla seguire */
               x2: (k === 'row' && typeof el.x2 === 'number') ? el.x2 : undefined,
               y2: (k === 'row' && typeof el.y2 === 'number') ? el.y2 : undefined,
               h2: (sk==='w' && typeof el.h === 'number') ? el.h : undefined,
               /* la griglia a file automatiche non ha un'altezza propria:
                  quella che si scala e' l'altezza di una fila */
               rh2: (sk==='w' && el.type==='grid' && el.autoRows) ? el.rowH : undefined,
               d0: Math.max(8, Math.hypot(px-b.x, py-b.y)), bx:b.x, by:b.y};
  render(); e.preventDefault();
}
function moveDrag(e){
  if(boxSel){
    const q = canvasPos(e);
    boxSel.x1 = q.x; boxSel.y1 = q.y;
    render(); e.preventDefault();
    return;
  }
  if(!dragging) return;
  const p = canvasPos(e);
  const el = elOf(dragStart.k);
  if(mode==='move'){
    const tol = state.snap.on && !e.altKey ? 0.012 : -1;
    GUIDES = {x:null, y:null};
    /* Aggancio: vince il piu' vicino fra il bordo dell'elemento e il suo
       centro. Con il solo bordo, "mettilo in mezzo alla tela" non si
       trovava mai, perche' il mezzo lo fa il centro, non il bordo. */
    const aggancia = (v, asse, off)=>{
      const r = snapTo(v, asse, tol);
      const dBordo = r.v !== v ? Math.abs(r.v - v) : Infinity;
      let dCentro = Infinity, vCentro = v, gCentro = null;
      if(off !== null && off !== undefined){
        const c = v + off;
        const rc = snapTo(c, asse, tol);
        if(rc.v !== c){ dCentro = Math.abs(rc.v - c); vCentro = rc.v - off; gCentro = rc.v; }
      }
      if(dCentro < dBordo) return {v:vCentro, guida:gCentro};
      if(dBordo < Infinity) return {v:r.v, guida:r.v};
      return {v:v, guida:null};
    };
    if(dragStart.pk.x){
      let v = clamp(dragStart.x + (p.x-dragStart.p.x), -0.5, 1.5);
      if(tol>0){ const a = aggancia(v, 'x', dragStart.offCx); v = a.v; GUIDES.x = a.guida; }
      el[dragStart.pk.x] = v;
    }
    if(dragStart.pk.y){
      let v = clamp(dragStart.y + (p.y-dragStart.p.y), -0.5, 1.5);
      if(tol>0){ const a = aggancia(v, 'y', dragStart.offCy); v = a.v; GUIDES.y = a.guida; }
      el[dragStart.pk.y] = v;
    }
    /* La riga di testo e' fatta di due pezzi: il titolo (x, y) e il brand
       con la categoria (x2, y2), che nella modalita' impilata stanno sopra.
       Trascinando si muoveva solo il primo e l'altro restava piantato dove
       era: qui la seconda riga segue la prima dello stesso tratto. */
    if(dragStart.k === 'row' && dragStart.x2 !== undefined){
      const dx = el.x - dragStart.x, dy = el.y - dragStart.y;
      el.x2 = clamp(dragStart.x2 + dx, -0.5, 1.5);
      el.y2 = clamp(dragStart.y2 + dy, -0.5, 1.5);
    }
    /* gli altri livelli scelti seguono lo stesso spostamento */
    if(dragStart.gruppo && dragStart.gruppo.length > 1){
      const dx = (dragStart.pk.x ? el[dragStart.pk.x] - dragStart.x : 0);
      const dy = (dragStart.pk.y ? el[dragStart.pk.y] - dragStart.y : 0);
      dragStart.gruppo.forEach((g,i)=>{
        if(i===0) return;
        g.l.x = clamp(g.x + dx, -0.5, 1.5);
        g.l.y = clamp(g.y + dy, -0.5, 1.5);
      });
    }
  } else if(dragStart.sk){
    /* La misura si prende lungo la direzione in cui si e' afferrata la
       maniglia, con il segno. Prima si usava la distanza secca: tirando
       la maniglia OLTRE l'angolo dell'elemento la distanza ricominciava a
       crescere e l'elemento, invece di farsi piccolo, saltava al massimo. */
    const ux = dragStart.p.x*PW - dragStart.bx, uy = dragStart.p.y*PH - dragStart.by;
    const len = Math.max(1, Math.hypot(ux, uy));
    const vx = p.x*PW - dragStart.bx, vy = p.y*PH - dragStart.by;
    const d = (vx*ux + vy*uy) / len;
    const factor = clamp(d/dragStart.d0, 0.05, 20);
    const mx = sizeMaxOf(dragStart.k);
    el[dragStart.sk] = clamp(dragStart.size*factor, 0.002, mx);
    /* i livelli forma hanno larghezza e altezza separate: la maniglia
       deve scalarle insieme, se no si deformano trascinando */
    if(dragStart.h2 !== undefined){
      el.h = clamp(dragStart.h2*factor, 0.002, mx);
    }
    if(dragStart.rh2 !== undefined){
      el.rowH = clamp(dragStart.rh2*factor, 0.005, 0.5);
    }
  }
  render(); e.preventDefault();
}
function endDrag(){
  if(boxSel){
    const presi = livelliNelRiquadro();
    const grande = Math.abs(boxSel.x1-boxSel.x0)*PW > 4 &&
                   Math.abs(boxSel.y1-boxSel.y0)*PH > 4;
    const somma = boxSel.somma;
    boxSel = null;
    if(grande){
      if(!somma) multiClear();
      if(presi.length){
        if(!somma || !isLay(state.sel)){
          state.sel = 'lay:' + presi[0];
          selMulti = presi.slice(1);
        } else {
          presi.forEach(id=>{
            if(id !== state.sel.slice(4) && selMulti.indexOf(id) < 0) selMulti.push(id);
          });
        }
        toast(multiCount() + ' layer' + (multiCount()===1?'':'s') + ' selected');
      } else if(!somma && layersOf(state.layouts[state.active]).length){
        toast('Nothing inside the box');
      }
      buildControls();
    }
    render();
    return;
  }
  if(!dragging) return;
  dragging=false; cv.classList.remove('drag');
  GUIDES = {x:null, y:null};
  syncControls(); render();
}

cv.addEventListener('mousemove', e=>{
  if(dragging || compareMode) return;
  const p = canvasPos(e);
  const k = selLocked ? null : hitTest(p.x*PW, p.y*PH);
  const hr = handleRect(PW, PH);
  const sopraManiglia = hr && p.x*PW>=hr.x && p.x*PW<=hr.x+hr.w &&
                              p.y*PH>=hr.y && p.y*PH<=hr.y+hr.h;
  cv.style.cursor = sopraManiglia ? 'nwse-resize' : (selLocked ? 'grab' : 'pointer');
  if(k !== HOVER){ HOVER = k; render(); }
});
