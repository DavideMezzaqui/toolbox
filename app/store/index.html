  :root{
    --bg:#101012; --panel:#18181a; --panel2:#202024; --line:#2e2e33;
    --txt:#e6e6e8; --dim:#8a8a90;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 14px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  /* filo verticale fra i gruppi di bottoni, non uno spazio elastico:
     prima i gruppi si allontanavano fino ai bordi opposti dello schermo */
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
  .grow{flex:1;min-width:8px}
  /* nome del progetto e stato del salvataggio, accanto a Save: si legge,
     non chiama l'attenzione */
  .projinfo{font-size:11px;color:var(--dim);white-space:nowrap;max-width:300px;
    overflow:hidden;text-overflow:ellipsis;margin-left:4px}
  .projinfo b{color:var(--txt);font-weight:500}
  .projinfo .auto{transition:color .6s}
  .projinfo .auto.lampo{color:#c8c8ce}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12px}
  button:hover{border-color:#4a4a52;background:#26262b}
  button.acc{background:#e6e6e8;border-color:#e6e6e8;color:#101012;font-weight:600}
  button.acc:hover{background:#fff}
  main{display:flex;height:calc(100vh - 53px);min-height:0}
  aside{width:262px;flex:none;overflow-y:auto;background:var(--panel);padding:10px}
  aside.right{width:342px;border-left:1px solid var(--line)}
  aside.left{border-right:1px solid var(--line)}
  #stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:9px;overflow:auto}
  #cvwrap{position:relative;overflow:hidden;display:flex;align-items:center;
     justify-content:center;max-width:100%;max-height:calc(100vh - 172px)}
  #cv{max-width:100%;max-height:calc(100vh - 172px);background:#000;border:1px solid var(--line);
     cursor:grab;touch-action:none;transform-origin:50% 50%}
  #cv.drag{cursor:grabbing}
  #cvwrap.panning #cv{cursor:move}
  /* velo che compare quando si trascina un file sopra la finestra */
  #dropzone{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
     background:rgba(10,10,12,.72);border:2px dashed #8a8a94;pointer-events:none;z-index:5}
  #dropzone.on{display:flex}
  #dropzone span{font-size:13px;letter-spacing:.06em;color:#e8e8ec;text-align:center;
     padding:10px 16px;border-radius:6px;background:rgba(0,0,0,.55)}
  .stagebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--dim)}
  .grp{margin-bottom:12px}
  .grp h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .fmt{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
  .fmt:hover{background:var(--panel2)}
  .fmt.on{background:var(--panel2);border-color:#5a5a62}
  .fmt canvas.th{flex:none;background:#000;border:1px solid var(--line);
     border-radius:3px;image-rendering:auto}
  /* sopra una certa misura l'anteprima va sopra il nome, non di fianco:
     di fianco resterebbero due dita di spazio per la scritta */
  .fmt.big{flex-direction:column;align-items:stretch;gap:5px;padding:7px}
  .fmt.big canvas.th{width:100%;height:auto}
  .fmt.big .top{display:flex;align-items:center;gap:7px}
  .thumbbar{display:flex;align-items:center;gap:5px;margin-bottom:9px;
            font-size:10px;color:var(--dim)}
  .thumbbar button{padding:3px 7px;font-size:11px;line-height:1}
  .thumbbar span{flex:1}
  .fmt .nm{flex:1;min-width:0}
  .fmt .nm b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fmt .nm i{font-style:normal;color:var(--dim);font-size:10px}
  .fmt select.res{flex:none;width:54px;background:var(--bg);color:var(--txt);
    border:1px solid var(--line);border-radius:4px;padding:1px 2px;font:9px inherit}
  /* con le anteprime grandi il menu della risoluzione va sotto il nome,
     se no mangia lo spazio della scritta e il nome viene troncato */
  .fmt.big select.res{width:auto;align-self:flex-start;font:10px inherit;padding:2px 4px}
  input[type=range]{accent-color:#9a9aa2}
  /* La casella di serie, su un pannello scuro, e' bianca quando e' SPENTA e
     grigia quando e' accesa: al primo colpo d'occhio sembra il contrario.
     Qui la si disegna come tutto il resto: vuota e scura quando e' spenta,
     chiara con il segno quando e' accesa. */
  input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;
    width:13px;height:13px;flex:none;position:relative;cursor:pointer;
    border:1px solid var(--line);border-radius:3px;background:var(--bg)}
  input[type=checkbox]:hover{border-color:#6a6a74}
  input[type=checkbox]:focus-visible{outline:1px solid #8a8a94;outline-offset:1px}
  input[type=checkbox]:checked{background:#c8c8ce;border-color:#c8c8ce}
  input[type=checkbox]:checked::after{content:'';position:absolute;
    left:4px;top:1px;width:3px;height:7px;border:solid #101012;
    border-width:0 2px 2px 0;transform:rotate(45deg)}
  /* Le barre di scorrimento di serie sono chiare e saltano all'occhio piu'
     del disegno. Qui sono sottili e dello stesso grigio dei bordi. */
  *{scrollbar-width:thin;scrollbar-color:#3a3a42 transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#33333b;border-radius:5px;
     border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#45454f}
  ::-webkit-scrollbar-corner{background:transparent}
  .sec{border:1px solid var(--line);border-radius:6px;margin-bottom:5px;overflow:hidden}
  .sec>.hd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel2);cursor:pointer;user-select:none}
  .sec>.hd b{flex:1;font-size:12px;font-weight:600}
  .sec>.hd span{color:var(--dim);font-size:14px;line-height:1}
  .sec>.bd{padding:8px 9px;display:none}
  .sec.open>.bd{display:block}
  .sec.open>.hd{background:#282830}
  .sec>.hd>svg.ic{opacity:.6}
  .sec.open>.hd>svg.ic{opacity:1}
  .sec>.hd:hover>svg.ic{opacity:.9}
  .row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .row label{width:80px;flex:none;color:var(--dim);font-size:11px}
  /* Slider: riga sottile e cursore quadrato. Quello di serie del browser e'
     un tondo grosso che fa pesare ogni riga, e in un pannello con duecento
     controlli si vede. */
  /* barra sopra la tela: due gradini di risparmio, prima le etichette dei
     bottoni con icona, poi i divisori e i margini */
  #tools.compatta button.conIcona span{display:none}
  #tools.compatta button.conIcona{padding-left:7px;padding-right:7px}
  #tools.strettissima{gap:2px;padding:4px}
  #tools.strettissima button{padding:5px 6px}
  #tools.strettissima .tsep{display:none}
  .row input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;
     height:13px;background:transparent;cursor:pointer}
  .row input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3a3a42}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;
     margin-top:-3.5px;background:#9a9aa2;border:0;border-radius:1px}
  .row input[type=range]:hover::-webkit-slider-thumb{background:#c9c9d0}
  .row input[type=range]:active::-webkit-slider-thumb{background:#e8e8ec}
  .row input[type=range]:focus-visible::-webkit-slider-thumb{outline:1px solid #8a8a94;outline-offset:1px}
  .row input[type=range]::-moz-range-track{height:2px;background:#3a3a42}
  .row input[type=range]::-moz-range-thumb{width:9px;height:9px;background:#9a9aa2;
     border:0;border-radius:1px}
  .row input[type=range]:hover::-moz-range-thumb{background:#c9c9d0}
  .row input[type=range]:active::-moz-range-thumb{background:#e8e8ec}
  .row input[type=color]{width:28px;height:17px;padding:0;border:1px solid var(--line);background:none;border-radius:2px;cursor:pointer}
  .row input[type=text],.row textarea,.row select{flex:1;min-width:0;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:12px inherit}
  .row textarea{resize:vertical;height:42px}
  .row input.val{width:52px;flex:none;text-align:right;color:var(--dim);
    font:10px/1.4 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;
    background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 3px;
    -moz-appearance:textfield}
  .row input.val::-webkit-outer-spin-button,
  .row input.val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .row input.val:hover{border-color:var(--line)}
  .row input.val:focus{border-color:#8a8a94;color:var(--txt);background:var(--bg);outline:none}
  .full{display:block}
  .full label{display:block;width:auto;margin-bottom:4px}
  /* In una riga a blocco il "flex:1" non vale piu' niente e la casella
     tornava alla sua larghezza di serie, una ventina di caratteri: il
     titolo, che e' il campo che si scrive di piu', veniva meta' degli
     altri. Qui si prende tutta la riga, come tutto il resto. */
  .full textarea,.full input[type=text]{width:100%;box-sizing:border-box}
  .hint{color:var(--dim);font-size:10px;margin:-2px 0 8px}
  /* esito del controllo prima dell'export: una riga per cosa da guardare */
  .chk{font-size:11px;line-height:1.45;padding:3px 6px;margin-bottom:2px;border-radius:3px;
     background:var(--panel2);color:var(--dim);cursor:default}
  .chk.bad{color:#e8e8ec;border-left:2px solid #b9b9c2}
  .chk[title]{cursor:pointer}
  .chk[title]:hover{background:#33333c}
  .swatches{display:flex;gap:4px;flex:1;flex-wrap:wrap}
  .grads{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 4px}
  .gr{width:34px;height:15px;padding:0;flex:none;border-radius:3px;
      border:1px solid var(--line);cursor:pointer}
  .gr.on{outline:1px solid #e8e8ec;outline-offset:1px}
  .sw{width:18px;height:18px;padding:0;flex:none;border-radius:3px;border:1px solid var(--line)}
  .row button.hex{flex:none;padding:1px 4px;font:10px/1.4 ui-monospace,Consolas,monospace;
     color:var(--dim);background:transparent;border:1px solid transparent}
  .row button.hex:hover{border-color:var(--line);color:var(--txt)}
  .row button.swapc{flex:none;padding:0 5px;font-size:12px;line-height:16px}
  .sw.on{outline:1px solid #e8e8ec;outline-offset:1px}
  /* titoletto che divide i controlli in gruppi dentro una sezione */
  .grp2{display:flex;align-items:center;gap:7px;margin:11px 0 6px;
        font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#7d7d88}
  .grp2:first-child{margin-top:2px}
  .grp2::after{content:'';flex:1;height:1px;background:var(--line)}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .btnrow button{flex:1 1 auto;min-width:0;padding:6px 8px;font-size:11px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
  .pgrid button{padding:6px 4px;font-size:11px}

  /* --- icone: SVG semplici, nessuna emoji --- */
  svg.ic{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;
         stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;
         display:block;opacity:.85}
  button:hover svg.ic{opacity:1}
  button.on svg.ic{opacity:1}
  /* testo e icona sulla stessa linea di base, e il testo non va mai a capo */
  header button,.toolbar button,.btnrow button{display:inline-flex;align-items:center;
    justify-content:center;gap:6px;white-space:nowrap}

  /* --- barra strumenti sopra la tela --- */
  .toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;
           background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
  .toolbar button{padding:5px 9px;font-size:11px}
  .toolbar button.on{background:#e6e6e8;border-color:#e6e6e8;color:#101012}
  .toolbar .tsep{width:1px;height:18px;background:var(--line);margin:0 3px}

  /* --- schede del pannello destro --- */
  .tabs{display:flex;gap:3px;margin-bottom:8px}
  .tabs button{flex:1;padding:6px 2px;font-size:11px;border-radius:5px}
  .tabs button.on{background:#e6e6e8;border-color:#e6e6e8;color:#101012;font-weight:600}

  /* --- griglia di ancoraggio dei livelli --- */
  .apad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:96px;flex:none}
  .apad button{padding:0;height:24px;line-height:0;color:var(--dim);
     display:flex;align-items:center;justify-content:center}
  .apad button:hover{border-color:#5a5a62}
  .apad button canvas{display:block}
  .arow{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
  .acol{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .acol button{padding:4px 6px;font-size:10px;text-align:left}

  /* --- selettore con anteprima disegnata --- */
  .pick{position:relative;flex:1;min-width:0}
  .pick>.cur{width:100%;display:flex;align-items:center;
             justify-content:space-between;padding:4px 7px;gap:7px}
  .pick>.cur canvas{width:30px;height:16px;flex:none;background:var(--bg);border-radius:2px}
  .pick>.cur .lbl{flex:1;min-width:0;text-align:left;overflow:hidden;
                  text-overflow:ellipsis;white-space:nowrap}
  .pick>.cur .car{color:var(--dim);font-size:9px;flex:none}
  .pick .pop{position:absolute;z-index:50;top:calc(100% + 3px);left:0;right:0;
    background:var(--panel2);border:1px solid #4a4a52;border-radius:6px;padding:5px;
    display:grid;gap:4px;max-height:250px;overflow-y:auto;
    box-shadow:0 8px 22px rgba(0,0,0,.55)}
  .pick .opt{border:1px solid transparent;border-radius:4px;cursor:pointer;
             background:var(--bg);padding:2px;overflow:hidden}
  .pick .opt:hover{border-color:#6a6a74}
  .pick .opt.on{border-color:#e6e6e8}
  .pick .opt canvas{display:block;width:100%;height:30px}
  .pick .opt span{display:block;font-size:8.5px;color:var(--dim);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:1px}

  /* --- immagini del progetto, sempre in vista in cima al pannello --- */
  #imgs{position:sticky;top:-10px;z-index:4;background:var(--panel);
        margin:-10px -10px 8px;padding:9px 10px 8px;border-bottom:1px solid var(--line)}
  #imgs .ih{display:flex;align-items:center;gap:5px;margin-bottom:6px}
  #imgs .ih b{flex:1;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
  #imgs .ih button{padding:3px 7px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
  #imgs .vuoto{border:1px dashed #3a3a42;border-radius:5px;padding:10px;text-align:center;
        color:var(--dim);font-size:11px;cursor:pointer}
  #imgs .vuoto:hover{border-color:#6a6a74;color:var(--txt)}
  .lib{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:168px;overflow-y:auto;padding:2px}
  .lib .card{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;
             background:#000;cursor:pointer;user-select:none}
  .lib .card:hover{border-color:#6a6a74}
  /* in uso su questo formato: bordo chiaro; nel pannello scelto: anello pieno */
  .lib .card.usata{border-color:#8a8a94}
  .lib .card.on{border-color:#fff;box-shadow:0 0 0 1px #fff}
  .lib .card.dragging{opacity:.3}
  .lib .card.prima{box-shadow:-3px 0 0 #e6e6e8}
  .lib .card.dopo{box-shadow:3px 0 0 #e6e6e8}
  .lib .card canvas{display:block;width:100%;height:38px}
  .lib .card .num{position:absolute;top:1px;left:1px;background:rgba(0,0,0,.72);
                  color:#e6e6e8;font-size:9px;padding:0 3px;border-radius:2px;
                  font-variant-numeric:tabular-nums}
  .lib .card .pan{position:absolute;bottom:1px;left:1px;background:#e6e6e8;color:#101012;
                  font-size:8px;font-weight:700;padding:0 3px;border-radius:2px}
  .lib .card .del{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.72);
                  border:none;color:#e6e6e8;padding:2px 3px;border-radius:2px;
                  line-height:0;cursor:pointer;opacity:0}
  .lib .card:hover .del{opacity:1}
  .lib .card .del:hover{background:#c04040}
  /* blocco di un pannello: quello scelto si riconosce */
  .pblk{border:1px solid var(--line);border-radius:5px;padding:6px 7px 3px;margin-bottom:6px;cursor:pointer}
  .pblk.on{border-color:#8a8a94;background:#1d1d22}
  .pblk .ph{font-size:10px;color:var(--dim);margin-bottom:4px;letter-spacing:.06em}
  .pblk.on .ph{color:var(--txt)}

  /* --- lista dei livelli --- */
  .layrow{display:flex;align-items:center;gap:4px;padding:4px 5px;border-radius:5px;
          border:1px solid transparent;cursor:pointer;margin-bottom:3px;background:var(--bg)}
  .layrow:hover{background:var(--panel2)}
  .layrow.on{border-color:#6a6a74;background:var(--panel2)}
  /* gli altri livelli della selezione multipla: segno piu' leggero */
  .layrow.sel2{border-color:#4e4e58;background:#232329}
  .layrow.on .lname{color:#fff}
  .layrow .lname{flex:1;min-width:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .layrow .ltag{color:var(--dim);font-size:9px;letter-spacing:.06em;text-transform:uppercase}
  button.lbtn{padding:3px 4px;background:none;border:1px solid transparent;color:var(--dim)}
  button.lbtn:hover{border-color:var(--line);color:var(--txt);background:var(--panel2)}
  /* una freccia che non ha dove andare si vede che e' spenta */
  button.lbtn:disabled{opacity:.28;cursor:default}
  button.lbtn:disabled:hover{border-color:transparent;color:var(--dim);background:none}

  /* --- scorciatoie sempre visibili --- */
  .keys{font-size:10px;color:var(--dim);line-height:1.7;margin-top:10px;
        border-top:1px solid var(--line);padding-top:8px}
  .keys b{color:#c8c8ce;font-weight:600;font-family:ui-monospace,Consolas,monospace}
  .keys div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid #4a4a52;padding:9px 15px;border-radius:6px;opacity:0;transition:.25s;pointer-events:none;font-size:12px}
  #toast.on{opacity:1}
  @media(max-width:900px){
    main{flex-direction:column;height:auto}
    aside,aside.right{width:100%;border:none;border-top:1px solid var(--line)}
    /* In colonna la tela va per prima: e' quello che si guarda. Prima
       veniva dopo l'elenco delle anteprime, alto quasi mille pixel, e per
       vedere la grafica bisognava scorrere. */
    #stage{order:-1}
    /* e l'elenco non si prende mezza pagina: scorre per conto suo */
    aside.left{max-height:40vh;overflow:auto}
    #cv{max-height:52vh}
  }
</style>
</head>
<body>

<input type="file" id="fImg" accept="image/*" multiple hidden>

<script>
"use strict";
/* ============================================================================
   STORE GRAPHICS
   Generatore di grafiche per Unity Asset Store, Fab e social.
   Misure e stile ricavati dal PSD "Store Screenshots PSD 2".

   versione 1.0

   -------------------------------------------------------------------------
   COME SI ESTENDE
   -------------------------------------------------------------------------
   AGGIUNGERE UN FORMATO      una riga in FORMATS. Nient'altro.
   AGGIUNGERE UN ELEMENTO     una voce in PARTS: chiave, etichetta, valori di
                              default, funzione di disegno, righe del pannello.
                              Pannello, selezione, trascinamento, ridimensiona-
                              mento, undo, preset ed export si agganciano da soli.
   AGGIUNGERE UN CONTROLLO    una riga nell'array rows della sua voce in PARTS.
   AGGIUNGERE UN EFFETTO      un campo in PARTS.fx.defaults e la riga nel pannello,
                              poi usalo dentro paintShot.
   CAMBIARE ORDINE DI DISEGNO il campo order in PARTS (piu basso = piu sotto).

   Ogni voce di PARTS accetta:
     key        nome del gruppo dentro il layout
     label      nome mostrato nella barra sotto l'anteprima
     section    titolo della sezione nel pannello (se manca, nessuna sezione)
     order      ordine di disegno, crescente
     select     true se si puo selezionare e trascinare sul canvas
     pos        {x:'campoX', y:'campoY'} oppure null, per il trascinamento
     size       nome del campo ridimensionabile con maniglia e rotellina
     sizeMax    limite superiore di quel campo
     defaults   funzione (P) che ritorna i valori iniziali
     draw       funzione (c, W, H, L, preview) che disegna e ritorna il riquadro
     rows       righe del pannello
     note       testo di aiuto sotto il titolo della sezione
   ============================================================================ */

const APP = {version:'6.3'};

/* ---------------------------------------------------------------- FORMATI */
const FORMATS = [
  {id:'unity_cover', group:'Unity Asset Store', name:'Cover',      w:1950, h:1300, profile:'wide', note:'title + tagline + logo'},
  {id:'unity_shot',  group:'Unity Asset Store', name:'Asset page', w:3840, h:2160, profile:'asset',
   note:'product page screenshots', sizes:[[3840,2160,'4K'],[1920,1080,'1080p']]},
  {id:'unity_card',  group:'Unity Asset Store', name:'Card',       w:420,  h:280,  profile:'small',note:'title and logo only'},
  /* Il manuale Unity, sulla pagina dei dettagli del pacchetto, dice per
     queste due immagini "This image shouldn't contain text". Sulla Card
     ammette il titolo e il nome o logo dell'editore, sulla Cover anche una
     riga di sottotitolo. Il flag serve al controllo prima dell'export. */
  {id:'unity_icon',  group:'Unity Asset Store', name:'Icon',       w:160,  h:160,  profile:'tiny', note:'no text allowed by Unity', senzaTesto:true},
  {id:'unity_social',group:'Unity Asset Store', name:'Social',     w:1200, h:630,  profile:'wide', note:'no text allowed by Unity', senzaTesto:true},
  {id:'yt_thumb',    group:'YouTube',           name:'Thumbnail',  w:1920, h:1080, profile:'big'},
  {id:'fab_thumb',   group:'Fab',               name:'Thumbnail',  w:1920, h:1080, profile:'wide'},
  {id:'fab_gallery', group:'Fab',               name:'Gallery',    w:1920, h:1080, profile:'wide'},
];
/* Post 1:1 e Story 9:16 tolti perche' non servono. La regola per i formati
   alti resta dov'e': si accende sul rapporto (h > w*1.6), non sull'id, e
   quindi torna da sola se un giorno un formato verticale rientra qui. */
/* i quattro formati che vengono dal PSD non vanno riscalati */

   del PSD senza riscalarli */
const FROM_PSD = ['unity_cover','unity_shot','unity_card','unity_icon','yt_thumb'];
/* SPESSORE DELLA BARRA ACCENTO, PRESO DAL PSD
   Misurato sugli artboard: Cover 10 px su 1950, Asset page 30 px su 3840,
   Youtube Thumbnail 23 px su 3840 (nel PSD quell'artboard e' 4K, il tool lo
   esporta a 1920 e la proporzione resta la stessa). E' detto in frazione
   della LARGHEZZA perche' e' cosi' che si confrontano due grafiche di forma
   diversa: guardate alla stessa larghezza, la linea deve essere quella.
   I formati che il PSD non ha seguono la Cover, che e' il riferimento
   generale. Card e Icon non entrano qui: li' la barra non e' una linea ma
   il fondo colorato del brand, e ha i suoi valori. */
/* L'Asset page nel PSD ha la barra a 30 px su 3840, cioe' meta' piu' spessa
   della Cover a parita' di larghezza. Guardate una accanto all'altra la
   Asset page sembrava un'altra grafica, quindi qui segue la Cover: 20 px
   su 3840 invece di 30. E' l'unico punto in cui si stacca dal PSD di
   proposito. */
const ACCENT_W = {unity_cover:0.005128, unity_shot:0.003333, yt_thumb:0.005400};
const ACCENT_W_ALTRI = 0.005128;
/* Sotto questo raggio l'alone della barra si sfoca direttamente sulla tela.
   Sopra si passa da una tela ridotta, che costa un decimo: a 4K, con la

   per ogni export. */
const RAGGIO_PICCOLO = 14;

const FONTS = ['Turret Road','Impact','Arial Black','Arial','Bebas Neue','Oswald','Montserrat',

   farebbe solo finta, il browser li simulerebbe ingrassando il 500 */
const WEIGHTS = ['200','300','400','500','700','800'];
const CORNERS = ['none','all','top-left + bottom-right','top-right + bottom-left',

/* Coppie pronte per il gradiente del tema: si scelgono con un clic e

const GRADIENTI = [

  ['Gold',       '#ffe066', '#f2a104'], ['Sunset',    '#ff9a3c', '#ff3d5e'],
  ['Ember',      '#ff6b35', '#c1121f'], ['Rust',      '#e86a33', '#8a2b06'],

  ['Ice',        '#bfe9ff', '#4fa8e0'], ['Deep sea',  '#43c6ac', '#191654'],
  ['Teal',       '#2fe1c6', '#0a8f8f'], ['Aqua',      '#5ff0d8', '#0e7490'],
  ['Mint',       '#a8f0c6', '#1f9e6e'], ['Emerald',   '#5be49b', '#0b7a4b'],
  ['Forest',     '#86d07a', '#1b5e20'], ['Lime',      '#d9f99d', '#4d9b1a'],
  ['Toxic',      '#c7f464', '#16a085'], ['Cyberpunk', '#00f5d4', '#ff006e'],
  ['Heat',       '#ffd166', '#ef476f'], ['Bronze',    '#d6b27a', '#7a5320'],
  ['Silver',     '#edeff3', '#9ba3b0'], ['Steel',     '#c7cbd4', '#5a6172'],
  ['Graphite',   '#9aa0ac', '#3a3f4b'], ['Charcoal',  '#6b7280', '#1f2430'],
  ['Mono light', '#ffffff', '#8a8a95'], ['Mono dark', '#5a5a66', '#121216']
];

/* colori presi dal PSD */
const C = {band:'#0d0d0d', accent:'#ffb600', accentAlt:'#f8a718',
           text:'#efefef', dark:'#060606', badgeBg:'#181818',

function icon(name){
  const ns = 'http://www.w3.org/2000/svg';
  const sv = document.createElementNS(ns, 'svg');
  sv.setAttribute('class','ic');
  sv.setAttribute('viewBox','0 0 16 16');
  const pa = document.createElementNS(ns, 'path');
  pa.setAttribute('d', ICONS[name] || ICONS.grid);
  sv.appendChild(pa);
  return sv;
}
/* mette l'icona davanti al testo dei bottoni che la chiedono con data-ic */
function paintIcons(root){
  (root || document).querySelectorAll('[data-ic]').forEach(b=>{
    if(b.querySelector('svg.ic')) return;
    b.insertBefore(icon(b.getAttribute('data-ic')), b.firstChild);
  });
}

/* ------------------------------------------------------------ UTILITA' */
/* il gradiente della barra: due colori, inclinabile. Se il gradiente e'
   spento resta il colore singolo, cosi' il resto del codice non cambia */
/* I due capi del gradiente di una parte: se segue il tema li prende da
   la', se no usa i suoi. Il controllo su theme.gradA serve ai preset
   salvati prima che il tema avesse la coppia. */
function gradEnds(o){
  const t = state.theme;
  return (o.gradLink && t && t.gradA) ? [t.gradA, t.gradB || o.color2]
                                      : [o.color, o.color2];
}
function gradPaint(c, o, x, y, w, h){
  const ends = gradEnds(o);
  if(!o.gradOn || !ends[1]) return ends[0];
  const ang = (o.gradAngle||0) * Math.PI/180;
  const dx = Math.cos(ang)*w/2, dy = Math.sin(ang)*w/2;
  const cx = x + w/2, cy = y + h/2;
  const g = c.createLinearGradient(cx-dx, cy-dy, cx+dx, cy+dy);
  g.addColorStop(0, ends[0]);
  g.addColorStop(1, ends[1]);
  return g;
}
function accentPaint(c, a, x, y, w, t){ return gradPaint(c, a, x, y, w, t); }
/* Il bordo del logo prende il colore da cui parte il gradiente del tema:
   nel PSD e' lo stesso arancione con cui comincia la barra accento, e
   tenerli legati vuol dire non doverli piu' rincorrere a mano. */
function logoOutColor(l){
  return (l.outLink && state.theme && state.theme.gradA) ? state.theme.gradA : l.outColor;
}

const FONT_MIO = 'Custom (loaded)';
function fam(n){ return n===FONT_MIO ? '"UserFont"' : '"'+n+'"'; }
/* Il file del font non entra nel preset, ci entra solo il suo nome: chi
   riapre il preset domani, o su un altro computer, si ritrova le scritte
   con un altro carattere e non c'e' niente che glielo dica. Questa
   funzione risponde a "qualcuno sta chiedendo il font caricato?", e chi la
   chiama avvisa. */
/* "a, b e c": un elenco scritto come lo direbbe una persona */
function elencaCose(a){
  if(!a || !a.length) return '';
  return a.length > 1 ? a.slice(0,-1).join(', ') + ' and ' + a[a.length-1] : a[0];
}
function chiedonoIlFontMio(){
  let quanti = 0;
  FORMATS.forEach(f=>{
    const L = state.layouts[f.id];
    if(!L) return;
    const guarda = o=>{
      if(!o || typeof o !== 'object') return;
      ['font','titleFont','itemFont'].forEach(k=>{ if(o[k] === FONT_MIO) quanti++; });
    };
    Object.keys(L).forEach(g=>{
      if(g === 'layers') (L.layers||[]).forEach(guarda);
      else guarda(L[g]);
    });
  });
  return quanti;
}
function hex2rgb(h){
  const n = parseInt(String(h).replace('#',''),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
function setFont(c, font, weight, px, track){
  c.font = weight+' '+px+'px '+fam(font)+', sans-serif';
  if('letterSpacing' in c) c.letterSpacing = (px*track)+'px';
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

const _scratch = [];
function scratch(i, W, H){
  if(!_scratch[i]) _scratch[i] = document.createElement('canvas');
  const cv2 = _scratch[i];
  if(cv2.width!==W || cv2.height!==H){ cv2.width=W; cv2.height=H; }
  const c = cv2.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1; c.globalCompositeOperation='source-over'; c.filter='none';
  c.clearRect(0,0,W,H);
  return c;
}

/* rettangolo con angoli tagliati a 45 gradi, scelti uno per uno */
function cutCornerPath(c, x, y, w, h, cut, which, keepPath){
  const k = Math.max(0, Math.min(cut, Math.min(w,h)/2));
  const on = {tl:false, tr:false, br:false, bl:false};
  if(which==='all'){ on.tl=on.tr=on.br=on.bl=true; }
  else if(which==='top-left + bottom-right'){ on.tl=on.br=true; }
  else if(which==='top-right + bottom-left'){ on.tr=on.bl=true; }
  else if(which==='top only'){ on.tl=on.tr=true; }
  else if(which==='bottom only'){ on.bl=on.br=true; }
  else if(which==='left only'){ on.tl=on.bl=true; }
  else if(which==='right only'){ on.tr=on.br=true; }
  if(!keepPath) c.beginPath();
  if(k<=0 || which==='none'){ c.rect(x,y,w,h); return; }
  c.moveTo(x + (on.tl?k:0), y);
  c.lineTo(x+w - (on.tr?k:0), y);
  if(on.tr) c.lineTo(x+w, y+k);
  c.lineTo(x+w, y+h - (on.br?k:0));
  if(on.br) c.lineTo(x+w-k, y+h);
  c.lineTo(x + (on.bl?k:0), y+h);
  if(on.bl) c.lineTo(x, y+h-k);
  c.lineTo(x, y + (on.tl?k:0));
  if(on.tl) c.lineTo(x+k, y);
  c.closePath();
}

/* dilatazione quadrata: allarga la sagoma tenendo gli angoli netti.
   raddoppia a ogni passo, quindi costa log2(r) disegni per asse */
function dilateSharp(src, r){
  const R = Math.max(0, Math.round(r));
  const pad = R + 2;
  const c = document.createElement('canvas');
  c.width = src.width + pad*2; c.height = src.height + pad*2;
  const g = c.getContext('2d');
  g.drawImage(src, pad, pad);
  if(R>0){
    let m = 0;
    while(m < R){ const k = Math.min(m===0?1:m, R-m); g.drawImage(c,-k,0); g.drawImage(c,k,0); m += k; }
    m = 0;
    while(m < R){ const k = Math.min(m===0?1:m, R-m); g.drawImage(c,0,-k); g.drawImage(c,0,k); m += k; }
  }
  return {canvas:c, pad:pad};
}

/* Molte misure (dove sta un livello, dove arriva il titolo, se qualcosa
   sborda) servono in frazioni della tela, non in pixel: farle a piena
   risoluzione su una Asset page 4K costa piu' del disegno stesso. Questo
   restituisce lo stesso formato rimpicciolito, con dentro tutto quello che
   serve a chi disegna. */
function formatoRidotto(f, tetto){
  const k = Math.min(1, tetto/Math.max(f.w, f.h));
  if(k >= 1) return f;
  return {id:f.id, group:f.group, name:f.name, note:f.note, profile:f.profile,
          w: Math.max(2, Math.round(f.w*k)), h: Math.max(2, Math.round(f.h*k))};
}

/* Il bordo alto della fascia, nel PSD, non sfuma in modo lineare: resta un
   velo sotto un quarto di opacita' per quasi tutta la rampa e poi sale di
   colpo negli ultimi pixel. Misurato sulle tre grafiche che ce l'hanno, il
   punto di meta' opacita' cade al 97% della rampa, non a meta'. Con due soli
   capi la fascia sembrava cominciare cinquanta pixel piu' in alto di quella
   del PSD. */
const BAND_GINOCCHIO = 0.965, BAND_VELO = 0.25, BAND_STOPS = 16;
/* La sfumatura a sinistra della fascia non e' una rampa dritta: nel PSD e'
   la maschera di Photoshop, che sale piano e poi accelera. I numeri qui
   sono letti dal PSD, un campione ogni ventesimo di rampa, e sono gli
   stessi su Cover, Asset page e miniatura YouTube: e' una sola curva. */
const BAND_LATO = [0.01,0.02,0.05,0.08,0.12,0.16,0.21,0.25,0.30,0.36,0.41,
                   0.46,0.52,0.58,0.64,0.71,0.77,0.84,0.90,0.95,1.00];
function bandFadeAlpha(t){
  if(t <= 0) return 0;
  if(t >= 1) return 1;
  if(t < BAND_GINOCCHIO) return BAND_VELO * Math.pow(t/BAND_GINOCCHIO, 1.5);
  return BAND_VELO + (1-BAND_VELO) * (t-BAND_GINOCCHIO)/(1-BAND_GINOCCHIO);
}

/* ============================================================================
   LIBRERIA DI FORME
   Tutte spigolose: nessun cerchio, nessuna pillola, nessun angolo arrotondato.
   Per aggiungerne una: una voce in SHAPE_KINDS e un caso in shapePath.
   ============================================================================ */
const SHAPE_KINDS = ['panel','bar','slant-bar','arrow-bar','notch-bar','chevron',
                     'bracket-L','corner-wedge','triangle','diamond','steps',
                     'stripes','ticks','double-rule','cross-hatch','frame'];

/* forme composte da piu' tratti: ritornano una lista di percorsi */
function shapePath(c, k, x, y, w, h, o){
  const cut = o.cut*Math.min(w,h);
  const sk  = o.skew*h;
  const seg = Math.max(1, Math.round(o.count));

  if(k==='panel'){ cutCornerPath(c, x, y, w, h, cut, o.cuts); return; }
  if(k==='bar'){ c.beginPath(); c.rect(x,y,w,h); return; }
  if(k==='slant-bar'){
    c.beginPath(); c.moveTo(x+sk,y); c.lineTo(x+w,y); c.lineTo(x+w-sk,y+h); c.lineTo(x,y+h); c.closePath(); return;
  }
  if(k==='arrow-bar'){
    const t = h*0.5;
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+w-t,y); c.lineTo(x+w,y+h/2);
    c.lineTo(x+w-t,y+h); c.lineTo(x,y+h); c.closePath(); return;
  }
  if(k==='notch-bar'){
    const t = h*0.5;
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+w,y); c.lineTo(x+w-t,y+h/2);
    c.lineTo(x+w,y+h); c.lineTo(x,y+h); c.lineTo(x+t,y+h/2); c.closePath(); return;
  }
  if(k==='chevron'){
    const t = Math.min(w,h)*0.45;
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+w-t,y); c.lineTo(x+w,y+h/2);
    c.lineTo(x+w-t,y+h); c.lineTo(x,y+h); c.lineTo(x+t,y+h/2); c.closePath(); return;
  }
  if(k==='triangle'){
    c.beginPath(); c.moveTo(x,y+h); c.lineTo(x+w/2,y); c.lineTo(x+w,y+h); c.closePath(); return;
  }
  if(k==='diamond'){
    c.beginPath(); c.moveTo(x+w/2,y); c.lineTo(x+w,y+h/2); c.lineTo(x+w/2,y+h);
    c.lineTo(x,y+h/2); c.closePath(); return;
  }
  if(k==='corner-wedge'){
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+w,y); c.lineTo(x,y+h); c.closePath(); return;
  }
  if(k==='bracket-L'){
    const t = Math.max(1, o.thick*Math.min(w,h));
    const ax = w*o.armX, ay = h*o.armY;
    c.beginPath();
    c.moveTo(x+ax,y); c.lineTo(x,y); c.lineTo(x,y+ay);
    c.lineTo(x+t,y+ay); c.lineTo(x+t,y+t); c.lineTo(x+ax,y+t); c.closePath();
    c.moveTo(x+w-ax,y+h); c.lineTo(x+w,y+h); c.lineTo(x+w,y+h-ay);
    c.lineTo(x+w-t,y+h-ay); c.lineTo(x+w-t,y+h-t); c.lineTo(x+w-ax,y+h-t); c.closePath();
    return;
  }
  if(k==='steps'){
    const n = seg, sw = w/n, sh = h/n;
    c.beginPath(); c.moveTo(x, y+h);
    for(let i=0;i<n;i++){ c.lineTo(x+i*sw, y+h-(i+1)*sh); c.lineTo(x+(i+1)*sw, y+h-(i+1)*sh); }
    c.lineTo(x+w, y+h); c.closePath(); return;
  }
  if(k==='stripes'){
    const n = seg, gap = w/n, t = gap*o.ratio;
    c.beginPath();
    for(let i=0;i<n;i++){
      const px = x + i*gap;
      c.moveTo(px+sk, y); c.lineTo(px+sk+t, y); c.lineTo(px+t, y+h); c.lineTo(px, y+h); c.closePath();
    }
    return;
  }
  if(k==='ticks'){
    const n = seg, gap = w/n, t = Math.max(1, gap*o.ratio);
    c.beginPath();
    for(let i=0;i<n;i++){ c.rect(x+i*gap, y, t, h); }
    return;
  }
  if(k==='double-rule'){
    const t = Math.max(1, h*o.ratio);
    c.beginPath(); c.rect(x, y, w, t); c.rect(x, y+h-t, w, t); return;
  }
  if(k==='cross-hatch'){
    const n = seg, t = Math.max(1, Math.min(w,h)*o.ratio*0.3);
    c.beginPath();
    for(let i=0;i<=n;i++){ c.rect(x + i*(w/n) - t/2, y, t, h); }
    for(let j=0;j<=n;j++){ c.rect(x, y + j*(h/n) - t/2, w, t); }
    return;
  }
  if(k==='frame'){
    const t = Math.max(1, o.thick*Math.min(w,h));
    cutCornerPath(c, x, y, w, h, cut, o.cuts);
    cutCornerPath(c, x+t, y+t, Math.max(0,w-t*2), Math.max(0,h-t*2),
                  Math.max(0,cut-t), o.cuts, true);
    return;
  }
  c.beginPath(); c.rect(x,y,w,h);
}

/* ---------------------------------------------------------------- ombre
   Un'ombra sola, uguale per ogni elemento: colore, spostamento, sfocatura
   e opacita'. I valori sono frazioni del lato corto, cosi' l'ombra resta
   identica su tutti i formati. Basta chiamare shadowOn/shadowOff intorno
   al disegno. */
function shadowOn(c, o, W, H){
  if(!o || !o.shadowOn) return false;
  const u = Math.min(W, H);
  c.save();
  c.shadowColor = 'rgba(' + hex2rgb(o.shadowColor||'#000000') + ',' +
                  (o.shadowOpacity===undefined ? 0.45 : o.shadowOpacity) + ')';
  c.shadowBlur    = Math.max(0, (o.shadowBlur||0) * u);
  c.shadowOffsetX = (o.shadowX||0) * u;
  c.shadowOffsetY = (o.shadowY||0) * u;
  return true;
}
function shadowOff(c, was){ if(was) c.restore(); }

/* righe di controllo dell'ombra, uguali per tutti gli elementi */
function shadowRows(g){
  return [
    {type:'group', l:'Shadow'},
    /* Colore e opacita' portano il nome per esteso: quasi ogni sezione ha
       gia' un "Colour" e un "Opacity" suoi, e due righe uguali nella stessa
       sezione si sbagliano. Blur, X e Y sono unici e stanno sotto il
       titolo del gruppo, quindi restano corti. */
    /* con l'ombra spenta le sue cinque regolazioni non fanno niente: si
       vedono solo quando c'e' qualcosa da regolare */
    {p:g+'.shadowOn',      l:'Drop shadow',   type:'check'},
    {p:g+'.shadowColor',   l:'Shadow colour', type:'color',
     when:L=> L[g] && L[g].shadowOn},
    {p:g+'.shadowOpacity', l:'Shadow opacity',type:'range', min:0, max:1, step:0.02,
     when:L=> L[g] && L[g].shadowOn},
    {p:g+'.shadowBlur',    l:'Blur',        type:'range', min:0, max:0.2, step:0.002,
     when:L=> L[g] && L[g].shadowOn},
    {p:g+'.shadowX',       l:'Offset X',    type:'range', min:-0.1, max:0.1, step:0.002,
     when:L=> L[g] && L[g].shadowOn},
    {p:g+'.shadowY',       l:'Offset Y',    type:'range', min:-0.1, max:0.1, step:0.002,
     when:L=> L[g] && L[g].shadowOn},
  ];
}
function shadowDefaults(){
  return {shadowOn:false, shadowColor:'#000000', shadowOpacity:0.45,
          shadowBlur:0.018, shadowX:0, shadowY:0.006};
}

function drawShape(c, W, H, o){
  if(!o.on) return null;
  const w = o.w*W, h = o.h*H, x = o.x*W, y = o.y*H;
  if(w<=0 || h<=0) return null;
  c.save();
  c.globalAlpha = o.opacity;
  if(o.rot){
    c.translate(x+w/2, y+h/2);
    c.rotate(o.rot*Math.PI/180);
    c.translate(-(x+w/2), -(y+h/2));
  }
  const evenOdd = (o.kind==='frame');
  const sh = shadowOn(c, o, W, H);
  if(o.mode==='fill' || o.mode==='both'){
    c.fillStyle = o.gradOn && o.color2 ? boxGradient(c, o, x, y, w, h) : o.color;
    shapePath(c, o.kind, x, y, w, h, o);
    c.fill(evenOdd ? 'evenodd' : 'nonzero');
  }
  if(o.mode==='stroke' || o.mode==='both'){
    c.strokeStyle = o.gradOn && o.color2 ? boxGradient(c, o, x, y, w, h) : o.strokeColor;
    c.lineWidth = Math.max(1, o.thick*Math.min(w,h));
    c.lineJoin = 'miter'; c.miterLimit = 12;
    shapePath(c, o.kind, x, y, w, h, o);
    c.stroke();
  }
  shadowOff(c, sh);
  c.restore();
  return {x:x, y:y, w:w, h:h};
}

/* gradiente lineare inclinabile dentro un riquadro qualsiasi */
function boxGradient(c, o, x, y, w, h){
  const ang = (o.gradAngle||0) * Math.PI/180;
  const r = Math.max(w, h)/2;
  const cx = x+w/2, cy = y+h/2;
  const g = c.createLinearGradient(cx-Math.cos(ang)*r, cy-Math.sin(ang)*r,
                                   cx+Math.cos(ang)*r, cy+Math.sin(ang)*r);
  g.addColorStop(0, o.color);
  g.addColorStop(1, o.color2);
  return g;
}

/* ---------------------------------------------------- SCREENSHOT E FILTRI */
/* La sfocatura fatta con ctx.filter su una immagine grande costa un occhio:
   con sei pannelli il disegno passava da 11 ms a 740 ms e trascinare
   diventava impossibile. Una immagine sfocata pero' non ha piu' dettaglio
   fine: la si puo' rimpicciolire, sfocare in piccolo e poi ringrandire.
   Il risultato a occhio e' lo stesso e il costo crolla. */
const _sfocCache = new WeakMap();
function imgSfocata(img, blurPx, dw, dh){
  if(!(blurPx > 1.5)) return img;
  const f = Math.min(1, 4/blurPx);
  const w = Math.max(8, Math.round(Math.abs(dw)*f));
  const h = Math.max(8, Math.round(Math.abs(dh)*f));
  const chiave = w+'x'+h+'|'+blurPx.toFixed(1);
  const vecchia = _sfocCache.get(img);
  if(vecchia && vecchia.chiave === chiave) return vecchia.canvas;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.filter = 'blur('+(blurPx*f).toFixed(2)+'px)';
  g.drawImage(img, 0, 0, w, h);
  g.filter = 'none';
  _sfocCache.set(img, {chiave, canvas:c});
  return c;
}
/* ==========================================================================
   RIMPICCIOLIRE SENZA SGRANARE
   Il browser, quando disegna un'immagine molto piu' piccola del vero, guarda
   pochi pixel per volta: su una Card da 420 px partendo da 1920 una trama
   fine (particelle, scintille, geometria sottile) diventa una griglia di
   macchie che nell'originale non c'e'. Dimezzando piu' volte, ogni passaggio
   media quattro pixel in uno e il risultato e' pulito. Si fa solo quando la
   riduzione supera il doppio, e il risultato si tiene da parte: le anteprime
   ridisegnano di continuo. */
const _ridCache = new WeakMap();
function imgRidotta(img, dw, dh){
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const tw = Math.abs(dw), th = Math.abs(dh);
  if(!sw || !sh || tw < 1 || th < 1) return img;
  /* Entro il doppio il browser se la cava: sotto ogni pixel finale nasce da
     quattro veri, che e' una media onesta. Oltre, no. */
  const passi = Math.ceil(Math.log(Math.max(sw/tw, sh/th)) / Math.LN2);
  if(passi <= 1) return img;
  const chiave = Math.round(tw) + 'x' + Math.round(th);
  const gia = _ridCache.get(img);
  if(gia && gia.chiave === chiave) return gia.canvas;
  /* passi uguali fra loro, mai piu' di due volte per passo, e l'ultimo
     arriva esattamente alla misura che serve: cosi' il disegno finale non
     deve piu' rimpicciolire niente */
  const kw = Math.pow(tw/sw, 1/passi), kh = Math.pow(th/sh, 1/passi);
  let src = img;
  for(let i=1; i<=passi && i<=8; i++){
    const w = Math.max(1, Math.round(sw*Math.pow(kw, i)));
    const h = Math.max(1, Math.round(sh*Math.pow(kh, i)));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, w, h);
    src = c;
  }
  _ridCache.set(img, {chiave, canvas:src});
  return src;
}

function buildFilter(fx, H, senzaSfocatura){
  const p = [];
  const b = fx.bright * Math.pow(2, fx.expo||0);
  if(Math.abs(b-1)>0.001)           p.push('brightness('+b.toFixed(3)+')');
  if(Math.abs(fx.contrast-1)>0.001) p.push('contrast('+fx.contrast.toFixed(3)+')');
  if(Math.abs(fx.sat-1)>0.001)      p.push('saturate('+fx.sat.toFixed(3)+')');
  if(Math.abs(fx.hue)>0.5)          p.push('hue-rotate('+fx.hue.toFixed(0)+'deg)');
  if(fx.blur>0.0005 && !senzaSfocatura) p.push('blur('+(fx.blur*H).toFixed(2)+'px)');
  return p.length ? p.join(' ') : 'none';
}

/* Quanto va ingrandita un'immagine perche', ruotata, copra ancora tutto il
   riquadro. Prima si usava un valore approssimato che non teneva conto della
   forma del riquadro: su una tela larga bastavano otto gradi per scoprire
   due angoli neri. */
function scalaPerRotazione(gradi, W, H){
  const a = Math.abs((gradi||0) * Math.PI/180);
  if(!a) return 1;
  const co = Math.cos(a), si = Math.sin(a);
  return Math.max((W*co + H*si)/W, (W*si + H*co)/H);
}

function drawImageCover(c, img, W, H, cfg, fx){
  const base = cfg.fit === 'contain'
    ? Math.min(W/img.width, H/img.height)
    : Math.max(W/img.width, H/img.height);
  let s = base*cfg.scale*(1 + (fx.blur>0 ? fx.blur*3 : 0));
  if(cfg.rot) s *= scalaPerRotazione(cfg.rot, W, H);
  const dw = img.width*s, dh = img.height*s;
  /* se la sfocatura ha gia' prodotto una copia ridotta si usa quella, se no
     si rimpicciolisce a gradini per non sgranare */
  const sfocata = imgSfocata(img, fx.blur*H, dw, dh);
  const src = (sfocata !== img) ? sfocata : imgRidotta(img, dw, dh);
  c.save();
  c.filter = buildFilter(fx, H, sfocata !== img);
  c.translate(cfg.x*W, cfg.y*H);
  if(cfg.rot) c.rotate(cfg.rot*Math.PI/180);
  c.scale(cfg.fh?-1:1, cfg.fv?-1:1);
  c.drawImage(src, -dw/2, -dh/2, dw, dh);
  c.restore();
}

/* TRASFORMAZIONE DI UN PANNELLO
   Ogni pannello ha la sua: zoom, posizione, rotazione, specchio. Prima il
   pannello 0 stava nei campi scale/x/y e gli altri in elenchi a parte, e la
   maniglia, la rotellina, le frecce e il trascinamento conoscevano solo i
   primi: con piu' pannelli, toccare un'immagine muoveva quella del pannello
   0. Rotazione e specchio stavano nelle regolazioni, comuni a tutti. Adesso
   c'e' un elenco per proprieta', una voce per pannello, e basta. */
const PANNELLI_MAX = 6;
const PANNELLO_ZERO = {sc:1, px:0.5, py:0.5, rot:0, fh:false, fv:false};
function panelVal(cfg, i, key){
  const arr = cfg[key];
  return (arr && arr[i]!==undefined) ? arr[i] : PANNELLO_ZERO[key];
}
function pannelloT(cfg, i){
  return {scale:panelVal(cfg,i,'sc'), x:panelVal(cfg,i,'px'), y:panelVal(cfg,i,'py'),
          rot:panelVal(cfg,i,'rot'), fh:!!panelVal(cfg,i,'fh'), fv:!!panelVal(cfg,i,'fv'),
          fit:cfg.fit};
}
function pannelloAttivo(S){
  const n = Math.max(1, Math.round(S.panels||1));
  return Math.min(Math.max(0, Math.round(S.active||0)), n-1);
}
/* Porta un layout di prima al modello nuovo. Si rifa' a ogni caricamento
   senza danni: quando e' gia' a posto non trova niente da spostare. */
function migraPannelli(L){
  const S = L && L.shot;
  if(!S) return L;
  Object.keys(PANNELLO_ZERO).forEach(k=>{
    if(!Array.isArray(S[k])) S[k] = [];
    for(let i=0;i<PANNELLI_MAX;i++) if(S[k][i]===undefined) S[k][i] = PANNELLO_ZERO[k];
  });
  /* il vecchio valore di serie dava al pannello 2 la stessa immagine del
     pannello 1 (che usa la prima): si sposta di uno, solo se e' rimasto quello */
  if(Array.isArray(S.src) && S.src.join(',') === '-1,0,1,2,3,4') S.src = [-1,1,2,3,4,5];
  if(typeof S.scale === 'number'){ S.sc[0] = S.scale; delete S.scale; }
  if(typeof S.x === 'number'){ S.px[0] = S.x; delete S.x; }
  if(typeof S.y === 'number'){ S.py[0] = S.y; delete S.y; }
  const fx = L.fx;
  if(fx && ('rot' in fx || 'flipH' in fx || 'flipV' in fx)){
    for(let i=0;i<PANNELLI_MAX;i++){
      if(fx.rot) S.rot[i] = fx.rot;
      if(fx.flipH) S.fh[i] = true;
      if(fx.flipV) S.fv[i] = true;
    }
    delete fx.rot; delete fx.flipH; delete fx.flipV;
  }
  return L;
}
function migraTuttiIPannelli(layouts){
  Object.keys(layouts||{}).forEach(id=> migraPannelli(layouts[id]));
}
function panelSrc(cfg, i){
  const a = cfg.src;
  return (a && a[i]!==undefined) ? a[i] : (i===0 ? -1 : i);
}

/* i confini fra i pannelli: normalmente in parti uguali, ma i pesi
   permettono un pannello grande e due piccoli, o qualsiasi altra divisione */
function panelEdges(cfg, n){
  const w = [];
  for(let i=0;i<n;i++){
    const v = (cfg.weights && cfg.weights[i]!==undefined) ? cfg.weights[i] : 1;
    w.push(Math.max(0.05, v));
  }
  const tot = w.reduce((a,b)=>a+b, 0);
  const e = [0];
  let acc = 0;
  w.forEach(v=>{ acc += v/tot; e.push(acc); });
  return e;
}

/* poligono del pannello i: due bordi verticali inclinati, come le maschere
   del PSD. slant e' l'inclinazione comune, slants[i] la corregge sul singolo
   confine, cosi' si possono fare tagli che non sono tutti paralleli. */
function panelPoly(i, n, W, H, slant, gap, cfg){
  const e = panelEdges(cfg||{}, n);
  const per = k => {
    const a = cfg && cfg.slants;
    return (a && a[k]!==undefined) ? a[k] : 0;
  };
  const sL = (slant + per(i))   * H*0.5;
  const sR = (slant + per(i+1)) * H*0.5;
  const g = gap*W*0.5;
  const lx = (i===0   ? -3*W : e[i]  *W) + (i===0   ? 0 : g);
  const rx = (i===n-1 ?  4*W : e[i+1]*W) - (i===n-1 ? 0 : g);
  return [[lx+sL,0],[rx+sR,0],[rx-sR,H],[lx-sL,H]];
}
function polyPath(c, poly){
  c.beginPath();
  c.moveTo(poly[0][0], poly[0][1]);
  for(let i=1;i<poly.length;i++) c.lineTo(poly[i][0], poly[i][1]);
  c.closePath();
}
function polyBounds(poly, W, H){
  let x0=Infinity, x1=-Infinity;
  poly.forEach(pt=>{ x0=Math.min(x0,pt[0]); x1=Math.max(x1,pt[1*0]); });
  poly.forEach(pt=>{ x1=Math.max(x1,pt[0]); });
  x0 = Math.max(0, x0); x1 = Math.min(W, x1);
  if(x1<=x0){ x0=0; x1=W; }
  return {x:x0, y:0, w:x1-x0, h:H};
}
/* come drawImageCover ma dentro un riquadro invece che su tutta la tela */
function drawImageInBox(c, img, box, cfg, fx, H){
  const base = cfg.fit === 'contain'
    ? Math.min(box.w/img.width, box.h/img.height)
    : Math.max(box.w/img.width, box.h/img.height);
  let sc = base*cfg.scale*(1 + (fx.blur>0 ? fx.blur*3 : 0));
  if(cfg.rot) sc *= scalaPerRotazione(cfg.rot, box.w, box.h);
  const dw = img.width*sc, dh = img.height*sc;
  const sfocata = imgSfocata(img, fx.blur*H, dw, dh);
  const src = (sfocata !== img) ? sfocata : imgRidotta(img, dw, dh);
  c.save();
  c.filter = buildFilter(fx, H, sfocata !== img);
  c.translate(box.x + cfg.x*box.w, box.y + cfg.y*box.h);
  if(cfg.rot) c.rotate(cfg.rot*Math.PI/180);
  c.scale(cfg.fh?-1:1, cfg.fv?-1:1);
  c.drawImage(src, -dw/2, -dh/2, dw, dh);
  c.restore();
}

function drawPanels(c, W, H, cfg, fx){
  const n = Math.max(1, Math.round(cfg.panels||1));
  /* Anche con un pannello solo vale la scelta dell'immagine: prima qui si
     prendeva sempre la principale, e il menu "Image" non faceva niente
     finche' non si spezzava lo screenshot in due. */
  if(n===1){
    const uno = shotByIndex(panelSrc(cfg, 0));
    if(uno) drawImageCover(c, uno, W, H, pannelloT(cfg, 0), fx);
    return;
  }
  for(let i=0;i<n;i++){
    const img = shotByIndex(panelSrc(cfg, i));
    if(!img) continue;
    const poly = panelPoly(i, n, W, H, cfg.slant||0, cfg.gap||0, cfg);
    c.save();
    polyPath(c, poly); c.clip();
    drawImageInBox(c, img, polyBounds(poly, W, H), pannelloT(cfg, i), fx, H);
    c.restore();
  }
  /* filo di separazione fra i pannelli, come nel PSD */
  if(cfg.edgeOn && cfg.edgeThick>0){
    c.save();
    c.strokeStyle = cfg.edgeColor || '#000000';
    c.lineWidth = Math.max(1, cfg.edgeThick*Math.min(W,H));
    c.globalAlpha = cfg.edgeOpacity===undefined ? 1 : cfg.edgeOpacity;
    for(let i=0;i<n;i++){
      const poly = panelPoly(i, n, W, H, cfg.slant||0, cfg.gap||0, cfg);
      polyPath(c, poly); c.stroke();
    }
    c.restore();
  }
}

/* La schermata con i suoi effetti e' la parte piu' cara del disegno: su una
   Asset page a sei pannelli con sfocature e grana sono decine di millisecondi
   per fotogramma, e mentre si trascina il logo la si rifaceva ogni volta
   identica. Qui il risultato resta in una tela di lato, e si rifa' solo
   quando cambia qualcosa che la riguarda davvero. */
/* Piu' di una tela in memoria: l'anteprima grande, le dieci anteprime
   piccole a sinistra e l'export hanno misure diverse, e con una sola
   casella si scacciavano a vicenda a ogni disegno. Il tetto e' sui pixel
   totali, non sul numero di voci, se no una Asset page 4K da sola
   riempirebbe la memoria. */
let _shotCache = [];
/* Svuotare la lista non basta: finche' il browser non passa a raccogliere,
   quelle tele occupano ancora memoria. Rimpicciolirle a un pixel la
   restituisce subito. */
function svuotaMemoriaSchermate(){
  _shotCache.forEach(v=>{ if(v.c){ v.c.width = 1; v.c.height = 1; } });
  _shotCache = [];
}
const SHOT_CACHE_MAX = 48e6;
/* Sopra questa misura non si tiene niente da parte: l'export non si ripete
   e una tela da trentatre megabyte costa piu' di quello che fa risparmiare.
   Sotto invece si', anteprima e disegno nitido dello zoom comprese. */
const CACHE_LATO_MAX = 2900;
function shotCacheCerca(k, W, H){
  for(let i=0;i<_shotCache.length;i++){
    const v = _shotCache[i];
    if(v.k === k && v.c.width === W && v.c.height === H){
      _shotCache.splice(i,1); _shotCache.push(v);      /* la piu' usata in fondo */
      return v.c;
    }
  }
  return null;
}
function shotCacheMetti(k, memo){
  _shotCache.push({k:k, c:memo});
  let tot = _shotCache.reduce((a,v)=> a + v.c.width*v.c.height, 0);
  while(_shotCache.length > 1 && tot > SHOT_CACHE_MAX){
    const via = _shotCache.shift();
    tot -= via.c.width*via.c.height;
  }
}
function shotChiave(W, H, cfg, fx){
  const n = Math.max(1, Math.round(cfg.panels||1));
  const usate = [];
  for(let i=0;i<n;i++){
    const im = shotByIndex(Array.isArray(cfg.src) ? cfg.src[i] : -1);
    usate.push(im ? im.__uid : 0);
  }
  return W + 'x' + H + '|' + JSON.stringify(cfg) + '|' + JSON.stringify(fx) + '|' +
         (imgShot ? imgShot.__uid : 0) + '|' + usate.join(',');
}
function paintShot(c, W, H, cfg, fx){
  /* Serve all'anteprima, alle miniature e al disegno nitido dello zoom, che
     si rifanno di continuo con le stesse impostazioni. */
  if(Math.max(W, H) > CACHE_LATO_MAX){ paintShotVero(c, W, H, cfg, fx); return; }
  const chiave = shotChiave(W, H, cfg, fx);
  const gia = shotCacheCerca(chiave, W, H);
  if(gia){ c.drawImage(gia, 0, 0); return; }
  const memo = document.createElement('canvas');
  memo.width = W; memo.height = H;
  paintShotVero(memo.getContext('2d'), W, H, cfg, fx);
  shotCacheMetti(chiave, memo);
  c.drawImage(memo, 0, 0);
}
function paintShotVero(c, W, H, cfg, fx){
  const many = Math.max(1, Math.round(cfg.panels||1)) > 1;
  /* con un pannello solo conta comunque l'immagine scelta nel menu, non
     per forza quella principale */
  const uno = many ? null : shotByIndex(panelSrc(cfg, 0));
  if(!uno && !many) return;
  const layer = many || fx.zoomBlur>0.001 || fx.spinBlur>0.001 || fx.edgeBlur>0.001;
  if(!layer){ drawImageCover(c, uno, W, H, pannelloT(cfg, 0), fx); return; }

  const base = scratch(0, W, H);
  drawPanels(base, W, H, cfg, fx);
  let src = base.canvas;
  const cx = fx.cx*W, cy = fx.cy*H;

  if(fx.zoomBlur>0.001 || fx.spinBlur>0.001){
    const N = 14, acc = scratch(1, W, H);
    for(let i=0;i<N;i++){
      const t = i/(N-1);
      acc.save();
      acc.globalAlpha = i===0 ? 1 : 1/(i+1);
      acc.translate(cx, cy);
      acc.rotate((fx.spinBlur*Math.PI/180*18)*t);
      const k = 1 + fx.zoomBlur*0.28*t;
      acc.scale(k, k);
      acc.translate(-cx, -cy);
      acc.drawImage(src, 0, 0);
      acc.restore();
    }
    src = acc.canvas;
  }

  if(fx.edgeBlur>0.001){
    /* stessa idea della sfocatura piena: sfoco in piccolo e ringrandisco,
       cosi' anche al massimo il disegno resta scorrevole */
    const raggio = fx.edgeBlur*H*0.06;
    const f = Math.min(1, 4/Math.max(1, raggio));
    const bw = Math.max(8, Math.round(W*f)), bh = Math.max(8, Math.round(H*f));
    const piccolo = scratch(6, bw, bh);
    piccolo.filter = 'blur('+(raggio*f).toFixed(2)+'px)';
    const over2 = Math.max(bw,bh)*0.06;
    piccolo.drawImage(src, -over2, -over2, bw+over2*2, bh+over2*2);
    piccolo.filter = 'none';

    const blurred = scratch(2, W, H);
    blurred.drawImage(piccolo.canvas, 0, 0, W, H);

    const sharp = scratch(3, W, H);
    sharp.drawImage(src, 0, 0);
    sharp.globalCompositeOperation = 'destination-in';
    const rMax = Math.hypot(W,H)/2;
    const r0 = rMax*Math.max(0.001, fx.edgeStart);
    const g = sharp.createRadialGradient(cx,cy,r0, cx,cy, r0 + rMax*Math.max(0.02, fx.edgeSoft));
    g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
    sharp.fillStyle = g; sharp.fillRect(0,0,W,H);

    c.drawImage(blurred.canvas, 0, 0);
    c.drawImage(sharp.canvas, 0, 0);
    return;
  }
  c.drawImage(src, 0, 0);
}

    feather: P.S(P.big?0.1019 : (P.asset?0.0606 : (P.mini?0 : 0.0615))),

       assolute: la volta prima la maschera era disallineata e mi risultava

    g.fillStyle = b.color;
    if(sl!==0){
      g.beginPath();
      g.moveTo(x, yTop-sl/2); g.lineTo(x+w, yTop+sl/2);
      g.lineTo(x+w, H); g.lineTo(x, H); g.closePath(); g.fill();
    } else {
      g.fillRect(x, yTop, w, H-yTop);
    }
    if(f>0){
      const lg = g.createLinearGradient(0, y0, 0, yTop);
      const rgb = hex2rgb(b.color);
      for(let i=0;i<=BAND_STOPS;i++){
        const t = i/BAND_STOPS;
        lg.addColorStop(t, 'rgba('+rgb+','+bandFadeAlpha(t).toFixed(4)+')');

      g.fillStyle = lg;
      if(sl!==0){
        g.save(); g.beginPath();
        g.moveTo(x, y0-sl/2); g.lineTo(x+w, y0+sl/2);
        g.lineTo(x+w, yTop+sl/2); g.lineTo(x, yTop-sl/2); g.closePath();

      g.globalCompositeOperation = 'source-over';

{ key:'accent', label:'Accent line', section:'Accent line', order:30, select:true,
  pos:{x:null, y:'y'}, size:'thick', sizeMax:0.14,
  defaults:P=>({on:true,
    y:     P.B(P.big?0.862 : (P.asset?0.9095 : (P.tiny?0.844 : (P.small?0.832:0.915)))),
    x0:    P.tiny?0 : (P.small?0.169 : (P.asset?0.0924 : (P.big?0.135:0.111))),
    x1:    (P.mini||P.big)?1 : (P.asset?0.998 : 0.997),
    /* spessore: vedi ACCENT_W, sono le misure prese dal PSD */
    thick: P.mini ? P.S(P.tiny?0.125:0.107)
                  : (ACCENT_W[P.f.id] || ACCENT_W_ALTRI) * P.f.w / P.f.h,
    /* il PSD mette un gradiente orizzontale sulla barra: giallo a sinistra,
       arancio piu' caldo a destra */
    color:  P.mini?C.accentA:C.accentA2,
    color2: P.mini?C.accentB:C.accentB2,
    gradOn:true, gradLink:true, gradAngle:0,
    glow:  P.mini?0:0.15,
    endCut:0, segments:1, segGap:0.15}),
  draw:(c,W,H,L)=>{
    const a = L.accent;
    if(!a.on) return null;
    const t = Math.max(1, a.thick*H);
    const x = a.x0*W, w = (a.x1-a.x0)*W, y = a.y*H - t/2;
    const paint = accentPaint(c, a, x, y, w, t);
    if(a.glow>0){
      /* L'alone e' una sfumatura morbida: non ha dettagli da perdere. Con la
         barra spessa del PSD, a 4K, sfocare a piena risoluzione costava mezzo
         secondo per ogni export. Sopra un certo raggio si disegna in piccolo
         e si ringrandisce: identico a vedersi, un decimo del tempo. */
      const raggio = t*1.6;
      c.save(); c.globalAlpha = a.glow;
      if(raggio > RAGGIO_PICCOLO){
        /* La tela di servizio va piu' larga della zona che interessa: una
           sfumatura ha bisogno di circa tre raggi di spazio attorno per
           spegnersi. Prima il bordo della tela cadeva a un raggio scarso e
           la sfumatura veniva tagliata di netto: si vedeva un rettangolo
           squadrato attorno alla barra, come se l'alone fosse una copia
           della barra stessa invece di un alone. */
        const k = RAGGIO_PICCOLO/raggio;
        const marg = Math.ceil(RAGGIO_PICCOLO*3);
        const regY = y - t*2, regH = t*5;          /* la fascia di tela che ci serve */
        const bw = Math.max(8, Math.round(W*k) + marg*2);
        const bh = Math.max(8, Math.round(regH*k) + marg*2);
        const g2 = scratch(9, bw, bh);
        g2.setTransform(1,0,0,1,0,0);
        g2.clearRect(0, 0, bw, bh);
        const rx = x*k + marg;
        const ry = (y - t - regY)*k + marg;        /* l'alone e' alto tre volte la barra */
        g2.filter = 'blur(' + (raggio*k).toFixed(2) + 'px)';
        g2.fillStyle = accentPaint(g2, a, rx, (y-regY)*k + marg, w*k, t*k);
        g2.fillRect(rx, ry, w*k, t*3*k);
        g2.filter = 'none';
        /* si rimette al suo posto tenendo conto del bordo aggiunto */
        c.drawImage(g2.canvas, 0, 0, bw, bh,
                    -marg/k, regY - marg/k, bw/k, bh/k);
      } else {
        c.filter = 'blur(' + raggio + 'px)';
        c.fillStyle = paint; c.fillRect(x, y-t, w, t*3);
      }
      c.restore();
    }
    c.save(); c.fillStyle = paint;
    const n = Math.max(1, Math.round(a.segments||1));
    const gap = n>1 ? (w*(a.segGap||0))/(n-1) : 0;
    const sw = (w - gap*(n-1))/n;
    /* Il taglio obliquo in punta e' dato in multipli dello spessore. Se
       supera la larghezza del segmento il quadrilatero si rovescia e la
       barra finisce per disegnare a sinistra del suo inizio: sulla Card, con
       nove segmenti, arrivava a coprire il logo. */
    const cutx = Math.min((a.endCut||0)*t, sw*0.9);
    for(let i=0;i<n;i++){
      const sx = x + i*(sw+gap);
      if(cutx>0){
        c.beginPath();
        c.moveTo(sx+cutx, y); c.lineTo(sx+sw, y);
        c.lineTo(sx+sw-cutx, y+t); c.lineTo(sx, y+t);
        c.closePath(); c.fill();
      } else {
        c.fillRect(sx, y, sw, t);
      }
    }
    c.restore();
    return {x:x, y:y, w:w, h:t};
  },
  rows:[
    {p:'accent.on',    l:'On',        type:'check'},
    {type:'group', l:'Placement'},
    {p:'accent.y',     l:'Centre Y', type:'range', min:0, max:1, step:0.002},
    {p:'accent.x0',    l:'Start X',   type:'range', min:0, max:1, step:0.002},
    {p:'accent.x1',    l:'End X',     type:'range', min:0, max:1, step:0.002},
    /* il valore piu' alto che serve davvero e' la barra dell'Icon, 0.125:
       arrivare a 0.3 rendeva lo slider inutilizzabile nella parte bassa */
    {p:'accent.thick', l:'Thickness', type:'range', min:0.0005, max:0.14, step:0.0005},
    {type:'group', l:'Colour'},
    {p:'accent.gradLink', l:'Follow theme', type:'check'},
    {p:'accent.color', l:'Colour',     type:'color', when:L=> !L.accent.gradLink},
    {p:'accent.gradOn',   l:'Gradient',    type:'check'},
    {p:'accent.color2',   l:'Colour right', type:'color',
     when:L=> L.accent.gradOn && !L.accent.gradLink},
    {p:'accent.gradAngle',l:'Grad. angle', type:'range', min:-90, max:90, step:1,
     when:L=> L.accent.gradOn},
    {p:'accent.glow',  l:'Glow',      type:'range', min:0, max:1, step:0.02},
    {type:'group', l:'Shape'},
    {p:'accent.endCut',   l:'Angled ends', type:'range', min:0, max:6, step:0.1},
    {p:'accent.segments', l:'Segments',    type:'range', min:1, max:24, step:1},
    {p:'accent.segGap',   l:'Segment gap', type:'range', min:0, max:0.6, step:0.01,
     when:L=> L.accent.segments > 1},
  ]},

{ key:'logo', label:'Logo', section:'Logo', order:40, select:true,

       PSD il contorno sta dentro il quadrato, non fuori. Misure: quadrato
       150 e logo 138 sulla Cover, 30 e 26 sull'Icon. */
    pad: P.tiny?0.0667 : (P.small?0.0545 : (P.asset?0.0412 : (P.big?0.0369 : 0.04))),
    tintOn:false, tintColor:C.dark,
    /* zone del logo: off lascia il file com'e' */
    mapMode:'off', darkColor:'#3a3a3f', lightColor:'#ffffff', mapCut:0.5,
    opacity:1}),
  draw:(c,W,H,L,preview)=>{
    const l = L.logo;
    if(!l.on) return null;
    const s = l.size*H, x = l.x*W, y = l.y*H;
    const box = {x:x, y:y, w:s, h:s};
    if(!imgLogo){
      if(preview){
        c.save();
        c.strokeStyle='rgba(255,255,255,0.45)';
        c.lineWidth=Math.max(1,s*0.012);
        c.setLineDash([s*0.08, s*0.06]);
        c.strokeRect(x,y,s,s);
        c.restore();
      }
      return box;
    }
    const pad = l.pad*s, inner = s-pad*2;
    const r = Math.min(inner/imgLogo.width, inner/imgLogo.height);
    const dw = Math.max(1,Math.round(imgLogo.width*r)), dh = Math.max(1,Math.round(imgLogo.height*r));
    const dx = x+(s-dw)/2, dy = y+(s-dh)/2;

    c.save();
    c.globalAlpha = l.opacity;
    if(l.fill){ c.fillStyle = l.fillColor; c.fillRect(x, y, s, s); }

    if(l.glow>0){
      const g = logoSil(dw, dh, l.glowColor);
      c.save();
      c.globalAlpha = l.opacity*Math.min(1,l.glow);
      c.filter = 'blur('+(s*0.06*l.glow+1)+'px)';
      const gs = 1 + l.glow*0.18;
      c.drawImage(g, dx-dw*(gs-1)/2, dy-dh*(gs-1)/2, dw*gs, dh*gs);
      c.restore();
    }

    if(l.outOn && l.outThick>0){
      const sil = logoSil(dw, dh, logoOutColor(l));
      const t = l.outThick*s;
      if(l.outMode==='scale'){
        const k = 1 + (t*2)/Math.max(dw,dh);
        c.drawImage(sil, dx-dw*(k-1)/2, dy-dh*(k-1)/2, dw*k, dh*k);
      } else if(l.outMode==='sharp'){
        const d = dilateSharp(sil, t);
        c.drawImage(d.canvas, dx-d.pad, dy-d.pad);
      } else {
        [[t,48],[t*0.62,28],[t*0.3,16]].forEach(([rad,n])=>{
          for(let i=0;i<n;i++){
            const a = i/n*Math.PI*2;
            c.drawImage(sil, dx+Math.cos(a)*rad, dy+Math.sin(a)*rad, dw, dh);
          }
        });
      }
    }

    if(l.tintOn){
      /* tinta unita: tutto il segno di un colore solo */
      c.drawImage(logoSil(dw, dh, l.tintColor), dx, dy, dw, dh);
    } else if(l.mapMode && l.mapMode !== 'off'){
      /* le due zone del logo, una per volta o tutte e due */
      c.drawImage(logoMapped(dw, dh, l), dx, dy, dw, dh);
    } else {
      c.drawImage(imgLogo, dx, dy, dw, dh);
    }
    c.restore();
    return box;
  },

/* ==========================================================================
   RICOLORAZIONE DEL LOGO PER ZONE
   Il logo e' bianco e nero: qui le due zone si possono cambiare una per
   volta o insieme. Serve per esempio a portare il nero verso il grigio
   quando il fondo e' molto scuro e il segno si perde, senza toccare il
   bianco. Il taglio fra scuro e chiaro e' regolabile, e i bordi restano
   morbidi perche' i pixel intermedi vengono mescolati fra i due colori.
   Il risultato e' tenuto da parte: rifarlo a ogni fotogramma sarebbe uno
   spreco, il logo cambia di rado. */
let _logoMapCache = null;
/* Quanto logo e' scuro e quanto e' chiaro. Serve per dire subito che su un
   logo bianco su trasparente la voce "ricolora la parte scura" non ha
   niente su cui lavorare: se no si girano i cursori aspettando che cambi
   qualcosa. Si misura una volta sola, in piccolo. */
function zoneLogo(){
  if(!imgLogo) return null;
  if(imgLogo.__zone) return imgLogo.__zone;
  const N = 64;
  const t = document.createElement('canvas');
  t.width = N; t.height = N;
  const c = t.getContext('2d', {willReadFrequently:true});
  try{
    c.drawImage(imgLogo, 0, 0, N, N);
    const d = c.getImageData(0, 0, N, N).data;
    let scuri = 0, chiari = 0, tot = 0;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3] < 128) continue;
      tot++;
      const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(lum < 128) scuri++; else chiari++;
    }
    imgLogo.__zone = {scuri, chiari, tot};
  }catch(e){ imgLogo.__zone = null; }
  return imgLogo.__zone;
}
function avvisaZonaLogo(path, val){
  if(path !== 'logo.mapMode' || !imgLogo) return;
  const z = zoneLogo();
  if(!z || !z.tot) return;
  if((val==='dark' || val==='both') && z.scuri < z.tot*0.01)
    toast('This logo has no dark part: it is light on transparent, so there is nothing to recolour there');
  else if(val==='light' && z.chiari < z.tot*0.01)
    toast('This logo has no light part to recolour');
}

function logoMapped(w, h, l){
  const W = Math.max(1, Math.round(w)), H = Math.max(1, Math.round(h));
  const chiave = [W, H, l.mapMode, l.darkColor, l.lightColor, l.mapCut,
                  imgLogo && (imgLogo.width+'x'+imgLogo.height)].join('|');
  if(_logoMapCache && _logoMapCache.k === chiave) return _logoMapCache.c;

  const t = document.createElement('canvas');
  t.width = W; t.height = H;
  const c = t.getContext('2d', {willReadFrequently:true});
  if(!imgLogo) return t;          /* niente logo, niente da ricolorare */
  c.drawImage(imgLogo, 0, 0, W, H);
  let d;
  try{ d = c.getImageData(0, 0, W, H); }
  catch(err){ return t; }

  const px = d.data;
  const cut = (l.mapCut === undefined ? 0.5 : l.mapCut) * 255;
  const morbido = 26;                    /* fascia di mescolanza sui bordi */
  const dk = hex2rgbArr(l.darkColor  || '#000000');
  const lt = hex2rgbArr(l.lightColor || '#ffffff');
  const tocca = {
    dark:  l.mapMode === 'dark'  || l.mapMode === 'both',
    light: l.mapMode === 'light' || l.mapMode === 'both'
  };
  for(let i=0; i<px.length; i+=4){
    if(px[i+3] === 0) continue;
    const lum = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
    /* 0 = tutto scuro, 1 = tutto chiaro, in mezzo si mescola */
    let f = (lum - (cut - morbido)) / (morbido*2);
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    const dr = tocca.dark  ? dk[0] : px[i],
          dg = tocca.dark  ? dk[1] : px[i+1],
          db = tocca.dark  ? dk[2] : px[i+2];
    const lr = tocca.light ? lt[0] : px[i],
          lg = tocca.light ? lt[1] : px[i+1],
          lb = tocca.light ? lt[2] : px[i+2];
    px[i]   = dr + (lr-dr)*f;
    px[i+1] = dg + (lg-dg)*f;
    px[i+2] = db + (lb-db)*f;
  }
  c.putImageData(d, 0, 0);
  _logoMapCache = {k:chiave, c:t};
  return t;
}
function hex2rgbArr(hex){
  const n = parseInt(String(hex).replace('#',''), 16);
  if(isNaN(n)) return [0,0,0];
  return [(n>>16)&255, (n>>8)&255, n&255];
}

function logoSil(w, h, color){
  const t = document.createElement('canvas');
  t.width = Math.max(1,Math.round(w)); t.height = Math.max(1,Math.round(h));
  const c = t.getContext('2d');
  /* senza logo caricato restituisco una tela vuota invece di far saltare
     tutto: questa funzione la chiamano anche le anteprime e il ripristino */
  if(!imgLogo) return t;
  c.drawImage(imgLogo, 0, 0, t.width, t.height);
  c.globalCompositeOperation = 'source-in';
  c.fillStyle = color;
  c.fillRect(0, 0, t.width, t.height);
  return t;
}

    size: P.S(P.big?0.02759 : (P.asset?0.0164 : 0.0169)), op:0.25, track:0.05,
    font:'Turret Road', weight:'300', color:''}),
  draw:(c,W,H,L)=>{
    const v = L.version, r = L.row, txt = state.pack.version;
    if(!v.on || !txt) return null;
    const px = v.size*H;
    c.save();
    setFont(c, v.font || iFont(r), v.weight || r.itemWeight, px, v.track);
    c.textBaseline='alphabetic'; c.textAlign='left';
    c.globalAlpha = v.op; c.fillStyle = v.color || iColor(r);
    /* La spaziatura fra le lettere aggiunge spazio anche dopo l'ultima: se
       si allinea a destra usando la larghezza misurata, la scritta resta
       staccata dal bordo di quel tanto. Nel PSD il bordo destro e' esatto,
       quindi lo scarto va tolto. */
    const coda = px * (v.track || 0);
    const w = c.measureText(txt).width;
    const x = (v.align==='right') ? v.x*W - w + coda : v.x*W;
    c.fillText(txt, x, v.y*H);
