window.addEventListener('keydown', e=>{
  const t = e.target.tagName;
  const inCampo = (t==='INPUT'||t==='TEXTAREA'||t==='SELECT');
  /* Dentro a un campo di testo le lettere da sole scrivono, e ci mancherebbe.
     Ma Ctrl+S mentre si scrive il titolo deve salvare il preset, non aprire
     il salva pagina del browser: le scorciatoie con Ctrl passano lo stesso.
     Le tre che nel campo vogliono dire un'altra cosa (annulla, rifai,
     seleziona tutto il testo) restano al campo. */
  /* Annulla, rifai e taglia/copia/incolla restano al campo solo se e' un
     campo dove si scrive davvero. Uno slider, una spunta, un selettore di
     colore e un menu a tendina sono <input> anche loro ma non hanno niente
     da annullare: finche' contavano come campi di testo, Ctrl+Z dopo aver
     mosso uno slider si fermava li' e la cronologia non tornava indietro.
     E dopo un cambiamento il fuoco sta quasi sempre proprio li'. */
  const SCRITTURA = ['text','search','url','email','password','number','tel'];
  const inTesto = t==='TEXTAREA' ||
                  (t==='INPUT' && SCRITTURA.indexOf(String(e.target.type||'text').toLowerCase()) >= 0);
  if(inCampo){
    const k = e.key.toLowerCase();
    /* Esc esce dal campo, come ci si aspetta da un campo di testo */
    if(e.key==='Escape'){ if(e.target.blur) e.target.blur(); return; }
    if(!(e.ctrlKey||e.metaKey)) return;
    if(inTesto && (k==='z'||k==='y'||k==='a'||k==='c'||k==='v'||k==='x')) return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
    e.preventDefault(); document.getElementById(e.shiftKey ? 'bSaveAs' : 'bSave').click(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='e'){
    e.preventDefault();
    document.getElementById(e.shiftKey ? 'bZip' : 'bExp').click(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d'){
    e.preventDefault();
    if(isLay(state.sel)) layerDup(state.sel.slice(4));
    return; }
  /* Ctrl+A prende tutti i livelli del formato, come in ogni programma di
     disegno. Nei campi di testo non arriva qui: il gestore esce prima. */
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){
    const list = layersOf(state.layouts[state.active]);
    if(!list.length) return;
    e.preventDefault();
    state.sel = 'lay:'+list[0].id;
    selMulti = list.slice(1).map(x=>x.id);
    buildControls(); render();
    toast(list.length===1 ? 'Layer selected' : list.length + ' layers selected');
    return; }
  /* Da qui in giu' ci sono i tasti singoli: dentro a un campo scrivono e
     basta */
  if(inCampo) return;
  /* Esc esce dalle viste speciali e scioglie la selezione multipla */
  if(e.key==='Escape'){
    if(compareMode){
      compareMode = false;
      buildTools(); render(); toast('Back to editing'); return;
    }
    if(multiCount() > 1){ multiClear(); buildControls(); render(); return; }
    if(view.z !== 1){ viewFit(); return; }
    return; }
  /* Canc toglie i livelli scelti. Sugli altri elementi non fa niente: la
     fascia o il logo non si cancellano, si spengono, e cancellarli per
     sbaglio con un tasto sarebbe peggio che scomodo. */
  if(!e.ctrlKey && !e.metaKey && (e.key==='Delete' || e.key==='Backspace')){
    const ids = multiIds();
    if(!ids.length) return;
    e.preventDefault();
    /* layerDelete si porta via da solo tutta la selezione multipla, e in
       quel caso il messaggio lo dice gia' lui */
    const uno = ids.length === 1;
    layerDelete(ids[0]);
    if(uno) toast('Layer deleted. Ctrl+Z brings it back');
    return; }
  if(!e.ctrlKey && !e.metaKey && e.key.toLowerCase()==='l'){
    selLocked = !selLocked; HOVER = null; buildTools(); render();
    toast(selLocked ? 'Selection locked on ' + selLabel(state.sel)
                    : 'Selection unlocked'); return; }
  if(e.key===' '){ spazio = true; if(view.z>1) e.preventDefault(); return; }
  /* Ingrandire la tela vale con e senza Ctrl. Con Ctrl serve soprattutto a
     togliere il gesto a Chrome: se non lo prendessimo noi, Ctrl+ e Ctrl-
     ingrandirebbero tutta la pagina, pannelli compresi, che non e' mai
     quello che si vuole mentre si impagina. */
  if(e.key==='+' || e.key==='=' || (e.ctrlKey && e.code==='NumpadAdd')){
    e.preventDefault(); zoomStep(1); return; }
  if(e.key==='-' || e.key==='_' || (e.ctrlKey && e.code==='NumpadSubtract')){
    e.preventDefault(); zoomStep(-1); return; }
  if(e.key==='0'){
    e.preventDefault(); viewFit(); return; }
  if(!e.ctrlKey && !e.metaKey && e.key.toLowerCase()==='c'){
    runAction('compareShow'); return; }
  if(!e.ctrlKey && !e.metaKey && e.key.toLowerCase()==='g'){
    state.snap.on = !state.snap.on; buildTools(); syncControls();
    toast('Snapping ' + (state.snap.on ? 'on' : 'off')); return; }
  if(e.key==='Tab'){
    e.preventDefault();
    const i = FORMATS.findIndex(f=>f.id===state.active);
    const n = FORMATS[(i + (e.shiftKey?-1:1) + FORMATS.length) % FORMATS.length];
    state.active = n.id; buildFormats(); buildControls(); render();
    toast(n.group+' / '+n.name); return; }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)<0) return;
  if(compareMode){
    e.preventDefault();
    toast('Comparison view: press C to go back to editing');
    return; }
  if(!e.repeat) pushUndo();
  /* Un colpo di freccia = un pixel vero del formato che si sta guardando,
     cinque con Shift. Prima il passo era una frazione fissa: sulla Cover
     erano quasi quattro pixel per volta, e sull'Icon da 160 un terzo di
     pixel, cioe' tre colpi per vedere qualcosa muoversi. */
  const misura = sizeOf(FORMATS.find(f=> f.id===state.active) || {w:1000,h:1000});
  const volte = e.shiftKey ? 5 : 1;
  const passoX = volte / Math.max(1, misura.w);
  const passoY = volte / Math.max(1, misura.h);
  const el = elOf(state.sel), pk = posKeysOf(state.sel);
  const dx = (e.key==='ArrowLeft' ? -passoX : e.key==='ArrowRight' ? passoX : 0);
  const dy = (e.key==='ArrowUp'   ? -passoY : e.key==='ArrowDown'  ? passoY : 0);
  if(dx && pk.x) el[pk.x] = clamp(el[pk.x]+dx, -0.5, 1.5);
  if(dy && pk.y) el[pk.y] = clamp(el[pk.y]+dy, -0.5, 1.5);
  /* la riga di testo ha due linee di base: si spostano insieme, come nel
     trascinamento */
  if(state.sel === 'row'){
    if(dx && typeof el.x2 === 'number') el.x2 = clamp(el.x2+dx, -0.5, 1.5);
    if(dy && typeof el.y2 === 'number') el.y2 = clamp(el.y2+dy, -0.5, 1.5);
  }
  if(multiCount() > 1){
    multiLayers().forEach((l,i)=>{
      if(i===0) return;
      if(dx) l.x = clamp(l.x+dx, -0.5, 1.5);
      if(dy) l.y = clamp(l.y+dy, -0.5, 1.5);
    });
  }
  e.preventDefault(); render(); syncControls();
});

/* ======================================================== FILE IN E OUT */
/* Un file rovinato, o che si chiama .png ma non lo e', non fa mai scattare
   onload: senza questa via d'uscita il conteggio delle immagini in arrivo
   non arrivava mai a zero e TUTTO il gruppo spariva in silenzio, anche le
   immagini buone. Qui l'immagine rotta torna come null e chi chiama decide. */
let IMG_SEQ = 0;
function segnaImmagine(im){ if(im && !im.__uid) im.__uid = ++IMG_SEQ; return im; }
/* Aprire un'immagine ha due strade. La prima e' l'elemento <img>, veloce e
   che va bene quasi sempre. Quando quella rifiuta il file (capita con certi
   PNG a 16 bit o con profili di colore particolari, che Photoshop scrive
   volentieri) si prova con createImageBitmap, che usa un decodificatore
   diverso e spesso ce la fa. Se non ce la fa nessuno dei due, chi ha chiamato
   riceve anche il motivo, cosi' il messaggio dice qualcosa di utile invece
   di "non si puo' leggere". */
/* Quando il browser rifiuta un file, "non e' un'immagine" quasi mai e' la
   vera ragione. Le tre che capitano davvero sono: il file non si riesce a
   leggere dal disco (segnaposto di Drive o OneDrive non ancora scaricato,
   file spostato, permessi), il file ha l'estensione di un'immagine ma
   dentro c'e' altro, oppure e' un PNG piu' grande di quanto il browser
   sappia aprire. Guardando i primi byte si capisce quale delle tre e', e
   il messaggio dice cosa fare invece di lasciare l'utente al buio. */
const FIRME_IMG = [
  [[0x89,0x50,0x4e,0x47], 'PNG'],  [[0xff,0xd8,0xff], 'JPEG'],
  [[0x47,0x49,0x46,0x38], 'GIF'],  [[0x42,0x4d], 'BMP'],
  [[0x52,0x49,0x46,0x46], 'WEBP'], [[0x00,0x00,0x01,0x00], 'ICO'],
  [[0x38,0x42,0x50,0x53], 'PSD'],  [[0x25,0x50,0x44,0x46], 'PDF'],
  [[0x49,0x49,0x2a,0x00], 'TIFF'], [[0x4d,0x4d,0x00,0x2a], 'TIFF'],
  [[0x50,0x4b,0x03,0x04], 'ZIP'],  [[0x3c,0x3f,0x78,0x6d], 'SVG'],
  [[0x3c,0x73,0x76,0x67], 'SVG']
];
function firmaDi(b){
  for(let i=0;i<FIRME_IMG.length;i++){
    const f = FIRME_IMG[i][0];
    let ok = f.length <= b.length;
    for(let j=0; ok && j<f.length; j++) if(b[j] !== f[j]) ok = false;
    if(ok) return FIRME_IMG[i][1];
  }
  return '';
}
/* larghezza e altezza stanno nell'intestazione del PNG, subito dopo la firma */
function misuraPng(b){
  if(firmaDi(b) !== 'PNG' || b.length < 24) return null;
  const n = i => ((b[i]<<24 | b[i+1]<<16 | b[i+2]<<8 | b[i+3]) >>> 0);
  const w = n(16), h = n(20);
  return (w && h && w < 1e6 && h < 1e6) ? [w, h] : null;
}
const LATO_MAX = 16384;
function perche(file, cb){
  const nome = (file && file.name) || 'file';
  if(!file || !file.size){ cb(nome + ' is empty (0 KB)'); return; }
  let detto = false;
  const di = t => { if(detto) return; detto = true; clearTimeout(attesa); cb(t); };
  const attesa = setTimeout(()=> di(nome + ': the file could not be read from disk'), 8000);
  let letto = null;
  try{ letto = file.slice(0, 32).arrayBuffer(); }catch(e){ letto = null; }
  if(!letto){ di(nome + ': the file could not be read from disk'); return; }
  letto.then(buf=>{
    const b = new Uint8Array(buf);
    const tipo = firmaDi(b);
    const est = ((nome.match(/\.([a-z0-9]+)$/i) || ['',''])[1] || '').toUpperCase();
    if(!tipo){
      di(nome + ' is not an image: its first bytes match no image format');
      return;
    }
    const mis = misuraPng(b);
    if(mis && (mis[0] > LATO_MAX || mis[1] > LATO_MAX || mis[0]*mis[1] > 2.5e8)){
      di(nome + ' is ' + mis[0] + 'x' + mis[1] + ' px: too big for the browser to open. ' +
         'Resize it and try again');
      return;
    }
    const pari = tipo === est || (tipo === 'JPEG' && (est === 'JPG' || est === 'JPEG'));
    if(!pari && est)
      di(nome + ' is named .' + est.toLowerCase() + ' but contains ' + tipo + ' data');
    else if(tipo === 'PSD' || tipo === 'PDF' || tipo === 'ZIP' || tipo === 'SVG')
      di(nome + ' is a ' + tipo + ' file, which the browser cannot use as an image');
    else
      di(nome + ': the ' + tipo + ' data is damaged, the browser cannot decode it');
  }).catch(()=> di(nome + ': the file could not be read from disk. If it lives on ' +
                   'Google Drive or OneDrive, make it available offline first'));
}

function loadImage(file, cb){
  const nome = (file && file.name) || 'file';
  let fatto = false, url = null, tempo = null;
  const chiudi = (v, motivo)=>{
    if(fatto) return;
    fatto = true;
    if(tempo) clearTimeout(tempo);
    if(url) URL.revokeObjectURL(url);
    cb(v, motivo);
  };
  /* ultima parola: si spiega perche' non si e' potuto aprire */
  const arrenditi = ()=>{ if(!fatto) perche(file, m=> chiudi(null, m)); };
  /* seconda strada: alcuni file che <img> rifiuta passano da qui */
  const conBitmap = ()=>{
    if(fatto) return;
    if(typeof createImageBitmap !== 'function'){ arrenditi(); return; }
    createImageBitmap(file).then(bm=>{
      /* lo porto su una tela: da li' in poi e' un'immagine come le altre */
      const c = document.createElement('canvas');
      c.width = bm.width; c.height = bm.height;
      c.getContext('2d').drawImage(bm, 0, 0);
      if(bm.close) bm.close();
      chiudi(segnaImmagine(c));
    }).catch(()=> arrenditi());
  };
  try{ url = URL.createObjectURL(file); }
  catch(e){ chiudi(null, nome + ': the browser cannot open this file'); return; }
  const im = new Image();
  im.onload  = ()=> chiudi(segnaImmagine(im));
  im.onerror = ()=> conBitmap();
  /* se il browser non dice ne' si ne' no si prova l'altra strada */
  tempo = setTimeout(()=> conBitmap(), 25000);
  im.src = url;
}
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2800);
}
function slug(s){ return (s||'pack').trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'_').substring(0,40) || 'pack'; }
/* Nome di file utilizzabile su Windows, Mac e Linux. Oltre ai caratteri
   vietati va tagliata anche la lunghezza: sopra i 255 caratteri il file non
   si crea, e dentro uno zip il problema si scopre solo quando lo si apre.
   Taglio a 120 per stare largo anche con la cartella davanti. */
/* Windows si ferma a 260 caratteri di percorso intero. Con la cartella e il
   nome del file tutti e due al massimo si arrivava a 245, e bastava una
   cartella di partenza un po' profonda per non riuscire piu' a estrarre lo
   zip. Novanta per pezzo lasciano spazio al percorso di chi apre. */
const NOME_MAX = 90;
/* Le lettere accentate diventavano trattini: "Citta' & Nuvole" usciva
   "Citt-_-_Nuvole". Qui prima si tolgono gli accenti, cosi' resta la
   parola leggibile. */
function senzaAccenti(s){
  try{ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  catch(e){ return String(s); }
}
function safe(s){
  let out = senzaAccenti(s).replace(/[^A-Za-z0-9._-]+/g,'-');
  /* Un nome che comincia o finisce con un punto e' un guaio: ".." dentro un
     percorso vuol dire "cartella sopra", e uno zip con dentro una cartella
     ".." e' proprio quello che i programmi di archiviazione rifiutano. */
  out = out.replace(/^[-.\s]+|[-.\s]+$/g, '');
  out = out.replace(/\.{2,}/g, '.').replace(/-{2,}/g, '-');
  if(out.length > NOME_MAX) out = out.slice(0, NOME_MAX).replace(/[-.]+$/,'');
  /* nomi che Windows si tiene per se': ci aggiungo un trattino basso */
  if(/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i.test(out)) out += '_';
  return out || 'x';
}

/* Gli screenshot si accumulano in una libreria: caricarne altri non
   cancella quelli di prima, cosi' si possono mettere insieme immagini
   prese da cartelle diverse e provare accostamenti. */
/* chi chiama compone il messaggio: cosi' non se ne accavallano due */
function frase(n, rotte, motivo){
  const a = rotte ? (rotte===1 ? ', 1 file was not a readable image'
                               : ', '+rotte+' files were not readable images') : '';
  if(!n) return rotte ? (rotte===1 ? (motivo || 'That file could not be read as an image')
                                   : 'None of those '+rotte+' files could be read as images')
                      : 'Nothing new to add';
  return n+' added, '+SHOTS.length+' screenshots in the library'+a;
}
/* Uno screenshot con parti trasparenti diventa un buco nero nel file
   esportato, e il buco si vede solo dopo, sullo store. Qui si guarda una
   volta sola, al caricamento: si rimpicciolisce l'immagine a 128 pixel e
   si guarda il canale alpha. Costa una lettura di 16 mila pixel. */
function haTrasparenza(im){
  try{
    const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
    if(!w || !h) return false;
    const lato = 128;
    const sw = Math.max(1, Math.round(w >= h ? lato : lato*w/h));
    const sh = Math.max(1, Math.round(h >= w ? lato : lato*h/w));
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.clearRect(0, 0, sw, sh);
    g.drawImage(im, 0, 0, sw, sh);
    const d = g.getImageData(0, 0, sw, sh).data;
    let bucati = 0;
    for(let i=3; i<d.length; i+=4) if(d[i] < 250) bucati++;
    /* qualche pixel sul bordo puo' essere mezzo trasparente per il
       ridimensionamento: si segnala solo se e' una zona vera */
    return bucati > sw*sh*0.005;
  }catch(e){ return false; }
}
function addShots(files, done){
  if(!files.length){ if(done) done(0, 0); return; }
  let left = files.length;
  const loaded = [];
  let rotte = 0, primoMotivo = '';
  files.forEach((file, i)=>{
    loadImage(file, (im, motivo)=>{
      if(im) loaded[i] = {name:file.name, img:im, path:file.webkitRelativePath || file.name,
                          blob:file, buchi: haTrasparenza(im)};
      else { rotte++; if(!primoMotivo && motivo) primoMotivo = motivo; }
      if(--left===0){
        const fresh = loaded.filter(Boolean);
        fresh.forEach(sh=>{
          if(!SHOTS.some(x=> x.name===sh.name && x.path===sh.path)) SHOTS.push(sh);
        });
        if(!imgShot && SHOTS.length) imgShot = SHOTS[0].img;
        autoAssignPanels();
        dbSalva();
        showLibrary();
        if(done) done(fresh.length, rotte, primoMotivo);
      }
    });
  });
}

document.getElementById('fImg').onchange = e=>{
  const files = [...e.target.files];
  e.target.value = '';
  addShots(files, (n, rotte, motivo)=>{
    toast(n===1 && SHOTS.length===1 && !rotte ? 'Screenshot loaded' : frase(n, rotte, motivo));
  });
};

/* ==========================================================================
   LE IMMAGINI RESTANO DA UNA VOLTA ALL'ALTRA
   Il salvataggio automatico tiene tutto tranne le immagini: sono troppo
   pesanti per lo spazio a chiave e valore del browser. Vanno pero' in
   IndexedDB, che ne regge molte e le tiene com'erano. Cosi' riaprendo la
   pagina la libreria e' ancora li' e i pannelli mostrano quello che
   mostravano. Se il browser non lo permette non cambia niente: si lavora
   come prima, solo senza il ritorno delle immagini.
   ========================================================================== */
const DB_NOME = 'davfx-store-graphics', DB_VER = 1;
let _db = null, _dbRotto = false;
function dbApri(){
  if(_dbRotto) return Promise.resolve(null);
  if(_db) return Promise.resolve(_db);
  return new Promise(ris=>{
    let req;
    try{ req = indexedDB.open(DB_NOME, DB_VER); }
    catch(e){ _dbRotto = true; return ris(null); }
    req.onupgradeneeded = ()=>{
      const d = req.result;
      if(!d.objectStoreNames.contains('shots')) d.createObjectStore('shots', {keyPath:'i'});
      if(!d.objectStoreNames.contains('meta'))  d.createObjectStore('meta');
    };
    req.onsuccess = ()=>{ _db = req.result; ris(_db); };
    req.onerror   = ()=>{ _dbRotto = true; ris(null); };
    req.onblocked = ()=>{ _dbRotto = true; ris(null); };
  });
}
/* riscrivo l'elenco intero: le mosse sono poche (aggiunta, cancellazione,
   spostamento) e cosi' l'ordine sul disco e' sempre quello vero */
let dbTimer = null, dbAvvisato = false;
function dbSalva(){
  if(dbTimer) clearTimeout(dbTimer);
  dbTimer = setTimeout(dbSalvaOra, 400);
}
function dbSalvaOra(){
  dbTimer = null;
  dbApri().then(d=>{
    if(!d) return;
    try{
      const t = d.transaction(['shots','meta'], 'readwrite');
      t.onerror = t.onabort = ()=>{
        if(!dbAvvisato){ dbAvvisato = true;
          toast('Could not keep the images for next time: not enough room in the browser'); }
      };
      const st = t.objectStore('shots');
      st.clear();
      SHOTS.forEach((sh, i)=>{
        if(!sh.blob) return;                 /* senza il file originale non salvo */
        st.put({i:i, nome:sh.name, path:sh.path || sh.name, blob:sh.blob});
      });
      const mt = t.objectStore('meta');
      const attiva = SHOTS.findIndex(x=> x.img === imgShot);
      mt.put(attiva, 'principale');
      mt.put(logoBlob || null, 'logo');
    }catch(e){ _dbRotto = true; }
  });
}
function dbSvuota(){
  dbApri().then(d=>{
    if(!d) return;
    try{
      const t = d.transaction(['shots','meta'], 'readwrite');
      t.objectStore('shots').clear();
      t.objectStore('meta').delete('principale');
    }catch(e){}
  });
}
function blobInImmagine(blob){
  return new Promise(ris=>{
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload  = ()=>{ URL.revokeObjectURL(url); ris(segnaImmagine(im)); };
    im.onerror = ()=>{ URL.revokeObjectURL(url); ris(null); };
    im.src = url;
  });
}
async function dbCarica(){
  const d = await dbApri();
  if(!d) return 0;
  let righe = [], principale = -1, logo = null;
  try{
    righe = await new Promise((ris, rif)=>{
      const r = d.transaction('shots').objectStore('shots').getAll();
      r.onsuccess = ()=> ris(r.result || []);
      r.onerror   = ()=> ris([]);
    });
    principale = await new Promise(ris=>{
      const r = d.transaction('meta').objectStore('meta').get('principale');
      r.onsuccess = ()=> ris(typeof r.result === 'number' ? r.result : -1);
      r.onerror   = ()=> ris(-1);
    });
    logo = await new Promise(ris=>{
      const r = d.transaction('meta').objectStore('meta').get('logo');
      r.onsuccess = ()=> ris(r.result || null);
      r.onerror   = ()=> ris(null);
    });
  }catch(e){ return 0; }
  righe.sort((a,b)=> a.i - b.i);
  const dentro = [];
  for(const r of righe){
    const im = await blobInImmagine(r.blob);
    if(im) dentro.push({name:r.nome, img:im, path:r.path, blob:r.blob});
  }
  if(dentro.length){
    SHOTS = dentro;
    imgShot = (principale >= 0 && SHOTS[principale]) ? SHOTS[principale].img : SHOTS[0].img;
  }
  if(logo){
    const im = await blobInImmagine(logo);
    /* stessa rifilatura del bordo trasparente che si fa al caricamento,
       se no il logo tornerebbe diverso da come lo si e' lasciato */
    if(im){ imgLogo = trimAlpha(im).img; logoBlob = logo; }
  }
  return dentro.length;
}

/* Se ci sono piu' pannelli e nessuno ha un'immagine assegnata, li riempio
   in ordine: e' quello che serve per affiancare screenshot diversi senza
   dover scegliere a mano ogni volta. Le scelte gia' fatte non si toccano. */
function autoAssignPanels(){
  FORMATS.forEach(f=>{
    const S = state.layouts[f.id].shot;
    const n = Math.max(1, Math.round(S.panels||1));
    if(n < 2 || !Array.isArray(S.src)) return;
    let vuoti = 0;
    for(let i=0;i<n;i++) if(S.src[i]===undefined || S.src[i]<0) vuoti++;
    if(vuoti !== n) return;               /* qualcuno ha gia' scelto: lascio stare */
    for(let i=0;i<n;i++) S.src[i] = Math.min(i, SHOTS.length-1);
  });
}

/* ==========================================================================
   SCANSIONE DI UNA CARTELLA
   Si sceglie una cartella e si prendono tutte le immagini che ci sono, anche
   nelle sottocartelle, in ordine di percorso (2 prima di 10). Prima la
   scansione cercava solo una cartella chiamata Screenshots sotto quella di
   un pack, quindi una cartella normale di PNG non dava niente.
   Un solo caso si tratta a parte: le cartelle dei pack hanno spesso "No
   Edit" e "Edit" con le stesse schermate, ritoccate e no. Se c'e' una No
   Edit, le copie dentro le cartelle Edit restano fuori, se no entrerebbero
   tutte due volte.
   ========================================================================== */
const IMG_RE = /\.(png|jpe?g|webp|bmp|gif)$/i;
function immaginiDellaCartella(files){
  const parola = x => String(x).toLowerCase().replace(/[^a-z]/g, '');
  const cartelle = f => (f.webkitRelativePath || f.name).split('/').slice(0, -1).map(parola);
  const img = files.filter(f=> IMG_RE.test(f.name));
  const conNoEdit = img.some(f=> cartelle(f).indexOf('noedit') >= 0);
  const prese = conNoEdit ? img.filter(f=> cartelle(f).indexOf('edit') < 0) : img;
  const via = f => f.webkitRelativePath || f.name;
  return prese.sort((a, b)=> via(a).localeCompare(via(b), undefined, {numeric:true, sensitivity:'base'}));
}

/* ==========================================================================
   TRASCINA E INCOLLA
   Passare ogni volta dal bottone "carica" per una schermata e' il gesto
   che si ripete di piu'. Qui i file si buttano sulla finestra e basta:
   le immagini finiscono nella libreria, ma se le lasci cadere sopra il
   logo prendono il posto del logo; un .json e' un progetto. Ctrl+V fa lo
   stesso con quello che c'e' negli appunti.
   ========================================================================== */
const dropzone = document.getElementById('dropzone');
function mostraDrop(acceso, testo){
  if(!dropzone) return;
  dropzone.classList.toggle('on', !!acceso);
  if(testo) dropzone.querySelector('span').textContent = testo;
}
function haFile(e){
  const d = e.dataTransfer;
  if(!d) return false;
  if(d.types && [...d.types].indexOf('Files') >= 0) return true;
  return !!(d.files && d.files.length);
}
/* il puntatore e' sopra il logo disegnato sulla tela? */
function sopraIlLogo(e){
  const r = cv.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return false;
  const b = BOXES.logo;
  if(!b) return false;
  const x = (e.clientX - r.left)/r.width * PW;
  const y = (e.clientY - r.top )/r.height* PH;
  return x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h;
}
let dropProfondita = 0;

function smistaFile(files, comeLogo){
  const img  = files.filter(f=> /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name));
  const json = files.filter(f=> /\.json$/i.test(f.name));
  const font = files.filter(f=> /\.(ttf|otf|woff2?)$/i.test(f.name));
  if(comeLogo && img.length){
    caricaLogoFile(img[0]);
    if(img.length > 1) addShots(img.slice(1), (n, rotte, motivo)=> toast(frase(n, rotte, motivo)));
    return;
  }
  if(img.length) addShots(img, (n, rotte, motivo)=>
    toast(n===1 && SHOTS.length===1 && !rotte ? 'Screenshot loaded' : frase(n, rotte, motivo)));
  if(json.length) caricaPresetFile(json[0]);
  if(font.length){
    const file = font[0];
    file.arrayBuffer().then(buf=>{
      const ff = new FontFace('UserFont', buf);
      return ff.load().then(l=>{ document.fonts.add(l); state.customFont = file.name;
        buildControls(); render();
        toast('Font loaded - pick "Custom (loaded)" in any Font list'); });
    }).catch(()=> toast('Invalid font file'));
  }
  if(!img.length && !json.length && !font.length)
    toast('I can take images, a font, or a project file (.json)');
}

/* Ctrl+V: immagini dagli appunti */
window.addEventListener('paste', e=>{
  const t = e.target.tagName;
  if(t==='INPUT' || t==='TEXTAREA') return;      /* sta scrivendo, non tocco */
  const dt = e.clipboardData;
  if(!dt) return;
  const files = [...(dt.files||[])];
  if(!files.length && dt.items){
    [...dt.items].forEach(it=>{
      if(it.kind==='file'){ const f = it.getAsFile(); if(f) files.push(f); }
    });
  }
  if(files.length){
    e.preventDefault();
    /* le immagini incollate spesso si chiamano tutte "image.png" */
    let k = SHOTS.length + 1;
    const rinominati = files.map(f=>{
      if(!/^image\//.test(f.type)) return f;
      const est = (f.type.split('/')[1]||'png').replace('jpeg','jpg');
      try{ return new File([f], 'pasted-'+(k++)+'.'+est, {type:f.type}); }
      catch(err){ return f; }
    });
    smistaFile(rinominati, false);
  }
});

/* Il PNG del logo di solito ha una tela molto piu' grande del segno, con
   tutto il resto trasparente. Se lo si inserisce cosi' com'e' il logo
   risulta minuscolo dentro il suo riquadro. Qui ritaglio il rettangolo
   che contiene davvero i pixel visibili, prima di usarlo. */
function trimAlpha(im, thr){
  const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
  if(!w || !h) return {img:im, trimmed:false};
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.drawImage(im, 0, 0);
  let d;
  try{ d = g.getImageData(0,0,w,h).data; }
  catch(err){ return {img:im, trimmed:false}; }
  const T = thr===undefined ? 8 : thr;
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++){
    const row = y*w*4;
    for(let x=0;x<w;x++){
      if(d[row+x*4+3] > T){
        if(x<x0) x0=x;
        if(x>x1) x1=x;
        if(y<y0) y0=y;
        y1=y;
      }
    }
  }
  if(x1<0) return {img:im, trimmed:false};
  const tw = x1-x0+1, th = y1-y0+1;
  /* se il margine trasparente e' trascurabile lascio stare */
  if(tw>=w*0.98 && th>=h*0.98) return {img:im, trimmed:false};
  const o = document.createElement('canvas');
  o.width = tw; o.height = th;
  o.getContext('2d').drawImage(c, x0, y0, tw, th, 0, 0, tw, th);
  return {img:o, trimmed:true, before:[w,h], after:[tw,th]};
}

}

/* ==========================================================================
   PROGETTO SU FILE
   Il file del progetto porta dentro le immagini, non i loro percorsi: un
   percorso vale solo sul disco dove e' stato scritto, e una pagina nel
   browser non puo' andare a cercare un file da sola. Con le immagini dentro
   il progetto si apre uguale su un altro computer, dopo aver spostato o
   rinominato le cartelle, o mandato a qualcuno. Costa spazio: ogni immagine
   pesa quanto il suo file piu' un terzo. Si salvano i byte originali, non
   una copia ricodificata, quindi la qualita' e' quella del file di partenza.

   Il primo Save chiede dove; da li' in poi Save scrive sullo stesso file
   senza chiedere niente, e "Save as" sceglie un file nuovo. Il file scelto
   si ricorda anche dopo aver chiuso il programma.
   ========================================================================== */
let fileProgetto = null, nomeProgetto = '', firmaSalvata = '', salvando = false;
function blobInBase64(blob){
  return new Promise((ris, rif)=>{
    const r = new FileReader();
    r.onload = ()=> ris(String(r.result).slice(String(r.result).indexOf(',') + 1));
    r.onerror = ()=> rif(r.error);
    r.readAsDataURL(blob);
  });
}
function base64InBlob(b64, tipo){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], {type: tipo || 'image/png'});
}
function immagineInBlob(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  return new Promise(r=> c.toBlob(r, 'image/png'));
}
/* cosa c'e' nel progetto adesso, per sapere se ci sono cambiamenti non salvati */
function firmaProgetto(stato){
  return (stato || snapState()) + '|' + SHOTS.map(x=> x.img.__uid || 0).join(',') + '|' +
         (imgLogo && imgLogo.__uid || 0);
}
async function testoProgetto(){
  const images = [];
  for(const sh of SHOTS){
    const blob = sh.blob || await immagineInBlob(sh.img);
    images.push({name:sh.name, path:sh.path || sh.name, type:blob.type || 'image/png',
                 data: await blobInBase64(blob)});
  }
  const logo = logoBlob ? {name:logoBlob.name || 'logo.png', type:logoBlob.type || 'image/png',
                           data: await blobInBase64(logoBlob)} : null;
  return JSON.stringify({app:'store-graphics', v:APP.version, format:2,
    pack:state.pack, theme:state.theme, naming:state.naming, export:state.export,
    variants:state.variants, layouts:state.layouts, active:state.active,
    images, logo});
}
async function permessoScrittura(h){
  try{
    if(!h.queryPermission) return true;
    if(await h.queryPermission({mode:'readwrite'}) === 'granted') return true;
    return await h.requestPermission({mode:'readwrite'}) === 'granted';
  }catch(e){ return false; }
}
function aggiornaInfoProgetto(firma){
  const el = document.getElementById('projInfo');
  if(!el) return;
  const nome = el.querySelector('b') || document.createElement('b');
  const auto = el.querySelector('.auto') || document.createElement('span');
  auto.className = auto.className || 'auto';
  if(!el.contains(nome)){ el.textContent = ''; el.appendChild(nome); el.appendChild(auto); }
  const cambiato = !!nomeProgetto && firma !== undefined && firma !== firmaSalvata;
  nome.textContent = nomeProgetto ? nomeProgetto + (cambiato ? ' *' : '') : '';
  el.title = nomeProgetto
    ? (cambiato ? 'Changes not saved to ' + nomeProgetto + ' yet. Ctrl+S saves them'
                : 'Saved in ' + nomeProgetto)
    : 'Not saved to a file yet. The work is kept in this program by the autosave';
}
/* L'autosalvataggio lo dice con una parola accanto a Save, che si accende
   un momento e torna grigia: niente finestre, niente messaggi in mezzo. */
function segnaAutosave(){
  const el = document.getElementById('projInfo');
  if(!el) return;
  aggiornaInfoProgetto(firmaProgetto());
  const auto = el.querySelector('.auto');
  const d = new Date();
  auto.textContent = (nomeProgetto ? '  \u00b7  ' : '') + 'Auto saved ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  auto.classList.add('lampo');
  clearTimeout(auto._t); auto._t = setTimeout(()=> auto.classList.remove('lampo'), 900);
}
function ricordaFileProgetto(h){
  dbApri().then(d=>{ if(!d) return; try{ d.transaction('meta','readwrite').objectStore('meta').put(h, 'progetto'); }catch(e){} });
}
function dimenticaFileProgetto(){
  fileProgetto = null; nomeProgetto = ''; firmaSalvata = '';
  dbApri().then(d=>{ if(!d) return; try{ d.transaction('meta','readwrite').objectStore('meta').delete('progetto'); }catch(e){} });
  aggiornaInfoProgetto();
}
async function riprendiFileProgetto(){
  const d = await dbApri(); if(!d) return;
  const h = await new Promise(ris=>{
    try{ const r = d.transaction('meta').objectStore('meta').get('progetto');
         r.onsuccess = ()=> ris(r.result || null); r.onerror = ()=> ris(null); }
    catch(e){ ris(null); }
  });
  if(!h || !h.name) return;
  fileProgetto = h; nomeProgetto = h.name;
  /* lo stato appena ripreso e' quello di quando si e' chiuso: per quanto ne
     sappiamo coincide con il file, finche' non si cambia qualcosa */
  firmaSalvata = firmaProgetto();
  aggiornaInfoProgetto(firmaSalvata);
}
async function salvaProgetto(nuovo){
  if(salvando) return;
  salvando = true;
  try{
    let h = nuovo ? null : fileProgetto;
    if(h && !(await permessoScrittura(h))) h = null;
    if(!h){
      /* il selettore va aperto subito, finche' il clic e' ancora fresco */
      if(typeof window.showSaveFilePicker !== 'function'){
        const t = await testoProgetto();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], {type:'application/json'}));
        a.download = slug(state.pack.title) + '.json'; a.click();
        toast('Project saved'); return;
      }
      try{
        h = await window.showSaveFilePicker({suggestedName: slug(state.pack.title) + '.json', types:TIPO_PROGETTO});
      }catch(e){ if(e && e.name === 'AbortError') return; throw e; }
    }
    const stato = snapState();
    const testo = await testoProgetto();
    const w = await h.createWritable();
    await w.write(new Blob([testo], {type:'application/json'}));
    await w.close();
    fileProgetto = h; nomeProgetto = h.name;
    firmaSalvata = firmaProgetto(stato);
    ricordaFileProgetto(h);
    aggiornaInfoProgetto(firmaProgetto());
    toast('Saved to ' + h.name + (SHOTS.length ? ', ' + SHOTS.length + ' image' + (SHOTS.length===1?'':'s') + ' inside' : ''));
  }catch(e){
    toast('Could not save: ' + (e && e.message || e));
  }finally{ salvando = false; }
}
document.getElementById('bSave').onclick = ()=> salvaProgetto(false);
document.getElementById('bSaveAs').onclick = ()=> salvaProgetto(true);

/* i preset vecchi restano validi: i campi mancanti vengono presi dai default */
function mergeLayout(f, got){
  const def = defLayout(f), out = {};
  Object.keys(def).forEach(k=>{
    if(k==='layers') return;
    out[k] = (def[k] && typeof def[k]==='object')
      ? Object.assign({}, def[k], got[k]||{})
      : (got[k]!==undefined ? got[k] : def[k]);
  });
  out.layers = Array.isArray(got.layers) ? got.layers.map(fixLayer) : [];
  migraPannelli(out);
  /* i preset salvati prima dei livelli avevano Shape 1/2/3 */
  ['shape1','shape2','shape3'].forEach(k=>{ if(got[k]) out[k] = got[k]; });
  migrateShapes(out);
  return out;
}
function caricaPresetFile(f, handle){
  if(!f) return;
  f.text().then(async t=>{
    const d = JSON.parse(t);
    /* Un JSON qualsiasi non e' un preset: prima diceva "Preset loaded" e non
       cambiava niente, e uno resta li' a chiedersi perche'. */
    const suo = d && typeof d === 'object' &&
                (d.pack || d.layouts || d.theme || d.naming || Array.isArray(d.variants));
    if(!suo){ toast((f.name||'That file') + ' is not a Store Graphics project'); return; }
    pushUndo();
    /* le immagini del progetto prendono il posto di quelle aperte: gli
       indici dei pannelli parlano di quell'elenco, non di un altro */
    let immagini = 0, rotte = 0;
    if(Array.isArray(d.images)){
      const nuove = [];
      for(const x of d.images){
        try{
          const blob = base64InBlob(x.data, x.type);
          const file = new File([blob], x.name || 'image.png', {type: blob.type});
          const im = await blobInImmagine(file);
          if(im) nuove.push({name:file.name, img:im, path:x.path || file.name, blob:file, buchi:haTrasparenza(im)});
          else rotte++;
        }catch(e){ rotte++; }
      }
      SHOTS = nuove; imgShot = SHOTS.length ? SHOTS[0].img : null;
      immagini = nuove.length;
    }
    if(d.logo && d.logo.data){
      try{
        const blob = base64InBlob(d.logo.data, d.logo.type);
        const im = await blobInImmagine(blob);
        if(im){ imgLogo = trimAlpha(im).img; logoBlob = new File([blob], d.logo.name || 'logo.png', {type: blob.type}); }
      }catch(e){}
    }
    if(d.export) state.export = Object.assign({}, state.export, d.export);
    if(d.pack) state.pack = Object.assign({}, state.pack, d.pack);
    if(d.theme) state.theme = Object.assign({}, state.theme, d.theme);
    if(d.naming) state.naming = Object.assign({}, state.naming, d.naming);
    if(Array.isArray(d.variants)) state.variants = d.variants;
    if(d.layouts) FORMATS.forEach(fm=>{
      if(d.layouts[fm.id]) state.layouts[fm.id] = mergeLayout(fm, d.layouts[fm.id]);
    });
    /* un preset salvato mesi fa porta dentro le misure di allora, come il
       salvataggio automatico */
    migraSalvataggio({theme:state.theme, layouts:state.layouts});
    if(d.active && FORMATS.some(fm=> fm.id === d.active)) state.active = d.active;
    dbSalva();
    fileProgetto = handle || null; nomeProgetto = handle ? handle.name : '';
    if(handle) ricordaFileProgetto(handle); else dimenticaFileProgetto();
    firmaSalvata = firmaProgetto();
    aggiornaInfoProgetto(firmaSalvata);
    buildFormats(); buildControls(); render();
    /* si dice cosa e' entrato davvero: un preset di un'altra versione puo'
       avere solo una parte delle cose */
    const pezzi = [];
    if(d.pack) pezzi.push('texts');
    if(d.layouts) pezzi.push(FORMATS.filter(fm=> d.layouts[fm.id]).length + ' layouts');
    if(Array.isArray(d.variants) && d.variants.length) pezzi.push(d.variants.length + ' variants');
    if(immagini) pezzi.push(immagini + ' image' + (immagini===1?'':'s'));
    if(rotte) pezzi.push(rotte + ' image' + (rotte===1?'':'s') + ' could not be read');
    toast((Array.isArray(d.images) ? 'Project opened' : 'Older preset opened, images not included') +
          (pezzi.length ? ': ' + pezzi.join(', ') : ''));
    /* il font caricato non sta dentro al preset: se il preset lo chiede e
       non c'e', le scritte escono con un altro carattere senza dire niente */
    if(!state.customFont && chiedonoIlFontMio())
      setTimeout(()=> toast('This project asks for a loaded font, and none is loaded: ' +
        'the text falls back to the system font. Use Font to load the file'), 2400);
  }).catch(()=> toast('That file could not be read as a project'));
}

function renderFormatToBlob(f, cb){
  const o = outSize(f);
  /* Un export a piena risoluzione alloca tele da decine di megabyte. Se la
     memoria delle schermate e' piena di anteprime il browser se le contende
     e l'export ci mette il triplo del tempo: misurato 950 ms contro 350 su
     una Asset page 4K. Prima di un export grande la si svuota, tanto
     l'anteprima se la rifa' da sola al primo disegno. */
  if(Math.max(o.w, o.h) > CACHE_LATO_MAX) svuotaMemoriaSchermate();
  const c = document.createElement('canvas');
  c.width = o.w; c.height = o.h;
  /* niente 'sizes' nello shim: w/h sono gia' la misura finale scelta,
     ricalcolarla porterebbe a disegnare alla risoluzione sbagliata */
  const shim = {id:f.id, group:f.group, name:f.name, note:f.note, profile:f.profile,
                w:o.w, h:o.h};
  renderTo(c.getContext('2d'), shim, state.layouts[f.id], false);
  const mime = exportMime();
  if(mime === 'image/png') c.toBlob(cb, mime);          /* PNG: nessuna perdita */
  else c.toBlob(cb, mime, state.export.quality);
}
/* ==========================================================================
   EXPORT NUMERATO IN UNA CARTELLA
   La cartella si sceglie una volta e si ricorda. Ogni file prende il primo
   numero libero dopo il nome (Asset_page_3.png): il numero si ricava da
   quello che c'e' davvero nella cartella, il piu' alto piu' uno, quindi non
   si sovrascrive mai niente, nemmeno con dei buchi nella numerazione o
   file aggiunti a mano. Niente piu' finestra "salva come" a ogni export.
   ========================================================================== */
let cartellaExport = null;
async function scegliCartellaExport(){
  const h = await window.showDirectoryPicker({id:'sg-export', mode:'readwrite'});
  cartellaExport = h;
  dbApri().then(d=>{ if(!d) return; try{ d.transaction('meta','readwrite').objectStore('meta').put(h, 'cartellaExport'); }catch(e){} });
  buildControls();
  toast('Exports go to ' + h.name);
  return h;
}
async function riprendiCartellaExport(){
  const d = await dbApri(); if(!d) return;
  cartellaExport = await new Promise(ris=>{
    try{ const r = d.transaction('meta').objectStore('meta').get('cartellaExport');
         r.onsuccess = ()=> ris(r.result || null); r.onerror = ()=> ris(null); }
    catch(e){ ris(null); }
  });
}
function scaricaFile(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 60000);
}
const _numeriSenzaCartella = {};
async function cartellaPronta(){
  if(typeof window.showDirectoryPicker !== 'function') return null;
  let dir = cartellaExport;
  if(dir && !(await permessoScrittura(dir))) dir = null;
  return dir || await scegliCartellaExport();
}
async function esportaNumerato(blobOPromessa, nome, dirGia){
  const p = nome.lastIndexOf('.'), base = nome.slice(0, p), est = nome.slice(p);
  if(typeof window.showDirectoryPicker !== 'function'){
    const k = (_numeriSenzaCartella[base] || 0) + 1; _numeriSenzaCartella[base] = k;
    scaricaFile(await blobOPromessa, base + '_' + k + est);
    return base + '_' + k + est;
  }
  /* la cartella prima del disegno: il selettore va aperto finche' il clic
     e' ancora fresco */
  const dir = dirGia || await cartellaPronta();
  const blob = await blobOPromessa;
  const re = new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_(\\d+)\\.[a-z0-9]+$', 'i');
  let max = 0;
  for await (const [voce] of dir.entries()){ const m = re.exec(voce); if(m) max = Math.max(max, +m[1]); }
  const finale = base + '_' + (max + 1) + est;
  const fh = await dir.getFileHandle(finale, {create:true});
  const w = await fh.createWritable(); await w.write(blob); await w.close();
  return finale;
}

  /* l'avviso del controllo va detto alla fine, se no l'ultimo messaggio lo

  toast(list.length+' image'+(list.length===1?'':'s')+' exported in ' + scritto +

/* ============================================================================
   LOOKS
   Stili pronti da provare sopra la grafica base. Ognuno tocca solo il layout
   del formato corrente, mai i testi ne' i colori del pack.
   Per aggiungerne uno: una voce qui dentro. Compare da solo nel pannello.
   ============================================================================ */
/* Sui formati grandi il testo comincia a destra del logo, quindi far
   partire la barra accento dalla x del testo va bene. Su Card e Icon invece
   logo e testo hanno lo stesso margine sinistro, e la barra finiva per
   attraversare il quadrato del logo. Qui la si fa cominciare dopo il logo,
   quando serve. */
/* Ultimo controllo dopo che il Look ha finito e il riordino ha spostato le
   cose: una barra che non parte dal bordo della tela non deve tagliare il
   quadrato del logo. Sui formati grandi non succede mai, su Card e Icon
   logo e testo hanno lo stesso margine e senza questo la barra passava
   attraverso il logo. */
function accentoFuoriDalLogo(L, fm){
  const a = L.accent, lg = L.logo;
  if(!a || !a.on || !lg || !lg.on || !fm) return;
  if(a.x0 <= 0.03) return;                 /* barra da bordo a bordo: passa dietro apposta */
  const lw = lg.size * fm.h / fm.w;
  const alto = lg.y, basso = lg.y + lg.size;
  if(a.y < alto || a.y > basso) return;    /* passa sopra o sotto, non la tocca */
  const destra = lg.x + lw;
  if(a.x0 < destra){
    /* la barra taglia il logo: la faccio partire subito dopo */
    const nuovo = destra + lw*0.10;
    if(a.x1 - nuovo > 0.12) a.x0 = nuovo;
  } else if(a.x0 - destra > lw*0.12){
    /* Il caso opposto, e piu' brutto da vedere: la barra parte molto
       dopo il logo e resta a mezz'aria, con un buco in mezzo. Nel PSD la
       barra nasce sul bordo del quadrato del logo, e alcuni Look la
       facevano partire dalla x del testo dimenticandosi del logo che sta
       piu' a sinistra. Qui torna attaccata. */
    a.x0 = destra;
  }
  /* L'alone sfuma di circa tre volte lo spessore della barra. Se la barra
     parte attaccata al logo, come nel disegno del PSD sulla Card, allontanarla
     aprirebbe un buco: meglio tenere la barra dov'e' e smorzare l'alone,
     cosi' resta un velo e non una macchia sopra il logo. */
  if(a.glow > 0){
    const spazio = (a.x0 - destra) * fm.w;
    const alone = a.thick * fm.h * 3.2;
    if(alone > spazio) a.glow = Math.min(a.glow, 0.15);
  }
}

  L.band.top=Math.min(0.88, L.band.top-0.05);
