<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Annotate</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
/* Page furniture only: every component comes from the shared kit. */
html,body{height:100%}
body.kit{display:flex;flex-direction:column;overflow:hidden;user-select:none}
/* inside Studio the host header carries the title and the actions */
body.embed .kit-head{display:none}

.abar{flex:none;padding:8px 14px;border-bottom:1px solid var(--line)}
#tb{flex-wrap:nowrap;justify-content:flex-start;overflow:hidden;gap:5px}
#tb>*{flex:none}
#tb .tgrp{display:flex;gap:2px}
#tb .tgrow{flex:1 1 0;min-width:0}
#tb button.ibtn{padding:0;width:28px;height:28px}
#tb .tl{font-size:var(--fs-s);color:var(--dim);white-space:nowrap}
#tb input[type=range]{width:96px}
#tb input[type=color]{width:30px;height:22px}
#tb .swatches{flex:none;gap:4px;flex-wrap:nowrap;align-items:center}
#tb .swatches button.sw{padding:0;width:18px;height:18px;border-radius:3px}
#tb .swatches button.sw:hover{border-color:#8a8a94}
#tb .swatches button.sw.on{border-color:#e8e8ec}
#tb .val{font:var(--fs-s)/1.4 var(--mono);color:var(--txt2);min-width:18px;text-align:left}
/* narrow window: first the Clear label goes, then the dividers, then the slider shortens */
#tb.compact button.ib span{display:none}
#tb.compact button.ib{padding-left:7px;padding-right:7px}
#tb.tight{gap:2px;padding:4px}
#tb.tight .tsep{display:none}
#tb.tight .swatches{gap:3px}
#tb.narrow input[type=range]{width:56px}
#tb.narrow .tl{display:none}

.stage{flex:1;position:relative;background:var(--bg);overflow:hidden;min-height:0;touch-action:none}
#cv{display:block;position:absolute;left:0;top:0}
.view{position:absolute;right:10px;top:10px;padding:3px;gap:2px;flex-wrap:nowrap;justify-content:flex-start;z-index:3}
.view button.ibtn{padding:0;width:26px;height:26px}
.view span{font:var(--fs-s)/1 var(--mono);color:var(--txt2);min-width:46px;text-align:center}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--dim);pointer-events:none;text-align:center;padding:0 24px}
.empty b{color:var(--txt);font-size:15px;font-weight:600}
.empty div{font-size:var(--fs-l);line-height:1.8}
.empty kbd{font:var(--fs-s) var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--txt2)}

#textEdit{position:absolute;display:none;user-select:text;-webkit-user-select:text;background:var(--panel2);
  border:1px solid #8a8a94;border-radius:4px;color:#fff;padding:3px 6px;
  font:600 14px 'Segoe UI',system-ui,sans-serif;outline:none;min-width:120px;height:auto;z-index:5}

.status{flex:none;padding:0 14px;border-top:1px solid var(--line);background:var(--panel);font-size:var(--fs-s);
  color:var(--dim);height:28px;display:flex;gap:14px;align-items:center;white-space:nowrap}
.status #status{color:var(--txt2);overflow:hidden;text-overflow:ellipsis}
.status .hintkeys{overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body class="kit">

<header class="kit-head" id="head">
  <h1>Annotate</h1>
  <div class="grow"></div>
  <button id="open" data-ic="open" title="Open an image  (Ctrl+O)">Open</button>
  <button id="paste" data-ic="down" title="Paste the screenshot on the clipboard  (Ctrl+V)">Paste</button>
  <div class="sep"></div>
  <button id="undo" data-ic="undo" disabled title="Undo  (Ctrl+Z)">Undo</button>
  <button id="redo" data-ic="redo" disabled title="Redo  (Ctrl+Y)">Redo</button>
  <div class="sep"></div>
  <button id="copy" data-ic="copy" disabled title="Copy the result  (Ctrl+C)">Copy</button>
  <button id="save" class="primary" data-ic="save" disabled title="Save as PNG  (Ctrl+S)">Save PNG</button>
  <div class="sep"></div>
  <button id="bKeys" data-ic="key" title="Keyboard shortcuts  (?)">Shortcuts</button>
</header>

<div class="abar">
  <div class="toolbar" id="tb">
    <div class="tgrp" id="tools"></div>
    <span class="tsep"></span>
    <div class="swatches" id="swatches"></div>
    <input type="color" id="colorCustom" value="#e5484d" title="Custom colour">
    <span class="tsep"></span>
    <span class="tl">Size</span>
    <input type="range" id="weight" min="1" max="24" step="1" value="4" title="Line width, text and marker size">
    <span class="val" id="weightV">4</span>
    <span class="tgrow"></span>
    <button id="clear" class="ib" data-ic="trash" disabled title="Remove every annotation"><span>Clear</span></button>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="cv" width="16" height="9"></canvas>
  <div class="view toolbar tight">
    <button class="ibtn" id="zoomOut" title="Zoom out" data-ic="zout"></button>
    <span id="zoomV">100%</span>
    <button class="ibtn" id="zoomIn" title="Zoom in" data-ic="zin"></button>
    <button class="ibtn" id="fit" title="Fit to the window" data-ic="fit"></button>
  </div>
  <div class="empty" id="empty">
    <b>Paste a screenshot</b>
    <div><kbd>Ctrl</kbd> + <kbd>V</kbd> &middot; or drop an image here &middot; or use Open</div>
  </div>
  <input id="textEdit" type="text" spellcheck="false">
</div>

<div class="status">
  <span id="status">No image yet.</span>
  <span class="grow"></span>
  <span class="hintkeys" id="keys">middle-drag or space+drag to pan &middot; wheel to zoom &middot; Del removes the selection</span>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script src="../shared/kit.js"></script>
<script src="../shared/embed.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Annotate - mark up a screenshot and get it onto the clipboard.

   Annotations are objects, not pixels: everything stays movable, resizable and
   removable until it is exported. The canvas shows the image and the shapes
   through a pan/zoom transform, and all geometry is stored in image
   coordinates so the result is independent of how you are looking at it.

   Inside Studio (?embed=1) the page header is hidden and the same actions are
   registered with the host (Embed.register). Remembered between runs:
   `annotate.ui` (tool, colour, width, this page); the shell/host keep the
   controls with an id (colorCustom, weight) under toolbox.controls.annotate.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var stageEl = $('stage');
  var cv = $('cv');
  var ctx = cv.getContext('2d');
  var textEdit = $('textEdit');
  var viewBox = document.querySelector('.view');

  var img = null;            // the screenshot
  var srcName = '';          // file name it came from ('' = clipboard)
  var shapes = [];           // annotations, in image coordinates
  var tool = 'select';
  var color = '#e5484d';
  var weight = 4;
  var sel = -1;              // index of the selected shape
  var nextNumber = 1;

  var view = { zoom: 1, x: 0, y: 0, fitted: true };
  var ZMIN = 0.05, ZMAX = 16;

  var undoStack = [], redoStack = [];
  var drawing = null;        // shape being created
  var dragging = null;       // { mode:'move'|'handle', ... }
  var panning = null;
  var spaceDown = false;

  var COLORS = ['#e5484d', '#f5a524', '#f5e14b', '#46c26a', '#4aa3f0', '#c76bf0', '#ffffff', '#111111'];

  var TOOLS = [
    { id: 'select',    key: 'V', label: 'Select and move', icon: 'a_select' },
    { id: 'arrow',     key: 'A', label: 'Arrow',           icon: 'a_arrow' },
    { id: 'rect',      key: 'R', label: 'Rectangle',       icon: 'a_rect' },
    { id: 'ellipse',   key: 'E', label: 'Ellipse',         icon: 'a_ellipse' },
    { id: 'highlight', key: 'H', label: 'Highlight',       icon: 'a_highlight' },
    { id: 'pen',       key: 'P', label: 'Freehand',        icon: 'a_pen' },
    { id: 'text',      key: 'T', label: 'Text',            icon: 'type' },
    { id: 'number',    key: 'N', label: 'Numbered marker', icon: 'a_number' },
    { id: 'blur',      key: 'B', label: 'Pixelate',        icon: 'a_pixel' }
  ];
  Kit.addIcons({
    a_select:    'M4.5 2.5v10l2.7-2.4 1.9 3.6 1.7-.9-1.9-3.5 3.7-.1z',
    a_arrow:     'M3 13L13 3 M6.5 3H13v6.5',
    a_rect:      'M2.5 4h11v8h-11z',
    a_ellipse:   'M8 3.5c3.3 0 5.5 2 5.5 4.5S11.3 12.5 8 12.5 2.5 10 2.5 8 4.7 3.5 8 3.5z',
    a_highlight: 'M2.5 13.5h4l6-6-4-4-6 6z M7.8 5.2l3 3 M8.5 13.5h5',
    a_pen:       'M2.5 11.5c1.8 0 2-6 4-6s1.6 5.5 3.4 5.5 1.5-3.5 3.6-3.5',
    a_number:    'M8 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z M7 6.7l1.3-.8v4.6 M6.7 10.5h3.3',
    a_pixel:     'M2.5 2.5h11v11h-11z M2.5 8h11 M8 2.5v11 M2.5 2.5h5.5v5.5H2.5z M8 8h5.5v5.5H8z'
  });

  /* ---- small helpers ---------------------------------------------------- */
  var uiStore = Kit.persist('annotate.ui');
  function saveUi() { uiStore.setAll({ tool: tool, color: color, weight: weight }); }
  function say(msg, opts) { return Embed.toast(msg, opts); }

  /* ---- history ---------------------------------------------------------- */
  function snapshot() { return JSON.stringify(shapes); }
  function pushSnap(json) {
    undoStack.push(json);
    if (undoStack.length > 60) undoStack.shift();
    redoStack.length = 0;
    syncButtons();
  }
  function pushUndo() { pushSnap(snapshot()); }
  function restore(json) {
    shapes = JSON.parse(json);
    sel = -1;
    nextNumber = shapes.reduce(function (m, s) {
      return s.type === 'number' ? Math.max(m, s.n + 1) : m;
    }, 1);
    render();
    syncButtons();
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }
  var lastBtnState = '';
  function syncButtons() {
    var st = {
      undo: !undoStack.length, redo: !redoStack.length, clear: !shapes.length,
      copy: !img, save: !img
    };
    $('undo').disabled = st.undo;
    $('redo').disabled = st.redo;
    $('clear').disabled = st.clear;
    $('copy').disabled = st.copy;
    $('save').disabled = st.save;
    var sig = JSON.stringify(st);
    if (sig === lastBtnState) return;
    lastBtnState = sig;
    ['undo', 'redo', 'copy', 'save'].forEach(function (id) { Embed.action(id, { disabled: st[id] }); });
  }

  /* ---- coordinates ------------------------------------------------------ */
  function toImage(clientX, clientY) {
    var r = stageEl.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.x) / view.zoom,
      y: (clientY - r.top - view.y) / view.zoom
    };
  }
  function toScreen(ix, iy) {
    return { x: ix * view.zoom + view.x, y: iy * view.zoom + view.y };
  }
  function stageSize() {
    return { w: Math.max(40, stageEl.clientWidth), h: Math.max(40, stageEl.clientHeight) };
  }
  function fitView() {
    if (!img) return;
    var s = stageSize(), pad = 20;
    var z = Math.min((s.w - pad * 2) / img.width, (s.h - pad * 2) / img.height);
    view.zoom = Math.max(ZMIN, Math.min(ZMAX, z));
    view.x = (s.w - img.width * view.zoom) / 2;
    view.y = (s.h - img.height * view.zoom) / 2;
    view.fitted = true;
  }

  /* ---- shape geometry --------------------------------------------------- */
  function boxOf(s) {
    if (s.type === 'arrow') {
      return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2),
               w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
    }
    if (s.type === 'pen') {
      var xs = s.pts.map(function (p) { return p.x; });
      var ys = s.pts.map(function (p) { return p.y; });
      return { x: Math.min.apply(null, xs), y: Math.min.apply(null, ys),
               w: Math.max.apply(null, xs) - Math.min.apply(null, xs),
               h: Math.max.apply(null, ys) - Math.min.apply(null, ys) };
    }
    if (s.type === 'text') {
      var w = Math.max(20, (s.text || '').length * s.size * 0.56);
      return { x: s.x, y: s.y - s.size, w: w, h: s.size * 1.35 };
    }
    if (s.type === 'number') {
      var r = s.size;
      return { x: s.x - r, y: s.y - r, w: r * 2, h: r * 2 };
    }
    return { x: Math.min(s.x, s.x + s.w), y: Math.min(s.y, s.y + s.h),
             w: Math.abs(s.w), h: Math.abs(s.h) };
  }

  function hit(s, p) {
    var b = boxOf(s);
    var m = Math.max(6 / view.zoom, (s.weight || 4));
    if (s.type === 'arrow') {
      return distToSegment(p, { x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }) <= m + 4;
    }
    if (s.type === 'pen') {
      for (var i = 1; i < s.pts.length; i++) {
        if (distToSegment(p, s.pts[i - 1], s.pts[i]) <= m + 4) return true;
      }
      return false;
    }
    return p.x >= b.x - m && p.x <= b.x + b.w + m && p.y >= b.y - m && p.y <= b.y + b.h + m;
  }

  function distToSegment(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var len2 = dx * dx + dy * dy;
    var t = len2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2)) : 0;
    var qx = a.x + t * dx, qy = a.y + t * dy;
    return Math.hypot(p.x - qx, p.y - qy);
  }

  // Handles: arrows get their two ends, boxes get their four corners.
  function handlesOf(s) {
    if (s.type === 'arrow') return [{ id: 'p1', x: s.x1, y: s.y1 }, { id: 'p2', x: s.x2, y: s.y2 }];
    if (s.type === 'pen' || s.type === 'text' || s.type === 'number') return [];
    var b = boxOf(s);
    return [
      { id: 'nw', x: b.x, y: b.y },
      { id: 'ne', x: b.x + b.w, y: b.y },
      { id: 'sw', x: b.x, y: b.y + b.h },
      { id: 'se', x: b.x + b.w, y: b.y + b.h }
    ];
  }

  /* ---- drawing ---------------------------------------------------------- */
  function drawShape(c, s) {
    c.save();
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = s.color;
    c.fillStyle = s.color;
    c.lineWidth = s.weight;

    if (s.type === 'rect') {
      c.strokeRect(s.x, s.y, s.w, s.h);
    } else if (s.type === 'ellipse') {
      c.beginPath();
      c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, 0, Math.PI * 2);
      c.stroke();
    } else if (s.type === 'highlight') {
      c.globalAlpha = 0.32;
      c.fillRect(s.x, s.y, s.w, s.h);
    } else if (s.type === 'arrow') {
      var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
      var head = Math.max(10, s.weight * 3.4);
      // stop the shaft short so the head has a clean point
      var bx = s.x2 - Math.cos(ang) * head * 0.62;
      var by = s.y2 - Math.sin(ang) * head * 0.62;
      c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(bx, by); c.stroke();
      c.beginPath();
      c.moveTo(s.x2, s.y2);
      c.lineTo(s.x2 - Math.cos(ang - 0.42) * head, s.y2 - Math.sin(ang - 0.42) * head);
      c.lineTo(s.x2 - Math.cos(ang + 0.42) * head, s.y2 - Math.sin(ang + 0.42) * head);
      c.closePath(); c.fill();
    } else if (s.type === 'pen') {
      c.beginPath();
      s.pts.forEach(function (p, i) { i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y); });
      c.stroke();
    } else if (s.type === 'text') {
      c.font = '600 ' + s.size + "px 'Segoe UI', system-ui, sans-serif";
      c.textBaseline = 'alphabetic';
      // a dark rim keeps light text readable over a bright screenshot
      c.strokeStyle = 'rgba(0,0,0,.55)';
      c.lineWidth = Math.max(2, s.size / 7);
      c.strokeText(s.text || '', s.x, s.y);
      c.fillStyle = s.color;
      c.fillText(s.text || '', s.x, s.y);
    } else if (s.type === 'number') {
      c.beginPath();
      c.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#fff';
      c.font = '700 ' + Math.round(s.size * 1.15) + "px 'Segoe UI', system-ui, sans-serif";
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(String(s.n), s.x, s.y + s.size * 0.04);
    }
    c.restore();
  }

  // Pixelate straight from the source image, so it cannot be undone by zooming.
  function drawPixelate(c, s, source) {
    var b = boxOf(s);
    if (b.w < 2 || b.h < 2) return;
    var cells = Math.max(3, Math.round(Math.max(b.w, b.h) / Math.max(4, s.weight * 2.2)));
    var tw = Math.max(1, Math.round(cells * (b.w / Math.max(b.w, b.h))));
    var th = Math.max(1, Math.round(cells * (b.h / Math.max(b.w, b.h))));
    var tmp = document.createElement('canvas');
    tmp.width = tw; tmp.height = th;
    var tc = tmp.getContext('2d');
    tc.imageSmoothingEnabled = true;
    tc.drawImage(source, b.x, b.y, b.w, b.h, 0, 0, tw, th);
    c.save();
    c.imageSmoothingEnabled = false;
    c.drawImage(tmp, 0, 0, tw, th, b.x, b.y, b.w, b.h);
    c.restore();
  }

  function drawAll(c, withSelection) {
    if (!img) return;
    c.drawImage(img, 0, 0);
    shapes.forEach(function (s) {
      if (s.type === 'blur') drawPixelate(c, s, img);
      else drawShape(c, s);
    });
    if (drawing) {
      if (drawing.type === 'blur') drawPixelate(c, drawing, img);
      else drawShape(c, drawing);
    }
    if (withSelection && sel >= 0 && shapes[sel]) {
      var s = shapes[sel];
      var b = boxOf(s);
      c.save();
      c.strokeStyle = '#ffffff';
      c.lineWidth = 1 / view.zoom;
      c.setLineDash([4 / view.zoom, 3 / view.zoom]);
      c.strokeRect(b.x - 2 / view.zoom, b.y - 2 / view.zoom,
                   b.w + 4 / view.zoom, b.h + 4 / view.zoom);
      c.setLineDash([]);
      var hs = 4 / view.zoom;
      handlesOf(s).forEach(function (h) {
        c.fillStyle = '#fff';
        c.strokeStyle = '#111';
        c.lineWidth = 1 / view.zoom;
        c.fillRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
        c.strokeRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
      });
      c.restore();
    }
  }

  // transparency shows through a quiet checkerboard that exists only under the image
  var checker = null;
  function checkerPattern() {
    if (checker) return checker;
    var t = document.createElement('canvas');
    t.width = t.height = 16;
    var tc = t.getContext('2d');
    tc.fillStyle = '#1a1a1d'; tc.fillRect(0, 0, 16, 16);
    tc.fillStyle = '#222226'; tc.fillRect(0, 0, 8, 8); tc.fillRect(8, 8, 8, 8);
    checker = ctx.createPattern(t, 'repeat');
    return checker;
  }

  var lastStatus = null;
  function setStatus(text) {
    if (text === lastStatus) return;
    lastStatus = text;
    $('status').textContent = text;
    Embed.status(img ? text : '');
  }

  function render() {
    var s = stageSize();
    var dpr = window.devicePixelRatio || 1;
    // Assigning width/height clears the canvas and resets its state, which is
    // costly on every pointer move: only do it when the size really changed.
    var pw = Math.max(1, Math.round(s.w * dpr)), ph = Math.max(1, Math.round(s.h * dpr));
    if (cv.width !== pw) cv.width = pw;
    if (cv.height !== ph) cv.height = ph;
    var cssW = s.w + 'px', cssH = s.h + 'px';
    if (cv.style.width !== cssW) cv.style.width = cssW;
    if (cv.style.height !== cssH) cv.style.height = cssH;

    if (view.fitted) fitView();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, s.w, s.h);
    if (img) {
      var ix = view.x, iy = view.y, iw = img.width * view.zoom, ih = img.height * view.zoom;
      ctx.fillStyle = checkerPattern();
      ctx.fillRect(ix, iy, iw, ih);
      ctx.strokeStyle = '#33333a';
      ctx.lineWidth = 1;
      ctx.strokeRect(ix - 0.5, iy - 0.5, iw + 1, ih + 1);
    }
    ctx.save();
    ctx.translate(view.x, view.y);
    ctx.scale(view.zoom, view.zoom);
    drawAll(ctx, true);
    ctx.restore();

    var zt = Math.round(view.zoom * 100) + '%';
    if ($('zoomV').textContent !== zt) $('zoomV').textContent = zt;
    $('empty').style.display = img ? 'none' : '';
    viewBox.style.display = img ? '' : 'none';
    setStatus(img
      ? img.width + '×' + img.height + ' · ' + shapes.length + ' annotation' + (shapes.length === 1 ? '' : 's')
      : 'No image yet.');
    positionTextEditor();
  }

  /* ---- loading ---------------------------------------------------------- */
  function stemOf(name) {
    var n = String(name || '').replace(/^.*[\\/]/, '');
    // the clipboard hands over "image.png": that is not a name worth keeping
    if (/^image\.(png|jpe?g|gif|webp|bmp)$/i.test(n)) return '';
    return n.replace(/\.[A-Za-z0-9]{1,5}$/, '').trim();
  }
  function loadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var im = new Image();
    im.onload = function () {
      // the decoded bitmap stays valid after the URL is gone
      URL.revokeObjectURL(url);
      img = im;
      srcName = stemOf(name || blob.name);
      shapes = [];
      undoStack.length = 0; redoStack.length = 0;
      sel = -1; nextNumber = 1;
      view.fitted = true;
      syncButtons();
      render();
    };
    im.onerror = function () {
      URL.revokeObjectURL(url);
      say('Could not read that image.');
    };
    im.src = url;
  }
  function loadFile(f) { loadBlob(f, f && f.name); }
  function isImage(f) { return f && (/^image\//.test(f.type || '') || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name || '')); }

  function openDialog() { $('file').click(); }
  $('file').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
    e.target.value = '';
  });

  function pasteFromClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) { say('Could not paste: the clipboard is not available here.'); return; }
    navigator.clipboard.read().then(function (items) {
      for (var i = 0; i < items.length; i++) {
        var type = items[i].types.filter(function (t) { return t.indexOf('image/') === 0; })[0];
        if (type) { items[i].getType(type).then(function (b) { loadBlob(b, ''); }); return; }
      }
      say('There is no image on the clipboard.');
    }, function () { say('Could not paste: the clipboard is blocked.'); });
  }

  document.addEventListener('paste', function (e) {
    if (e.target === textEdit) return;
    var dt = e.clipboardData;
    if (!dt || !dt.items) return;
    for (var i = 0; i < dt.items.length; i++) {
      if (dt.items[i].kind === 'file' && dt.items[i].type.indexOf('image/') === 0) {
        var f = dt.items[i].getAsFile();
        if (f) { e.preventDefault(); loadBlob(f, ''); return; }
      }
    }
  });

  Kit.config({ stage: '#stage' });
  Kit.drop(document.body, {
    accept: 'image/*',
    overlayText: 'Drop an image to annotate it',
    onFiles: function (files) { loadFile(files[0]); }
  });

  /* ---- tools ------------------------------------------------------------ */
  function setTool(t, quiet) {
    tool = t;
    Array.prototype.forEach.call(document.querySelectorAll('#tools button'), function (b) {
      var on = b.dataset.tool === t;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (t !== 'select') { sel = -1; if (!quiet) render(); }
    saveUi();
  }
  (function buildTools() {
    var box = $('tools');
    TOOLS.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ibtn';
      b.id = 't_' + t.id;
      b.dataset.tool = t.id;
      b.title = t.label + '  (' + t.key + ')';
      b.setAttribute('aria-label', t.label);
      b.appendChild(Kit.icon(t.icon));
      b.firstChild.classList.add('lg');
      b.addEventListener('click', function () { setTool(t.id); });
      box.appendChild(b);
    });
  })();

  (function buildSwatches() {
    var box = $('swatches');
    COLORS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sw';
      b.style.background = c;
      b.title = c;
      b.addEventListener('click', function () { setColor(c); });
      box.appendChild(b);
    });
  })();

  // The colour picker fires input for every step of a drag: one undo step per drag.
  var colorGesture = false;
  function setColor(c, fromPicker) {
    color = c;
    $('colorCustom').value = /^#[0-9a-f]{6}$/i.test(c) ? c : '#e5484d';
    Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (b) {
      b.classList.toggle('on', b.title.toLowerCase() === String(c).toLowerCase());
    });
    // recolour the selection, which is what you expect after picking a swatch
    var s = shapes[sel];
    if (sel >= 0 && s && s.type !== 'blur' && s.color !== c) {
      if (!colorGesture) pushUndo();
      colorGesture = !!fromPicker;
      s.color = c;
      render();
    }
    saveUi();
  }
  $('colorCustom').addEventListener('input', function () { setColor($('colorCustom').value, true); });
  $('colorCustom').addEventListener('change', function () { colorGesture = false; });

  var weightGesture = false;
  $('weight').addEventListener('input', function () {
    weight = parseInt($('weight').value, 10) || 4;
    $('weightV').textContent = weight;
    var s = shapes[sel];
    if (sel >= 0 && s) {
      if (!weightGesture) { pushUndo(); weightGesture = true; }
      s.weight = weight;
      if (s.type === 'text' || s.type === 'number') s.size = textSize();
      render();
    }
    saveUi();
  });
  $('weight').addEventListener('change', function () { weightGesture = false; });

  function textSize() { return Math.max(12, weight * 5); }

  /* ---- pointer ---------------------------------------------------------- */
  function capture(e) { try { stageEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ } }

  stageEl.addEventListener('pointerdown', function (e) {
    if (e.target === textEdit) return;
    commitText();
    if (!img) return;

    // middle button, or space held: pan regardless of the active tool
    if (e.button === 1 || spaceDown) {
      panning = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
      capture(e);
      e.preventDefault();
      return;
    }
    if (e.button !== 0) return;

    var p = toImage(e.clientX, e.clientY);

    if (tool === 'text') {
      // Focusing an input from inside pointerdown does not stick: once the
      // event finishes the browser moves focus to the canvas, the editor
      // blurs, and the empty text shape is discarded before anything can be
      // typed. Suppressing the default focus change is half the fix; the
      // other half is focusing on the next tick, in startText().
      e.preventDefault();
      startText(p);
      return;
    }

    capture(e);

    if (tool === 'select') {
      // A click that only selects must not add an undo step: the step is
      // recorded by the first real movement (see pointermove), from the
      // snapshot taken here.
      // a handle of the current selection wins over everything else
      if (sel >= 0 && shapes[sel]) {
        var hs = 6 / view.zoom;
        var found = handlesOf(shapes[sel]).filter(function (h) {
          return Math.abs(p.x - h.x) <= hs && Math.abs(p.y - h.y) <= hs;
        })[0];
        if (found) {
          dragging = { mode: 'handle', id: found.id, start: p, cx: e.clientX, cy: e.clientY, moved: false,
                       pre: snapshot(), orig: JSON.parse(JSON.stringify(shapes[sel])) };
          return;
        }
      }
      var idx = -1;
      for (var i = shapes.length - 1; i >= 0; i--) { if (hit(shapes[i], p)) { idx = i; break; } }
      sel = idx;
      if (idx >= 0) {
        dragging = { mode: 'move', start: p, cx: e.clientX, cy: e.clientY, moved: false,
                     pre: snapshot(), orig: JSON.parse(JSON.stringify(shapes[idx])) };
      } else {
        // empty space: drag the picture around
        panning = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
      }
      render();
      return;
    }

    if (tool === 'number') {
      pushUndo();
      shapes.push({ type: 'number', x: p.x, y: p.y, n: nextNumber++, color: color, size: textSize(), weight: weight });
      sel = -1;
      render(); syncButtons();
      return;
    }

    if (tool === 'pen') {
      drawing = { type: 'pen', pts: [p], color: color, weight: weight };
      return;
    }

    if (tool === 'arrow') {
      drawing = { type: 'arrow', x1: p.x, y1: p.y, x2: p.x, y2: p.y, color: color, weight: weight };
      return;
    }

    drawing = { type: tool, x: p.x, y: p.y, w: 0, h: 0, color: color, weight: weight };
  });

  stageEl.addEventListener('pointermove', function (e) {
    if (panning) {
      view.x = panning.vx + (e.clientX - panning.x);
      view.y = panning.vy + (e.clientY - panning.y);
      view.fitted = false;
      render();
      return;
    }
    if (!img) return;
    var p = toImage(e.clientX, e.clientY);

    if (dragging && sel >= 0) {
      if (!dragging.moved) {
        // a click is not a move: wait for 2 screen pixels before it counts
        if (Math.hypot(e.clientX - dragging.cx, e.clientY - dragging.cy) < 2) return;
        dragging.moved = true;
        pushSnap(dragging.pre);
      }
      var s = shapes[sel], o = dragging.orig;
      var dx = p.x - dragging.start.x, dy = p.y - dragging.start.y;
      if (dragging.mode === 'move') {
        if (s.type === 'arrow') { s.x1 = o.x1 + dx; s.y1 = o.y1 + dy; s.x2 = o.x2 + dx; s.y2 = o.y2 + dy; }
        else if (s.type === 'pen') { s.pts = o.pts.map(function (q) { return { x: q.x + dx, y: q.y + dy }; }); }
        else { s.x = o.x + dx; s.y = o.y + dy; }
      } else {
        if (s.type === 'arrow') {
          if (dragging.id === 'p1') { s.x1 = o.x1 + dx; s.y1 = o.y1 + dy; }
          else { s.x2 = o.x2 + dx; s.y2 = o.y2 + dy; }
        } else {
          var b = { x: Math.min(o.x, o.x + o.w), y: Math.min(o.y, o.y + o.h),
                    w: Math.abs(o.w), h: Math.abs(o.h) };
          var nx = b.x, ny = b.y, nw = b.w, nh = b.h;
          if (dragging.id.indexOf('w') >= 0) { nx = b.x + dx; nw = b.w - dx; }
          if (dragging.id.indexOf('e') >= 0) { nw = b.w + dx; }
          if (dragging.id.indexOf('n') >= 0) { ny = b.y + dy; nh = b.h - dy; }
          if (dragging.id.indexOf('s') >= 0) { nh = b.h + dy; }
          s.x = nx; s.y = ny; s.w = nw; s.h = nh;
        }
      }
      render();
      return;
    }

    if (drawing) {
      if (drawing.type === 'pen') {
        var last = drawing.pts[drawing.pts.length - 1];
        if (Math.hypot(p.x - last.x, p.y - last.y) > 1.2 / view.zoom) drawing.pts.push(p);
      } else if (drawing.type === 'arrow') {
        drawing.x2 = p.x; drawing.y2 = p.y;
      } else {
        drawing.w = p.x - drawing.x; drawing.h = p.y - drawing.y;
      }
      render();
    }
  });

  function endPointer() {
    panning = null;
    if (dragging) { dragging = null; syncButtons(); }
    if (drawing) {
      var d = drawing;
      drawing = null;
      var b = boxOf(d);
      var big = d.type === 'pen' ? d.pts.length > 2
             : d.type === 'arrow' ? Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 6
             : (Math.abs(b.w) > 4 && Math.abs(b.h) > 4);
      if (big) {
        pushUndo();
        shapes.push(d);
        syncButtons();
      }
      render();
    }
  }
  ['pointerup', 'pointercancel'].forEach(function (t) {
    stageEl.addEventListener(t, endPointer);
  });

  stageEl.addEventListener('wheel', function (e) {
    if (!img) return;
    e.preventDefault();
    var r = stageEl.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    var nz = Math.max(ZMIN, Math.min(ZMAX, view.zoom * f));
    if (nz === view.zoom) return;
    view.x = mx - (mx - view.x) * (nz / view.zoom);
    view.y = my - (my - view.y) * (nz / view.zoom);
    view.zoom = nz;
    view.fitted = false;
    render();
  }, { passive: false });

  $('fit').addEventListener('click', function () { view.fitted = true; render(); });
  $('zoomIn').addEventListener('click', function () {
    view.zoom = Math.min(ZMAX, view.zoom * 1.25); view.fitted = false; render();
  });
  $('zoomOut').addEventListener('click', function () {
    view.zoom = Math.max(ZMIN, view.zoom / 1.25); view.fitted = false; render();
  });

  /* ---- layout: the toolbar never wraps ----------------------------------- */
  var tbEl = $('tb');
  function fitToolbar() {
    tbEl.classList.remove('compact', 'tight', 'narrow');
    var steps = ['compact', 'tight', 'narrow'];
    for (var i = 0; i < steps.length && tbEl.scrollWidth > tbEl.clientWidth + 1; i++) {
      tbEl.classList.add(steps[i]);
    }
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { fitToolbar(); render(); }).observe(stageEl);
    new ResizeObserver(fitToolbar).observe(tbEl.parentNode);
  } else {
    window.addEventListener('resize', function () { fitToolbar(); render(); });
  }

  /* ---- text ------------------------------------------------------------- */
  var editing = -1, editingUndoLen = -1;
  function startText(p) {
    pushUndo();
    editingUndoLen = undoStack.length;
    shapes.push({ type: 'text', x: p.x, y: p.y, text: '', color: color, size: textSize(), weight: weight });
    editing = shapes.length - 1;
    sel = editing;
    textEdit.value = '';
    textEdit.style.display = 'block';
    positionTextEditor();
    render();
    setTimeout(function () { textEdit.focus(); }, 0);
  }
  function positionTextEditor() {
    if (editing < 0 || !shapes[editing]) { textEdit.style.display = 'none'; return; }
    var s = shapes[editing];
    var sc = toScreen(s.x, s.y - s.size);
    textEdit.style.left = Math.round(sc.x) + 'px';
    textEdit.style.top = Math.round(sc.y) + 'px';
    textEdit.style.fontSize = Math.max(12, Math.round(s.size * view.zoom)) + 'px';
  }
  function commitText() {
    if (editing < 0) return;
    var s = shapes[editing];
    var i = editing;
    editing = -1;
    textEdit.style.display = 'none';
    if (s && !(s.text || '').trim()) {
      shapes.splice(i, 1); sel = -1;
      // the empty box changed nothing: take its undo step back
      if (undoStack.length === editingUndoLen) undoStack.pop();
    }
    editingUndoLen = -1;
    syncButtons();
    render();
  }
  textEdit.addEventListener('input', function () {
    if (editing >= 0 && shapes[editing]) { shapes[editing].text = textEdit.value; render(); }
  });
  textEdit.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); commitText(); }
    e.stopPropagation();
  });
  textEdit.addEventListener('blur', function () {
    // A short delay lets the focus settle: clicking straight from the editor
    // onto a toolbar button would otherwise commit before the click lands.
    setTimeout(commitText, 60);
  });

  /* ---- output ----------------------------------------------------------- */
  function compose() {
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var cc = c.getContext('2d');
    var keep = sel; sel = -1;      // never bake the selection outline in
    drawAll(cc, false);
    sel = keep;
    return c;
  }

  function copyOut() {
    if (!img) return;
    compose().toBlob(function (blob) {
      if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) { say('Could not copy: the clipboard is not available here.'); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
        .then(function () { say('Copied to the clipboard.'); }, function () { say('Could not copy to the clipboard.'); });
    }, 'image/png');
  }

  // <source name>_annotated.png, or annotated.png for a pasted screenshot
  function saveName() {
    if (!srcName) return 'annotated.png';
    var stem = srcName.replace(/[\\/:*?"<>|]+/g, '_');
    return (/_annotated$/i.test(stem) ? stem : stem + '_annotated') + '.png';
  }
  function saveOut() {
    if (!img) return;
    var name = saveName();
    compose().toBlob(function (blob) {
      Kit.save(blob, name);
    }, 'image/png');
  }

  function clearAll() {
    if (!shapes.length) return;
    pushUndo();
    shapes = []; sel = -1; nextNumber = 1;
    render(); syncButtons();
  }

  $('open').addEventListener('click', openDialog);
  $('paste').addEventListener('click', pasteFromClipboard);
  $('copy').addEventListener('click', copyOut);
  $('save').addEventListener('click', saveOut);
  $('undo').addEventListener('click', undo);
  $('redo').addEventListener('click', redo);
  $('clear').addEventListener('click', clearAll);

  /* ---- keyboard --------------------------------------------------------- */
  var KEYS = {};
  TOOLS.forEach(function (t) { KEYS[t.key.toLowerCase()] = t.id; });
  var SHORTCUTS = [
    ['Tools', TOOLS.map(function (t) { return [t.key, t.label]; })],
    ['Edit', [
      ['Ctrl+Z', 'Undo'], ['Ctrl+Y', 'Redo'], ['Del', 'Remove the selection'], ['Esc', 'Deselect']
    ]],
    ['Image', [
      ['Ctrl+V', 'Paste a screenshot'], ['Ctrl+O', 'Open an image'],
      ['Ctrl+C', 'Copy the result'], ['Ctrl+S', 'Save as PNG']
    ]],
    ['View', [
      ['Wheel', 'Zoom at the pointer'], ['Space + drag', 'Pan'], ['Middle drag', 'Pan']
    ]]
  ];

  document.addEventListener('keydown', function (e) {
    if (e.target === textEdit) return;
    if (Kit.dialogOpen()) return;
    var k = (e.key || '').toLowerCase();

    if (e.key === ' ') { spaceDown = true; e.preventDefault(); return; }

    if (e.ctrlKey || e.metaKey) {
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); return; }
      if (k === 'c') { e.preventDefault(); copyOut(); return; }
      if (k === 's') { e.preventDefault(); saveOut(); return; }
      if (k === 'o') { e.preventDefault(); openDialog(); return; }
      return;      // leave Ctrl+V to the paste handler
    }

    if (k === '?' && !Embed.active) { e.preventDefault(); Kit.keys(SHORTCUTS, { button: $('bKeys'), title: 'Annotate shortcuts' }); return; }
    if (k === 'delete' || k === 'backspace') {
      if (sel >= 0) { e.preventDefault(); pushUndo(); shapes.splice(sel, 1); sel = -1; render(); syncButtons(); }
      return;
    }
    if (k === 'escape') { sel = -1; render(); return; }
    if (KEYS[k] && !e.altKey) { e.preventDefault(); setTool(KEYS[k]); }
  });

  document.addEventListener('keyup', function (e) {
    if (e.key === ' ') spaceDown = false;
  });
  window.addEventListener('blur', function () { spaceDown = false; });

  $('bKeys').addEventListener('click', function () {
    Kit.keys(SHORTCUTS, { button: $('bKeys'), title: 'Annotate shortcuts' });
  });

  /* ---- start ------------------------------------------------------------ */
  Kit.paintIcons(document);
  (function restoreUi() {
    var ui = uiStore.getAll();
    if (ui.weight >= 1 && ui.weight <= 24) { weight = Math.round(ui.weight); $('weight').value = weight; $('weightV').textContent = weight; }
    if (typeof ui.color === 'string' && /^#[0-9a-f]{6}$/i.test(ui.color)) color = ui.color;
    setColor(color);
    setTool(TOOLS.some(function (t) { return t.id === ui.tool; }) ? ui.tool : 'select', true);
  })();

  Embed.register({
    id: 'annotate',
    title: 'Annotate',
    actions: [
      { id: 'open',  label: 'Open',     icon: 'open', tip: 'Open an image  (Ctrl+O)', run: openDialog },
      { id: 'paste', label: 'Paste',    icon: 'down', tip: 'Paste the screenshot on the clipboard  (Ctrl+V)', run: pasteFromClipboard },
      { id: 'undo',  label: 'Undo',     icon: 'undo', tip: 'Undo  (Ctrl+Z)', disabled: true, run: undo },
      { id: 'redo',  label: 'Redo',     icon: 'redo', tip: 'Redo  (Ctrl+Y)', disabled: true, run: redo },
      { id: 'copy',  label: 'Copy',     icon: 'copy', tip: 'Copy the result  (Ctrl+C)', disabled: true, run: copyOut },
      { id: 'save',  label: 'Save PNG', icon: 'save', primary: true, tip: 'Save as PNG  (Ctrl+S)', disabled: true, run: saveOut }
    ],
    shortcuts: SHORTCUTS,
    accepts: ['image/*'],
    onReceive: function (files) {
      var f = [].slice.call(files || []).filter(isImage)[0];
      if (f) loadFile(f);
    },
    onShow: function () { fitToolbar(); render(); },
    onHide: function () { commitText(); spaceDown = false; }
  });

  fitToolbar();
  syncButtons();
  render();
})();
</script>
</body>
</html>
