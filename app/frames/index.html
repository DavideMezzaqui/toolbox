<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact sheet</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
/* Page furniture only: every component comes from ../shared/kit.css */
html,body{height:100%}
body.kit{display:flex;flex-direction:column;overflow:hidden;--stage:#0a0a0c}
body.embed .kit-head{display:none}
.kit-head .sub{color:var(--dim);font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:6px}

#main{flex:1;display:flex;min-height:0}
#work{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

#stage{position:relative;flex:1;min-height:160px;overflow:hidden;background:var(--stage);cursor:grab;touch-action:none}
#stage.panning{cursor:grabbing}
#sheet{display:block}
#viewbar{position:absolute;right:12px;bottom:12px;padding:3px 4px;gap:2px;flex-wrap:nowrap;background:rgba(24,24,26,.92)}
#viewbar button.ibtn{width:26px;height:26px;border-color:transparent;background:transparent}
#viewbar button.ibtn:hover{background:#2c2c33}
#zoomV{min-width:46px;text-align:center;color:var(--txt2);font:var(--fs-s) var(--mono);font-variant-numeric:tabular-nums}

#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;padding:24px;pointer-events:none;color:var(--dim)}
#empty .big{width:56px;height:56px;border:1px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
#empty .big svg.ic{width:24px;height:24px;opacity:.6}
#empty b{color:var(--txt);font-size:15px;font-weight:600}
#empty span{font-size:var(--fs)}
#empty .btnrow{pointer-events:auto;margin:10px 0 0;justify-content:center;flex-wrap:nowrap}
#empty .btnrow button{flex:none;padding:6px 14px;font-size:var(--fs)}

#busy{position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);
  padding:7px 14px;border-radius:8px;background:var(--panel3);border:1px solid #4a4a52;color:var(--txt);
  font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* the video trim: a scrub thumbnail and two sliders under the stage */
#dock{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;
  padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
#dock .scrub{width:200px}
#scrub{display:block;width:200px;height:auto;background:#000;border:1px solid var(--line);border-radius:5px}
#scrubT{margin-top:4px;color:var(--dim);font:var(--fs-s) var(--mono);text-align:center}
.trim{min-width:0;max-width:760px}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.trow:last-child{margin-bottom:0}
.trow label{width:44px;flex:none;color:var(--txt2);font-size:var(--fs)}
.trow input[type=range]{flex:1}
.trow .tv{width:64px;flex:none;text-align:right;color:var(--txt2);font:var(--fs-s) var(--mono);font-variant-numeric:tabular-nums}
.trow .hint{margin:0}

#info{flex:none;display:flex;align-items:center;gap:12px;height:30px;padding:0 14px;background:var(--panel);
  border-top:1px solid var(--line);font-size:var(--fs-s);color:var(--txt2);white-space:nowrap;overflow:hidden}
#dock:not([hidden])+#info{border-top-color:var(--line)}
#info .dim{color:var(--dim)}

aside.kit-panel{flex:none;width:clamp(310px,23vw,430px);overflow-y:auto;background:var(--panel);
  border-left:1px solid var(--line);padding:10px}
@media(min-width:2200px){ aside.kit-panel{width:clamp(420px,20vw,540px)} }
aside.kit-panel .tabs{width:100%;margin-bottom:10px}
aside.kit-panel .tabs button{flex:1}
.sec .row>label{width:92px}
.bd .btnrow{margin-bottom:8px}

/* images: the add area and the list you reorder */
#dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 10px;text-align:center;
  border:1px dashed var(--line2);border-radius:8px;background:var(--bg);color:var(--dim);font-size:var(--fs);cursor:pointer;margin-bottom:8px}
#dz:hover,#dz.over{border-color:#8a8a94;color:var(--txt2)}
#dz b{color:var(--txt);font-weight:600;font-size:var(--fs-l)}
#list{display:flex;flex-direction:column;gap:4px;max-height:min(42vh,440px);overflow-y:auto;margin:0 0 8px;padding-right:2px}
#list:empty{display:none}
.it{display:grid;grid-template-columns:20px 46px minmax(0,1fr) 22px;gap:8px;align-items:center;padding:5px 5px 5px 8px;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;cursor:grab}
.it:hover{border-color:#4a4a52}
.it.dragging{opacity:.4}
.it.before{box-shadow:0 -2px 0 0 #c8c8ce}
.it.after{box-shadow:0 2px 0 0 #c8c8ce}
.it .ix{color:var(--dim);font:var(--fs-xs) var(--mono);text-align:right}
.it canvas{display:block;width:46px;height:34px;border-radius:3px;background:#000}
.it .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.it .nm{font-size:var(--fs-s);color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it input.cap{width:100%;height:22px;padding:0 6px;font-size:var(--fs-s)}
.it button.del{width:22px;height:22px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-color:transparent;background:transparent;color:var(--dim)}
.it button.del:hover{color:var(--txt);background:#2c2c33}
.foot{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--dim);font-size:var(--fs-s)}
.foot .grow{flex:1}
#vchip{display:flex;flex-direction:column;gap:2px;padding:8px 10px;margin-bottom:8px;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;min-width:0}
#vchip b{font-weight:600;font-size:var(--fs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vchip span{color:var(--dim);font-size:var(--fs-s)}
#outInfo{color:var(--dim);font-size:var(--fs-s);margin:2px 0 8px}
</style>
</head>
<body class="kit">

<header class="kit-head" id="head">
  <h1>Contact sheet</h1>
  <span class="sub">images or video frames, laid out as one picture</span>
  <div class="grow"></div>
  <button id="hAddImages" data-ic="image" title="Add images (Ctrl+O)">Add images</button>
  <button id="hAddVideo" data-ic="video" title="Pick a video for the frames (Ctrl+Shift+O)">Add video</button>
  <div class="sep"></div>
  <button id="copy" data-ic="copy" disabled title="Copy the sheet to the clipboard (Ctrl+Shift+C)">Copy</button>
  <button id="export" class="primary" data-ic="down" disabled title="Save the sheet as a PNG (Ctrl+S)">Export PNG</button>
  <button id="keysBtn" class="ibtn" data-ic="key" title="Keyboard shortcuts" aria-expanded="false"></button>
</header>

<div id="main">
  <div id="work">
    <div id="stage">
      <canvas id="sheet" width="16" height="9"></canvas>
      <div id="empty" hidden>
        <div class="big" id="emptyIc"></div>
        <b id="emptyT">Drop images or a video</b>
        <span id="emptyS">or paste a screenshot with Ctrl+V</span>
        <div class="btnrow" id="emptyB"></div>
      </div>
      <div id="busy" hidden></div>
      <div class="toolbar" id="viewbar">
        <button class="ibtn" id="zoomOut" title="Zoom out (-)" data-ic="zout"></button>
        <span id="zoomV">100%</span>
        <button class="ibtn" id="zoomIn" title="Zoom in (+)" data-ic="zin"></button>
        <button class="ibtn" id="fitView" title="Fit to the window (F)" data-ic="fit"></button>
      </div>
    </div>

    <div id="dock" hidden>
      <div class="scrub">
        <canvas id="scrub" width="200" height="112"></canvas>
        <div id="scrubT">0:00.00</div>
      </div>
      <div class="trim">
        <div class="trow"><label for="start">Start</label>
          <input type="range" id="start" min="0" max="1" step="0.01" value="0"><span class="tv" id="startV">0:00.00</span></div>
        <div class="trow"><label for="end">End</label>
          <input type="range" id="end" min="0" max="1" step="0.01" value="1"><span class="tv" id="endV">0:00.00</span></div>
        <div class="trow"><label></label><button id="whole">Whole clip</button><span class="hint" id="trimInfo"></span></div>
      </div>
    </div>

    <div id="info"><span id="status"></span><span class="dim" id="statusHint"></span></div>
  </div>

  <aside class="kit-panel" id="panel"></aside>
</div>

<input type="file" id="files" accept="image/*" multiple hidden>
<input type="file" id="file" accept="video/*,.mkv,.mov" hidden>

<script src="../shared/kit.js"></script>
<script src="../shared/embed.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Contact sheet - one engine, two sources.

   A sheet is a list of items {src, w, h, label}: a picture and the text to
   print on it. Layout, labels, viewport (pan / zoom / fit), compose and export
   (PNG file, clipboard) are ONE path; the sources only decide what the items
   are:
     images        screenshots dropped, pasted or picked, in the order the
                   user gave them, reorderable, each with its own caption
     video frames  N frames of one video between a start and an end, pulled
                   out through video-io (exact frames, WebM without a duration
                   works, source resolution up to what the output needs)

   Settings live in localStorage 'sheet.opts'. The first time (no sheet.opts)
   they are seeded from what the two old tools had saved: Collage
   ('vc-collage-opts') and Frame Strip ('toolbox.controls.frames').

   For tests and the host: window.Sheet (see the end of this script).
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const E = window.Embed || { active: false, register() {}, action() {}, status() {}, toast() {}, tray() {} };

  /* ------------------------------------------------------------------ options */
  const KEY = 'sheet.opts';
  const DEF = {
    count: 9, sampling: 'ends',
    layout: 'grid', cols: 3, sizing: 'proportional', fit: 'cover', gap: 8, pad: 8,
    radius: 0, border: 0, borderColor: '#2a2a2e', bg: '#101013', transparent: false,
    labelMode: 'time', labelModeImg: 'none', labelPos: 'above', labelSize: 18, labelColor: '#e8e8ea',
    outW: 1920
  };
  const LIM = { count: [2, 48], cols: [1, 12], gap: [0, 80], pad: [0, 120], radius: [0, 60], border: [0, 20], labelSize: [9, 64], outW: [64, 8192] };
  const ENUM = {
    sampling: ['ends', 'centres'], layout: ['grid', 'row', 'col'], sizing: ['proportional', 'uniform'],
    fit: ['cover', 'contain'], labelMode: ['none', 'time', 'number'], labelModeImg: ['none', 'caption', 'number'],
    labelPos: ['above', 'top', 'bottom']
  };
  const COLORS = ['borderColor', 'bg', 'labelColor'];

  /* only valid fields survive, clamped: whatever was stored (by hand, by an
     older version, by another tool) can never put the page in a bad state */
  function clean(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.keys(LIM).forEach(k => {
      const n = parseFloat(raw[k]);
      if (isFinite(n)) out[k] = clamp(Math.round(n), LIM[k][0], LIM[k][1]);
    });
    Object.keys(ENUM).forEach(k => { if (ENUM[k].indexOf(raw[k]) >= 0) out[k] = raw[k]; });
    COLORS.forEach(k => { if (typeof raw[k] === 'string' && /^#[0-9a-f]{6}$/i.test(raw[k])) out[k] = raw[k].toLowerCase(); });
    if (raw.transparent !== undefined) out.transparent = raw.transparent === true || raw.transparent === 'true';
    return out;
  }
  function readJSON(key) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v && typeof v === 'object' ? v : null; } catch (e) { return null; }
  }
  /* Collage ids -> the ids of this page */
  function fromCollage(c) {
    const m = {
      layout: c.cgLayout, cols: c.cgCols, sizing: c.cgSizing, fit: c.cgFit, gap: c.cgGap, pad: c.cgPad,
      radius: c.cgRadius, border: c.cgBorder, borderColor: c.cgBorderColor, bg: c.cgBg, transparent: c.cgTransparent,
      labelPos: c.cgLabelPos, labelColor: c.cgLabelColor, labelSize: c.cgLabelSize, outW: c.cgOutW
    };
    if (c.cgLabels !== undefined) m.labelModeImg = c.cgLabels ? 'caption' : 'none';
    return m;
  }
  function loadSaved() {
    const own = readJSON(KEY);
    if (own) return { source: own.source === 'frames' ? 'frames' : 'images', o: Object.assign({}, DEF, clean(own.o)), seeded: false };
    /* first run: carry over the old tools' settings. Frame Strip's ids are the
       ones this page kept, Collage's are mapped; where both exist Frame Strip
       wins on the fields they share. */
    const col = readJSON('vc-collage-opts'), fr = readJSON('toolbox.controls.frames');
    const o = Object.assign({}, DEF);
    if (col) Object.assign(o, clean(fromCollage(col)));
    if (fr) Object.assign(o, clean(fr));
    return { source: fr && !col ? 'frames' : 'images', o: o, seeded: !!(col || fr) };
  }

  const saved = loadSaved();
  const S = {
    source: saved.source,
    o: saved.o,
    images: [],            // { id, name, src, w, h, caption, thumb }
    frames: [],            // { t, canvas }
    video: null,           // { src (video-io VideoSource), file, name, w, h, duration }
    trim: { start: 0, end: 0 },
    grabW: 0               // width of the cached frames
  };
  let nextId = 1;

  let saveTimer = 0;
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = 0;
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, source: S.source, o: S.o })); } catch (e) { /* private mode: not worth failing over */ }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }
  saveNow();        /* a seeded first run is written at once, so it happens only once */
  window.addEventListener('pagehide', saveNow);

  /* ------------------------------------------------------------------ helpers */
  function say(msg, kind) {
    if (E.active) E.toast(msg, kind ? { kind: kind } : undefined);
    else Kit.toast(msg, kind ? { kind: kind } : undefined);
  }
  function fmtTime(t) {
    t = Math.max(0, t || 0);
    const m = Math.floor(t / 60), s = t - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
  }
  const isImage = f => /^image\//.test(f.type) || (!f.type && /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(f.name || ''));
  const isVideo = f => /^video\//.test(f.type) || (!f.type && /\.(mp4|m4v|mov|webm|mkv)$/i.test(f.name || ''));

  /* ================================================================ the engine */

  /* What the sheet shows right now: the active source as {src, w, h, label}. */
  function currentItems() {
    const o = S.o;
    if (S.source === 'images') {
      return S.images.map((it, i) => ({
        src: it.src, w: it.w, h: it.h,
        label: o.labelModeImg === 'caption' ? it.caption : o.labelModeImg === 'number' ? String(i + 1) : ''
      }));
    }
    const V = S.video;
    return S.frames.map((f, i) => ({
      src: f.canvas, w: V ? V.w : f.canvas.width, h: V ? V.h : f.canvas.height,
      label: o.labelMode === 'time' ? fmtTime(f.t) : o.labelMode === 'number' ? String(i + 1) : ''
    }));
  }

  /* Two layouts. proportional: every picture keeps its aspect and each row is
     justified to the full width (the gallery look). uniform: identical cells,
     pictures cropped or letterboxed. Frames of one video all share an aspect,
     so for them the two are the same except for a short last row: frames
     always use uniform, which keeps that row's cells at the size of the rest.
     Cell edges are whole pixels, so seams are crisp in the export. */
  function layoutSheet(items, o, sizing) {
    const n = items.length;
    if (!n) return { width: o.outW, height: Math.round(o.outW * 9 / 16), cells: [], cols: 0, rows: 0 };
    const cols = o.layout === 'row' ? n : o.layout === 'col' ? 1 : Math.max(1, Math.min(o.cols, n));
    const rows = [];
    for (let i = 0; i < n; i += cols) rows.push(items.slice(i, i + cols));

    const inner = Math.max(1, o.outW - o.pad * 2);
    /* a caption strip above each row only when something is to be printed */
    const cap = (o.labelPos === 'above' && items.some(it => it.label)) ? Math.round(o.labelSize * 1.75) : 0;
    const asp = it => (it.w > 0 && it.h > 0) ? it.w / it.h : 16 / 9;
    const cells = [];
    let y = o.pad;
    const put = (x, yy, w, h, item) => {
      const x0 = Math.round(x), y0 = Math.round(yy), x1 = Math.round(x + w), y1 = Math.round(yy + h);
      cells.push({ x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0), item: item, cap: cap });
    };

    if (sizing === 'uniform') {
      const avg = items.reduce((s, it) => s + asp(it), 0) / n;
      const cw = (inner - (cols - 1) * o.gap) / cols, ch = Math.max(1, cw / avg);
      rows.forEach(row => {
        y += cap;
        row.forEach((it, i) => put(o.pad + i * (cw + o.gap), y, cw, ch, it));
        y += ch + o.gap;
      });
    } else {
      rows.forEach(row => {
        const avail = Math.max(1, inner - (row.length - 1) * o.gap);
        const h = Math.max(1, avail / row.reduce((s, it) => s + asp(it), 0));
        y += cap;
        let x = o.pad;
        row.forEach(it => { const w = h * asp(it); put(x, y, w, h, it); x += w + o.gap; });
        y += h + o.gap;
      });
    }
    return { width: o.outW, height: Math.max(1, Math.round(y - o.gap + o.pad)), cells: cells, cols: cols, rows: rows.length };
  }
  const sizingFor = () => S.source === 'frames' ? 'uniform' : S.o.sizing;

  function roundRect(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    if (!r) { c.rect(x, y, w, h); return; }
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  const FONT = "'Segoe UI', system-ui, sans-serif";
  let checker = null;
  function checkerOf() {
    if (checker) return checker;
    checker = document.createElement('canvas'); checker.width = checker.height = 16;
    const g = checker.getContext('2d');
    g.fillStyle = '#18181b'; g.fillRect(0, 0, 16, 16);
    g.fillStyle = '#212125'; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8);
    return checker;
  }

  /* Draws the whole sheet in sheet units, magnified by `scale`. `preview`
     puts a checkerboard under a transparent sheet (never in the export). */
  function drawSheet(c, L, o, scale, preview) {
    c.save();
    c.scale(scale, scale);
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.clearRect(0, 0, L.width, L.height);
    if (!o.transparent) { c.fillStyle = o.bg; c.fillRect(0, 0, L.width, L.height); }
    else if (preview) {
      const p = c.createPattern(checkerOf(), 'repeat');
      if (p.setTransform) p.setTransform(new DOMMatrix([1 / scale, 0, 0, 1 / scale, 0, 0]));
      c.fillStyle = p; c.fillRect(0, 0, L.width, L.height);
    }

    L.cells.forEach(cell => {
      const it = cell.item, label = it.label;
      const ia = (it.w > 0 && it.h > 0) ? it.w / it.h : 16 / 9, ca = cell.w / cell.h;
      let dw, dh;
      if (o.fit === 'cover' ? ia > ca : ia < ca) { dh = cell.h; dw = dh * ia; } else { dw = cell.w; dh = dw / ia; }

      c.save();
      roundRect(c, cell.x, cell.y, cell.w, cell.h, o.radius);
      c.clip();
      c.drawImage(it.src, cell.x + (cell.w - dw) / 2, cell.y + (cell.h - dh) / 2, dw, dh);

      /* overlaid labels are clipped to the picture; the "above" variant is
         drawn after restore() so the clip does not cut it away */
      if (label && o.labelPos !== 'above') {
        const fs = o.labelSize, barH = fs * 1.9;
        const barY = o.labelPos === 'top' ? cell.y : cell.y + cell.h - barH;
        c.fillStyle = 'rgba(0,0,0,.6)';
        c.fillRect(cell.x, barY, cell.w, barH);
        c.fillStyle = o.labelColor;
        c.font = '600 ' + fs + 'px ' + FONT;
        c.textBaseline = 'middle'; c.textAlign = 'center';
        c.fillText(label, cell.x + cell.w / 2, barY + barH / 2, Math.max(1, cell.w - fs));
      }
      c.restore();

      if (label && o.labelPos === 'above' && cell.cap) {
        c.save();
        c.fillStyle = o.labelColor;
        c.font = '600 ' + o.labelSize + 'px ' + FONT;
        c.textBaseline = 'alphabetic'; c.textAlign = 'center';
        c.fillText(label, cell.x + cell.w / 2, cell.y - cell.cap * 0.32, cell.w);
        c.restore();
      }

      if (o.border > 0) {
        c.save();
        roundRect(c, cell.x + o.border / 2, cell.y + o.border / 2, Math.max(1, cell.w - o.border), Math.max(1, cell.h - o.border), o.radius);
        c.lineWidth = o.border;
        c.strokeStyle = o.borderColor;
        c.stroke();
        c.restore();
      }
    });
    c.restore();
  }

  /* ---- viewport: the canvas is the window, not the picture ----------------
     It matches the stage and the sheet is drawn through a pan/zoom transform,
     so zooming re-renders sharp instead of magnifying pixels. */
  const stageEl = $('stage'), canvas = $('sheet'), ctx = canvas.getContext('2d');
  const view = { zoom: 1, x: 0, y: 0, fitted: true };
  const ZMIN = 0.02, ZMAX = 16;
  const stageSize = () => ({ w: Math.max(40, stageEl.clientWidth), h: Math.max(40, stageEl.clientHeight) });
  function fitView(L) {
    const s = stageSize(), pad = 20;
    view.zoom = clamp(Math.min((s.w - pad * 2) / L.width, (s.h - pad * 2) / L.height), ZMIN, ZMAX);
    view.x = (s.w - L.width * view.zoom) / 2;
    view.y = (s.h - L.height * view.zoom) / 2;
    view.fitted = true;
  }

  let last = { L: null, n: 0 };
  function render() {

    const L = layoutSheet(items, S.o, sizingFor());
    const s = stageSize(), dpr = window.devicePixelRatio || 1;
    const pw = Math.max(1, Math.round(s.w * dpr)), ph = Math.max(1, Math.round(s.h * dpr));

    canvas.style.width = s.w + 'px'; canvas.style.height = s.h + 'px';
    if (view.fitted) fitView(L);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, s.w, s.h);
    if (items.length) {
      ctx.save();
      ctx.translate(view.x, view.y);
      drawSheet(ctx, L, S.o, view.zoom, true);
      ctx.restore();
      /* outline, so the sheet's extent stays readable against the backdrop */

  let raf = 0;
  function schedRender() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }

  }
  function zoomCentre(f) { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, f); }
  function actualSize() {
    const s = stageSize();
    if (!last.L) return;

    view.x = (s.w - last.L.width) / 2; view.y = (s.h - last.L.height) / 2;
    schedRender();
  }
  function fit() { view.fitted = true; schedRender(); }

  stageEl.addEventListener('wheel', e => {
    e.preventDefault();

  }, { passive: false });
  let pan = null;

    if (e.button !== 0 && e.button !== 1) return;
    if (e.target.closest && e.target.closest('button, .toolbar')) return;

  $("fitView").onclick = fit;
  $('zoomIn').onclick = () => zoomCentre(1.25);
  $('zoomOut').onclick = () => zoomCentre(1 / 1.25);

  else window.addEventListener('resize', schedRender);

  /* ---- compose and export ------------------------------------------------- */
  function compose() {
    const L = layoutSheet(currentItems(), S.o, sizingFor());
    const c = document.createElement('canvas');
    c.width = L.width; c.height = L.height;
    drawSheet(c.getContext('2d'), L, S.o, 1, false);
    return c;
  }
  async function exportBlob() {
    if (!currentItems().length) throw new Error('There is nothing on the sheet yet.');
    await ensureRes();          /* frames at the resolution this output needs */
    const L = layoutSheet(currentItems(), S.o, sizingFor());
    if (L.width > 16384 || L.height > 16384 || L.width * L.height > 268e6)
      throw new Error('The sheet would be ' + L.width + '×' + L.height + ' px, more than a canvas can hold. Lower the width or the number of frames.');
    const c = compose();
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('The PNG could not be encoded.')), 'image/png'));
  }
  function fileName() {
    const n = currentItems().length;
    if (S.source === 'frames') {
      const base = (S.video ? S.video.name : '').replace(/\.[^.]+$/, '') || 'frames';
      return base + '_' + n + 'frames.png';
    }
    return 'sheet_' + n + 'x_' + S.o.outW + 'px.png';
  }
  async function exportPNG() {
    if (!currentItems().length) return;
    try {
      const blob = await exportBlob();
      const name = Kit.save(blob, fileName());
      say('Exported ' + name);
    } catch (e) { say(e.message || String(e), 'err'); }
  }
  async function copySheet() {
    if (!currentItems().length) return;
    if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) { say('The clipboard is not available here.', 'err'); return; }
    try {
      /* a promise inside the ClipboardItem keeps the click's permission alive while frames are re-read */
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportBlob() })]);
      say('Sheet copied to the clipboard');
    } catch (e) { say('Could not copy: ' + (e.message || e), 'err'); }
  }

  /* ================================================================ source: images */
  async function decodeImage(file) {
    let src = null, w = 0, h = 0;
    try { src = await createImageBitmap(file); w = src.width; h = src.height; }
    catch (e) {
      /* SVG and a few others: through an <img> */
      src = await new Promise(res => {
        const url = URL.createObjectURL(file), im = new Image();
        im.onload = () => res(im); im.onerror = () => res(null);
        im.src = url;
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      });
      if (!src) return null;
      w = src.naturalWidth || 300; h = src.naturalHeight || 150;
    }
    const th = document.createElement('canvas'); th.width = 92; th.height = 68;
    const g = th.getContext('2d'), k = Math.min(92 / w, 68 / h);
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, (92 - w * k) / 2, (68 - h * k) / 2, w * k, h * k);
    return { src: src, w: w, h: h, thumb: th };
  }

  /* Images enter in the order given (selection, drop or paste order), not in
     the order each one happens to finish decoding; later calls queue behind
     earlier ones, so two quick drops also stay in order. */
  let addChain = Promise.resolve(), pasteCount = 0;
  function addImages(files, nameFor) {
    const list = [].slice.call(files || []).filter(isImage);
    if (!list.length) return Promise.resolve(0);
    addChain = addChain.then(async () => {
      if (S.source !== 'images') setSource('images');
      setBusy('Reading ' + list.length + ' image' + (list.length > 1 ? 's' : '') + '…');
      const got = await Promise.all(list.map(f => decodeImage(f).catch(() => null)));
      let added = 0;
      got.forEach((r, i) => {
        if (!r) { say('Could not read ' + (list[i].name || 'that image'), 'err'); return; }
        S.images.push({ id: nextId++, name: nameFor ? nameFor(list[i], i) : (list[i].name || 'image'), src: r.src, w: r.w, h: r.h, caption: '', thumb: r.thumb });
        added++;
      });
      setBusy('');
      if (added) view.fitted = true;
      renderList(); schedRender(); panelSync();
      return added;
    }).catch(e => { setBusy(''); say(e.message || String(e), 'err'); return 0; });
    return addChain;
  }
  function removeImage(id) {
    const i = S.images.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = S.images.splice(i, 1)[0];
    try { if (it.src.close) it.src.close(); } catch (e) {}
    renderList(); schedRender(); panelSync();
  }
  function clearImages() {
    S.images.forEach(it => { try { if (it.src.close) it.src.close(); } catch (e) {} });
    S.images = []; view.fitted = true;
    renderList(); schedRender(); panelSync();
  }
  function moveImage(id, toIndex) {
    const from = S.images.findIndex(x => x.id === id);
    if (from < 0) return;
    toIndex = clamp(toIndex, 0, S.images.length - 1);
    if (from === toIndex) return;
    S.images.splice(toIndex, 0, S.images.splice(from, 1)[0]);
    renderList(); schedRender();
  }

  let dragId = null;
  function renderList() {
    const list = $('list');
    const focusedCap = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('cap')
      ? Number(document.activeElement.dataset.id) : null;
    list.textContent = '';
    S.images.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'it'; row.draggable = true; row.dataset.id = it.id;

      const ix = document.createElement('span'); ix.className = 'ix'; ix.textContent = String(i + 1);
      const th = document.createElement('canvas'); th.width = 92; th.height = 68;
      th.getContext('2d').drawImage(it.thumb, 0, 0);
      const meta = document.createElement('div'); meta.className = 'meta';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name; nm.title = it.name + '  ' + it.w + '×' + it.h;
      const cap = document.createElement('input'); cap.type = 'text'; cap.className = 'cap'; cap.dataset.id = it.id;
      cap.placeholder = 'caption'; cap.value = it.caption;
      cap.addEventListener('input', () => { it.caption = cap.value; schedRender(); });
      /* the row is draggable, which would otherwise swallow text selection */
      cap.addEventListener('mousedown', ev => ev.stopPropagation());
      cap.addEventListener('dragstart', ev => { ev.preventDefault(); ev.stopPropagation(); });
      cap.addEventListener('keydown', ev => {
        if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
          ev.preventDefault(); ev.stopPropagation();
          moveImage(it.id, S.images.findIndex(x => x.id === it.id) + (ev.key === 'ArrowUp' ? -1 : 1));
          const again = list.querySelector('input.cap[data-id="' + it.id + '"]');
          if (again) again.focus();
        }
      });
      meta.appendChild(nm); meta.appendChild(cap);
      const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.title = 'Remove';
      del.appendChild(Kit.icon('close'));
      del.onclick = () => removeImage(it.id);
      row.appendChild(ix); row.appendChild(th); row.appendChild(meta); row.appendChild(del);

      const clear = () => { row.classList.remove('before', 'after'); };
      row.addEventListener('dragstart', ev => {
        dragId = it.id; row.classList.add('dragging');
        ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(it.id));
      });
      row.addEventListener('dragend', () => {
        dragId = null; row.classList.remove('dragging');

        let to = S.images.findIndex(x => x.id === it.id) + (after ? 1 : 0);
        if (from < to) to--;

      list.appendChild(row);
    });
    if (focusedCap !== null) { const f = list.querySelector('input.cap[data-id="' + focusedCap + '"]'); if (f) f.focus(); }
    const n = S.images.length;
    $('imgCount').textContent = n ? n + (n === 1 ? ' image' : ' images') : 'No images yet';
    $('imgClear').disabled = !n;
  }

  /* the clipboard button: same job as Ctrl+V, reachable with the mouse */
  async function pasteFromClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) { say('The clipboard is not available here.', 'err'); return; }
    try {
      const entries = await navigator.clipboard.read();
      const jobs = [];
      entries.forEach(en => {
        const type = en.types.filter(t => t.indexOf('image/') === 0)[0];
        if (type) jobs.push(en.getType(type).then(b => new File([b], 'clipboard.png', { type: type })));
      });
      if (!jobs.length) { say('There is no image on the clipboard.', 'warn'); return; }
      const files = await Promise.all(jobs);
      await addImages(files, () => 'Pasted ' + (++pasteCount));
    } catch (e) { say('The clipboard could not be read.', 'err'); }
  }

  /* ================================================================ source: video frames */
  let vioMod = null;
  const vio = () => vioMod || (vioMod = import('../shared/lib/video-io.js'));

  let grabSeq = 0, grabChain = Promise.resolve(), grabbing = false, grabTimer = 0;
  const PIXELS = 200e6;                    /* cached frames never exceed this many pixels in total */
  function colsFor(n) { return S.o.layout === 'row' ? n : S.o.layout === 'col' ? 1 : Math.max(1, Math.min(S.o.cols, n)); }
  /* width the cached frames need so that the output shows them 1:1 (never more than the source has) */
  function targetWidth(n) {
    const V = S.video, o = S.o, cols = colsFor(n);
    const cellW = (Math.max(1, o.outW - o.pad * 2) - (cols - 1) * o.gap) / cols;
    const byMemory = Math.floor(Math.sqrt(PIXELS * (V.w / V.h) / n));
    return Math.max(16, Math.min(V.w, Math.ceil(cellW), byMemory));
  }
  function needRes() {
    if (!S.video || !S.frames.length) return false;
    const t = targetWidth(S.frames.length);
    return S.grabW < t - 1 || S.grabW > t * 2.5 + 16;
  }
  function trimRange() {
    let s = S.trim.start, e = S.trim.end;
    if (e < s) { const t = s; s = e; e = t; }

  }
  /* latest request wins: a running extraction stops at its next frame and the new one starts */
  function requestGrab(exact) {

    return grabChain;
  }
  async function ensureRes() {
    clearTimeout(grabTimer);
    await grabChain;
    if (S.source === 'frames' && S.video && (needRes() || !S.frames.length)) await requestGrab(true);
  }

  async function doGrab(id, exact) {
    const V = S.video;
    if (!V || id !== grabSeq) return;
    grabbing = true; updateChrome();
    const o = S.o, r = trimRange(), n = o.count, span = Math.max(0, r.end - r.start);
    const times = [];
    for (let i = 0; i < n; i++) {
      const f = o.sampling === 'centres' ? (i + 0.5) / n : (n === 1 ? 0 : i / (n - 1));
      times.push(r.start + span * f);
    }

    if (!exact) gw = Math.min(V.w, Math.ceil(gw * 1.25));       /* some headroom, so small layout changes do not re-read */
    gw = Math.max(16, Math.min(gw, Math.floor(Math.sqrt(PIXELS * (V.w / V.h) / n))));
    const gh = Math.max(1, Math.round(gw * V.h / V.w));

    try {
      for (let k = 0; k < n; k++) {
        if (id !== grabSeq) return;                              /* superseded */
        setBusy('Reading frame ' + (k + 1) + ' of ' + n + '…');
        const fr = await V.src.frameAt(times[k]);
        if (id !== grabSeq) return;
        const c = document.createElement('canvas'); c.width = gw; c.height = gh;
        const g = c.getContext('2d');

        out.push({ t: times[k], canvas: c });

    } finally {
      if (id === grabSeq) { grabbing = false; setBusy(''); schedRender(); panelSync(); if (scrubLast !== null) scrubTo(scrubLast); }
    }
  }

  let loadSeq = 0;
  async function loadVideoFile(file) {
    if (!file) return false;
    if (!isVideo(file)) { say('That is not a video file.', 'err'); return false; }
    const token = ++loadSeq;
    setBusy('Opening ' + file.name + '…');
    let src;
    try { src = await (await vio()).loadVideo(file); }
    catch (e) {
      if (token === loadSeq) { setBusy(''); say('Could not read that video (' + (e.message || e) + '). H.264 MP4 and WebM are the safe choices.', 'err'); }
      return false;
    }
    if (token !== loadSeq) { src.dispose(); return false; }
    ++grabSeq; await grabChain;              /* a running extraction on the old video ends first */
    grabbing = false;
    if (S.video) { try { S.video.src.dispose(); } catch (e) {} }
    S.video = { src: src, file: file, name: file.name, w: src.width, h: src.height, duration: src.duration };
    S.frames = []; S.grabW = 0;
    S.trim = { start: 0, end: src.duration };
    setBusy('');
    setSource('frames');
    buildDock();
    scrubTo(0);
    view.fitted = true;
    requestGrab(false);
    panelSync();
    return true;
  }

  /* ---- the trim: scrub thumbnail + start / end ---------------------------- */
  const startEl = $('start'), endEl = $('end'), scrubC = $('scrub');
  let scrubBusy = false, scrubWant = null, scrubLast = null;
  function scrubTo(t) {
    scrubLast = t; scrubWant = t;

      scrubBusy = true;

        const tt = scrubWant;
        if (grabbing || !S.video) break;        /* the extraction owns the decoder; the last position is drawn once it ends */
        scrubWant = null;
        try {
          const fr = await S.video.src.frameAt(tt);
          scrubC.getContext('2d').drawImage(fr, 0, 0, scrubC.width, scrubC.height);
          $('scrubT').textContent = fmtTime(tt);
        } catch (e) { /* the video went away: nothing to draw */ }
      }
      scrubBusy = false;
    })();
  }
  const minSpan = () => { const V = S.video; return V ? Math.min(0.04, V.duration / 10) : 0.04; };
  function trimTexts() {
    const r = trimRange(), n = S.o.count;
    $('startV').textContent = fmtTime(r.start);
    $('endV').textContent = fmtTime(r.end);
    $('trimInfo').textContent = 'covering ' + (r.end - r.start).toFixed(2) + ' s · ' + n + ' frames';
  }
  function buildDock() {
    const V = S.video;
    $('dock').hidden = !(V && S.source === 'frames');
    if (!V) return;
    const step = V.src.frameDur || 0.01;
    [startEl, endEl].forEach(el => { el.min = 0; el.max = V.duration; el.step = step; });
    startEl.value = S.trim.start; endEl.value = S.trim.end;
    scrubC.width = 200; scrubC.height = Math.max(1, Math.round(200 * V.h / V.w));
    trimTexts();
  }
  function onTrim(which) {
    const V = S.video; if (!V) return;
    let s = parseFloat(startEl.value), e = parseFloat(endEl.value);
    const gap = minSpan();
    if (which === 'start' && s > e - gap) { s = Math.max(0, e - gap); startEl.value = s; }
    if (which === 'end' && e < s + gap) { e = Math.min(V.duration, s + gap); endEl.value = e; }
    S.trim = { start: s, end: e };
    trimTexts();
    scrubTo(which === 'end' ? e : s);
    queueGrab(350);
  }
  startEl.addEventListener('input', () => onTrim('start'));
  endEl.addEventListener('input', () => onTrim('end'));
  $('whole').onclick = () => {
    const V = S.video; if (!V) return;
    S.trim = { start: 0, end: V.duration }; startEl.value = 0; endEl.value = V.duration;
    trimTexts(); scrubTo(0); queueGrab(0);
  };

  /* ================================================================ panel */
  const rowSets = [];
  function reg(specs) { const w = Kit.rows(specs); rowSets.push(w); return w; }
  function opt(k, extra) {
    return Object.assign({ id: k, hard: true, get: () => S.o[k], set: v => setOpt(k, v), def: DEF[k] }, extra);
  }
  const GRAB = { count: 1, sampling: 1 }, RES = { layout: 1, cols: 1, gap: 1, pad: 1, outW: 1 };
  function setOpt(k, v) {
    if (!(k in S.o) || S.o[k] === v) return;
    S.o[k] = v;
    if (GRAB[k]) { queueGrab(); if (k === 'count') trimTexts(); }
    else if (RES[k]) queueRes();
    schedRender(); panelSyncSoon(); saveSoon();
  }
  const isImg = () => S.source === 'images';
  const labelsOn = () => (isImg() ? S.o.labelModeImg : S.o.labelMode) !== 'none';

  /* a note that follows the options (Kit notes have no `when`) */
  function capNote() {
    const d = document.createElement('div');
    d.className = 'hint'; d.textContent = 'Type a caption under each picture in the list.';
    d.sync = function () { d.hidden = !(isImg() && S.o.labelModeImg === 'caption'); };
    return d;
  }

  let tabs;
  function buildPanel() {
    const panel = $('panel');
    tabs = Kit.tabs({
      items: [{ id: 'images', label: 'Images', icon: 'image', tip: 'Pictures you add, drop or paste' },
              { id: 'frames', label: 'Video frames', icon: 'film', tip: 'Frames taken from one video' }],
      value: S.source, onChange: id => setSource(id)
    });
    panel.appendChild(tabs);

    /* images */
    const imgBody = document.createElement('div');
    const dz = document.createElement('div');
    dz.id = 'dz'; dz.tabIndex = 0; dz.setAttribute('role', 'button');
    dz.innerHTML = '<b>Add images</b><span>drop them here, paste with Ctrl+V, or click to choose</span>';
    dz.onclick = () => pickImages();
    dz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickImages(); } };
    imgBody.appendChild(dz);
    const list = document.createElement('div'); list.id = 'list'; imgBody.appendChild(list);
    const foot = document.createElement('div'); foot.className = 'foot';
    foot.innerHTML = '<span id="imgCount"></span><span class="grow"></span>';
    const pasteB = document.createElement('button'); pasteB.type = 'button'; pasteB.id = 'imgPaste'; pasteB.textContent = 'Paste';
    pasteB.title = 'Add the image on the clipboard (Ctrl+V)'; pasteB.onclick = pasteFromClipboard;
    const clearB = document.createElement('button'); clearB.type = 'button'; clearB.id = 'imgClear'; clearB.textContent = 'Clear all';
    clearB.onclick = clearImages;
    foot.appendChild(pasteB); foot.appendChild(clearB);
    imgBody.appendChild(foot);
    P.secImages = Kit.section({ title: 'Images', icon: 'image', open: true, body: imgBody });

    /* video */
    const vBody = document.createElement('div');
    const chip = document.createElement('div'); chip.id = 'vchip';
    chip.innerHTML = '<b id="vName">No video</b><span id="vMeta">Drop one, or choose a file</span>';
    vBody.appendChild(chip);
    vBody.appendChild(Kit.row({ type: 'button', buttons: [
      { text: 'Choose video…', icon: 'video', click: () => pickVideo() },
      { text: 'Re-extract', icon: 'reset', click: () => requestGrab(false), tip: 'Read the frames again' }] }));
    P.reextract = vBody.lastChild.querySelectorAll('button')[1];
    vBody.appendChild(reg([
      opt('count', { type: 'range', label: 'Frames', min: 2, max: 48, step: 1 }),
      opt('sampling', { type: 'select', label: 'Sampling', options: [['ends', 'Include first and last'], ['centres', 'Even intervals']] }),
      { type: 'note', text: 'Even intervals takes the middle of each slice, which avoids a black first frame on captures that fade in.' }
    ]));
    P.secVideo = Kit.section({ title: 'Video', icon: 'film', open: true, body: vBody });

    P.secLayout = Kit.section({ title: 'Layout', icon: 'grid', open: true, body: reg([
      opt('layout', { type: 'select', label: 'Arrange', options: [['grid', 'Grid'], ['row', 'Single row'], ['col', 'Single column']] }),
      opt('cols', { type: 'range', label: 'Columns', min: 1, max: 12, step: 1, disabled: () => S.o.layout !== 'grid' }),
      opt('sizing', { type: 'select', label: 'Cells', when: isImg, options: [['proportional', 'Keep each aspect'], ['uniform', 'Same size']],
        tip: 'Keep each aspect: every picture keeps its shape and rows fill the width. Same size: identical cells.' }),
      opt('fit', { type: 'select', label: 'Fit', when: () => isImg() && S.o.sizing === 'uniform', options: [['cover', 'Crop to fill'], ['contain', 'Fit inside']] }),
      opt('gap', { type: 'range', label: 'Gap', min: 0, max: 80, step: 1 }),
      opt('pad', { type: 'range', label: 'Margin', min: 0, max: 120, step: 1 })
    ]) });

    P.secStyle = Kit.section({ title: 'Style', icon: 'frame', open: true, body: reg([
      opt('radius', { type: 'range', label: 'Corners', min: 0, max: 60, step: 1 }),
      opt('border', { type: 'range', label: 'Border', min: 0, max: 20, step: 1 }),
      opt('borderColor', { type: 'color', label: 'Border colour', disabled: () => !S.o.border }),
      opt('bg', { type: 'color', label: 'Background', disabled: () => S.o.transparent }),
      opt('transparent', { type: 'check', label: 'Transparent', text: 'no background' })
    ]) });

    P.secLabels = Kit.section({ title: 'Labels', icon: 'tag', open: true, body: reg([
      opt('labelModeImg', { type: 'select', label: 'Show', when: isImg, options: [['none', 'Nothing'], ['caption', 'Captions'], ['number', 'Numbers']] }),
      opt('labelMode', { type: 'select', label: 'Show', when: () => !isImg(), options: [['none', 'Nothing'], ['time', 'Timestamp'], ['number', 'Frame number']] }),
      capNote(),
      opt('labelPos', { type: 'select', label: 'Place', when: labelsOn, options: [['above', 'Above the picture'], ['top', 'Over the top'], ['bottom', 'Over the bottom']] }),
      opt('labelSize', { type: 'range', label: 'Size', min: 9, max: 64, step: 1, when: labelsOn }),
      opt('labelColor', { type: 'color', label: 'Colour', when: labelsOn })
    ]) });

    const outBody = document.createElement('div');
    outBody.appendChild(reg([ opt('outW', { type: 'number', label: 'Width (px)', min: 64, max: 8192, step: 16 }) ]));
    const oi = document.createElement('div'); oi.id = 'outInfo'; outBody.appendChild(oi);
    P.secOut = Kit.section({ title: 'Output', icon: 'down', open: true, body: outBody });

    [P.secImages, P.secVideo, P.secLayout, P.secStyle, P.secLabels, P.secOut].forEach(s => panel.appendChild(s));
    Kit.paintIcons(document);
  }
  const P = {};

  let psTimer = 0;
  function panelSyncSoon() { if (psTimer) return; psTimer = requestAnimationFrame(() => { psTimer = 0; panelSync(); }); }
  function panelSync() {
    if (!P.secImages) return;
    P.secImages.hidden = S.source !== 'images';
    P.secVideo.hidden = S.source !== 'frames';
    rowSets.forEach(w => w.sync());
    const V = S.video;
    $('vName').textContent = V ? V.name : 'No video';
    $('vMeta').textContent = V ? V.w + '×' + V.h + ' · ' + fmtTime(V.duration) + (V.src.frameDur ? ' · ' + Math.round(1 / V.src.frameDur * 100) / 100 + ' fps' : '') + (V.src.mode === 'seek' ? ' · read by seeking' : '')
                             : 'Drop one, or choose a file';
    $('vName').title = V ? V.name : '';
    if (P.reextract) P.reextract.disabled = !V || grabbing;
    $('dock').hidden = !(V && S.source === 'frames');
    updateChrome();
  }

  function setSource(s) {
    if (s !== 'images' && s !== 'frames') return;
    const changed = S.source !== s;
    S.source = s;
    if (tabs) tabs.set(s);
    if (changed) { view.fitted = true; saveSoon(); }
    panelSync(); schedRender();
    if (S.video && s === 'frames' && !S.frames.length && !grabbing) requestGrab(false);
    if (s === 'frames' && S.video) scrubTo(scrubLast === null ? S.trim.start : scrubLast);
  }

  /* ================================================================ chrome: info line, empty state, actions */
  function setBusy(text) {
    const b = $('busy');
    b.textContent = text || ''; b.hidden = !text;
  }

  const ACTIONS = [
    { id: 'addImages', label: 'Add images', icon: 'image', tip: 'Add images (Ctrl+O)', run: () => pickImages() },
    { id: 'addVideo', label: 'Add video', icon: 'video', tip: 'Pick a video for the frames (Ctrl+Shift+O)', run: () => pickVideo() },
    { id: 'copy', label: 'Copy', icon: 'copy', tip: 'Copy the sheet to the clipboard (Ctrl+Shift+C)', disabled: true, run: copySheet },
    { id: 'export', label: 'Export PNG', icon: 'down', primary: true, tip: 'Save the sheet as a PNG (Ctrl+S)', disabled: true, run: exportPNG }
  ];
  const BTN = { addImages: 'hAddImages', addVideo: 'hAddVideo', copy: 'copy', export: 'export' };
  function setAction(id, patch) {
    const a = ACTIONS.filter(x => x.id === id)[0];
    if (!a) return;
    const was = a.disabled;
    Object.assign(a, patch);
    if (patch.disabled !== undefined && !!was === !!patch.disabled && Object.keys(patch).length === 1) return;
    const b = $(BTN[id]);
    if (b && patch.disabled !== undefined) b.disabled = !!patch.disabled;
    E.action(id, patch);
  }

  let lastInfo = '';
  function updateChrome() {
    const n = last.n, L = last.L;
    const has = n > 0;
    setAction('export', { disabled: !has });
    setAction('copy', { disabled: !has });
    const kind = S.source === 'frames' ? (n === 1 ? 'frame' : 'frames') : (n === 1 ? 'image' : 'images');
    const txt = has ? n + ' ' + kind + ' · ' + L.cols + '×' + L.rows + ' · ' + L.width + '×' + L.height + ' px' : '';
    $('status').textContent = has ? txt : (S.source === 'frames' ? (S.video ? (grabbing ? '' : 'No frames yet') : 'No video yet') : 'No images yet');
    $('statusHint').textContent = has ? 'drag to pan · wheel to zoom · F to fit' : '';
    if (txt !== lastInfo) { lastInfo = txt; E.status(txt); }
    const oi = $('outInfo');
    if (oi) oi.textContent = has ? 'Output ' + L.width + ' × ' + L.height + ' px' + (S.source === 'frames' && S.video ? ' · frames read at ' + S.grabW + ' px wide' : '') : 'Output width ' + S.o.outW + ' px';

    /* empty state */
    const empty = $('empty');
    const show = !has && !grabbing && !$('busy').textContent;
    empty.hidden = !show;
    if (show) {
      const frames = S.source === 'frames';
      $('emptyIc').textContent = ''; $('emptyIc').appendChild(Kit.icon(frames ? 'film' : 'image'));
      $('emptyT').textContent = frames ? 'Drop a video' : 'Drop images';
      $('emptyS').textContent = frames ? 'its frames become one contact sheet' : 'or paste a screenshot with Ctrl+V';
      const eb = $('emptyB');
      const key = frames ? 'v' : 'i';
      if (eb.dataset.k !== key) {
        eb.dataset.k = key; eb.textContent = '';
        const b = document.createElement('button'); b.type = 'button'; b.className = 'primary'; b.textContent = frames ? 'Choose video…' : 'Add images';
        b.onclick = () => frames ? pickVideo() : pickImages();
        eb.appendChild(b);
        if (!frames) { const p = document.createElement('button'); p.type = 'button'; p.textContent = 'Paste'; p.onclick = pasteFromClipboard; eb.appendChild(p); }
      }
    }
    const vb = $('viewbar'); vb.hidden = !has;
  }

  /* ================================================================ input */
  const imgPicker = $('files'), vidPicker = $('file');
  function pickImages() { imgPicker.click(); }
  function pickVideo() { vidPicker.click(); }
  imgPicker.addEventListener('change', e => {
    const files = [].slice.call(e.target.files || []); e.target.value = '';
    if (files.length) { addImages(files); E.tray(files); }
  });
  vidPicker.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (f) { loadVideoFile(f); E.tray([f]); }
  });

  /* files from anywhere: pictures go to the sheet's images, the first video to the frames */
  function receive(files) {
    files = [].slice.call(files || []);
    const imgs = files.filter(isImage), vids = files.filter(isVideo);
    const videoFirst = files.length && isVideo(files[0]);
    if (imgs.length && !videoFirst) {
      addImages(imgs);
      if (vids.length) loadVideoFile(vids[0]).then(() => {});
    } else {
      if (vids.length) loadVideoFile(vids[0]);
      if (imgs.length) addImages(imgs);
    }
    if (vids.length > 1) say('Only the first video is used (' + vids[0].name + ').', 'warn');
    if (!imgs.length && !vids.length) say('Nothing to add: pictures and videos only.', 'warn');
  }
  Kit.drop(document.body, { accept: f => isImage(f) || isVideo(f), overlayText: 'Drop images or a video', onFiles: receive });

  /* Screenshots usually arrive on the clipboard (Win+Shift+S). Ignored while a
     text field has focus, where Ctrl+V pastes text as usual. */
  document.addEventListener('paste', e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    const dt = e.clipboardData;
    if (!dt || !dt.items) return;
    const imgs = [], vids = [];
    for (let i = 0; i < dt.items.length; i++) {
      const it = dt.items[i];
      if (it.kind !== 'file') continue;
      const f = it.getAsFile();
      if (!f) continue;
      if (it.type.indexOf('image/') === 0) imgs.push(f); else if (it.type.indexOf('video/') === 0) vids.push(f);
    }
    if (!imgs.length && !vids.length) return;
    e.preventDefault();
    if (imgs.length) addImages(imgs, () => 'Pasted ' + (++pasteCount));
    else loadVideoFile(vids[0]);
  });

  const SHORTCUTS = [
    ['Sources', [['Ctrl+O', 'Add images'], ['Ctrl+Shift+O', 'Pick a video'], ['Ctrl+V', 'Paste an image from the clipboard'], ['Drop', 'Images or one video, anywhere']]],
    ['View', [['F', 'Fit the sheet to the window'], ['1', 'Actual size (output pixels)'], ['+  /  -', 'Zoom in / out'], ['Wheel', 'Zoom at the pointer'], ['Drag', 'Pan'], ['Double-click', 'Fit']]],
    ['Output', [['Ctrl+S', 'Export PNG'], ['Ctrl+Shift+C', 'Copy the sheet to the clipboard']]],
    ['Image list', [['Drag a row', 'Change the order'], ['Alt+Up / Down', 'Move the item whose caption has focus']]]
  ];
  document.addEventListener('keydown', e => {
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') && t.type !== 'range' && t.type !== 'checkbox' && t.type !== 'color';
    const mod = e.ctrlKey || e.metaKey, k = e.key;
    if (mod && !e.altKey) {
      const lk = k.toLowerCase();
      if (lk === 'o') { e.preventDefault(); e.shiftKey ? pickVideo() : pickImages(); }
      else if (lk === 's' && !e.shiftKey) { e.preventDefault(); exportPNG(); }
      else if (lk === 'c' && e.shiftKey) { e.preventDefault(); copySheet(); }
      return;
    }
    if (typing || e.altKey) return;
    if (k === 'f' || k === 'F') { e.preventDefault(); fit(); }
    else if (k === '1') { e.preventDefault(); actualSize(); }
    else if (k === '+' || k === '=') { e.preventDefault(); zoomCentre(1.25); }
    else if (k === '-' || k === '_') { e.preventDefault(); zoomCentre(1 / 1.25); }
  });

  /* ================================================================ start */
  buildPanel();
  renderList();
  $('hAddImages').onclick = () => pickImages();
  $('hAddVideo').onclick = () => pickVideo();
  $('copy').onclick = copySheet;
  $('export').onclick = exportPNG;
  $('keysBtn').onclick = () => Kit.keys(SHORTCUTS, { button: $('keysBtn') });
  Kit.paintIcons(document);
  Kit.config({ stage: '#stage', avoid: ['#dock', '#info'] });
  panelSync();
  render();

  E.register({
    id: 'sheet', title: 'Contact sheet',
    actions: ACTIONS.map(a => ({ id: a.id, label: a.label, icon: a.icon, primary: a.primary, tip: a.tip, disabled: a.disabled, run: a.run })),
    shortcuts: SHORTCUTS,
    accepts: ['image/*', 'video/*'],
    onReceive: receive,
    onShow: () => { schedRender(); },
    onHide: () => { saveNow(); }
  });

  /* what tests and the host can reach */
  window.Sheet = {
    ready: true, S: S, view: view,
    addImages: addImages, loadVideoFile: loadVideoFile, receive: receive,
    setOpt: setOpt, setSource: setSource, moveImage: moveImage, removeImage: removeImage, clearImages: clearImages,
    items: currentItems, layout: () => layoutSheet(currentItems(), S.o, sizingFor()),
    compose: compose, exportBlob: exportBlob, exportPNG: exportPNG, copySheet: copySheet,
    render: render, ensureRes: ensureRes, requestGrab: requestGrab, idle: () => grabChain,
    saveNow: saveNow, fileName: fileName, seeded: saved.seeded
  };
})();
</script>
</body>
</html>
