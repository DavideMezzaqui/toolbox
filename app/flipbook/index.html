/* ============================================================
   Textures
   ============================================================ */
const isTga   = f => /\.tga$/i.test(f.name || '');
const isImage = f => /^image\//.test(f.type || '') || IMAGE_RE.test(f.name || '');

/** Decode an image file. Rejects when the browser cannot read it. */
function decodeImage(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('read failed'));
        reader.onload = ev => {
            const img = new Image();
            img.onload  = () => resolve(img);
            img.onerror = () => reject(new Error('decode failed'));
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });
}

/** A small picture for the strip, made once. */
function makeThumb(img){
    const k = Math.min(1, 108 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k));
    c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { return c.toDataURL('image/png'); } catch (err) { return img.src; }
}

/** Grid from a name like fire_8x8.png. Several NxN in a name: the last that divides the image. */
function gridFromName(name, img){
    const found = [];
    const re = /(\d+)\s*[xX]\s*(\d+)/g;
    let m;
    while ((m = re.exec(name))) {
        const c = parseInt(m[1], 10), r = parseInt(m[2], 10);
        if (c >= 1 && r >= 1 && c <= 64 && r <= 64) found.push([c, r]);
    }
    if (!found.length) return [8, 8];
    const fits = found.filter(([c, r]) => img.width % c === 0 && img.height % r === 0);
    return (fits.length ? fits : found)[(fits.length ? fits : found).length - 1];
}

function makeTexture(file, img, handle, saved){
    const [cols, rows] = saved ? [saved.cols, saved.rows] : gridFromName(file.name, img);
    return {
        id: saved ? saved.id : Date.now() + Math.random(),
        img, name: saved ? saved.name : file.name,
        handle: handle || null,
        src: file,                       // kept for the saved scene (handle-less textures)
        blobSaved: false,
        thumb: makeThumb(img),
        cols, rows, totalFrames: saved ? saved.totalFrames : cols * rows,
        channel: saved ? saved.channel : 'all',
        tint: saved ? saved.tint : state.lastTint,
        tintAmount: saved ? saved.tintAmount : state.lastTintAmount,
        proc: null, procCtx: null, procKey: null,
        chan: null, chanCtx: null, chanKey: null
    };
}

/** Show the loaded-state UI (first texture in). */
function enterLoaded(){
    state.isLoaded = true;
    ui.emptyState.classList.add('hidden');
    ui.stats.classList.remove('hidden');
    ui.timeline.classList.add('show');
    ui.stage.classList.add('loaded');
    gated.forEach(s => s.classList.remove('disabled'));
    ['reimport', 'play', 'fit', 'clear'].forEach(id => setAction(id, { disabled: false }));
    resizeCanvas();   // after the timeline has taken its height, not before
}
function leaveLoaded(){
    state.isLoaded = false;
    ui.emptyState.classList.remove('hidden');
    ui.stats.classList.add('hidden');
    ui.timeline.classList.remove('show');
    ui.stage.classList.remove('loaded');
    gated.forEach(s => s.classList.add('disabled'));
    ['reimport', 'play', 'fit', 'clear'].forEach(id => setAction(id, { disabled: true }));
    Embed.status('');
}

/** Lay new instances out side by side (rows of up to 4, then a square-ish block) around (cx, cy). */
function layoutBatch(insts, cx, cy){
    const n = insts.length;
    if (n === 1) { insts[0].x = cx; insts[0].y = cy; return; }
    const perRow = n <= 4 ? n : Math.ceil(Math.sqrt(n));
    const rows = [];
    for (let i = 0; i < n; i += perRow) rows.push(insts.slice(i, i + perRow));
    const dims = rows.map(r => {
        const sizes = r.map(i => instSize(i));
        return { sizes,
                 w: sizes.reduce((a, s) => a + s.w, 0) + BATCH_GAP * (r.length - 1),
                 h: Math.max(...sizes.map(s => s.h)) };
    });
    const totalH = dims.reduce((a, d) => a + d.h, 0) + BATCH_GAP * (rows.length - 1);
    let y = cy - totalH / 2;
    rows.forEach((r, ri) => {
        let x = cx - dims[ri].w / 2;
        r.forEach((inst, i) => {
            const s = dims[ri].sizes[i];
            inst.x = x + s.w / 2;
            inst.y = y + dims[ri].h / 2;
            x += s.w + BATCH_GAP;
        });
        y += dims[ri].h + BATCH_GAP;
    });
}

/**
 * Add sheets. items = [{file, handle}] (handle: a FileSystemFileHandle, kept so
 * Reimport can pull fresh pixels off disk later without a second dialog).
 * Several at once are laid out next to each other instead of stacked at the origin.
 */
async function addTextureItems(items){
    await bootDone;
    const made = [];
    let tga = 0;
    const bad = [];
    for (const it of items) {
        const f = it && it.file;
        if (!f) continue;
        if (isTga(f)) { tga++; continue; }
        if (!isImage(f)) continue;
        try { made.push(makeTexture(f, await decodeImage(f), it.handle)); }
        catch (err) { bad.push(f.name); }
    }

    const notes = [];
    if (tga) notes.push(tga === 1 ? 'A TGA file was skipped: it cannot be opened here, export the sheet as PNG.'
                                  : tga + ' TGA files were skipped: they cannot be opened here, export them as PNG.');
    if (bad.length) notes.push('Could not read ' + bad.join(', ') + '.');
    if (!made.length) {
        if (notes.length) notify(notes.join(' '), { kind: bad.length ? 'err' : 'warn' });
        return [];
    }

    const first = !state.isLoaded;
    state.absoluteFrame = 0;
    if (first) { enterLoaded(); state.instances = []; resetView(); }
    const c = first ? { x: 0, y: 0 } : s2w(view.w / 2, view.h / 2);

    const insts = [];
    made.forEach(tex => {
        state.textures.push(tex);
        state.activeTexId = tex.id;
        const inst = createInstance(0, 0, false);
        if (inst) insts.push(inst);
    });
    if (insts.length) layoutBatch(insts, c.x, c.y);

    renderTextureStrip();
    loadActiveTextureSettings();
    setSelection(first || !insts.length ? [] : [insts[insts.length - 1]]);
    updateRanges();
    updateStats();
    if (made.length > 1) fitView(); else if (first) resetView();
    if (!state.isPlaying && first) setPlaying(true);
    invalidate();
    if (notes.length) notify(notes.join(' '), { kind: 'warn' });
    return made;
}
const handleTextureFile = (file, handle) => addTextureItems([{ file, handle }]);

function removeTexture(id){
    state.textures = state.textures.filter(t => t.id !== id);
    state.instances = state.instances.filter(i => i.texId !== id);
    setSelection(state.selection.filter(i => state.instances.includes(i)));
    if (state.activeTexId === id) state.activeTexId = state.textures.length ? state.textures[0].id : null;

    if (!state.textures.length) leaveLoaded();
    else loadActiveTextureSettings();
    renderTextureStrip();
    updateStats();
    invalidate();
}

/* ------------------------------------------------------------
   Reimport

   A texture is a live link to a file, not a snapshot: re-export the
   sheet from Photoshop / Blender / Substance, hit Reimport, and every
   instance already on the canvas picks up the new pixels while keeping
   its grid, channel, tint, transform and animation offset.

   When the browser gives us a FileSystemFileHandle (Chrome / Edge, via
   the file picker or drag & drop) the reload is silent. Otherwise we
   fall back to asking for the file once and remembering the handle if
   one comes back.
   ------------------------------------------------------------ */
function flashThumb(id){
    const e = ui.texThumbs.querySelector(`[data-texid="${id}"]`);
    if (!e) return;
    e.classList.remove('flash');
    void e.offsetWidth;      // restart the animation
    e.classList.add('flash');
}

/** Swap fresh pixels into a texture already in the scene. Everything else survives. */
async function applyReloadedFile(tex, file){
    const img = await decodeImage(file);
    tex.img = img;
    tex.name = file.name;
    tex.src = file;
    tex.blobSaved = false;   // a handle-less texture saves its new bytes with the scene
    tex.thumb = makeThumb(img);
    tex.procKey = null;      // both caches were built from the old pixels
    tex.chanKey = null;
    renderTextureStrip();
    if (tex.id === state.activeTexId) loadActiveTextureSettings();
    updateStats();
    invalidate();
}

/** Read a handle. `interactive` may raise a permission prompt, so it needs a gesture. */
async function fileFromHandle(handle, interactive = true){
    if (handle.queryPermission) {
        let perm = await handle.queryPermission({ mode: 'read' });
        if (perm !== 'granted' && interactive) perm = await handle.requestPermission({ mode: 'read' });
        if (perm !== 'granted') return null;
    }
    return handle.getFile();
}

/** Manual file dialog — the fallback when there is no handle to re-read. */
function pickFiles(multiple){
    return new Promise(resolve => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.multiple = !!multiple;
        inp.addEventListener('change',  () => resolve(Array.from(inp.files)), { once: true });
        inp.addEventListener('cancel',  () => resolve([]), { once: true });
        inp.click();
    });
}

/**
 * @param tex     texture to refresh
 * @param silent  true inside "Reimport all" — skip anything that would pop a dialog
 * @returns       true if the texture actually got new pixels
 */
async function reimportTexture(tex, silent){
    let file = null;

    if (tex.handle) {
        try { file = await fileFromHandle(tex.handle); }
        catch (err) { file = null; }   // moved, renamed or deleted — ask below
    }

    if (!file && !silent) {
        if (window.showOpenFilePicker) {
            try {
                const [h] = await window.showOpenFilePicker({ multiple: false });
                tex.handle = h;                       // silent from here on
                file = await h.getFile();
            } catch (err) {
                if (err && err.name === 'AbortError') return false;
            }
        }
        if (!file) file = (await pickFiles(false))[0] || null;
    }

    if (!file) return false;
    try { await applyReloadedFile(tex, file); }
    catch (err) { notify(`Could not read ${file.name}.`, { kind: 'err' }); return false; }
    flashThumb(tex.id);
    return true;
}

async function reimportAll(){
    if (!state.textures.length) { notify('No textures to reload.'); return; }

    let done = 0;
    const manual = [];
    for (const tex of state.textures.slice()) {
        if (!state.textures.includes(tex)) continue;          // removed mid-loop
        if (await reimportTexture(tex, true)) done++;
        else manual.push(tex);
    }

    // Nothing could be re-read on its own (no handles — Firefox, or the page
    // was opened in a way that blocks the API): let one dialog cover them all
    // and match what comes back by filename.
    if (!done && manual.length) {
        const files = await pickFiles(true);
        for (const f of files) {
            const tex = manual.length === 1 && files.length === 1
                ? manual[0]
                : manual.find(t => t.name === f.name);
            if (!tex) continue;
            try { await applyReloadedFile(tex, f); flashThumb(tex.id); done++; manual.splice(manual.indexOf(tex), 1); }
            catch (err) { /* skip unreadable file */ }
        }
    }

    const time = new Date().toLocaleTimeString();
    if (!done) notify('Nothing reloaded.');
    else notify(`Reloaded ${done} texture${done > 1 ? 's' : ''} at ${time}` +
        (manual.length ? `. ${manual.length} need the reload button on the thumbnail.` : '.'));
}

/** Add texture — prefer the picker that hands back handles. */
async function addTextures(){
    if (window.showOpenFilePicker) {
        try {
            const handles = await window.showOpenFilePicker({
                multiple: true,
                types: [{ description: 'Images', accept: { 'image/*': ['.png','.jpg','.jpeg','.webp','.gif','.bmp'] } }]
            });
            const items = [];
            for (const h of handles) items.push({ file: await h.getFile(), handle: h });
            await addTextureItems(items);
            return;
        } catch (err) {
            if (err && err.name === 'AbortError') return;      // cancelled
            // unsupported or blocked — plain input below, reimport still works
            // through its own dialog.
        }
    }
    ui.fileInput.click();
}

function renderTextureStrip(){
    const box = ui.texThumbs;
    box.textContent = '';
    state.textures.forEach(tex => {
        // a tile holds three real buttons: pick (the picture), reimport and remove (corners, on hover or focus)
        const tile = document.createElement('div');
        tile.className = 'thumb' + (tex.id === state.activeTexId ? ' on' : '');
        tile.dataset.texid = tex.id;

        const pick = document.createElement('button');
        pick.type = 'button';
        pick.className = 'pick';
        pick.title = tex.name + (tex.handle ? '' : '  (reimport will ask for the file)');
        pick.setAttribute('aria-label', tex.name);
        pick.setAttribute('aria-pressed', tex.id === state.activeTexId ? 'true' : 'false');
        pick.addEventListener('click', () => {
            state.activeTexId = tex.id;
            renderTextureStrip();
            loadActiveTextureSettings();
            invalidate();
        });
        const img = document.createElement('img');
        img.alt = '';
        img.src = tex.thumb;
        pick.appendChild(img);
        tile.appendChild(pick);

        if (tintActive(tex)) {
            const dot = document.createElement('span');
            dot.className = 'tintdot';
            dot.style.background = tex.tint;
            dot.title = `Tint ${tex.tint} @ ${Math.round(tex.tintAmount * 100)}%`;
            tile.appendChild(dot);
        }

        const mini = (cls, title, icon, fn) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'mini ' + cls;
            b.title = title;
            b.setAttribute('aria-label', title);
            b.appendChild(Kit.icon(icon));
            b.addEventListener('click', fn);
            tile.appendChild(b);
        };
        mini('re', 'Reimport this texture from disk', 'reset', async () => {
            if (await reimportTexture(tex, false)) notify(`Reloaded ${tex.name} at ${new Date().toLocaleTimeString()}.`);
        });
        mini('x', 'Remove texture and its instances', 'close', () => removeTexture(tex.id));

        box.appendChild(tile);
    });

    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'thumb add';
    add.title = 'Add texture';
    add.setAttribute('aria-label', 'Add texture');
    add.appendChild(Kit.icon('plus'));
    add.addEventListener('click', addTextures);
    box.appendChild(add);
}

function loadActiveTextureSettings(){
    const tex = activeTex();
    if (!tex) return;
    ui.statFilename.textContent = tex.name;
    ui.statSrcRes.textContent   = `${tex.img.width}×${tex.img.height}`;
    if (ui.texRows) ui.texRows.sync();
    updateRanges();
}

/* ============================================================
   Texture library

   Folders you import from, remembered between sessions.

   Chrome and Edge hand back a real directory handle, and a handle survives
   a structured clone — so it goes into IndexedDB and comes back when the
   page reopens. The browser still will not grant read access without a
   gesture, so a remembered folder shows Connect: one click and the sheets
   are listed again. Elsewhere the folder is picked with a plain directory
   input; the tick list is still remembered, only the link to the folder
   has to be drawn again each session.
   ============================================================ */
let library = [];
const libMode = typeof window.showDirectoryPicker === 'function' ? 'native' : 'fallback';
let libPersist = 'none';        // 'idb' | 'ls' | 'none'
let libStatusTimer = 0;

function normalizeEntry(r){
    return {
        id: r.id, name: r.name || 'Folder',
        handle: r.handle || null,
        picks: Array.isArray(r.picks) ? r.picks.slice() : [],
        auto: !!r.auto,
        files: null, expanded: false, error: ''
    };
}

async function loadLibrary(){
    try {
        const recs = await dbDo(LIB_STORE, 'readonly', s => s.getAll());
        libPersist = 'idb';
        return (recs || []).map(normalizeEntry);
    } catch (err) { /* no IndexedDB here — plain metadata below */ }

    try {
        const raw = localStorage.getItem(LIB_KEY);
        libPersist = 'ls';
        return raw ? JSON.parse(raw).map(normalizeEntry) : [];
    } catch (err) { libPersist = 'none'; return []; }
}

async function saveLibrary(){
    const recs = library.map(e => ({ id:e.id, name:e.name, handle:e.handle || null, picks:e.picks.slice(), auto:!!e.auto }));
    try {
        const db = await idb();
        await new Promise((resolve, reject) => {
            const tx = db.transaction(LIB_STORE, 'readwrite');
            const st = tx.objectStore(LIB_STORE);
            st.clear();
            recs.forEach(r => st.put(r));
            tx.oncomplete = () => { resolve(); db.close(); };
            tx.onerror    = () => { reject(tx.error); db.close(); };
        });
        libPersist = 'idb';
        return;
    } catch (err) { /* fall back to metadata only */ }

    try {
        // a handle cannot be stringified, so this keeps the ticks and nothing else
        localStorage.setItem(LIB_KEY, JSON.stringify(recs.map(r => ({ id:r.id, name:r.name, picks:r.picks, auto:r.auto }))));
        libPersist = 'ls';
    } catch (err) { libPersist = 'none'; }
}

/** Read the folder's image list. `allowPrompt` can raise a permission dialog, so it needs a gesture. */
async function refreshFolder(entry, allowPrompt){
    if (!entry.handle) return !!entry.files;
    try {
        let perm = await entry.handle.queryPermission({ mode:'read' });
        if (perm !== 'granted' && allowPrompt) perm = await entry.handle.requestPermission({ mode:'read' });
        if (perm !== 'granted') { entry.files = null; return false; }

        const files = [];
        for await (const [name, h] of entry.handle.entries()) {
            if (h.kind === 'file' && IMAGE_RE.test(name)) files.push({ name, handle: h });
        }
        files.sort((a, b) => a.name.localeCompare(b.name));
        entry.files = files;
        entry.error = '';
        return true;
    } catch (err) {
        entry.files = null;
        entry.error = 'unavailable';
        return false;
    }
}

/** Plain directory input — one session's worth of link, but it works anywhere. */
function pickDirectory(){
    return new Promise(resolve => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.webkitdirectory = true;
        inp.multiple = true;
        inp.addEventListener('change', () => resolve(Array.from(inp.files)), { once:true });
        inp.addEventListener('cancel', () => resolve([]), { once:true });
        inp.click();
    });
}

function attachPickedDirectory(entry, files){
    const inside = f => {
        const rel = f.webkitRelativePath || f.name;
        return rel.includes('/') ? rel.split('/').slice(1).join('/') : rel;
    };
    entry.files = files.filter(f => IMAGE_RE.test(f.name))
                       .map(f => ({ name: inside(f), file: f }))
                       .sort((a, b) => a.name.localeCompare(b.name));
    entry.error = '';
    const root = (files[0].webkitRelativePath || '').split('/')[0];
    if (root) entry.name = root;
}

async function addFolder(){
    if (window.showDirectoryPicker) {
        try {
            const handle = await window.showDirectoryPicker({ mode: 'read' });
            const entry = normalizeEntry({ id: Date.now() + Math.random(), name: handle.name, handle });
            library.push(entry);
            entry.expanded = true;
            await refreshFolder(entry, true);
            entry.picks = (entry.files || []).map(f => f.name);   // a new folder starts fully ticked
            await saveLibrary();
            renderLibrary();
            return;
        } catch (err) {
            if (err && err.name === 'AbortError') return;
            // unsupported or blocked here — plain directory input below
        }
    }

    const files = await pickDirectory();
    if (!files.length) return;
    const entry = normalizeEntry({ id: Date.now() + Math.random(), name: 'Folder' });
    attachPickedDirectory(entry, files);
    entry.picks = entry.files.map(f => f.name);
    entry.expanded = true;
    library.push(entry);
    await saveLibrary();
    renderLibrary();
}

/** Load the ticked sheets of a folder. `skip` names are left out (already in the scene). */
async function importFolder(entry, skip){
    if (!entry.files && !(await refreshFolder(entry, true))) { renderLibrary(); return; }

    const wanted = entry.files.filter(f => entry.picks.includes(f.name) && !(skip && skip.has(f.name)));
    if (!wanted.length) { if (!skip) setLibStatus('Nothing ticked in ' + entry.name + '.'); return; }

    const items = [];
    for (const f of wanted) {
        const file = f.handle ? await f.handle.getFile() : f.file;
        items.push({ file, handle: f.handle || null });   // the handle travels along, so Reimport works
    }
    await addTextureItems(items);
    setLibStatus(`Imported ${wanted.length} sheet${wanted.length > 1 ? 's' : ''} from ${entry.name}.`);
}

function togglePick(entry, name, on){
    const i = entry.picks.indexOf(name);
    if (on && i < 0) entry.picks.push(name);
    if (!on && i > -1) entry.picks.splice(i, 1);
    saveLibrary();
}

function libBtn(label, title, fn, icon){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sm' + (icon ? ' ibtn' : '');
    if (icon) { b.appendChild(Kit.icon(icon)); b.setAttribute('aria-label', title); }
    else b.textContent = label;
    if (title) b.title = title;
    b.addEventListener('click', fn);
    return b;
}

function folderRow(entry){
    const box = document.createElement('div');
    box.className = 'libfolder' + (entry.files ? '' : ' stale');

    const head = document.createElement('div');
    head.className = 'libhead';

    const name = document.createElement('button');
    name.type = 'button';
    name.className = 'libname';
    name.appendChild(Kit.icon(entry.expanded ? 'chevd' : 'chevr'));
    name.appendChild(el('span', '', entry.name));
    name.title = entry.name;
    name.setAttribute('aria-expanded', entry.expanded ? 'true' : 'false');
    name.addEventListener('click', async () => {
        entry.expanded = !entry.expanded;
        if (entry.expanded && !entry.files) await refreshFolder(entry, true);
        renderLibrary();
    });
    head.appendChild(name);

    const count = document.createElement('span');
    count.className = 'libcount';
    head.appendChild(count);

    // ticking a box only moves the counter — rebuilding the row would throw away
    // the scroll position of a long file list under the pointer
    const syncCount = () => {
        count.textContent = entry.files ? `${entry.picks.length}/${entry.files.length}`
                                        : (entry.error || 'not connected');
    };
    syncCount();

    head.appendChild(libBtn('', 'Forget this folder (nothing on disk is touched)', async () => {
        library = library.filter(e => e !== entry);
        await saveLibrary();
        renderLibrary();
    }, 'close'));
    box.appendChild(head);

    if (!entry.expanded) return box;

    if (entry.files) {
        const list = document.createElement('div');
        list.className = 'libfiles';
        entry.files.forEach(f => {
            const row = document.createElement('label');
            row.className = 'libfile';
            row.title = f.name;
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = entry.picks.includes(f.name);
            cb.addEventListener('change', () => { togglePick(entry, f.name, cb.checked); syncCount(); });
            const label = document.createElement('span');
            label.textContent = f.name;
            row.appendChild(cb);
            row.appendChild(label);
            list.appendChild(row);
        });
        box.appendChild(list);
    }

    const bar = document.createElement('div');
    bar.className = 'libbar';
    if (entry.files) {
        const setAll = on => {
            entry.picks = on ? entry.files.map(f => f.name) : [];
            box.querySelectorAll('.libfile input').forEach(cb => { cb.checked = on; });
            saveLibrary();
            syncCount();
        };
        bar.appendChild(libBtn('All',  'Tick every sheet',   () => setAll(true)));
        bar.appendChild(libBtn('None', 'Untick every sheet', () => setAll(false)));
        bar.appendChild(libBtn('Import', 'Load the ticked sheets as textures', () => importFolder(entry)));
    } else {
        bar.appendChild(libBtn(entry.handle ? 'Connect' : 'Relink folder',
            'Give the page read access to this folder again', async () => {
                if (entry.handle) await refreshFolder(entry, true);
                else {
                    const files = await pickDirectory();
                    if (files.length) { attachPickedDirectory(entry, files); await saveLibrary(); }
                }
                renderLibrary();
            }));
    }
    box.appendChild(bar);

    const auto = document.createElement('label');
    auto.className = 'chk libauto';
    const acb = document.createElement('input');
    acb.type = 'checkbox';
    acb.checked = !!entry.auto;
    acb.addEventListener('change', () => { entry.auto = acb.checked; saveLibrary(); });
    auto.appendChild(acb);
    auto.appendChild(document.createTextNode('Load ticked sheets when the page opens'));
    box.appendChild(auto);

    return box;
}

function updateLibStatus(){
    const n = library.length;
    const where = libPersist === 'idb' ? 'remembered in this browser'
                : libPersist === 'ls'  ? 'ticks remembered, folder link is not'
                :                        'nothing can be saved: this browser blocks local storage here';
    const how = libMode === 'native'
        ? 'Reopen the page and click Connect once to allow reading again.'
        : 'This browser cannot keep a folder link, so pick the folder again each session.';
    ui.libStatus.textContent = `${n} folder${n === 1 ? '' : 's'}, ${where}. ${how}`;
}

function setLibStatus(msg){
    ui.libStatus.textContent = msg;
    clearTimeout(libStatusTimer);
    libStatusTimer = setTimeout(updateLibStatus, 7000);
}

function renderLibrary(){
    ui.libList.textContent = '';
    if (!library.length) {
        ui.libList.appendChild(el('div', 'hint', 'No folders saved'));
    } else {
        library.forEach(entry => ui.libList.appendChild(folderRow(entry)));
    }
    updateLibStatus();
}

async function initLibrary(){
    library = await loadLibrary();
    renderLibrary();

    // sheets already in the scene (restored a moment ago) are not loaded twice
    const have = new Set(state.textures.map(t => t.name));
    for (const entry of library) {
        // a permission prompt needs a gesture, so only folders the browser still
        // trusts can come back on their own; the rest wait behind Connect.
        if (entry.auto && !pendingScene && entry.handle && await refreshFolder(entry, false)) await importFolder(entry, have);
    }
    renderLibrary();

    if (library.some(e => e.auto && !e.files)) {
        ui.librarySec.toggle(true);
        setLibStatus('A folder is set to load on startup. Click Connect to allow reading.');
    }
}

/* ============================================================
   Instances
   ============================================================ */
function createInstance(x, y, isAuto){
    const tex = activeTex();
    if (!tex) return null;

    const lo = state.baseScale * (1 - state.randScaleAmt);
    const hi = state.baseScale * (1 + state.randScaleAmt);
    const s  = clamp(lo + Math.random() * (hi - lo), MIN_SCALE, MAX_SCALE);
    const rot = state.randRot ? Math.random() * Math.PI * 2 : 0;
    const life = isAuto ? state.emitLifetime * (0.8 + Math.random() * 0.4) : Infinity;

    // Phase: random, or aligned so a freshly placed sprite starts at frame 0.
    let phase = 0;
    if (state.randPhase) {
        phase = Math.random();
    } else if (!isAuto && state.manualDuration === 0) {
        const cur = state.absoluteFrame % tex.totalFrames;
        phase = (tex.totalFrames - cur) / tex.totalFrames;
        if (phase >= 1) phase = 0;
    }

    const inst = {
        texId: tex.id,
        x, y,
        scaleX: s, scaleY: s,
        rotation: rot,
        flipX: false, flipY: false,
        timeOffset: phase,
        age: 0,
        lifespan: life,
        animDuration: isAuto ? life : state.manualDuration,
        loop: isAuto ? false : state.manualLoop
    };
    state.instances.push(inst);
    updateStats();
    invalidate();
    return inst;
}

function instCorners(inst){
    const { w, h } = instSize(inst);
    const c = Math.cos(inst.rotation), s = Math.sin(inst.rotation);
    const hw = w / 2, hh = h / 2;
    return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([lx,ly]) => ({
        x: inst.x + lx * c - ly * s,
        y: inst.y + lx * s + ly * c
    }));
}

function pointInInstance(wx, wy, inst){
    const { w, h } = instSize(inst);
    if (w <= 0 || h <= 0) return false;
    const l = toLocal(inst, wx, wy);
    // tiny sprites still need a grabbable body
    const padX = Math.max(0, 6 / state.scale - w / 2);
    const padY = Math.max(0, 6 / state.scale - h / 2);
    return Math.abs(l.x) <= w / 2 + padX && Math.abs(l.y) <= h / 2 + padY;
}

function instanceAt(wx, wy){
    for (let i = state.selection.length - 1; i >= 0; i--)
        if (pointInInstance(wx, wy, state.selection[i])) return state.selection[i];
    for (let i = state.instances.length - 1; i >= 0; i--)
        if (pointInInstance(wx, wy, state.instances[i])) return state.instances[i];
    return null;
}

function setSelection(list){
    state.selection = list;
    syncSelectionPanel();
    invalidate();
}

/* ============================================================
   Gizmo — everything below works in SCREEN space, so handles keep
   a constant, comfortable size no matter the zoom or sprite size.
   ============================================================ */

/** Gizmo frame: centre + half-extents (screen px) + rotation. */
function getGizmo(){
    const sel = state.selection;
    if (!sel.length) return null;

    let cx, cy, hwS, hhS, rot, trueHwS, trueHhS;

    if (sel.length === 1) {
        const inst = sel[0];
        const { w, h } = instSize(inst);
        cx = inst.x; cy = inst.y; rot = inst.rotation;
        trueHwS = (w / 2) * state.scale;
        trueHhS = (h / 2) * state.scale;
    } else {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        sel.forEach(inst => instCorners(inst).forEach(p => {
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        }));
        cx = (minX + maxX) / 2; cy = (minY + maxY) / 2; rot = 0;
        trueHwS = ((maxX - minX) / 2) * state.scale;
        trueHhS = ((maxY - minY) / 2) * state.scale;
    }

    hwS = Math.max(trueHwS, MIN_GIZMO_HALF);
    hhS = Math.max(trueHhS, MIN_GIZMO_HALF);

    const c = w2s(cx, cy);
    return {
        multi: sel.length > 1,
        worldX: cx, worldY: cy,
        sx: c.x, sy: c.y,
        hw: hwS, hh: hhS,
        trueHw: trueHwS, trueHh: trueHhS,
        padded: hwS > trueHwS + 0.5 || hhS > trueHhS + 0.5,
        rot,
        ax: { x: Math.cos(rot),  y: Math.sin(rot) },   // screen dir of local +X
        ay: { x: -Math.sin(rot), y: Math.cos(rot) }    // screen dir of local +Y
    };
}

/** Screen position of a handle given unit coords (-1..1). */
function gizmoPoint(g, ux, uy, outward = 0){
    let x = g.sx + g.ax.x * (ux * g.hw) + g.ay.x * (uy * g.hh);
    let y = g.sy + g.ax.y * (ux * g.hw) + g.ay.y * (uy * g.hh);
    if (outward) {
        x += g.ay.x * outward;
        y += g.ay.y * outward;
    }
    return { x, y };
}

const HANDLES = [
    { ux:-1, uy:-1, type:'corner' }, { ux: 1, uy:-1, type:'corner' },
    { ux: 1, uy: 1, type:'corner' }, { ux:-1, uy: 1, type:'corner' },
    { ux: 0, uy:-1, type:'edgeY'  }, { ux: 0, uy: 1, type:'edgeY'  },
    { ux: 1, uy: 0, type:'edgeX'  }, { ux:-1, uy: 0, type:'edgeX'  }
];

/**
 * Returns the handle under the pointer, or null.
 *
 * The middle of the frame is reserved outright — a hit radius four times the
 * drawn handle blankets a small gizmo otherwise, and then there is nowhere left
 * to grab the sprite itself. Past the core the nearest handle wins: corners
 * carry a small bias so they beat the edges they sit next to, and rotation
 * competes on distance like everything else instead of swallowing the top edge
 * whenever it is anywhere near.
 */
function hitTestGizmo(sx, sy, touch, radius){
    const g = getGizmo();
    if (!g) return null;
    if (pointInGizmo(g, sx, sy, GIZMO_CORE)) return null;

    const R = (radius || HANDLE_HIT) * (touch ? TOUCH_MULT : 1);

    let best = null, bestD = Infinity;
    const consider = (h, p, bias) => {
        const d = Math.hypot(sx - p.x, sy - p.y);
        if (d <= R && d - bias < bestD) {
            best = { type:h.type, ux:h.ux, uy:h.uy, g };
            bestD = d - bias;
        }
    };

    consider({ type:'rotate', ux:0, uy:-1 }, gizmoPoint(g, 0, -1, -ROT_OFFSET), 0);
    for (const h of HANDLES) consider(h, gizmoPoint(g, h.ux, h.uy), h.type === 'corner' ? 4 : 0);
    return best;
}

/** Is a screen point inside the gizmo frame, scaled by `k` (1 = the frame itself)? */
function pointInGizmo(g, sx, sy, k){
    const f = k || 1;
    const dx = sx - g.sx, dy = sy - g.sy;
    const lx = dx * g.ax.x + dy * g.ax.y;   // ax / ay are unit vectors
    const ly = dx * g.ay.x + dy * g.ay.y;
    return Math.abs(lx) <= g.hw * f && Math.abs(ly) <= g.hh * f;
}

/**
 * What a press at this point would act on — the single answer both the hover
 * feedback and the actual press go through, so the cursor can never promise a
 * scale that the click then turns into a move.
 *
 * @returns {kind:'handle', h} | {kind:'move'} | {kind:'body', inst} | null
 */
function pickTarget(p, w, touch){
    const g = state.selection.length ? getGizmo() : null;

    if (g) {
        const h = hitTestGizmo(p.x, p.y, touch);
        if (h) return { kind:'handle', h };
        // the rest of a padded frame moves the sprite rather than deselecting it
        if (g.padded && pointInGizmo(g, p.x, p.y)) return { kind:'move' };
    }

    const inst = instanceAt(w.x, w.y);
    if (inst) return { kind:'body', inst };

    // nothing under the pointer: a near miss on a handle is far more likely to
    // be what was meant than a click on empty space, so widen and retry before
    // throwing the selection away.
    if (g) {
        const far = hitTestGizmo(p.x, p.y, touch, HANDLE_HIT_FAR);
        if (far) return { kind:'handle', h: far };
    }
    return null;
}

/** CSS cursor matching the screen-space direction of a handle. */
function cursorForHandle(h){
    if (h.type === 'rotate') return 'grab';
    const g = h.g;
    const dx = g.ax.x * h.ux * g.hw + g.ay.x * h.uy * g.hh;
    const dy = g.ax.y * h.ux * g.hw + g.ay.y * h.uy * g.hh;
    let a = Math.atan2(dy, dx) * 180 / Math.PI;
    if (a < 0) a += 180;
    if (a < 22.5 || a >= 157.5) return 'ew-resize';
    if (a < 67.5)  return 'nwse-resize';
    if (a < 112.5) return 'ns-resize';
    return 'nesw-resize';
}

/* ============================================================
   Pointer interaction (mouse / pen / touch unified)
   ============================================================ */
function setTool(tool){
    state.tool = tool;
    ui.toolPan.classList.toggle('on', tool === 'pan');
    ui.toolSelect.classList.toggle('on', tool === 'select');
    ui.toolScatter.classList.toggle('on', tool === 'scatter');
    if (tool !== 'select') { setSelection([]); state.hovered = null; }
    applyCursor();
    invalidate();
}

let lastCursor = null;
function applyCursor(cursorOverride){
    let c = cursorOverride;
    if (!c) {
        if (drag.kind === 'pan')            c = 'grabbing';
        else if (state.spaceDown)           c = 'grab';
        else if (state.tool === 'pan')      c = 'grab';
        else if (state.tool === 'scatter')  c = 'crosshair';
        else                                c = 'default';
    }
    if (c === lastCursor) return;
    lastCursor = c;
    wrapper.style.cursor = c;
}

function snapshotSelection(){
    drag.snapshot = state.selection.map(i => ({
        inst: i, x: i.x, y: i.y, sx: i.scaleX, sy: i.scaleY, rot: i.rotation
    }));
}

wrapper.addEventListener('pointerdown', e => {
    // A primary press always starts a fresh gesture. Without this, a pointerup
    // that never arrived (released off-window, cancelled by the OS) would leave a
    // stale id behind and the next press would be mistaken for a second finger.
    if (e.isPrimary) pointers.clear();
    pointers.set(e.pointerId, pointerPos(e));

    if (pointers.size === 2) { cancelDrag(); beginPinch(); return; }
    if (pointers.size > 2 || !state.isLoaded) return;

    const touch = e.pointerType === 'touch';
    const p = pointerPos(e);
    const w = s2w(p.x, p.y);
    try { wrapper.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }

    // --- pan: middle button, space, or the pan tool
    if (e.button === 1 || state.spaceDown || state.tool === 'pan') {
        if (state.spaceDown) state.spacePanned = true;   // this press was a pan, not a play toggle
        drag.kind = 'pan';
        drag.pointerId = e.pointerId;
        drag.startScreen = p;
        drag.startOffset = { x: state.offsetX, y: state.offsetY };
        applyCursor();
        e.preventDefault();
        return;
    }
    if (e.button !== 0) return;

    if (state.tool === 'select') {
        const ctrl = e.ctrlKey || e.metaKey;

        const beginHandle = h => {
            drag.pointerId = e.pointerId;
            drag.touch = touch;
            drag.handle = h;
            drag.startScreen = p;
            drag.startWorld = w;
            drag.pivot = { x: h.g.worldX, y: h.g.worldY };
            snapshotSelection();

            if (h.type === 'rotate') {
                drag.kind = 'rotate';
                drag.startAngle = Math.atan2(w.y - drag.pivot.y, w.x - drag.pivot.x);
            } else {
                drag.kind = 'scale';
                drag.startLocal = state.selection.length === 1
                    ? toLocal(state.selection[0], w.x, w.y)
                    : { x: w.x - drag.pivot.x, y: w.y - drag.pivot.y };
            }
            applyCursor(cursorForHandle(h));
        };

        const beginMove = () => {
            drag.kind = 'move';
            drag.pointerId = e.pointerId;
            drag.startWorld = w;
            snapshotSelection();
            applyCursor('move');
        };

        // ctrl-click is always about editing the selection set, never the handles
        if (ctrl) {
            const pick = instanceAt(w.x, w.y);
            if (pick) {
                const i = state.selection.indexOf(pick);
                const next = state.selection.slice();
                if (i > -1) next.splice(i, 1); else next.push(pick);
                setSelection(next);
                return;
            }
        }

        const target = pickTarget(p, w, touch);

        if (target && target.kind === 'handle') { beginHandle(target.h); return; }
        if (target && target.kind === 'move' && !ctrl) { beginMove(); return; }
        if (target && target.kind === 'body') {
            if (!state.selection.includes(target.inst)) setSelection([target.inst]);
            else syncSelectionPanel();
            beginMove();
            return;
        }

        // empty space -> marquee
        if (!ctrl) setSelection([]);
        drag.kind = 'marquee';
        drag.pointerId = e.pointerId;
        drag.startWorld = w;
        drag.marquee = { x0: w.x, y0: w.y, x1: w.x, y1: w.y, add: ctrl };
        invalidate();
        return;
    }

    if (state.tool === 'scatter') {
        const inst = createInstance(w.x, w.y, false);
        if (!inst) return;
        drag.kind = 'spawn';
        drag.pointerId = e.pointerId;
        drag.spawnInst = inst;
        drag.startWorld = w;
        setSelection([inst]);
    }
});

window.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, pointerPos(e));
    if (pointers.size >= 2) { updatePinch(); return; }

    const p = pointerPos(e);
    const w = s2w(p.x, p.y);

    // hover feedback when idle
    if (!drag.kind) {
        if (state.tool === 'select' && !state.spaceDown && state.isLoaded) {
            // same resolver as the press, so what lights up is what you get
            const t = pickTarget(p, w, e.pointerType === 'touch');

            const key = t && t.kind === 'handle' ? t.h.type + t.h.ux + t.h.uy : null;
            if (state.hoveredHandle !== key) { state.hoveredHandle = key; state.dirty = true; }

            const body = t && t.kind === 'body' ? t.inst : null;
            if (state.hovered !== body) { state.hovered = body; state.dirty = true; }

            if (t && t.kind === 'handle')    applyCursor(cursorForHandle(t.h));
            else if (t && t.kind === 'move') applyCursor('move');
            else                             applyCursor();
        } else if (state.hovered || state.hoveredHandle) {
            state.hovered = null; state.hoveredHandle = null; state.dirty = true;
        }
        return;
    }

    if (drag.pointerId !== e.pointerId) return;

    switch (drag.kind) {
        case 'pan':
            state.offsetX = drag.startOffset.x + (p.x - drag.startScreen.x);
            state.offsetY = drag.startOffset.y + (p.y - drag.startScreen.y);
            state.viewFit = false;
            invalidate();
            break;

        case 'move': {
            const dx = w.x - drag.startWorld.x;
            const dy = w.y - drag.startWorld.y;
            drag.snapshot.forEach(s => { s.inst.x = s.x + dx; s.inst.y = s.y + dy; });
            syncSelectionPanel();
            invalidate();
            break;
        }

        case 'scale': doScale(w, e.shiftKey); break;

        case 'rotate': {
            let a = Math.atan2(w.y - drag.pivot.y, w.x - drag.pivot.x) - drag.startAngle;
            if (e.shiftKey) {
                const step = Math.PI / 12;                       // 15°
                const base = drag.snapshot[0] ? drag.snapshot[0].rot : 0;
                a = Math.round((base + a) / step) * step - base;
            }
            const c = Math.cos(a), s = Math.sin(a);
            drag.snapshot.forEach(sn => {
                sn.inst.rotation = sn.rot + a;
                if (drag.handle.g.multi) {
                    const dx = sn.x - drag.pivot.x, dy = sn.y - drag.pivot.y;
                    sn.inst.x = drag.pivot.x + dx * c - dy * s;
                    sn.inst.y = drag.pivot.y + dx * s + dy * c;
                }
            });
            syncSelectionPanel();
            invalidate();
            break;
        }

        case 'marquee':
            drag.marquee.x1 = w.x; drag.marquee.y1 = w.y;
            invalidate();
            break;

        case 'spawn': {
            const dx = w.x - drag.startWorld.x, dy = w.y - drag.startWorld.y;
            if (dx * dx + dy * dy > 4 / (state.scale * state.scale)) {
                drag.spawnInst.rotation = Math.atan2(dy, dx);
                syncSelectionPanel();
                invalidate();
            }
            break;
        }
    }
});

function doScale(w, shift){
    const h = drag.handle;
    const EPS = 1e-6;

    if (!h.g.multi) {
        const inst = state.selection[0];
        const s0 = drag.snapshot[0];
        if (!inst || !s0) return;
        const L  = toLocal(inst, w.x, w.y);
        const L0 = drag.startLocal;

        let rx = Math.abs(L0.x) > EPS ? L.x / L0.x : 1;
        let ry = Math.abs(L0.y) > EPS ? L.y / L0.y : 1;

        if (h.type === 'corner') {
            if (shift) { /* free aspect */ }
            else {
                const d0 = Math.hypot(L0.x, L0.y), d = Math.hypot(L.x, L.y);
                rx = ry = d0 > EPS ? d / d0 : 1;
            }
            inst.scaleX = clamp(s0.sx * rx, MIN_SCALE, MAX_SCALE);
            inst.scaleY = clamp(s0.sy * ry, MIN_SCALE, MAX_SCALE);
        } else if (h.type === 'edgeX') {
            inst.scaleX = clamp(s0.sx * rx, MIN_SCALE, MAX_SCALE);
            if (shift) inst.scaleY = clamp(s0.sy * rx, MIN_SCALE, MAX_SCALE);
        } else {
            inst.scaleY = clamp(s0.sy * ry, MIN_SCALE, MAX_SCALE);
            if (shift) inst.scaleX = clamp(s0.sx * ry, MIN_SCALE, MAX_SCALE);
        }
    } else {
        const L0 = drag.startLocal;
        const L  = { x: w.x - drag.pivot.x, y: w.y - drag.pivot.y };
        let rx = Math.abs(L0.x) > EPS ? L.x / L0.x : 1;
        let ry = Math.abs(L0.y) > EPS ? L.y / L0.y : 1;

        if (h.type === 'corner' && !shift) {
            const d0 = Math.hypot(L0.x, L0.y), d = Math.hypot(L.x, L.y);
            rx = ry = d0 > EPS ? d / d0 : 1;
        } else if (h.type === 'edgeX') { ry = shift ? rx : 1; }
        else if (h.type === 'edgeY')   { rx = shift ? ry : 1; }

        drag.snapshot.forEach(s => {
            s.inst.x = drag.pivot.x + (s.x - drag.pivot.x) * rx;
            s.inst.y = drag.pivot.y + (s.y - drag.pivot.y) * ry;
            s.inst.scaleX = clamp(s.sx * Math.abs(rx), MIN_SCALE, MAX_SCALE);
            s.inst.scaleY = clamp(s.sy * Math.abs(ry), MIN_SCALE, MAX_SCALE);
        });
    }
    syncSelectionPanel();
    invalidate();
}

function endDrag(){
    if (drag.kind === 'marquee' && drag.marquee) {
        const m = drag.marquee;
        const minX = Math.min(m.x0, m.x1), maxX = Math.max(m.x0, m.x1);
        const minY = Math.min(m.y0, m.y1), maxY = Math.max(m.y0, m.y1);
        const inside = state.instances.filter(inst => {
            const pts = instCorners(inst);
            const bx0 = Math.min(...pts.map(p => p.x)), bx1 = Math.max(...pts.map(p => p.x));
            const by0 = Math.min(...pts.map(p => p.y)), by1 = Math.max(...pts.map(p => p.y));
            return bx1 >= minX && bx0 <= maxX && by1 >= minY && by0 <= maxY;
        });
        if (m.add) {
            const next = state.selection.slice();
            inside.forEach(i => { if (!next.includes(i)) next.push(i); });
            setSelection(next);
        } else {
            setSelection(inside);
        }
    }
    drag.kind = null;
    drag.pointerId = null;
    drag.handle = null;
    drag.marquee = null;
    drag.spawnInst = null;
    drag.snapshot = [];
    applyCursor();
    invalidate();
}
function cancelDrag(){
    drag.kind = null; drag.pointerId = null; drag.handle = null;
    drag.marquee = null; drag.spawnInst = null; drag.snapshot = [];
    applyCursor();
}

function onPointerUp(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch.active = false;
    if (drag.pointerId === e.pointerId || drag.kind === 'marquee') endDrag();
}
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
wrapper.addEventListener('lostpointercapture', onPointerUp);

/* Losing focus mid-gesture (alt-tab, OS dialog) would otherwise leave Space or a
   drag latched on, which reads as "the handles stopped responding". */
window.addEventListener('blur', () => {
    pointers.clear();
    pinch.active = false;
    state.spaceDown = false;
    state.spacePanned = false;
    state.shiftDown = false;
    if (drag.kind) cancelDrag();
    applyCursor();
});

/* Pinch zoom */
const pinch = { active:false, dist:0, cx:0, cy:0 };
function twoPointers(){
    const it = pointers.values();
    return [it.next().value, it.next().value];
}
function beginPinch(){
    const [a, b] = twoPointers();
    if (!a || !b) return;
    pinch.active = true;
    pinch.dist = Math.hypot(b.x - a.x, b.y - a.y);
    pinch.cx = (a.x + b.x) / 2;
    pinch.cy = (a.y + b.y) / 2;
}
function updatePinch(){
    if (!pinch.active) return;
    const [a, b] = twoPointers();
    if (!a || !b) return;
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;

    state.offsetX += cx - pinch.cx;
    state.offsetY += cy - pinch.cy;
    if (pinch.dist > 0) zoomBy((dist - pinch.dist) * 0.01, cx, cy);
    state.viewFit = false;

    pinch.dist = dist; pinch.cx = cx; pinch.cy = cy;
    invalidate();
}

wrapper.addEventListener('wheel', e => {
    e.preventDefault();
    const p = pointerPos(e);
    zoomBy(e.deltaY > 0 ? -0.12 : 0.12, p.x, p.y);
}, { passive:false });

wrapper.addEventListener('contextmenu', e => e.preventDefault());

/* ============================================================
   Keyboard
   ============================================================ */
function isTyping(){
    const e = document.activeElement;
    return e && (e.tagName === 'INPUT' || e.tagName === 'SELECT' || e.tagName === 'TEXTAREA');
}

/* A slider, tick box, colour or menu that was just used with the mouse must not keep the
   keyboard: V, B, F, Space and the arrows would silently stop working until a click on the canvas. */
let pointerHeld = false;
document.addEventListener('pointerdown', () => { pointerHeld = true; }, true);
document.addEventListener('pointerup', () => { setTimeout(() => { pointerHeld = false; }, 300); }, true);
document.addEventListener('change', e => {
    const t = e.target;
    if (!pointerHeld || !t || !t.matches || !t.matches('input[type=range],input[type=checkbox],input[type=color],select')) return;
    if (t.classList.contains('val')) return;
    t.blur();
}, true);

window.addEventListener('keydown', e => {
    if (Kit.dialogOpen()) return;
    state.shiftDown = e.shiftKey;

    if (e.code === 'Space' && !isTyping()) {
        // Held down space still pans (and preventDefault keeps it off buttons
        // and the scrollbar); a tap that never panned toggles play on release.
        e.preventDefault();
        if (!state.spaceDown) {
            state.spaceDown = true;
            state.spacePanned = false;
            applyCursor();
        }
        return;
    }
    if (isTyping()) return;

    const ctrl = e.ctrlKey || e.metaKey;

    if (ctrl && !e.shiftKey && !e.altKey && e.code === 'KeyO') { e.preventDefault(); addTextures(); return; }

    if (!ctrl && !e.altKey) {
        if (e.code === 'KeyV') { setTool('select'); return; }
        if (e.code === 'KeyB') { setTool('scatter'); return; }
        if (e.code === 'KeyH') { setTool('pan'); return; }
        if (e.code === 'KeyG') { toggleGrid(); return; }
        if (e.code === 'KeyP') { setPointFilter(!state.nearest); return; }
        if (e.code === 'KeyF') { fitView(); return; }
        if (e.code === 'KeyR') { restartPlayback(); return; }
        if (e.code === 'KeyI') { reimportAll(); return; }
        if (e.code === 'KeyK') { togglePlay(); return; }
        if (e.code === 'Digit0' || e.code === 'Numpad0') { resetView(); return; }
        if (e.code === 'Equal' || e.code === 'NumpadAdd')      { zoomBy(0.15); return; }
        if (e.code === 'Minus' || e.code === 'NumpadSubtract') { zoomBy(-0.15); return; }
        if (e.code === 'Escape') { setSelection([]); return; }
    }

    if (!state.isLoaded) return;

    if (ctrl && e.code === 'KeyA') {
        e.preventDefault();
        setTool('select');
        setSelection(state.instances.slice());
        return;
    }
    if (ctrl && e.code === 'KeyD') { e.preventDefault(); duplicateSelection(); return; }

    if (e.code === 'Delete' || e.code === 'Backspace') { deleteSelection(); return; }

    const arrows = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
    if (arrows[e.code] && state.selection.length) {
        e.preventDefault();
        const step = (e.shiftKey ? 10 : 1) / state.scale;
        const [dx, dy] = arrows[e.code];
        state.selection.forEach(i => { i.x += dx * step; i.y += dy * step; });
        syncSelectionPanel();
        invalidate();
    }
});

window.addEventListener('keyup', e => {
    state.shiftDown = e.shiftKey;
    if (e.code === 'Space') {
        const tapped = state.spaceDown && !state.spacePanned;
        state.spaceDown = false;
        state.spacePanned = false;
        applyCursor();
        if (tapped && !isTyping()) togglePlay();
    }
});

/* ============================================================
   Drag & drop (the kit draws the veil; Shift sends the image to the background)
   ============================================================ */
let dropShift = false;
const dropImageType = f => isImage(f) || isTga(f);

Kit.drop(document.body, {
    accept: dropImageType,
    overlayText: e => {
        dropShift = !!(e && e.shiftKey);
        return dropShift ? 'Release to use the image as the background'
                         : 'Drop sprite sheets (hold Shift to use the image as the background)';
    },
    onFiles: (files, e) => {
        const asBackground = e.shiftKey || dropShift;
        dropShift = false;
        // dataTransfer is emptied as soon as we await, so ask for the file handles
        // synchronously — they are what makes a dropped sheet reimportable later.
        const items = e.dataTransfer && e.dataTransfer.items ? Array.from(e.dataTransfer.items).filter(it => it.kind === 'file') : [];
        const handleOf = new Map();
        items.forEach(it => {
            const f = it.getAsFile();
            if (f && it.getAsFileSystemHandle) { try { handleOf.set(f.name + '|' + f.size, it.getAsFileSystemHandle().catch(() => null)); } catch (err) { /* no handle for this item */ } }
        });
        if (asBackground) { const img = files.filter(isImage)[0]; if (img) loadBackgroundImage(img); return; }
        Promise.all(files.map(async f => {
            const h = await (handleOf.get(f.name + '|' + f.size) || null);
            return { file: f, handle: h && h.kind === 'file' ? h : null };
        })).then(addTextureItems);
    },
    onReject: () => notify('Nothing to add: drop image files (PNG, JPG, WebP, GIF or BMP).')
});

/* ============================================================
   Image processing

   Brightness / contrast / saturation / invert are global and run as
   native canvas filters (GPU) instead of a per-pixel JS loop; the tint
   is per texture and is a multiply pass — so dragging a slider costs a
   couple of blits on that one sheet rather than millions of JS
   iterations. Each texture caches its own processed sheet, so tinting
   one texture never re-processes the others.

   Only channel isolation still needs real pixel access, and that is
   a toggle, not a slider, so it is cached until the channel changes.
   ============================================================ */
function filterString(){
    const f = [];
    if (state.invert)            f.push('invert(1)');
    if (state.saturation !== 1)  f.push(`saturate(${state.saturation})`);
    if (state.contrast !== 1)    f.push(`contrast(${state.contrast})`);
    if (state.brightness !== 1)  f.push(`brightness(${state.brightness})`);
    return f.length ? f.join(' ') : 'none';
}
function tintActive(tex){
    return !!tex && tex.tintAmount > 0 && tex.tint.toLowerCase() !== '#ffffff';
}
function ppActive(tex){
    return filterString() !== 'none' || tintActive(tex);
}

/** Greyscale view of a single channel. Cached — rebuilt only when the channel changes. */
function channelSource(tex){
    if (tex.channel === 'all') return tex.img;
    if (tex.chanKey === tex.channel && tex.chan) return tex.chan;

    if (!tex.chan) {
        tex.chan = document.createElement('canvas');
        tex.chanCtx = tex.chan.getContext('2d', { willReadFrequently:true });
    }
    const W = tex.img.width, H = tex.img.height;
    tex.chan.width = W; tex.chan.height = H;
    tex.chanCtx.clearRect(0, 0, W, H);
    tex.chanCtx.drawImage(tex.img, 0, 0);
    try {
        const data = tex.chanCtx.getImageData(0, 0, W, H);
        const d = data.data;
        const ch = tex.channel;
        for (let i = 0; i < d.length; i += 4) {
            const v = ch === 'r' ? d[i] : ch === 'g' ? d[i+1] : ch === 'b' ? d[i+2] : d[i+3];
            d[i] = d[i+1] = d[i+2] = v;
            d[i+3] = 255;
        }
        tex.chanCtx.putImageData(data, 0, 0);
        tex.chanKey = tex.channel;
    } catch (err) {
        return tex.img;
    }
    return tex.chan;
}

/** Drawable source for a texture — rebuilt only when a setting actually changes. */
function sourceFor(tex){
    const base = channelSource(tex);
    const filter = filterString();
    const tint = tintActive(tex);

    if (filter === 'none' && !tint) { tex.procKey = null; return base; }

    const key = [filter, tex.tint, tex.tintAmount, tex.channel].join('|');
    if (tex.procKey === key && tex.proc) return tex.proc;

    if (!tex.proc) {
        // deliberately NOT willReadFrequently: this canvas is only ever blitted,
        // and that flag would force a slow software backend.
        tex.proc = document.createElement('canvas');
        tex.procCtx = tex.proc.getContext('2d');
    }
    const c = tex.procCtx;
    const W = base.width, H = base.height;
    tex.proc.width = W; tex.proc.height = H;

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, W, H);

    c.filter = filter;
    c.drawImage(base, 0, 0);
    c.filter = 'none';

    if (tint) {
        // multiply the sheet by the tint colour, lerped by the tint amount…
        c.globalCompositeOperation = 'multiply';
        c.globalAlpha = tex.tintAmount;
        c.fillStyle = tex.tint;
        c.fillRect(0, 0, W, H);
        // …then restore the original alpha, which the fill flooded.
        c.globalAlpha = 1;
        c.globalCompositeOperation = 'destination-in';
        c.drawImage(base, 0, 0);
        c.globalCompositeOperation = 'source-over';
    }

    tex.procKey = key;
    return tex.proc;
}

/* ============================================================
   Background
   ============================================================ */
let checkerPattern = null, checkerKey = '';

function getCheckerPattern(){
    const key = state.bg.color;
    if (checkerPattern && checkerKey === key) return checkerPattern;
    const c = document.createElement('canvas');
    c.width = c.height = 40;
    const cc = c.getContext('2d');
    cc.fillStyle = state.bg.color;
    cc.fillRect(0, 0, 40, 40);
    const lum = (hexToRgb(state.bg.color) || {r:0,g:0,b:0});
    const bright = (lum.r + lum.g + lum.b) / 3 > 127;
    cc.fillStyle = shade(state.bg.color, bright ? -0.09 : 0.09);
    cc.fillRect(0, 0, 20, 20);
    cc.fillRect(20, 20, 20, 20);
    checkerPattern = ctx.createPattern(c, 'repeat');
    checkerKey = key;
    return checkerPattern;
}

async function loadBackgroundImage(file){
    if (!file || !isImage(file)) return;
    try {
        const img = await decodeImage(file);
        state.bg.img = img;
        state.bg.file = file;
        state.bg.imgName = file.name;
        state.bg.mode = 'image';
        state.bg.blobSaved = false;
        syncBackgroundUI();
        invalidate();
    } catch (err) {
        notify(`Could not read ${file.name}.`, { kind: 'err' });
    }
}

function drawBackground(){
    const bg = state.bg;
    const W = view.w, H = view.h;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    if (bg.mode === 'checker') {
        ctx.fillStyle = getCheckerPattern();
        ctx.fillRect(0, 0, W, H);
    } else {
        ctx.fillStyle = bg.color;
        ctx.fillRect(0, 0, W, H);
    }

    if (bg.mode === 'image' && bg.img) {
        const iw = bg.img.width, ih = bg.img.height;
        ctx.globalAlpha = bg.opacity;

        if (bg.worldLock) {
            ctx.translate(W / 2 + state.offsetX, H / 2 + state.offsetY);
            ctx.scale(state.scale * bg.scale, state.scale * bg.scale);
            ctx.drawImage(bg.img, -iw / 2, -ih / 2, iw, ih);
        } else if (bg.fit === 'tile') {
            const pat = ctx.createPattern(bg.img, 'repeat');
            ctx.fillStyle = pat;
            ctx.fillRect(0, 0, W, H);
        } else if (bg.fit === 'stretch') {
            ctx.drawImage(bg.img, 0, 0, W, H);
        } else {
            const k = bg.fit === 'cover' ? Math.max(W / iw, H / ih) : Math.min(W / iw, H / ih);
            const dw = iw * k, dh = ih * k;
            ctx.drawImage(bg.img, (W - dw) / 2, (H - dh) / 2, dw, dh);
        }
    }
    ctx.restore();
}

/* ============================================================
   Render
   ============================================================ */
function draw(){
    const dpr = view.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = !state.nearest;
    ctx.imageSmoothingQuality = 'high';

    drawBackground();

    // ---- world space: sprites
    ctx.save();
    ctx.translate(view.w / 2 + state.offsetX, view.h / 2 + state.offsetY);
    ctx.scale(state.scale, state.scale);

    const sources = new Map();
    state.textures.forEach(t => sources.set(t.id, sourceFor(t)));

    const at = activeTex();
    if (at) {
        const f = frameSize(at);
        const txt = `${Math.floor(f.w)}×${Math.floor(f.h)}`;
        if (ui.statFrameRes.textContent !== txt) ui.statFrameRes.textContent = txt;
    }

    state.instances.forEach(inst => {
        const tex = texById(inst.texId);
        if (!tex) return;
        const src = sources.get(tex.id) || tex.img;
        const f = frameSize(tex);

        const frame = currentFrame(inst, tex);
        const sX = (frame % tex.cols) * f.w;
        const sY = Math.floor(frame / tex.cols) * f.h;
        const dW = f.w * inst.scaleX, dH = f.h * inst.scaleY;

        let alpha = 1;
        if (state.emitFade && inst.lifespan !== Infinity) {
            const fade = inst.lifespan * 0.2;
            if (inst.age < fade) alpha = inst.age / fade;
            else if (inst.age > inst.lifespan - fade) alpha = Math.max(0, (inst.lifespan - inst.age) / fade);
        }

        ctx.save();
        ctx.globalCompositeOperation = state.blendMode;
        ctx.globalAlpha = alpha;
        ctx.translate(inst.x, inst.y);
        ctx.rotate(inst.rotation);
        ctx.scale(inst.flipX ? -1 : 1, inst.flipY ? -1 : 1);
        ctx.drawImage(src, sX, sY, f.w, f.h, -dW / 2, -dH / 2, dW, dH);
        ctx.restore();
    });

    if (state.showGrid) drawFrameGuides();
    ctx.restore();

    // ---- screen space: overlays
    drawOverlays();
}

function currentFrame(inst, tex){
    if (inst.animDuration === 0) {
        const off = Math.floor(inst.timeOffset * tex.totalFrames);
        return (state.absoluteFrame + off) % tex.totalFrames;
    }
    let p = inst.age / inst.animDuration + inst.timeOffset;
    p = inst.loop ? p % 1 : Math.min(p, 0.9999);
    return Math.floor(clamp(p, 0, 0.9999) * tex.totalFrames);
}

/* Overlays are white with a dark underlay, so they read on a black, grey, white or checkered background alike. */
const INK = '#ffffff', INK_SOFT = 'rgba(255,255,255,.7)', UNDER = 'rgba(0,0,0,.6)';

function drawFrameGuides(){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    state.instances.forEach(inst => {
        const { w, h } = instSize(inst);
        ctx.save();
        ctx.translate(inst.x, inst.y);
        ctx.rotate(inst.rotation);
        [[UNDER, 3], ['rgba(255,255,255,.75)', 1]].forEach(([col, lw]) => {
            ctx.strokeStyle = col;
            ctx.lineWidth = lw / state.scale;
            ctx.strokeRect(-w / 2, -h / 2, w, h);
            ctx.beginPath();
            ctx.moveTo(0, -h / 2); ctx.lineTo(0, h / 2);
            ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0);
            ctx.stroke();
        });
        ctx.restore();
    });
    ctx.restore();
}

function strokeQuad(pts, dash, color, lw){
    const path = () => {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
    };
    ctx.setLineDash(dash || []);
    ctx.strokeStyle = UNDER; ctx.lineWidth = (lw || 1.5) + 2; path(); ctx.stroke();
    ctx.strokeStyle = color || INK; ctx.lineWidth = lw || 1.5; path(); ctx.stroke();
    ctx.setLineDash([]);
}

function drawOverlays(){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    // hover outline
    if (state.tool === 'select' && state.hovered && !state.selection.includes(state.hovered)) {
        const pts = instCorners(state.hovered).map(p => w2s(p.x, p.y));
        strokeQuad(pts, [4, 4], 'rgba(255,255,255,.7)', 1.5);
    }

    // per-instance outlines when several are selected
    if (state.selection.length > 1) {
        ctx.fillStyle = 'rgba(255,255,255,.07)';
        state.selection.forEach(inst => {
            const pts = instCorners(inst).map(p => w2s(p.x, p.y));
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.fill();
            strokeQuad(pts, null, INK_SOFT, 1.5);
        });
    }

    // marquee
    if (drag.kind === 'marquee' && drag.marquee) {
        const a = w2s(drag.marquee.x0, drag.marquee.y0);
        const b = w2s(drag.marquee.x1, drag.marquee.y1);
        ctx.fillStyle = 'rgba(255,255,255,.10)';
        ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
        strokeQuad([{x:a.x,y:a.y},{x:b.x,y:a.y},{x:b.x,y:b.y},{x:a.x,y:b.y}], [5, 4], INK, 1);
    }

    // gizmo
    const showGizmo = state.selection.length > 0 &&
                      (state.tool === 'select' || drag.kind === 'spawn');
    if (showGizmo) drawGizmo();

    ctx.restore();
}

function drawGizmo(){
    const g = getGizmo();
    if (!g) return;

    const box = [
        gizmoPoint(g, -1, -1), gizmoPoint(g, 1, -1),
        gizmoPoint(g, 1, 1),   gizmoPoint(g, -1, 1)
    ];

    // real sprite bounds, when the handle box had to be padded out
    if (g.padded && !g.multi && state.selection[0]) {
        const pts = instCorners(state.selection[0]).map(p => w2s(p.x, p.y));
        strokeQuad(pts, [2, 3], 'rgba(255,255,255,.6)', 1);
    }

    // the reserved move zone at the centre of a padded frame
    if (g.padded) {
        ctx.beginPath();
        ctx.arc(g.sx, g.sy, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = INK;
        ctx.fill();
        ctx.strokeStyle = '#101012';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    strokeQuad(box, [5, 4], INK, 1.5);

    // rotation stem + knob
    const top = gizmoPoint(g, 0, -1);
    const rp  = gizmoPoint(g, 0, -1, -ROT_OFFSET);
    ctx.beginPath();
    ctx.moveTo(top.x, top.y); ctx.lineTo(rp.x, rp.y);
    ctx.strokeStyle = UNDER; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();

    const rotHot = state.hoveredHandle === 'rotate0-1' ||
                   (drag.kind === 'rotate');
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rotHot ? 9 : 7, 0, Math.PI * 2);
    ctx.fillStyle = rotHot ? '#ffffff' : '#d8d8de';
    ctx.fill();
    ctx.strokeStyle = '#101012';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // scale handles: corners white, edges grey
    HANDLES.forEach(h => {
        const p = gizmoPoint(g, h.ux, h.uy);
        const hot = state.hoveredHandle === h.type + h.ux + h.uy ||
                    (drag.kind === 'scale' && drag.handle &&
                     drag.handle.ux === h.ux && drag.handle.uy === h.uy);
        const s = (hot ? HANDLE_SIZE + 3 : HANDLE_SIZE);

        ctx.beginPath();
        ctx.rect(p.x - s / 2, p.y - s / 2, s, s);
        if (h.type === 'corner') ctx.fillStyle = hot ? '#ffffff' : '#ececf0';
        else                     ctx.fillStyle = hot ? '#d0d0d8' : '#9a9aa4';
        ctx.fill();
        ctx.strokeStyle = '#101012';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    });
}

/* ============================================================
   Main loop
   ============================================================ */
function loop(ts){
    requestAnimationFrame(loop);

    if (!state.lastSysTime) state.lastSysTime = ts;
    const dt = Math.min((ts - state.lastSysTime) / 1000, 0.1);
    state.lastSysTime = ts;

    if (state.isPlaying && state.isLoaded) {
        let changed = false;
        const before = state.instances.length;

        state.instances = state.instances.filter(inst => {
            inst.age += dt;
            return inst.lifespan === Infinity || inst.age < inst.lifespan;
        });
        if (state.instances.length !== before) {
            changed = true;
            const selBefore = state.selection.length;
            state.selection = state.selection.filter(i => state.instances.includes(i));
            if (selBefore !== state.selection.length) syncSelectionPanel();
        }

        if (state.autoEmit && state.activeTexId) {
            state.emitAccumulator += dt * state.emitRate;
            while (state.emitAccumulator >= 1) {
                const a = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * state.emitRadius;
                createInstance(Math.cos(a) * r, Math.sin(a) * r, true);
                state.emitAccumulator -= 1;
                changed = true;
            }
            const manual = state.instances.filter(i => i.lifespan === Infinity);
            let auto = state.instances.filter(i => i.lifespan !== Infinity);
            if (auto.length > state.emitMax) {
                auto = auto.slice(auto.length - state.emitMax);
                state.instances = manual.concat(auto);
                changed = true;
            }
        }
        if (changed) updateStats();

        state.frameTimer += dt;
        const spf = 1 / state.fps;
        if (state.frameTimer >= spf) {
            const adv = Math.floor(state.frameTimer / spf);
            state.frameTimer -= adv * spf;
            state.absoluteFrame += adv;
            const maxF = maxFrames();
            if (maxF > 0) state.absoluteFrame %= maxF;
            updateTimelineUI();
        }
        state.dirty = true;
    }

    if (state.dirty) { draw(); state.dirty = false; }
}

function maxFrames(){
    return state.textures.length ? Math.max(...state.textures.map(t => t.totalFrames)) : 0;
}

/* ============================================================
   Selection commands
   ============================================================ */
function duplicateSelection(){
    if (!state.selection.length) return;
    const copies = state.selection.map(src => Object.assign({}, src, {
        x: src.x + 20 / state.scale,
        y: src.y + 20 / state.scale,
        age: 0,
        timeOffset: state.randPhase ? Math.random() : src.timeOffset
    }));
    state.instances.push(...copies);
    setSelection(copies);
    updateStats();
}

function deleteSelection(){
    if (!state.selection.length) return;
    state.instances = state.instances.filter(i => !state.selection.includes(i));
    setSelection([]);
    updateStats();
}

function clearCanvas(){
    if (!state.instances.length) return;
    const prev = state.instances.slice();
    state.instances = [];
    setSelection([]);
    updateStats();
    invalidate();
    notify('Canvas cleared.', { undo: () => {
        state.instances = prev.concat(state.instances);
        updateStats();
        invalidate();
    } });
}

function moveSelection(toFront){
    if (!state.selection.length) return;
    const rest = state.instances.filter(i => !state.selection.includes(i));
    state.instances = toFront ? rest.concat(state.selection) : state.selection.concat(rest);
    invalidate();
}

function section(key, title, icon, open, body, gate){
    const s = Kit.section({
        title, icon, body,

    if (gate) { gated.push(s); s.classList.add('gated', 'disabled'); }
    return s;
}
