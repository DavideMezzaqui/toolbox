/* Texture grid: any of cols / rows / total can change. */
function applyGrid({ cols, rows, total }){
    const t = activeTex();
    if (!t) return;
    if (cols !== undefined)  t.cols = Math.max(1, Math.round(cols) || 1);
    if (rows !== undefined)  t.rows = Math.max(1, Math.round(rows) || 1);
    if (total !== undefined) t.totalFrames = Math.max(1, Math.round(total) || 1);
    else                     t.totalFrames = t.cols * t.rows;
    if (total === undefined) ui.texRows.sync();
    else ui.presetRow.sync();
    updateRanges();
    invalidate();
}

/** Write a tint onto the active texture (or onto all of them) and refresh. */
function setTint({ color, amount, all = false }){
    const active = activeTex();
    if (!active) return;
    if (color  !== undefined) state.lastTint = color;
    if (amount !== undefined) state.lastTintAmount = amount;

    (all ? state.textures : [active]).forEach(tex => {
        if (color  !== undefined) tex.tint = color;
        if (amount !== undefined) tex.tintAmount = amount;
        tex.procKey = null;   // its cached sheet is stale now
    });

    ui.texRows.sync();
    renderTextureStrip();
    invalidate();
}

/* --- background --- */
function syncBackgroundUI(){
    ui.bgRows.sync();
    ui.quickBg.forEach(b => {
        const v = b.dataset.quickbg;
        const on = v === 'checker' ? state.bg.mode === 'checker' : state.bg.mode === 'solid' && state.bg.color === v;
        b.classList.toggle('on', on);
    });
    invalidate();
}
function setBgColor(hex){
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
    state.bg.color = hex.toLowerCase();
    checkerPattern = null;
    syncBackgroundUI();
}
function clearBackgroundImage(){
    state.bg.img = null;
    state.bg.file = null;
    state.bg.imgName = '';
    if (state.bg.mode === 'image') state.bg.mode = 'solid';
    syncBackgroundUI();
}
ui.quickBg.forEach(btn => {
    btn.addEventListener('click', () => {
        const v = btn.dataset.quickbg;
        if (v === 'checker') { state.bg.mode = 'checker'; syncBackgroundUI(); }
        else { state.bg.mode = 'solid'; setBgColor(v); }
    });
});
ui.bgFileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadBackgroundImage(e.target.files[0]);
    e.target.value = '';
});

/* --- selection panel --- */
function syncSelectionPanel(){
    const sel = state.selection;
    if (!ui.selSection) return;
    if (!sel.length || (state.tool !== 'select' && drag.kind !== 'spawn')) {
        ui.selSection.hidden = true;
        return;
    }
    ui.selSection.hidden = false;
    ui.selTitle.textContent = sel.length > 1 ? `Selection (${sel.length} instances)` : 'Selection';
    ui.selRows.sync();
}

/* --- panel bindings --- */
ui.fileInput.addEventListener('change', e => {
    addTextureItems(Array.from(e.target.files).map(file => ({ file, handle: null })));
    e.target.value = '';
});
ui.emptyAdd.addEventListener('click', addTextures);
ui.restartBtn.addEventListener('click', restartPlayback);

function setPointFilter(on){
    state.nearest = on;
    ui.btnPoint.classList.toggle('on', on);
    if (ui.playRows) ui.playRows.sync();
    invalidate();
}
ui.btnPoint.addEventListener('click', () => setPointFilter(!state.nearest));

/* --- timeline --- */
ui.playBtn.addEventListener('click', togglePlay);

/**
 * Rewind everything to the top and play: the sheet goes back to frame 1 and
 * placed sprites restart their own animation. Emitted particles are thrown
 * away rather than un-aged, so a burst replays from an empty canvas.
 */
function restartPlayback(){
    if (!state.isLoaded) return;

    state.absoluteFrame = 0;
    state.frameTimer = 0;
    state.emitAccumulator = 0;

    const before = state.instances.length;
    state.instances = state.instances.filter(i => i.lifespan === Infinity);
    state.instances.forEach(i => { i.age = 0; });
    if (state.instances.length !== before) setSelection(state.selection.filter(i => state.instances.includes(i)));

    if (!state.isPlaying) setPlaying(true);
    updateStats();
    updateTimelineUI();
    invalidate();
}

function updateTimelineUI(){
    const maxF = maxFrames();
    if (!maxF) return;
    const f = state.absoluteFrame % maxF;
    ui.frameSlider.value = f;
    ui.frameCounter.textContent = `${f + 1}/${maxF}`;
}
function updateRanges(){
    const maxF = maxFrames();
    if (!maxF) return;
    ui.frameSlider.max = maxF - 1;
    updateTimelineUI();
}
ui.frameSlider.addEventListener('input', e => {
    if (state.isPlaying) setPlaying(false);
    state.absoluteFrame = parseInt(e.target.value);
    updateTimelineUI();
    invalidate();
});

/* --- toolbar --- */
ui.toolPan.addEventListener('click', () => setTool('pan'));
ui.toolSelect.addEventListener('click', () => setTool('select'));
ui.toolScatter.addEventListener('click', () => setTool('scatter'));
ui.btnZoomIn.addEventListener('click', () => zoomBy(0.15));
ui.btnZoomOut.addEventListener('click', () => zoomBy(-0.15));
ui.btnFit.addEventListener('click', () => fitView());
ui.btnReset.addEventListener('click', () => resetView());

function toggleGrid(){
    state.showGrid = !state.showGrid;
    ui.btnGrid.classList.toggle('on', state.showGrid);
    invalidate();
}
ui.btnGrid.addEventListener('click', toggleGrid);

function updateStats(){
    ui.statInstances.textContent = state.instances.length;
    const n = state.textures.length;
    Embed.status(n ? `${n} sheet${n === 1 ? '' : 's'}, ${state.instances.length} instance${state.instances.length === 1 ? '' : 's'}` : '');
}

/* ============================================================
   Saved scene
   Everything needed to come back to the same canvas: the sheets (as file
   handles where the browser gave us one, otherwise a stored copy), their
   grid / channel / tint, the placed instances, background, playback, post
   process, defaults, emitter and the view. The emitter's short-lived
   particles are not saved.
   ============================================================ */
let pendingScene = null;         // a saved scene that still needs a click (read permission)
let previousSaved = false;
let sceneSig = '';
let sceneQueue = Promise.resolve();

function buildScene(){
    return {
        v: 1, savedAt: Date.now(),
        textures: state.textures.map(t => ({
            id: t.id, name: t.name, cols: t.cols, rows: t.rows, totalFrames: t.totalFrames,
            channel: t.channel, tint: t.tint, tintAmount: t.tintAmount,
            handle: t.handle || null
        })),
        activeTexId: state.activeTexId,
        instances: state.instances.filter(i => i.lifespan === Infinity).map(i => ({
            texId: i.texId, x: i.x, y: i.y, scaleX: i.scaleX, scaleY: i.scaleY, rotation: i.rotation,
            flipX: i.flipX, flipY: i.flipY, timeOffset: i.timeOffset, animDuration: i.animDuration, loop: i.loop
        })),
        settings: {
            fps: state.fps, blendMode: state.blendMode, nearest: state.nearest, showGrid: state.showGrid,
            brightness: state.brightness, contrast: state.contrast, saturation: state.saturation, invert: state.invert,
            lastTint: state.lastTint, lastTintAmount: state.lastTintAmount,
            baseScale: state.baseScale, randScaleAmt: state.randScaleAmt, randRot: state.randRot,
            manualDuration: state.manualDuration, manualLoop: state.manualLoop, randPhase: state.randPhase,
            autoEmit: state.autoEmit, emitRate: state.emitRate, emitRadius: state.emitRadius, emitMax: state.emitMax,
            emitLifetime: state.emitLifetime, emitFade: state.emitFade
        },
        bg: {
            mode: state.bg.mode, color: state.bg.color, fit: state.bg.fit, opacity: state.bg.opacity,
            worldLock: state.bg.worldLock, scale: state.bg.scale, imgName: state.bg.imgName, hasImg: !!state.bg.img
        },
        view: { scale: state.scale, offsetX: state.offsetX, offsetY: state.offsetY, fitted: state.viewFit }
    };
}
/** What changed, without the handles and the time: a save is skipped when this is the same. */
const sceneKey = sc => JSON.stringify(Object.assign({}, sc, { savedAt: 0,
    textures: sc.textures.map(t => Object.assign({}, t, { handle: !!t.handle })) }));

async function writeScene(){
    if (!sceneReady) return;
    const sc = buildScene();

    if (!sc.textures.length) {
        if (sceneSig === '') return;
        sceneSig = '';
        await dbDel(SCENE_STORE, 'last');
        await cleanBlobs([]);
        return;
    }
    const key = sceneKey(sc);
    if (key === sceneSig) return;

    // the old scene waits in 'previous' while the user has not decided about it
    if (pendingScene && !previousSaved) {
        await dbPut(SCENE_STORE, pendingScene, 'previous');
        previousSaved = true;
    }
    // handle-less sheets and the background image are kept as files
    for (const t of state.textures) {
        if (!t.handle && !t.blobSaved && t.src) {
            await dbPut(BLOB_STORE, { id: t.id, blob: t.src, name: t.name });
            t.blobSaved = true;
        }
    }
    if (state.bg.img && state.bg.file && !state.bg.blobSaved) {
        await dbPut(BLOB_STORE, { id: 'bg', blob: state.bg.file, name: state.bg.imgName });
        state.bg.blobSaved = true;
    }
    try {
        await dbPut(SCENE_STORE, sc, 'last');
    } catch (err) {
        // a handle that cannot be stored: keep copies of those sheets instead
        for (const t of state.textures) {
            if (t.handle && t.src) await dbPut(BLOB_STORE, { id: t.id, blob: t.src, name: t.name });
        }
        sc.textures.forEach(t => { t.handle = null; });
        await dbPut(SCENE_STORE, sc, 'last');
    }
    sceneSig = key;
    await cleanBlobs(sc.textures.map(t => t.id).concat(sc.bg.hasImg ? ['bg'] : []));
}
/** Drop stored files no scene (the saved one, or the one waiting in 'previous') refers to any more. */
async function cleanBlobs(keep){
    const used = new Set(keep);
    if (pendingScene) {
        pendingScene.textures.forEach(t => used.add(t.id));
        if (pendingScene.bg && pendingScene.bg.hasImg) used.add('bg');
    }
    const keys = await dbKeys(BLOB_STORE);
    for (const k of keys) if (!used.has(k)) await dbDel(BLOB_STORE, k);
}

function flushScene(){
    clearTimeout(sceneTimer);
    sceneQueue = sceneQueue.then(writeScene).catch(() => { /* no IndexedDB: the scene is simply not kept */ });
    return sceneQueue;
}
window.addEventListener('pagehide', () => { flushScene(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushScene(); });

/** Read the saved sheets. interactive: may ask the browser for read access (needs a click). */
async function loadSceneTextures(rec, interactive){
    const textures = [], missing = [];
    for (const st of rec.textures) {
        let file = null;
        if (st.handle) {
            try { file = await fileFromHandle(st.handle, interactive); } catch (err) { file = null; }
        } else {
            try { const b = await dbGet(BLOB_STORE, st.id); file = b && b.blob; } catch (err) { file = null; }
        }
        if (!file) { missing.push(st.name); continue; }
        try {
            const tex = makeTexture(file, await decodeImage(file), st.handle, st);
            tex.blobSaved = !st.handle;
            textures.push(tex);
        } catch (err) { missing.push(st.name); }
    }
    return { textures, missing };
}

async function restoreScene(rec, interactive){
    const { textures, missing } = await loadSceneTextures(rec, interactive);
    if (!textures.length) {
        notify('The saved scene could not be restored: ' + (missing.length ? missing.join(', ') + ' not found.' : 'nothing was saved.'), { kind: 'err' });
        return false;
    }

    // wipe the canvas, then apply
    state.instances = []; state.selection = []; state.hovered = null;
    state.textures = textures;
    const wasLoaded = state.isLoaded;
    const s = rec.settings || {};
    Object.keys(s).forEach(k => { if (k in state) state[k] = s[k]; });
    state.emitAccumulator = 0;
    state.activeTexId = (textures.find(t => t.id === rec.activeTexId) || textures[0]).id;
    const ids = new Set(textures.map(t => t.id));
    state.instances = (rec.instances || []).filter(i => ids.has(i.texId)).map(i => Object.assign({}, i, { age: 0, lifespan: Infinity }));

    const b = rec.bg || {};
    Object.assign(state.bg, { mode: b.mode || 'solid', color: b.color || '#000000', fit: b.fit || 'cover',
        opacity: b.opacity === undefined ? 1 : b.opacity, worldLock: !!b.worldLock, scale: b.scale || 1,
        img: null, file: null, imgName: '', blobSaved: false });
    checkerPattern = null;
    if (b.hasImg) {
        try {
            const rb = await dbGet(BLOB_STORE, 'bg');
            if (rb && rb.blob) {
                state.bg.img = await decodeImage(rb.blob);
                state.bg.file = rb.blob; state.bg.imgName = b.imgName || rb.name || 'background'; state.bg.blobSaved = true;
            }
        } catch (err) { /* the colour stays */ }
    }
    if (state.bg.mode === 'image' && !state.bg.img) state.bg.mode = 'solid';

    if (!wasLoaded) enterLoaded();
    const v = rec.view || {};
    state.scale = v.scale || 1; state.offsetX = v.offsetX || 0; state.offsetY = v.offsetY || 0;
    state.viewFit = false;
    resizeCanvas();
    if (v.fitted) { state.viewFit = true; if (view.w > 40 && view.h > 40) fitView({ quiet: true }); }

    renderTextureStrip();
    loadActiveTextureSettings();
    syncAllUi();
    updateRanges();
    updateStats();
    invalidate();
    if (missing.length) notify('Not found: ' + missing.join(', ') + '.', { kind: 'warn' });
    return true;
}

/** Every control reads the state again. */
function syncAllUi(){
    ['texRows', 'bgRows', 'playRows', 'ppRows', 'scatterRows', 'selRows'].forEach(k => ui[k] && ui[k].sync());
    ui.btnPoint.classList.toggle('on', state.nearest);
    ui.btnGrid.classList.toggle('on', state.showGrid);
    ui.quickBg.forEach(b => {
        const v = b.dataset.quickbg;
        b.classList.toggle('on', v === 'checker' ? state.bg.mode === 'checker' : state.bg.mode === 'solid' && state.bg.color === v);
    });
    syncSelectionPanel();
}

function renderPending(){
    const on = !!pendingScene;
    ui.restoreBar.hidden = !on;
    ui.emptyRestore.hidden = !on;
    if (on) {
        const n = pendingScene.textures.length;
        ui.restoreText.textContent = `Last scene: ${n} sheet${n === 1 ? '' : 's'}. Reading the files needs your OK.`;
    }
}
async function restorePending(){
    const rec = pendingScene;
    if (!rec) return;
    if (state.textures.length && !(await Embed.confirm('Restoring replaces what is on the canvas now. Continue?', { title: 'Restore last scene', ok: 'Restore' }))) return;
    if (await restoreScene(rec, true)) {
        pendingScene = null; previousSaved = false;
        renderPending();
        try { await dbDel(SCENE_STORE, 'previous'); } catch (err) { /* nothing stored */ }
        flushScene();
    }
}
async function dismissPending(){
    pendingScene = null;
    renderPending();
    try { await dbDel(SCENE_STORE, 'previous'); } catch (err) { /* nothing stored */ }
    previousSaved = false;
    flushScene();
}

async function initScene(){
    let rec = null;
    try {
        rec = await dbGet(SCENE_STORE, 'last');
        await dbDel(SCENE_STORE, 'previous');
    } catch (err) { rec = null; }
    if (rec && Array.isArray(rec.textures) && rec.textures.length) {
        // any sheet behind a handle that is not readable without a click: wait for the click
        let ask = false;
        for (const t of rec.textures) {
            if (!t.handle) continue;
            try { if (!t.handle.queryPermission || await t.handle.queryPermission({ mode: 'read' }) !== 'granted') ask = true; }
            catch (err) { ask = true; }
        }
        if (ask) { pendingScene = rec; renderPending(); }
        else { try { await restoreScene(rec, false); } catch (err) { /* damaged scene: start empty */ } }
    }
    sceneReady = true;
    sceneSig = state.textures.length ? sceneKey(buildScene()) : '';
}

/* ============================================================
   Studio host (Embed) and the page's own header
   ============================================================ */
const ACTIONS = [
    { id: 'add',      label: 'Add texture',   icon: 'plus',  key: 'Ctrl+O', tip: 'Add sprite sheets', run: () => addTextures() },
    { id: 'reimport', label: 'Reimport all',  icon: 'reset', tip: 'Reload every texture from disk, keeping grid, tint and everything placed', key: 'I', disabled: true, run: () => reimportAll() },
    { sep: true },
    /* play and fit live in the transport bar and the toolbar: the page's own header has them, the Studio header does not */
    { id: 'play',     label: 'Pause',         icon: 'pause', tip: 'Play or pause', key: 'Space', disabled: true, inner: true, run: () => togglePlay() },
    { id: 'fit',      label: 'Fit',           icon: 'fit',   tip: 'Fit all sprites in the view', key: 'F', disabled: true, inner: true, run: () => fitView() },
    { id: 'clear',    label: 'Clear canvas',  icon: 'trash', tip: 'Remove every sprite from the canvas', disabled: true, run: () => clearCanvas() }
];
let registered = false;      // Embed.action only after Embed.register
const A = {};
ACTIONS.forEach(a => { if (a.id) A[a.id] = a; });

const SHORTCUTS = [
    ['Tools', [['V', 'Select and transform'], ['B', 'Scatter: click to place, drag to rotate'], ['H', 'Pan (or hold Space and drag)']]],
    ['Playback', [['Space / K', 'Play or pause (tap Space)'], ['R', 'Restart from frame 1'], ['I', 'Reimport every sheet from disk']]],
    ['View', [['F', 'Fit all sprites in the view'], ['0', 'Reset the view to 100%'], ['+ / -', 'Zoom in and out'],
              ['Wheel', 'Zoom at the pointer'], ['G', 'Frame guides'], ['P', 'Point filter, crisp pixels']]],
    ['Selection', [['Ctrl+A', 'Select all'], ['Ctrl+D', 'Duplicate'], ['Del', 'Delete'], ['Arrows', 'Nudge (Shift: 10 steps)'],
                   ['Esc', 'Deselect'], ['Ctrl+click', 'Add or remove from the selection'], ['Shift+drag', 'Free aspect / 15 degree rotation']]],
    ['Files', [['Ctrl+O', 'Add sprite sheets'], ['Drop', 'Add sprite sheets next to each other'], ['Shift+drop', 'Use the image as the background']]]
];

function paintHeaderButton(a){
    const b = a._btn;
    if (!b) return;
    b.textContent = '';
    if (a.icon) b.appendChild(Kit.icon(a.icon));
    b.appendChild(el('span', '', a.label));
    b.disabled = !!a.disabled;
    b.title = (a.tip || a.label) + (a.key ? '  (' + a.key + ')' : '');
    b.classList.toggle('ib', !!a.icon);
}
function setAction(id, patch){
    const a = A[id];
    if (!a) return;
    Object.assign(a, patch);
    paintHeaderButton(a);
    if (registered && !a.inner) Embed.action(id, patch);
}
(function buildHeader(){
    const box = $('headActions');
    ACTIONS.forEach(a => {
        if (a.sep) { box.appendChild(el('div', 'sep')); return; }
        const b = el('button'); b.type = 'button';
        a._btn = b;
        b.addEventListener('click', () => { a.run(); });
        paintHeaderButton(a);
        box.appendChild(b);
    });
    const keysBtn = $('hKeys');
    keysBtn.addEventListener('click', () => Kit.keys(SHORTCUTS, { button: keysBtn, title: 'Shortcuts: Flipbook previewer' }));
})();

/* ============================================================
   Boot
   ============================================================ */
buildSidebar();
ui.restoreBtn.addEventListener('click', restorePending);
ui.emptyRestore.addEventListener('click', restorePending);
ui.restoreDismiss.addEventListener('click', dismissPending);
setTool(state.tool);
resizeCanvas();
applyCursor();
paintPlay();
renderTextureStrip();
renderLibrary();
syncAllUi();
requestAnimationFrame(loop);

/* the saved scene first, then the remembered folders; files that arrive meanwhile wait for it */
const bootDone = (async () => {
    try { await initScene(); } catch (err) { sceneReady = true; }
    try { await initLibrary(); } catch (err) { /* the library is optional */ }
})();

/* The host pauses a hidden mode and resumes it when it comes back. */
let pausedByHost = false;
Embed.register({
    id: 'flipbook',
    title: 'Flipbook previewer',
    actions: ACTIONS.filter(a => !a.inner).map(a => {
        const c = Object.assign({}, a);
        delete c._btn;
        return c;
    }),
    shortcuts: SHORTCUTS,
    accepts: ['image/*'],
    onReceive: files => { addTextureItems(Array.from(files).map(file => ({ file, handle: null }))); },
    onHide: () => {
        if (state.isPlaying) { pausedByHost = true; setPlaying(false); }
        flushScene();
    },
    onShow: () => {
        if (pausedByHost) { pausedByHost = false; setPlaying(true); }
        onResize();
    }
});
registered = true;
</script>
