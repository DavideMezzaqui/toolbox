<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flipbook previewer</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
/* Page furniture only: every component comes from the shared kit. */
html,body{height:100%}
body.kit{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
/* inside Studio the host header carries the title and the actions */
body.embed .kit-head{display:none}

#app{flex:1;display:flex;min-height:0;width:100%}

/* ============================================================ stage */
#stage{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
#canvasWrapper{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0;background:#000}
#mainCanvas{display:block;width:100%;height:100%}

/* the strip above the canvas (kit-tools): the kit toolbar, one group per task */
#toolbar{flex-wrap:wrap}
#toolbar .toolbar{flex-wrap:nowrap;gap:2px;padding:3px}
#toolbar .toolbar button.ibtn{width:30px;height:30px}
#toolbar .toolbar .tsep{margin:0 3px}
button.qbg{width:24px;height:24px;padding:0;border-radius:5px;border:1px solid #55555d;flex:none}
button.qbg:hover{border-color:#fff}
button.qbg.on{outline:1px solid #e8e8ec;outline-offset:1px}
/* a checkerboard marks transparency; it is data, not decoration */
.checker{background-color:#2a2a2e;background-image:
  linear-gradient(45deg,#4a4a50 25%,transparent 25%),linear-gradient(-45deg,#4a4a50 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#4a4a50 75%),linear-gradient(-45deg,transparent 75%,#4a4a50 75%);
  background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
#zoomBadge{display:none;align-items:center;padding:0 10px;height:36px;border-radius:9px;
  font:600 var(--fs) var(--mono);color:var(--txt);background:rgba(24,24,26,.94);border:1px solid var(--line)}
#zoomBadge.show{display:flex}

#stats{position:absolute;top:10px;right:10px;z-index:4;width:240px;padding:8px 11px;border-radius:9px;
  background:rgba(24,24,26,.92);border:1px solid var(--line);font:var(--fs) var(--mono);color:var(--txt2);pointer-events:none}
#stats.hidden{display:none}
#stats b{display:block;color:var(--txt);font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stats .sr{display:flex;justify-content:space-between;gap:10px;line-height:1.6}
#stats .sr span:last-child{color:var(--txt)}

#emptyState.hidden{display:none}
#emptyState code{font:var(--fs) var(--mono);color:var(--txt)}

/* timeline: the kit transport bar, shown once a sheet is loaded */
#timeline{display:none}
#timeline.show{display:flex}
#frameSlider{flex:1}
#frameCounter{min-width:70px;text-align:right}

/* ============================================================ sidebar */
#sidebar{overscroll-behavior:contain}
.gated.disabled{opacity:.4;pointer-events:none}
.sec .hint{margin:0 0 8px}
.sec .row .btnrow{margin-bottom:0}

/* texture strip */
#texThumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#texThumbs .none{color:var(--dim);font-size:var(--fs);padding:6px 0}
.thumb{position:relative;width:54px;height:54px;flex:0 0 54px;border-radius:7px;overflow:hidden;
  border:1px solid var(--line2);padding:0;background:#0c0c0e;opacity:.6;transition:opacity .12s,border-color .12s}
.thumb:hover,.thumb:focus-within{opacity:1;border-color:#74747e;background:#0c0c0e}
.thumb.on{opacity:1;border-color:#e6e6e8;box-shadow:0 0 0 1px #e6e6e8}
.thumb .pick{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:none}
.thumb .pick:hover,.thumb .pick:active{background:none;border:0}
.thumb .pick:focus-visible{outline-offset:-3px}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.thumb .mini{position:absolute;top:0;width:18px;height:18px;padding:0;border:0;border-radius:0;
  background:rgba(0,0,0,.72);color:var(--txt);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .12s}
.thumb .mini:focus-visible{opacity:1;outline-offset:-2px}
.thumb .mini svg.ic{width:11px;height:11px}
.thumb .mini.x{right:0;border-bottom-left-radius:6px}
.thumb .mini.re{left:0;border-bottom-right-radius:6px}
.thumb:hover .mini,.thumb:focus-within .mini{opacity:1}
.thumb .mini:hover{background:#e6e6e8;color:#101012}
.thumb .mini.x:hover{background:var(--err);color:#fff}
@keyframes texFlash{from{border-color:#fff;background:#3a3a42}to{border-color:#e6e6e8;background:#0c0c0e}}
.thumb.flash{animation:texFlash .7s ease-out}
.thumb .tintdot{position:absolute;left:3px;bottom:3px;width:11px;height:11px;border-radius:50%;
  border:1px solid rgba(0,0,0,.8);box-shadow:0 0 0 1px rgba(255,255,255,.4);pointer-events:none}
.thumb.add{opacity:1;border-style:dashed;background:transparent;color:var(--txt2);display:flex;align-items:center;justify-content:center}
.thumb.add:hover{color:var(--txt);background:var(--panel2)}
.thumb.add svg.ic{width:16px;height:16px}

/* restore the last scene */
.restore{display:flex;flex-direction:column;gap:8px;padding:9px 10px 10px;margin-bottom:8px;
  background:var(--panel2);border:1px solid var(--line2);border-radius:8px;font-size:var(--fs);color:var(--txt2);line-height:1.4}
.restore[hidden]{display:none}
.restore .rbtns{display:flex;gap:6px}
.restore .rbtns button{flex:1}

/* kit sizes, one step up where the kit would go below 11 px */
.sec .grp2{font-size:var(--fs-s)}
.row button.hex{font-size:var(--fs-s);line-height:20px}

/* small buttons and check labels inside rows */
button.sm{padding:3px 9px;font-size:var(--fs-s)}
.chk{display:flex;align-items:center;gap:8px;font-size:var(--fs);color:var(--txt2);cursor:pointer}
.chk:hover{color:var(--txt)}
.rowgrid{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.rowgrid .rtext{flex:none}
.seg.wide{flex:1}
.seg.wide button{flex:1}

/* tint / background swatches */
.swatches .sw{width:20px;height:20px}

/* texture library */
.libfolder{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.libfolder.stale{border-style:dashed}
.libhead{display:flex;align-items:center;gap:6px}
.libname{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:6px;background:none;border:0;padding:3px 0;text-align:left;
  color:var(--txt);font-size:var(--fs);font-weight:600}
.libname:hover{background:none;border:0;color:#fff}
.libname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.libcount{font:var(--fs-s) var(--mono);color:var(--dim);flex:none}
.libfiles{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);max-height:200px;overflow-y:auto}
.libfile{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:var(--fs);color:var(--txt2)}
.libfile:hover{color:var(--txt)}
.libfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.libbar{display:flex;gap:6px;margin-top:8px}
.libbar button{flex:1;padding:4px 8px;font-size:var(--fs-s)}
.libauto{margin-top:9px}

@media (max-width:820px){
  #app{flex-direction:column}
  #sidebar{width:100%;flex:0 0 45%;border-left:none;border-top:1px solid var(--line)}
  #stage{flex:1 1 55%}
}
</style>
</head>
<body class="kit">

<header class="kit-head" id="head">
    <h1>Flipbook previewer</h1>
    <div class="grow"></div>
    <div id="headActions" style="display:flex;gap:6px;align-items:center"></div>
    <div class="sep"></div>
    <button id="hKeys" type="button" data-ic="key" title="Keyboard shortcuts">Shortcuts</button>
</header>

<div id="app">

    <!-- ================= STAGE ================= -->
    <main id="stage">

        <div id="toolbar" class="kit-tools">
            <div class="toolbar" id="bgQuick" role="group" aria-label="Background">
                <button class="qbg checker" data-quickbg="checker" title="Checkerboard background" aria-label="Checkerboard background"></button>
                <button class="qbg" data-quickbg="#000000" style="background:#000" title="Black background" aria-label="Black background"></button>
                <button class="qbg" data-quickbg="#808080" style="background:#808080" title="50% grey background" aria-label="Grey background"></button>
                <button class="qbg" data-quickbg="#ffffff" style="background:#fff" title="White background" aria-label="White background"></button>
            </div>

            <div class="toolbar" role="group" aria-label="Tools and view">
                <button id="toolSelect" class="ibtn on" data-ic="pointer" title="Select &amp; transform (V)" aria-label="Select and transform"></button>
                <button id="toolScatter" class="ibtn" data-ic="spray" title="Scatter / paint (B)" aria-label="Scatter"></button>
                <button id="toolPan" class="ibtn" data-ic="pan" title="Pan (H, or hold Space)" aria-label="Pan"></button>
                <div class="tsep"></div>
                <button id="btnZoomIn" class="ibtn" data-ic="zin" title="Zoom in (+)" aria-label="Zoom in"></button>
                <button id="btnZoomOut" class="ibtn" data-ic="zout" title="Zoom out (-)" aria-label="Zoom out"></button>
                <button id="btnFit" class="ibtn" data-ic="fit" title="Fit content to view (F)" aria-label="Fit content to view"></button>
                <button id="btnReset" class="ibtn" data-ic="actual" title="Reset view to 100% (0)" aria-label="Reset view to 100%"></button>
                <div class="tsep"></div>
                <button id="btnGrid" class="ibtn" data-ic="grid" title="Toggle frame guides (G)" aria-label="Frame guides"></button>
                <button id="btnPoint" class="ibtn" data-ic="pixels" title="Point filtering, crisp pixels (P)" aria-label="Point filter"></button>
            </div>

            <div id="zoomBadge">100%</div>
        </div>


        <div id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
            <div id="stats" class="hidden">
                <b id="statFilename">file.png</b>
                <div class="sr"><span>Source</span><span id="statSrcRes">0×0</span></div>
                <div class="sr"><span>Frame</span><span id="statFrameRes">0×0</span></div>
                <div class="sr"><span>Instances</span><span id="statInstances">0</span></div>
            </div>
            <div class="kit-empty" id="emptyState">
                <div class="card">
                    <div class="ke-ic" data-ic="flipbook"></div>
                    <b>Import a flipbook</b>
                    <span>Drop sprite sheets anywhere. The grid is read from names like <code>fire_8x8.png</code>.</span>
                    <div class="btnrow">
                        <button id="emptyAdd" class="primary" data-ic="plus">Add texture</button>
                        <button id="emptyRestore" data-ic="reset" hidden>Restore last scene</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="timeline" class="kit-transport">
            <button id="playBtn" class="ibtn" type="button" data-state="playing" title="Pause (Space or K)"></button>
            <button id="restartBtn" class="ibtn" type="button" data-ic="reset" title="Restart from frame 1 and play (R)" aria-label="Restart"></button>
            <input type="range" id="frameSlider" min="0" max="63" value="0" aria-label="Frame">
            <span id="frameCounter" class="tm">1/64</span>
        </div>
    </main>

    <!-- ================= SIDEBAR (built in the script) ================= -->
    <aside id="sidebar" class="kit-panel" aria-label="Settings"></aside>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="bgFileInput" accept="image/*" hidden>

<script src="../shared/kit.js"></script>
<script src="../shared/embed.js"></script>
<script>
'use strict';

/* ============================================================
   Constants
   ============================================================ */
const HANDLE_SIZE     = 11;   // drawn handle size, screen px
const HANDLE_HIT      = 21;   // pointer hit radius, screen px (mouse)
const HANDLE_HIT_FAR  = 38;   // forgiving second pass, used only when nothing else was hit
const TOUCH_MULT      = 1.7;  // hit radius multiplier for touch
const ROT_OFFSET      = 36;   // rotation handle distance above the box, screen px
const MIN_GIZMO_HALF  = 28;   // gizmo box is padded to at least this half-size, screen px
const GIZMO_CORE      = 0.5;  // inner fraction of the frame reserved for moving, never a handle
const MIN_SCALE       = 0.05;
const MAX_SCALE       = 20;
const BATCH_GAP       = 24;   // world units between sheets dropped together

/* icons this page needs on top of the kit set */
Kit.addIcons({
    pan:     'M8 2v12 M2 8h12 M6 4l2-2 2 2 M6 12l2 2 2-2 M4 6L2 8l2 2 M12 6l2 2-2 2',
    pointer: 'M3 2l10 4.5-4.3 1.3-1.4 4.7z',
    spray:   'M8 2.5v3 M8 10.5v3 M2.5 8h3 M10.5 8h3 M4.1 4.1l2 2 M9.9 9.9l2 2 M4.1 11.9l2-2 M9.9 6.1l2-2',
    actual:  'M2.5 2.5h11v11h-11z M7 6.3l1.5-1.1v5.6',
    pixels:  'M2.5 2.5h4v4h-4z M9.5 9.5h4v4h-4z M9.5 2.5h2v2h-2z M2.5 9.5h2v2h-2z',
    chevr:   'M6 3.5L10.5 8 6 12.5',
    chevd:   'M3.5 6L8 10.5 12.5 6',
    arrdown: 'M8 3v9 M4.5 8.5L8 12l3.5-3.5'
});

/* ============================================================
   State
   ============================================================ */
const state = {
    textures: [],
    activeTexId: null,
    instances: [],
    selection: [],
    hovered: null,

    isLoaded: false,
    isPlaying: true,
    dirty: true,
    absoluteFrame: 0,
    frameTimer: 0,
    lastSysTime: 0,

    fps: 60,
    blendMode: 'source-over',
    nearest: false,
    // tint is per texture (tex.tint / tex.tintAmount); these are only the
    // values a newly loaded texture starts with, so a batch keeps one look.
    lastTint: '#ffffff',
    lastTintAmount: 1,
    brightness: 1, contrast: 1, saturation: 1, invert: false,

    showGrid: false,

    bg: {
        mode: 'solid',
        color: '#000000',
        img: null,
        file: null,
        imgName: '',
        fit: 'cover',
        opacity: 1,
        worldLock: false,
        scale: 1
    },

    // view
    scale: 1, offsetX: 0, offsetY: 0,
    viewFit: false,          // the view came from Fit: refit when the window changes

    // tools
    tool: 'select',
    spaceDown: false, spacePanned: false,
    shiftDown: false,

    // placement defaults
    baseScale: 1, randScaleAmt: 0.5, randRot: false,
    manualDuration: 0, manualLoop: true, randPhase: false,

    // emitter
    autoEmit: false, emitRate: 15, emitRadius: 200, emitMax: 50,
    emitLifetime: 2, emitFade: true, emitAccumulator: 0
};

/* Active pointer interaction */
const drag = {
    kind: null,      // 'pan' | 'move' | 'scale' | 'rotate' | 'marquee' | 'spawn'
    pointerId: null,
    touch: false,
    handle: null,    // {ux, uy, type}
    startScreen: {x:0, y:0},
    startWorld: {x:0, y:0},
    startOffset: {x:0, y:0},
    startLocal: {x:0, y:0},
    startAngle: 0,
    pivot: {x:0, y:0},
    snapshot: [],    // per-instance starting transform
    marquee: null,
    spawnInst: null
};

const pointers = new Map();
const view = { w: 0, h: 0, dpr: 1 };

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
};

const canvas  = $('mainCanvas');
const ctx     = canvas.getContext('2d');
const wrapper = $('canvasWrapper');

// the settings column is built further down (buildSidebar) and adds its own fields
const ui = {
    stage:$('stage'), emptyState:$('emptyState'), stats:$('stats'), timeline:$('timeline'),
    zoomBadge:$('zoomBadge'), fileInput:$('fileInput'), bgFileInput:$('bgFileInput'),
    statFilename:$('statFilename'), statSrcRes:$('statSrcRes'), statFrameRes:$('statFrameRes'), statInstances:$('statInstances'),
    emptyAdd:$('emptyAdd'), emptyRestore:$('emptyRestore'),

    playBtn:$('playBtn'), restartBtn:$('restartBtn'), frameSlider:$('frameSlider'), frameCounter:$('frameCounter'),

    toolPan:$('toolPan'), toolSelect:$('toolSelect'), toolScatter:$('toolScatter'),
    btnZoomIn:$('btnZoomIn'), btnZoomOut:$('btnZoomOut'), btnFit:$('btnFit'),
    btnReset:$('btnReset'), btnGrid:$('btnGrid'), btnPoint:$('btnPoint'),
    quickBg: Array.from(document.querySelectorAll('[data-quickbg]'))
};

/* One place for messages: the Studio host when embedded, the kit otherwise. */
const notify = (msg, opts) => Embed.toast(msg, opts);
Kit.config({ stage: '#canvasWrapper' });

/* ============================================================
   Small helpers
   ============================================================ */
let sceneReady = false;          // false until the saved scene has been looked at
let sceneTimer = 0;
const markScene = () => {
    if (!sceneReady) return;
    clearTimeout(sceneTimer);
    sceneTimer = setTimeout(() => flushScene(), 700);
};
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const invalidate = () => { state.dirty = true; markScene(); };
const texById = id => state.textures.find(t => t.id === id);
const activeTex = () => texById(state.activeTexId);

function frameSize(tex){
    return { w: tex.img.width / tex.cols, h: tex.img.height / tex.rows };
}
function instSize(inst){
    const tex = texById(inst.texId);
    if (!tex) return { w: 0, h: 0 };
    const f = frameSize(tex);
    return { w: f.w * inst.scaleX, h: f.h * inst.scaleY };
}

function w2s(x, y){
    return { x: view.w / 2 + state.offsetX + x * state.scale,
             y: view.h / 2 + state.offsetY + y * state.scale };
}
function s2w(x, y){
    return { x: (x - view.w / 2 - state.offsetX) / state.scale,
             y: (y - view.h / 2 - state.offsetY) / state.scale };
}
function pointerPos(e){
    const r = wrapper.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}
/** Pointer position in the un-rotated local space of an instance (origin = its centre). */
function toLocal(inst, wx, wy){
    const dx = wx - inst.x, dy = wy - inst.y;
    const c = Math.cos(-inst.rotation), s = Math.sin(-inst.rotation);
    return { x: dx * c - dy * s, y: dx * s + dy * c };
}

function hexToRgb(hex){
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : null;
}
function shade(hex, amount){
    const c = hexToRgb(hex) || { r:0, g:0, b:0 };
    const f = v => clamp(Math.round(v + 255 * amount), 0, 255);
    return `rgb(${f(c.r)},${f(c.g)},${f(c.b)})`;
}

/* ============================================================
   View
   ============================================================ */
function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const r = wrapper.getBoundingClientRect();
    view.dpr = dpr;
    view.w = r.width;
    view.h = r.height;

    const w = Math.max(1, Math.round(r.width  * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width === w && canvas.height === h) return;
    canvas.width  = w;
    canvas.height = h;
    state.dirty = true;
}
/* A view that came from Fit stays fitted when the window changes size. A hidden
   frame measures 0 x 0 and is ignored: the next real size refits it. */
function onResize(){
    resizeCanvas();
    if (state.viewFit && state.isLoaded && view.w > 40 && view.h > 40) fitView({ quiet: true });
}
window.addEventListener('resize', onResize);

/* The canvas is sized from its wrapper, and the wrapper changes size for
   reasons no window resize event covers — the timeline bar appearing on the
   first import, the sidebar reflowing, the page being zoomed. Left stale, the
   backing store no longer matches the element and CSS quietly rescales the
   whole drawing: the gizmo is then painted tens of pixels away from where the
   hit test believes it is, and the handles stop taking. */
if (window.ResizeObserver) new ResizeObserver(() => onResize()).observe(wrapper);

function showZoomBadge(){
    ui.zoomBadge.textContent = Math.round(state.scale * 100) + '%';
    ui.zoomBadge.classList.add('show');
    clearTimeout(showZoomBadge.t);
    showZoomBadge.t = setTimeout(() => ui.zoomBadge.classList.remove('show'), 1400);
}

function zoomBy(delta, sx = view.w / 2, sy = view.h / 2){
    const old = state.scale;
    state.scale = clamp(state.scale * Math.exp(delta * 1.5), 0.05, 40);
    const k = state.scale / old - 1;
    state.offsetX -= (sx - view.w / 2 - state.offsetX) * k;
    state.offsetY -= (sy - view.h / 2 - state.offsetY) * k;
    state.viewFit = false;
    showZoomBadge();
    invalidate();
}

function resetView(){
    state.scale = 1; state.offsetX = 0; state.offsetY = 0;
    state.viewFit = false;
    showZoomBadge(); invalidate();
}

function fitView(opts){
    if (!state.instances.length) { resetView(); return; }
    // a hidden frame measures nothing: fit when it has a size again
    if (view.w < 40 || view.h < 40) { state.viewFit = true; return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.instances.forEach(inst => {
        const { w, h } = instSize(inst);
        const r = Math.hypot(w, h) / 2;             // rotation-safe bound
        minX = Math.min(minX, inst.x - r); maxX = Math.max(maxX, inst.x + r);
        minY = Math.min(minY, inst.y - r); maxY = Math.max(maxY, inst.y + r);
    });
    const bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
    state.scale = clamp(Math.min(view.w / bw, view.h / bh) * 0.85, 0.05, 40);
    state.offsetX = -((minX + maxX) / 2) * state.scale;
    state.offsetY = -((minY + maxY) / 2) * state.scale;
    state.viewFit = true;
    if (!(opts && opts.quiet === true)) showZoomBadge();
    invalidate();
}

/* ============================================================
   Persistence: one IndexedDB, three stores
     folders  the texture library (remembered folders)
     scene    key 'last': the whole scene, textures as file handles
     blobs    a copy of every texture that has no handle (a drop from the
              tray, a browser without the File System Access API), and of the
              background image
   ============================================================ */
const LIB_DB = 'flipbookStudio', LIB_STORE = 'folders', LIB_KEY = 'flipbookStudio.library';
const SCENE_STORE = 'scene', BLOB_STORE = 'blobs', DB_VERSION = 2;
const IMAGE_RE = /\.(png|jpe?g|webp|gif|bmp)$/i;

function idb(){
    return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('no indexedDB'));
        const req = indexedDB.open(LIB_DB, DB_VERSION);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(LIB_STORE))   db.createObjectStore(LIB_STORE, { keyPath:'id' });
            if (!db.objectStoreNames.contains(SCENE_STORE)) db.createObjectStore(SCENE_STORE);
            if (!db.objectStoreNames.contains(BLOB_STORE))  db.createObjectStore(BLOB_STORE, { keyPath:'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error || new Error('indexedDB unavailable'));
        req.onblocked = () => reject(new Error('indexedDB blocked'));
    });
}

/** One request in its own transaction; resolves with the request's result. */
function dbDo(store, mode, fn){
    return idb().then(db => new Promise((resolve, reject) => {
        let req;
        try {
            const tx = db.transaction(store, mode);
            req = fn(tx.objectStore(store));
            tx.oncomplete = () => { db.close(); resolve(req ? req.result : undefined); };
            tx.onerror    = () => { db.close(); reject(tx.error); };
            tx.onabort    = () => { db.close(); reject(tx.error || new Error('aborted')); };
        } catch (err) { db.close(); reject(err); }
    }));
}
const dbGet  = (store, key)      => dbDo(store, 'readonly',  s => s.get(key));
const dbKeys = store             => dbDo(store, 'readonly',  s => s.getAllKeys());
const dbPut  = (store, val, key) => dbDo(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key));
const dbDel  = (store, key)      => dbDo(store, 'readwrite', s => s.delete(key));
